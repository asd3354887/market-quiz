<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>金融市場常識與職業道德 互動題庫</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--sel:#dbeafe;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--fg:#f3f4f6;--mut:#9ca3af;--pri:#3b82f6;--okbg:#14532d;--badbg:#7f1d1d;--sel:#1e3a8a;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px}
header h1{font-size:18px;margin:4px 0 8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.links{display:flex;gap:6px;margin-bottom:6px}
.links a{color:var(--pri);text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:4px}.tab{flex:1;padding:8px 2px;font-size:14px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on,.primary{background:var(--pri)!important;color:#fff!important;border-color:var(--pri)!important}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card button{margin:4px 6px 4px 0}
.row{display:block;width:100%;text-align:left;margin-bottom:8px;border-radius:14px}
.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rt span{color:var(--mut);font-size:14px}
.pbar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;margin:0}
label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input[type=checkbox]{width:18px;height:18px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}header.bar button{white-space:nowrap;flex:none}header.bar span{font-size:15px;color:var(--mut);text-align:center}
.meta{color:var(--mut);font-size:13px;margin-bottom:6px}
.stem{font-size:17px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px;line-height:1.5;word-break:break-word;margin:0!important}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid}
.exp.ok{border-color:var(--ok);background:var(--okbg)}.exp.bad{border-color:var(--bad);background:var(--badbg)}
.exp p{margin:6px 0;word-break:break-word}.exp p.fix{background:rgba(34,197,94,.18);border-radius:8px;padding:6px 8px;font-weight:600}.res{font-weight:700}.refs{color:var(--mut);font-size:13px}
.nav{display:flex;gap:8px;margin-bottom:12px}.nav button{flex:1;padding:14px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{padding:6px 0;font-size:13px;border-radius:6px;margin:0}
.grid .done{background:var(--sel)}.grid .cur{outline:2px solid var(--pri)}.grid .ok{background:var(--okbg)}.grid .bad{background:var(--badbg)}
.grid button small{display:block;font-size:12px;line-height:1.2}.mk{display:flex;gap:6px;margin:-4px 0 12px}.mk button{flex:1;margin:0;padding:8px 4px;font-size:22px;line-height:1.2}
.center{text-align:center}.big{font-size:44px;font-weight:800;line-height:1.2}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.warn{border-color:#f59e0b}
.mut{color:var(--mut);font-size:14px}
#timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.fav{font-size:20px;padding:4px 12px;color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left}
.btnlink{display:inline-block;color:var(--pri);text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:4px 6px 4px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"cfg":{"key":"marketquiz_v1","title":"金融市場常識與職業道德 互動題庫","old":"","order":["all"],"subj":{"all":{"name":"金融市場常識＋職業道德","short":"常識道德","min":60,"n":100}}},"hot":[{"id":"M-001","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是金融市場的主要功能？","opts":["提供金融工具交易的場所","擔任資金需求者與供給者的橋樑","促進投資活動的效率，提升經濟發展","提供交易者投機的場所"],"ans":4,"exp":["📝 解析：金融市場的主要功能是提供交易場所、媒合資金供需、提升資源配置效率；投機只是參與者的動機之一，不是市場設立的主要功能。"],"pos":0.0,"w":1},{"id":"M-002","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是金融市場交易的工具？","opts":["商業本票","銀行存款","股票","古董與藝術品"],"ans":4,"exp":["📝 解析：商業本票、銀行存款、股票都是金融工具（金融資產）；古董與藝術品屬實物資產，不在金融市場交易。"],"pos":0.00078,"w":1},{"id":"M-003","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當金融市場管理的品質較佳時，企業發行的成本會______，金融工具的流動性會______。","opts":["較低，較低","較高，較低","較低，較高","較高，較高"],"ans":3,"exp":["📝 解析：市場管理品質好，投資人信任度高、資訊透明，企業籌資成本會降低，參與者多也使金融工具更容易買賣，流動性較高。"],"pos":0.00156,"w":1},{"id":"M-004","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"當企業需要資金來進行投資，最好不要用下列何種方式尋求融通？","opts":["向銀行借錢","發行股票","發行債券","向地下錢莊借錢"],"ans":4,"exp":["📝 解析：銀行借款、發行股票或債券都是正規融資管道；地下錢莊利率極高且不受監理，風險與成本都最大，應避免。"],"pos":0.00233,"w":1},{"id":"M-005","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是近年來國內主管機關管理金融市場自由化的發展方向？","opts":["減少法規的限制","鼓勵金融創新","對國外資金進行更嚴格的限制與管理","加強國際金融的流通"],"ans":3,"exp":["📝 解析：金融自由化的方向是鬆綁法規、鼓勵創新、促進國際資金流通；對外資加強限制是管制方向，與自由化相反。"],"pos":0.00311,"w":1},{"id":"M-006","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者並非在金融市場中，主管機關（如：我國的金管會、美國的 SEC 等）訂定法律規範之核心目的？","opts":["維護金融穩定與防範系統性風險","限制投資人及消費者權益","維持市場公平、透明與效率","推動政策目標與社會責任"],"ans":2,"exp":["📝 解析：監理法規的目的是維持金融穩定、市場公平透明及推動政策目標，並以保護投資人與消費者權益為核心，而不是限制其權益。"],"pos":0.00389,"w":1},{"id":"M-007","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"目前國內監理銀行、票券、證券及保險等金融機構的主管機關為：","opts":["財政部","內政部","金融監督管理委員會","經濟部"],"ans":3,"exp":["📝 解析：我國採金融一元化監理，銀行、票券、證券、期貨、保險均由金融監督管理委員會（金管會）主管。"],"pos":0.00467,"w":1},{"id":"M-008","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一個對象或機構，不屬於金融監督管理委員會「證券期貨局」的主要監理範疇？","opts":["證券投資信託業與期貨業","臺灣證券交易所與期貨交易所","金融控股公司","櫃買中心"],"ans":3,"exp":["📝 解析：證券期貨局主管證券、期貨、投信投顧業及證交所、期交所、櫃買中心；金融控股公司由銀行局主管。"],"pos":0.00545,"w":1},{"id":"M-009","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"依照國內金融監理制度的架構，主掌金融業檢查業務的單位為：","opts":["銀行局","中央銀行","中央存款保險公司","檢查局"],"ans":4,"exp":["📝 解析：金管會下設銀行局、證券期貨局、保險局及檢查局，其中檢查局負責各類金融機構的金融檢查業務。"],"pos":0.00623,"w":1},{"id":"M-010","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非隸屬「金融監督管理委員會」？","opts":["銀行局","公務人員退休撫卹基金管理委員會","證券期貨局","檢查局"],"ans":2,"exp":["📝 解析：銀行局、證券期貨局、檢查局都是金管會所屬機關；公務人員退休撫卹基金管理機關隸屬銓敘部（考試院體系），不屬金管會。"],"pos":0.007,"w":1},{"id":"M-011","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬證券期貨局監理的機構？","opts":["投信公司","期貨公司","證券商","保險公司"],"ans":4,"exp":["📝 解析：投信、期貨商、證券商都由證券期貨局監理；保險公司歸金管會保險局主管。"],"pos":0.00778,"w":1},{"id":"M-012","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是檢查局業務檢查的機構？","opts":["保險公司","銀行","證券公司","金融資訊服務公司"],"ans":4,"exp":["📝 解析：檢查局檢查的是銀行、證券、期貨、保險等金融機構；一般金融資訊服務公司並非受檢金融機構。"],"pos":0.00856,"w":1},{"id":"M-013","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非政府(金管會及中央銀行)管理金融市場的措施?","opts":["訂定金融機構的資本適足率","金融檢查的立即糾正措施","訂定金融機構呆帳準備的提列","限制存款戶的存款金額"],"ans":4,"exp":["📝 解析：資本適足率、立即糾正措施、呆帳準備提列都是審慎監理工具；限制存款戶存款金額不是金融監理措施，也不合理。"],"pos":0.00934,"w":1},{"id":"M-016","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"區分資本市場和貨幣市場的差異主要在於：","opts":["金管會核准發行的數量","證券發行期限的長短","證券收益率","以上皆是"],"ans":2,"exp":["📝 解析：貨幣市場與資本市場以金融工具期限劃分：一年以內為貨幣市場，一年以上為資本市場，與核准數量或收益率無關。"],"pos":0.01012,"w":1},{"id":"M-018","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"資金需求者以發行證券方式來向大眾募集資金者稱為：","opts":["直接金融","間接金融","再融資金融","機構金融"],"ans":1,"exp":["📝 解析：資金需求者自行發行股票、債券等證券向大眾募資，資金直接由投資人流向發行者，稱為直接金融。"],"pos":0.01089,"w":1},{"id":"M-019","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何種金融市場可以提供企業短期的資金融通？","opts":["貨幣市場","資本市場","初級市場","長期外匯市場"],"ans":1,"exp":["📝 解析：貨幣市場交易一年期以內的短期工具（如商業本票、國庫券），提供企業短期資金融通。"],"pos":0.01167,"w":1},{"id":"M-020","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"資金需求者可以在何種金融市場發行中、長期的證券來募集資金？","opts":["貨幣市場","資本市場","流通市場","次級市場"],"ans":2,"exp":["📝 解析：資本市場交易一年以上的中長期證券（股票、債券），是企業募集中長期資金的場所。"],"pos":0.01245,"w":1},{"id":"M-028","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列對於金融控股公司的描述何者為非？","opts":["結合銀行、證券、保險等相關行業","提供客戶一次購足的多元化服務","控股公司旗下金融機構的關係平等，與綜合銀行之組織型態不同","母公司可以非金融產業公司主導"],"ans":4,"exp":["📝 解析：依金融控股公司法，金控只能投資與管理金融相關事業，非金融業不得藉金控主導；跨業整合、一次購足、子公司並列是金控特色。"],"pos":0.01323,"w":1},{"id":"M-033","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬金融監督管理委員會之職掌?","opts":["票券市場之監督","保險市場之監督","稅改","金融檢查"],"ans":3,"exp":["📝 解析：金管會負責票券、保險、證券、銀行市場監督及金融檢查；稅制改革屬財政部職掌。"],"pos":0.01401,"w":1},{"id":"M-035","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬於金融體系的一環?","opts":["銀行","臺灣證券交易所","公司債","飾金買賣"],"ans":4,"exp":["📝 解析：銀行（金融機構）、證交所（金融市場）、公司債（金融工具）都屬金融體系；飾金買賣是一般商品交易。"],"pos":0.01479,"w":1},{"id":"M-039","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者「不屬於」金融市場運作的核心功能？","opts":["滿足實體經濟中，企業生產與擴展之資金需求","提供投資人利用衍生性工具規避價格風險","提供市場參與者合法進行內線交易與投機博弈","提升資本運作效率，促進整體經濟繁榮"],"ans":3,"exp":["📝 解析：金融市場功能包括支應實體經濟資金需求、提供避險工具、提升資本效率；內線交易是證交法禁止的違法行為，不可能是市場功能。"],"pos":0.01556,"w":1},{"id":"M-040","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"有關資金融通之描述，下列何者正確？","opts":["是指在經濟運行過程中，資金供求雙方運用各種金融工具調節資金的活動","是所有金融交易活動的總稱","分為直接融資和間接融資兩種","以上皆是"],"ans":4,"exp":["📝 解析：資金融通是資金供求雙方運用金融工具調節資金的活動，涵蓋所有金融交易，並分為直接融資與間接融資，三項敘述都正確。"],"pos":0.01634,"w":1},{"id":"M-041","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列關於金融市場不同分類方式的敘述，何者「錯誤」？","opts":["依地理範圍區分，可分為國內金融市場與國際金融市場","凡是沒有固定交易場所，透過電信或電腦網絡進行交易的市場，稱為無形市場","有形市場必須具備具體的實體空間與硬體設施，如：期貨交易所或證券交易所的營業大廳","國際金融市場的交易範疇僅限於不同國家貨幣間的外匯買賣，不涉及債券、股票或衍生性金融商品"],"ans":4,"exp":["📝 解析：國際金融市場不只外匯交易，還包括國際借貸、國際債券、股票及衍生性商品等，故(4)錯誤；其餘分類敘述正確。"],"pos":0.01712,"w":1},{"id":"M-042","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"有關金融市場的種類，下列何者正確？","opts":["國際金融市場，由經營國際間貨幣業務的金融機構組成，其經營內容包括資金借貸、外匯買賣、證券買賣、資金交易等","國內金融市場， 由國內金融機構組成，辦理各種貨幣、證券及作用業務活動","有形金融市場，指有固定場所和操作設施的金融市場","以上皆是"],"ans":4,"exp":["📝 解析：國際金融市場辦理跨國借貸、外匯、證券等業務；國內金融市場由國內金融機構組成；有形市場具固定交易場所，三項均正確。"],"pos":0.0179,"w":1},{"id":"M-043","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"有關金融市場的種類，下列何者正確？","opts":["長期資金市場（資本市場），主要供應一年以上的中長期資金","次級市場，是新證券發行的市場；它可以增加公司資本","初級市場，是已經發行、處在流通中的證券的買賣市場","貨幣市場是長期資金市場"],"ans":1,"exp":["📝 解析：資本市場供應一年以上中長期資金；(2)(3)把初級與次級市場定義互換，(4)貨幣市場應是短期資金市場。"],"pos":0.01868,"w":1},{"id":"M-044","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"金融市場按長短期資金的供需交易劃分可分為哪幾種市場？","opts":["貨幣市場和資本市場","現貨市場和期貨市場","初級市場和次級市場","地方性金融市場、國內性金融市場、國際性金融市場"],"ans":1,"exp":["📝 解析：依資金期限長短劃分為貨幣市場（一年以內）與資本市場（一年以上）；現貨／期貨是依交割時間，初級／次級是依發行或流通。"],"pos":0.01946,"w":1},{"id":"M-045","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"金融市場按地域範圍可分為哪幾種市場？","opts":["貨幣市場和資本市場","現貨市場和期貨市場","初級市場和次級市場","地方性金融市場、國內性金融市場、國際性金融市場"],"ans":4,"exp":["📝 解析：依地域範圍可分為地方性、國內性及國際性金融市場；其他選項分別是依期限、交割時間與交易階段的分類。"],"pos":0.02023,"w":1},{"id":"M-046","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融工具依據其「償還期限」的長短，可區分為短期與長期金融工具。在國際金融慣例與學理上，這兩者的劃分基準點通常設定為多久？","opts":["三個月：主要考量銀行間頭寸撥補的極短天期需求","半年：配合企業編製半年財務報表的審核週期","一年：作為區分「貨幣市場」 工具與「資本市場」工具的公認標準","二年：配合一般商業合約的平均存續期與法律追訴時效"],"ans":3,"exp":["📝 解析：國際慣例以一年為分界：一年以內為短期（貨幣市場）工具，一年以上為長期（資本市場）工具。"],"pos":0.02101,"w":1},{"id":"M-049","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"政府對金融業做特殊的監督與管理的理由，下列何者最正確？","opts":["保護投資人權益","金融體系的穩定會影響經濟的穩定","監管金融體系可以讓政府政策更有效率","以上皆是"],"ans":4,"exp":["📝 解析：政府監理金融業是為保護存款人與投資人、維持金融體系穩定（進而穩定經濟），並使貨幣與經濟政策有效傳導，三者皆是。"],"pos":0.02179,"w":1},{"id":"M-052","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"資金剩餘者將剩餘之資金存入金融機構，金融機構再間接將此資金貸放給資金不足者或購買資金不足者所發行之有價證券。謂之：","opts":["間接金融","直接金融","財務金融","以上皆非"],"ans":1,"exp":["📝 解析：資金經由銀行等金融中介機構吸收存款後再放款或投資，存款人與最終借款人不直接往來，稱為間接金融。"],"pos":0.02257,"w":1},{"id":"M-053","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於金融市場的主要功能與限制，下列敘述何者「錯誤」？","opts":["作為資金融通的媒介，協助資金剩餘者與資金需求者達成資源配置","透過高度標準化的契約與交易制度，可以完全消除投資人的市場風險與本金損失","具備「價格發現」機制，能透過供需平衡反映出金融資產的市場價值","藉由公開且透明的資訊揭露，有助於降低交易雙方之間的資訊不對稱與搜尋成本"],"ans":2,"exp":["📝 解析：標準化契約與交易制度只能降低交易成本與違約風險，無法消除市場價格波動帶來的風險與本金損失，故(2)錯誤。"],"pos":0.02335,"w":1},{"id":"M-056","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是健全的金融市場所需之條件？","opts":["金融商品的價格不透明","大量的儲蓄資金供給","多樣化的交易工具","健全的銀行制度與中央銀行"],"ans":1,"exp":["📝 解析：健全市場需要充足儲蓄、多樣工具、健全銀行與央行制度，且價格必須透明；價格不透明會損害公平與效率。"],"pos":0.02412,"w":1},{"id":"M-057","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者是金融中介機構在提升金融市場效率方面，最顯著的功能？","opts":["限制大眾參與投資，以維持金融體系之穩定","將零散的小額資金匯集為大額資金，發揮資產規模化之效益","確保所有放款對象皆具備相同的還款能力","僅提供單一的儲蓄產品，以降低消費者的決策難度"],"ans":2,"exp":["📝 解析：金融中介機構匯集零散小額存款成大額資金再貸放，產生規模經濟並分散風險，是提升市場效率的主要功能。"],"pos":0.0249,"w":1},{"id":"M-059","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"資金需求者藉由原始證券（例如股票、債券或票券）的發行（或稱承銷），並透過市場交易 （經紀或自營），撮合資金供需雙方完成資金交易的融通方式，謂之：","opts":["直接金融","間接金融","財務金融","金融中介"],"ans":1,"exp":["📝 解析：資金需求者發行原始證券，經承銷、經紀或自營撮合，讓投資人直接持有發行者的證券，屬直接金融。"],"pos":0.02568,"w":1},{"id":"M-060","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於金融監督管理委員會之主管業務？","opts":["金融控股公司","證券業","金融支付系統","期貨業"],"ans":3,"exp":["📝 解析：金控、證券業、期貨業均由金管會主管；金融支付清算系統依中央銀行法由中央銀行監管。"],"pos":0.02646,"w":1},{"id":"M-107","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"金控公司子公司間辦理跨業共同行銷，下列敘述何者正確？","opts":["金融控股公司之子公司間依使用目的得交互運用客戶之基本資料、帳務資料、信用資料等往來交易資料","辦理共同行銷之業務人員，應符合各業管法規所訂業務人員必須之資格或證照","共同行銷之業務人員辦理他業業務時，其行為直接對他業機構發生效力","以上皆是"],"ans":4,"exp":["📝 解析：依金融控股公司法及子公司間共同行銷規範，子公司間可依目的交互運用客戶資料、業務人員須具備他業證照、其辦理他業業務的行為對他業機構生效，三者皆是。"],"pos":0.02724,"w":1},{"id":"M-338","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"運用一年期以內短期信用工具，調節短期資金供需的交易市場，稱為下列何者？","opts":["債券市場","貨幣市場","股票市場","期貨市場"],"ans":2,"exp":["📝 解析：貨幣市場是以一年期以內短期信用工具（國庫券、商業本票、NCD、拆款等）調節短期資金的市場；一年以上屬資本市場。"],"pos":0.02802,"w":1},{"id":"M-339","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"金融機構間之新台幣拆款市場，係屬下列何者？","opts":["債券市場","貨幣市場","股票市場","外匯市場"],"ans":2,"exp":["📝 解析：金融同業拆款多為隔夜到數月的短期資金調度，屬貨幣市場的一環。"],"pos":0.02879,"w":1},{"id":"M-342","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬貨幣市場的功能？","opts":["配合中央銀行執行貨幣政策","提供法人及個人理財工具","提供股票買賣的機制","建立利率指標"],"ans":3,"exp":["📝 解析：貨幣市場可配合央行執行貨幣政策、提供短期理財工具並形成利率指標；股票買賣屬資本市場功能。"],"pos":0.02957,"w":1},{"id":"M-351","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為間接金融？","opts":["發行股票","發行短期票券","發行公司債","向銀行借款"],"ans":4,"exp":["📝 解析：間接金融是資金透過銀行等中介機構流向借款人；發行股票、票券、公司債直接向投資人籌資，屬直接金融。"],"pos":0.03035,"w":1},{"id":"M-373","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬金融機構合併法所定義之銀行業？","opts":["證券金融事業","信用合作社","票券金融公司","信用卡業務機構"],"ans":1,"exp":["📝 解析：金融機構合併法所稱銀行業包括銀行、信用合作社、農漁會信用部、票券金融公司、信用卡業務機構等；證券金融事業屬證券業。"],"pos":0.03113,"w":1},{"id":"M-505","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"有關資金融通之描述，下列何者「正確」？","opts":["間接金融是指資金需求者直接在金融市場發行有價證券，向資金供給者籌措資金","直接金融模式中，銀行扮演著承擔信用風險的中介角色","企業透過商業銀行辦理貸款，屬於「間接金融」的範疇","在直接金融下，資金供給者（存款人）不直接承擔投資風險"],"ans":3,"exp":["📝 解析：企業向銀行借款時，資金由存款人經銀行中介轉貸，屬間接金融；其餘選項把直接與間接金融的特徵說反了。"],"pos":0.03191,"w":1},{"id":"M-506","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"若依交易型態的金融工具予以區分金融市場的種類，下列何種不屬於金融市場？","opts":["貨幣市場","資本市場","地下錢莊","衍生性金融商品市場"],"ans":3,"exp":["📝 解析：貨幣、資本與衍生性商品市場皆是合法金融市場；地下錢莊屬非法放貸，不是正規金融市場。"],"pos":0.03268,"w":1},{"id":"M-507","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當企業需要資金進行投資時，主要向金融機構尋求融資借款，而金融中介機構從中賺取存、 放款的利差，此種金融市場的結構稱為？","opts":["直接金融","間接金融","發行債券","向地下錢莊借錢"],"ans":2,"exp":["📝 解析：企業向金融機構借款，中介機構賺取存放款利差，資金供需雙方不直接往來，屬間接金融。"],"pos":0.03346,"w":1},{"id":"M-508","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據金管會於2024 至 2026 年發布的「金融資安韌性發展藍圖」及「114 年金融建言白皮書」等相關政策文件，下列何者不是國內金融市場發展方向之核心面向？","opts":["強化金融韌性與風險監理","數位轉型與金融科技","不強制要求上市櫃公司按階段揭露溫室氣體盤查資訊","打造亞洲資產管理中心"],"ans":3,"exp":["📝 解析：金管會政策是要求上市櫃公司依永續發展路徑圖分階段揭露溫室氣體盤查與確信，選項(3)「不強制」與政策方向相反。"],"pos":0.03424,"w":1},{"id":"M-509","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於我國各政府機關在金融事務上的分工，下列哪一項敘述是正確的？","opts":["金管會負責制定國家的「貨幣政策」與調整銀行貼現率","金管會的主要任務是進行「金融監督與檢查」， 保護投資人與消費者權益","財政部負責直接監理所有民營銀行的日常存匯業務與內部稽核","內政部警政署負責審核證券商的執照發放與公開說明書內容"],"ans":2,"exp":["📝 解析：金管會負責金融監督、檢查與消費者保護；貨幣政策與貼現率屬中央銀行，證券商發照與公開說明書審查也屬金管會。"],"pos":0.03502,"w":1},{"id":"M-510","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"我國採取金融監理「一元化」模式，將原本分散在各單位的監理權力集中。下列關於此模式的敘述，何者正確？","opts":["由財政部統一負責所有金融機構的執照發放與現場檢查","由「金管會」統一跨部會監理銀行、證券與保險等不同產業","所有的金融詐騙案件均由檢查局直接進行逮捕與司法審判","銀行若發生違法情事，僅由中央銀行負責處分，不需經過金管會"],"ans":2,"exp":["📝 解析：我國於2004年成立金管會，統一監理銀行、證券期貨與保險業；違規處分由金管會為之，刑事審判則屬法院。"],"pos":0.0358,"w":1},{"id":"M-511","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列關於金管會下轄局處與監理對象的對應，何者正確？","opts":["檢查局：負責審核各類保單條款及保險費率","證券期貨局：負責管理全國信用合作社與農會信用部","銀行局：負責監理商業銀行、金融控股公司及信用卡公司","保險局：負責執行金融機構的現場金檢業務"],"ans":3,"exp":["📝 解析：銀行局監理銀行、金控與信用卡業務；保單條款費率屬保險局，農會信用部屬農業部農業金融署，現場金檢屬檢查局。"],"pos":0.03658,"w":1},{"id":"M-518","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於我國金融控股公司之監理規範，下列敘述何者正確？","opts":["金控公司本身不從事銀行、保險或證券之本業經營，僅負責子公司的投資與管理","為了創造更高報酬，金控公司可無限制地向外借款來轉投資非金融相關產業","衡量金控集團安全性時，僅需看各子公司的資本適足率，母公司無須計算集團合併資本適足率","金控公司法規定，金控公司對單一企業的持股比例不受限制，以利跨業併購"],"ans":1,"exp":["📝 解析：依金融控股公司法，金控僅得投資及管理被投資事業，不得自營本業；集團須計算合併資本適足率，借款與轉投資亦受限。"],"pos":0.03735,"w":1},{"id":"M-519","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融控股公司採取「母子公司」架構而非單一法人架構（如綜合銀行），其主要目的之一為何？","opts":["為了讓各子公司能規避資本適足率的法定限制","建立「防火牆」機制，避免單一子公司的經營風險直接拖累其他子公司或母公司","降低金控母公司的稅負義務，因為子公司盈餘無須上繳","方便母公司直接介入子公司的放款決策，提高資金運用效率"],"ans":2,"exp":["📝 解析：金控以母子公司架構把銀行、證券、保險分設子公司，形成防火牆，隔離單一子公司的經營風險，避免擴散至整個集團。"],"pos":0.03813,"w":1},{"id":"M-525","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列有關金融市場的分類與功能，哪一項敘述最為正確？","opts":["資本市場主要在於提供期限在一年以上的中長期資金融通","初級市場是指已發行證券在投資人之間轉手買賣的流通市場","次級市場是指發行新證券以籌集新資金的市場，可直接增加發行公司的資本","貨幣市場是指交易期限在一年以上的工具，提供長期穩定的資金"],"ans":1,"exp":["📝 解析：資本市場融通一年以上的中長期資金；初級市場是發行新證券、次級市場是流通轉手，貨幣市場則為一年以內工具。"],"pos":0.03891,"w":1},{"id":"M-526","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融市場若以「交割時間」作為劃分，通常可歸類為哪兩大類市場？","opts":["初級市場與次級市場","集中市場與店頭市場","貨幣市場與資本市場","現貨市場與期貨市場"],"ans":4,"exp":["📝 解析：依交割時間區分，成交後立即或短期內交割的是現貨市場，約定未來特定日期交割的是期貨（遠期）市場。"],"pos":0.03969,"w":1},{"id":"M-528","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"小明將存款存入銀行領取利息，銀行再將這筆款項貸放給某科技公司進行廠房擴建。在這種資金融通的過程中，小明與科技公司之間並不直接發生債權債務關係。此種模式屬於下列何者？","opts":["直接金融","間接金融","權益融資","公開市場操作"],"ans":2,"exp":["📝 解析：存款人把錢存銀行，由銀行貸放給企業，雙方無直接債權債務關係，由銀行居中承擔信用風險，屬間接金融。"],"pos":0.04047,"w":1},{"id":"M-529","s":"all","ch":"常識｜金融市場與監理機關","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融市場的存在能有效降低經濟活動中的「交易成本」，下列敘述何者正確？","opts":["因為市場完全競爭，所以投資人完全不需要支付任何稅賦與服務費","透過集中化的交易平台與標準化契約，減少尋找交易對手與訂定合約的時間與費用","讓企業不需經過任何審核即可募集資金，縮短資金到帳的時間","強制將所有資金導入特定產業，省去評估不同投資計畫的決策成本"],"ans":2,"exp":["📝 解析：金融市場透過集中交易平台與標準化契約，降低尋找交易對手、議約與資訊蒐集成本；並非免稅免費或免審核。"],"pos":0.04125,"w":1},{"id":"M-098","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於我國國家發展委員會公布之「景氣對策信號」，下列敘述何者錯誤？","opts":["景氣燈號由紅燈轉為黃紅燈，代表景氣熱度有稍微降溫的趨勢","當燈號出現「藍燈」時，政府通常會考慮實施擴張性政策以提振經濟","「綠燈」代表景氣穩定，各項經濟指標處於正常範圍","景氣燈號只要呈現「黃藍燈」，即表示股市已經進入崩盤階段"],"ans":4,"exp":["📝 解析：景氣對策信號反映整體景氣冷熱，黃藍燈表示景氣欠佳或趨緩，並不代表股市崩盤；其他燈號敘述正確。"],"pos":0.04202,"w":1},{"id":"M-110","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"利率之1 個基本點(basis point)等於?","opts":["0.001%","0.01%","0.1%","1%"],"ans":2,"exp":["📝 解析：1個基本點（bp）為0.01%，即萬分之一；100個基本點等於1%。"],"pos":0.0428,"w":1},{"id":"M-111","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"利率之一碼為：","opts":["0.25%","0.5%","1%","5%"],"ans":1,"exp":["📝 解析：利率一碼為0.25%（25個基本點），常見於央行升降息報導，例如「升息半碼」即0.125%。"],"pos":0.04358,"w":1},{"id":"M-259","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"下列何者係獨占發行通貨，執行貨幣政策之機構？","opts":["專業銀行","商業銀行","中央銀行","財政部"],"ans":3,"exp":["📝 解析：依中央銀行法，中央銀行獨占新台幣發行並負責執行貨幣政策；財政部掌財政，一般銀行無發行權。"],"pos":0.04436,"w":1},{"id":"M-260","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬中央銀行之業務範疇？","opts":["發行貨幣","進行公開市場操作","直接對企業融通資金","保管國際準備"],"ans":3,"exp":["📝 解析：央行是銀行的銀行與政府的銀行，負責發行貨幣、公開市場操作、保管外匯存底；不直接對企業融資。"],"pos":0.04514,"w":1},{"id":"M-261","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"有關我國中央銀行之功能，下列何者錯誤？","opts":["執行貨幣政策","穩定匯率","維持安全有效率之支付制度","核定各商業銀行之牌告利率"],"ans":4,"exp":["📝 解析：銀行牌告利率由各銀行自行訂定，央行只透過政策利率等工具間接影響；執行貨幣政策、穩定匯率、維護支付制度都是央行職能。"],"pos":0.04591,"w":1},{"id":"M-262","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"若其他條件不變，下列何者會使本國貨幣供給量增加？","opts":["國際收支順差","國際收支逆差","全體銀行對企業及個人信用緊縮","政府財政赤字餘額減少"],"ans":1,"exp":["📝 解析：國際收支順差使外匯流入，結匯成新台幣（央行買匯）時釋出強力貨幣，貨幣供給增加；逆差與信用緊縮則相反。"],"pos":0.04669,"w":1},{"id":"M-267","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"假設其他條件不變，下列何者可使存款貨幣的創造能力提高而增加貨幣供給量？","opts":["法定存款準備率提高","銀行授信增列補償性存款之規定","銀行超額準備增加","法定存款準備率降低"],"ans":4,"exp":["📝 解析：存款貨幣乘數約為法定準備率的倒數，調降準備率使銀行可貸放資金增加，存款創造能力提高。"],"pos":0.04747,"w":1},{"id":"M-283","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"經營外匯相關業務者，為處理國際間收付與國際清算之需要，進行不同貨幣間的相互交換之市場，稱為下列何者？","opts":["貨幣市場（Money Market）","資本市場（Capital Market）","外匯市場（Foreign Exchange Market）","權益市場（Equity Market）"],"ans":3,"exp":["📝 解析：不同貨幣相互兌換、處理國際收付與清算的市場是外匯市場；貨幣市場是短期資金借貸，資本市場是長期籌資。"],"pos":0.04825,"w":1},{"id":"M-284","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"本國外匯市場係由不同型態的外匯交易參與者所組成，下列何者非屬其組織成員？","opts":["進出口商及旅行、投資者","外匯指定銀行","外匯經紀商","期貨交易所"],"ans":4,"exp":["📝 解析：國內外匯市場成員包括顧客（進出口商、旅客、投資人）、外匯指定銀行、外匯經紀商與中央銀行；期貨交易所不是成員。"],"pos":0.04903,"w":1},{"id":"M-285","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"有關國際外匯市場之主要功能，下列敘述何者有誤？","opts":["提供國際匯兌與清算","擴大國際間各種貨幣之利差","提高國際資金運用效率","提供規避匯率風險的工具"],"ans":2,"exp":["📝 解析：外匯市場功能是國際匯兌清算、提高資金效率與提供避險工具；套利交易反而會縮小不同貨幣間的利差，不是擴大。"],"pos":0.04981,"w":1},{"id":"M-286","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"外匯交易雙方在一特定時點簽訂契約，決定匯率，並於交易後第二個營業日完成契約金額的交割，稱為下列何者？","opts":["即期交易","遠期交易","期貨交易","選擇權交易"],"ans":1,"exp":["📝 解析：成交後第二個營業日（T+2）交割的外匯交易稱為即期交易，超過即期交割日者為遠期交易。"],"pos":0.05058,"w":1},{"id":"M-287","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"交易雙方在某特定時點決定匯率，並同意在未來某一時日交割的外匯交易市場，稱為下列何者？","opts":["即期外匯市場","遠期外匯市場","外匯期貨市場","國際資本市場"],"ans":2,"exp":["📝 解析：現在約定匯率、在未來特定日期交割的外匯交易，屬遠期外匯市場（店頭、非標準化）；外匯期貨則在交易所集中交易。"],"pos":0.05136,"w":1},{"id":"M-288","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"當任何兩種通貨無直接兌換比率，必須透過第三種通貨間接計算而得的兌換率，稱為下列何者？","opts":["名目匯率","實質匯率","交叉匯率","均衡匯率"],"ans":3,"exp":["📝 解析：兩種貨幣沒有直接報價時，透過第三種貨幣（通常為美元）間接算出的匯率，稱為交叉匯率。"],"pos":0.05214,"w":1},{"id":"M-289","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"遠期匯率與即期匯率的差額，稱為下列何者？","opts":["實質匯率","換匯匯率","交叉匯率","均衡匯率"],"ans":2,"exp":["📝 解析：遠期匯率與即期匯率的差額稱為換匯匯率（換匯點、swap rate），主要反映兩幣別的利率差。"],"pos":0.05292,"w":1},{"id":"M-290","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"中央銀行為緩和本國通貨匯價的急遽升貶，可利用下列何種方式調節外匯供需，使達成適當匯率水準？","opts":["重貼現政策","準備金政策","選擇性信用管制","外匯干預"],"ans":4,"exp":["📝 解析：央行在外匯市場買賣外匯以調節供需、緩和匯率急升急貶，稱為外匯干預；重貼現與準備金政策是調節貨幣數量的工具。"],"pos":0.0537,"w":1},{"id":"M-291","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"外匯市場上，報價銀行 EUR/USD 之報價為 1.1713/17，表示詢價者買入一歐元之價格為何？","opts":["1.1713 美元","1.1717 美元","1.1700 美元","0.8534 美元"],"ans":2,"exp":["📝 解析：報價1.1713/17中，前者為銀行買價、後者為銀行賣價；詢價者買入歐元要用銀行賣價1.1717美元。"],"pos":0.05447,"w":1},{"id":"M-292","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"外資匯入美元，投資臺灣股市，唯恐將來匯出時新台幣貶值，可如何規避匯率風險？","opts":["買無本金交割遠期美元（NDF）","買入即期美元","買入美元賣權","賣出美元買權"],"ans":1,"exp":["📝 解析：外資擔心匯出時新台幣貶值、美元變貴，可先買進無本金交割遠期美元（NDF）鎖定未來買美元的價格；賣權或賣出買權方向相反。"],"pos":0.05525,"w":1},{"id":"M-296","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"在其他條件不變下，下列何者會使本國貨幣貶值？","opts":["本國利率上升","本國進口關稅下降","本國相對物價下跌","本國相對生產力提高"],"ans":2,"exp":["📝 解析：降低進口關稅使進口增加、對外匯需求上升，本國貨幣貶值；利率上升、物價相對下跌、生產力提高則有利本幣升值。"],"pos":0.05603,"w":1},{"id":"M-341","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"下列何者係在貨幣市場上擔任市場監督信用管理者及市場資金最後調節者？","opts":["票券商","商業銀行","中央銀行","財政部"],"ans":3,"exp":["📝 解析：中央銀行透過公開市場操作、融通等方式監督信用並調節市場資金，是貨幣市場最後的資金供給與調節者。"],"pos":0.05681,"w":1},{"id":"M-364","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"在貨幣市場上，我們常聽到「利率上升一碼」的說詞，請問「一碼」是多少？","opts":["0.01%","0.125%","0.25%","0.5%"],"ans":3,"exp":["📝 解析：市場慣稱一碼等於0.25個百分點，半碼為0.125%；央行升息一碼即政策利率上調0.25%。"],"pos":0.05759,"w":1},{"id":"M-375","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬中央銀行執行貨幣政策的工具？","opts":["公開市場操作","重貼現率政策","存款準備率政策","調整稅率政策"],"ans":4,"exp":["📝 解析：央行貨幣政策工具有公開市場操作、重貼現率、存款準備率及選擇性信用管制；調整稅率屬政府財政政策。"],"pos":0.05837,"w":1},{"id":"M-376","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為我國中央銀行作為經常性信用控管的一項政策工具，其在執行貨幣政策時，較具時效性、機動性及主動性？","opts":["公開市場操作","重貼現率政策","存款準備率政策","財政政策"],"ans":1,"exp":["📝 解析：公開市場操作可由央行每天主動、小額、可逆地調節資金，時效性與機動性最高，是我國央行最常用的工具。"],"pos":0.05914,"w":1},{"id":"M-377","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"中央銀行如欲採取寬鬆貨幣政策，則應採取下列何項措施？","opts":["提高存款準備率","提高重貼現率","買進可轉讓定存單","賣出可轉讓定存單"],"ans":3,"exp":["📝 解析：寬鬆政策要釋出資金：央行買回（或少發）可轉讓定存單可把資金放回市場；提高準備率、重貼現率及賣出定存單都是緊縮。"],"pos":0.05992,"w":1},{"id":"M-378","s":"all","ch":"常識｜貨幣與總體經濟","star":1,"n":1,"refs":"","tag":"","stem":"下列何者係中央銀行實施公開市場操作的短期目標？","opts":["影響貨幣數量及利率水準","實現穩定物價","經濟成長","充分就業"],"ans":1,"exp":["📝 解析：公開市場操作的短期（操作）目標是影響準備貨幣數量與短期利率，進而達成穩定物價、經濟成長等最終目標。"],"pos":0.0607,"w":1},{"id":"M-026","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬專業銀行？","opts":["工業信用銀行","中小企業信用銀行","商業銀行","輸出入信用銀行"],"ans":3,"exp":["📝 解析：銀行法所稱專業銀行包括工業、農業、輸出入、中小企業、不動產、國民銀行等專業信用銀行；商業銀行是一般性銀行，不屬專業銀行。"],"pos":0.06148,"w":1},{"id":"M-058","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在「間接金融」的運作過程中，資金供給者（存款人）所持有的金融工具，其主要的債務承擔主體（發行者）為何？","opts":["最終的資金需求者","供中介服務的金融機構","負責監管金融體系的中央銀行","提供撮合服務的證券經紀商"],"ans":2,"exp":["📝 解析：間接金融中，存款人持有的是銀行發行的存款憑證等債權，由金融中介機構（銀行）負償還責任，而非最終借款人。"],"pos":0.06226,"w":1},{"id":"M-084","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"小明在「甲銀行」存有 200 萬元，同時在「乙銀行」存有 200 萬元。若甲、乙兩家銀行皆為參加存款保險之金融機構且不幸同時倒閉，依據現行制度，小明最高可獲得總計多少元的賠付保障？","opts":["僅限 300 萬元（以個人為單位跨行合併計算）","總計 400 萬元（甲、乙兩銀行分別計算，且均未超過單一機構保額上限）","僅限 200 萬元（以存款較多之單一銀行為準）","總計 600 萬元（依政府專案全額保障）"],"ans":2,"exp":["📝 解析：存款保險以「每一存款人在同一家要保機構」分別計算保額（現行最高300萬元），甲、乙各200萬元均未超過上限，合計可獲賠400萬元。"],"pos":0.06304,"w":1},{"id":"M-085","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依據金融監督管理委員會針對「學生申請信用卡」之現行規範，為避免學生過度擴張信用， 對於其申請資格與信用額度有明確限制。下列關於學生卡申請條件之敘述，何者完全正確？","opts":["申請人須年滿18 歲，不限發卡機構家數，每家機構額度最高 2 萬元","申請人須年滿 20 歲，最多限3 家發卡機構，每家機構額度最高 5 萬元","申請人須年滿 18 歲，最多限 3 家發卡機構，每家機構額度最高 2 萬元","申請人須年滿 18 歲，限 5 家發卡機構，總信用額度不得超過10 萬元"],"ans":3,"exp":["📝 解析：依信用卡業務機構管理辦法，學生申請信用卡須成年（現行滿18歲），以3家發卡機構為限，每家信用額度不得超過新臺幣2萬元。"],"pos":0.06381,"w":1},{"id":"M-086","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依民法規定，有關保證之敘述，下列何者錯誤？","opts":["保證債務對主債務均有其從屬性，故主債務人拋棄其抗辯權者，保證人即不得為該主張","保證人之負擔較主債務人為重者，應減縮至主債務人之程度","債權人允許主債務人延期清償時，須經保證人同意，否則不負保證責任","保證人向債權人清償後，於其清償限度內取得債權人對於主債務人之債權"],"ans":1,"exp":["📝 解析：依民法第742條，主債務人所有之抗辯，保證人得主張之；即使主債務人拋棄抗辯，保證人仍得主張，故(1)錯誤。"],"pos":0.06459,"w":1},{"id":"M-087","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依據「銀行法」第 12 條之規定，銀行辦理授信業務時，必須符合法定的擔保方式始得稱為 「擔保授信」。下列哪一項授信行為，因其提供的擔保品或保證方式不符合該條文之法定種類，應歸類為「無擔保授信」？","opts":["借款人提供其所有之動產，並為銀行設定動產抵押權","借款人提供知名私人企業（非信用保證機構）出具之信用保證函","借款人提供經政府核准發行之公司債或股票並設定質權","借款人提供經銀行承兌且由營業交易所產生之匯票"],"ans":2,"exp":["📝 解析：銀行法第12條所稱擔保授信，擔保限於：不動產或動產抵押權、動產或權利質權（如股票、公司債設質）、借款人營業交易所發生的應收票據，以及各級政府公庫主管機關、銀行或經政府核准設立之信用保證機構的保證。一般私人企業出具的保證函不在法定範圍，屬無擔保授信，故選 (2)。"],"pos":0.06537,"w":1},{"id":"M-088","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"良好的內部控制可以利用環境相扣的內控措施減少弊端的發生，降低損失，下列何者不屬於內控措施？","opts":["日常運作之牽制","獎懲制度","命令休假","內部自行查核"],"ans":2,"exp":["📝 解析：日常作業牽制、強制休假、內部自行查核都是內控制度中的控制作業；獎懲制度屬人事管理，不是內控措施本身。"],"pos":0.06615,"w":1},{"id":"M-090","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者機構可以辦理特定金錢信託業務？","opts":["銷售共同信託基金之證券投資信託公司","核准辦理信託業務之銀行及證券商","受委託代操證券投資之證券商","提供金融商品投資分析之證券投資顧問公司"],"ans":2,"exp":["📝 解析：依信託業法，特定金錢信託須由經核准經營信託業務的機構辦理，例如兼營信託業務的銀行與證券商。"],"pos":0.06693,"w":1},{"id":"M-099","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關客戶委託保管有價證券，下列敘述何者錯誤？","opts":["經辦人員核符後蓋章核發保管憑條給委託人","經常不定期盤點有價證券並做成紀錄","依規定收取保管手續費並即時入帳","保管有價證券之送存與提領，經主管人核准後依規定辦理"],"ans":1,"exp":["📝 解析：保管有價證券屬重要作業，保管憑條須經辦人員核對後再經主管覆核共同簽章始得核發，僅經辦蓋章不符雙重控管，故(1)錯誤。"],"pos":0.0677,"w":1},{"id":"M-100","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"以下何者係屬應對金融機構建立並為維持適當有效之內部控制制度負最終責任之人：","opts":["總經理","董(理)事會","分行經理","總稽核"],"ans":2,"exp":["📝 解析：依金融控股公司及銀行業內部控制及稽核制度實施辦法，董（理）事會對建立並維持適當有效的內控制度負最終責任。"],"pos":0.06848,"w":1},{"id":"M-101","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"銀行辦理自用住宅及消費性貸款，如已徵提足額擔保，下列何者敘述是錯誤的？","opts":["借款人如為補強信用，仍可主動提供一般保證人","借款人就業不久，恐無負擔能力，得徵提連帶保證人","銀行辦理擔保貸款應以一定金額為限","銀行未來求償時，應先就借款人求償，不足部分得向保證人求償"],"ans":2,"exp":["📝 解析：依銀行法第12條之1，自用住宅及消費性放款已取得足額擔保時，不得要求借款人提供連帶保證人，故(2)錯誤。"],"pos":0.06926,"w":1},{"id":"M-263","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"銀行法中所稱資本嚴重不足，係指自有資本與風險性資產之比率低於多少百分比？","opts":["1%","2%","5%","8%"],"ans":2,"exp":["📝 解析：依銀行法 §44 第 3 項，資本嚴重不足是指自有資本與風險性資產之比率（資本適足率）低於 2%；銀行淨值占資產總額比率低於 2% 者也視為資本嚴重不足。依 §44-2 及 §62 第 2 項，主管機關應自列入之日起 90 日內派員接管。"],"pos":0.07004,"w":1},{"id":"M-264","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"銀行對於隨時可能發生的資金需求，因其變現能力與準備部位不足所產生的風險，稱為下列何者？","opts":["信用風險（credit risk）","市場風險（market risk）","流動性風險 （liquidity risk）","營運風險（operational risk）"],"ans":3,"exp":["📝 解析：無法及時以合理成本取得資金或變現資產以支應資金需求的風險，就是流動性風險。"],"pos":0.07082,"w":1},{"id":"M-265","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"當借款人或交易對手違約，致無法履行原先對銀行承諾的債務時，銀行將承受下列何種風險？","opts":["營運風險","信用風險","法律風險","市場風險"],"ans":2,"exp":["📝 解析：借款人或交易對手不履行債務，使銀行無法收回本息的風險，稱為信用風險（違約風險）。"],"pos":0.0716,"w":1},{"id":"M-266","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何項比率愈低，表示銀行資產品質愈佳？","opts":["淨值報酬率","資產週轉率","逾放比率","存放比率"],"ans":3,"exp":["📝 解析：逾放比率＝逾期放款÷總放款，比率愈低代表呆帳風險愈小，資產品質愈佳。"],"pos":0.07237,"w":1},{"id":"M-268","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"為穩健經營，有關商業銀行資金運用之原則，下列何者有誤？","opts":["安全性","投機性","流動性","獲利性"],"ans":2,"exp":["📝 解析：銀行資金運用講求安全性、流動性與獲利性，投機性違反穩健經營原則。"],"pos":0.07315,"w":1},{"id":"M-269","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"銀行內部控管制度如欠完備，造成人為疏失、舞弊或資訊系統操作不良，將使銀行承受何種風險所致損失？","opts":["市場風險","法律風險","營運風險","流動性風險"],"ans":3,"exp":["📝 解析：因內控缺失、人為疏失、舞弊或系統失靈造成的損失，屬作業（營運）風險。"],"pos":0.07393,"w":1},{"id":"M-270","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"銀行將利率敏感性缺口控制在一適當水準，係用來管理下列何項風險？","opts":["營運風險","信用風險","市場風險","利率風險"],"ans":4,"exp":["📝 解析：利率敏感性缺口衡量利率敏感資產與負債的差額，控制缺口是在管理利率變動對淨利息收入的影響，即利率風險。"],"pos":0.07471,"w":1},{"id":"M-271","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"存款有一定時期之限制，存款人憑存單或依約定方式提取，並得以之質借之存款，稱為下列何者？","opts":["支票存款","活期存款","活期儲蓄存款","定期存款"],"ans":4,"exp":["📝 解析：依銀行法，定期存款有一定期限、憑存單或約定方式提取，並可辦理存單質借；活儲與支存則可隨時提取。"],"pos":0.07549,"w":1},{"id":"M-274","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"提供下列何者予銀行辦理貸款者，不屬於擔保授信？","opts":["不動產抵押權","動產或權利質權","政府核准設立之信用保證機構保證","借款人開立之票據"],"ans":4,"exp":["📝 解析：依銀行法，擔保授信須有不動產或動產抵押、動產或權利質權、借款人營業交易應收票據或政府、銀行、信保機構保證；借款人自己開的票據不算擔保。"],"pos":0.07626,"w":1},{"id":"M-276","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"借款人提供房地產為擔保設定抵押權予銀行，其房屋應投保適當之保險，並以下列何者為受益人？","opts":["借款人","房地產所有權人","保證人","銀行"],"ans":4,"exp":["📝 解析：擔保房屋須投保火險等保險並以銀行為受益人（抵押權人），房屋受損時理賠金可優先清償貸款，確保擔保品價值。"],"pos":0.07704,"w":1},{"id":"M-277","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關銀行評估授信申請案件之主要考慮因素，下列何者有誤？","opts":["借款人之資信","借款資金用途","還款財源","介紹人之政治背景"],"ans":4,"exp":["📝 解析：授信審查看借款人資信、資金用途、還款來源、債權保障與未來展望（5P）；介紹人政治背景不是審查因素，還可能涉及不當關說。"],"pos":0.07782,"w":1},{"id":"M-278","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"正常情況下，下列何種消費者貸款利率最低？","opts":["小額信用貸款","首次購屋貸款","汽車貸款","現金卡循環信用"],"ans":2,"exp":["📝 解析：首購房貸有不動產擔保，且常搭配政策優惠，利率最低；信貸、車貸、現金卡循環利率依序較高。"],"pos":0.0786,"w":1},{"id":"M-279","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"信用卡持卡人在繳款截止日前，繳足最低應繳金額，即可維持其良好信用紀錄，其餘由發卡銀行依未繳金額按月收取利息，此授信方式稱為下列何者？","opts":["小額信用貸款","循環信用","簡易貸款","資本支出貸款"],"ans":2,"exp":["📝 解析：繳足最低應繳金額，其餘未繳款按日計息延後償還，這種可重複動用的信用額度稱為循環信用。"],"pos":0.07938,"w":1},{"id":"M-280","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"接受特約商店持簽帳單請款者稱為下列何者？","opts":["發卡銀行","信用卡客服中心","收單銀行","持卡人"],"ans":3,"exp":["📝 解析：收單銀行與特約商店簽約，受理商店請款並代為向發卡機構清算；發卡銀行則是發卡給持卡人的一方。"],"pos":0.08016,"w":1},{"id":"M-281","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"與卡片結合，提供消費者隨時透過自動提款機支借現金，以利救急使用之無擔保消費性貸款稱為下列何者？","opts":["現金卡","簽帳卡","認同卡","轉帳卡"],"ans":1,"exp":["📝 解析：現金卡是可在ATM直接借款的無擔保小額消費性貸款，用多少借多少；簽帳卡、轉帳卡則是扣自己帳戶的錢。"],"pos":0.08093,"w":1},{"id":"M-282","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關銀行發行信用卡之風險防範措施，下列敘述何者錯誤？","opts":["加強對申請人之徵信","研發信用卡之防偽技術","加強特約商店偽卡辨識訓練","將持卡人之個人及交易資料公開化"],"ans":4,"exp":["📝 解析：持卡人個人及交易資料應依個人資料保護法嚴格保密，公開化反而增加盜刷與詐騙風險；其餘都是正確的防範措施。"],"pos":0.08171,"w":1},{"id":"M-293","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依中央銀行規定，下列何者非屬銀行應提存準備金之存款範圍?","opts":["支票存款","儲蓄存款","公教人員退休金存款","定期存款"],"ans":3,"exp":["📝 解析：依央行規定，支票存款、儲蓄存款、定期存款等均須提存準備；公教人員退休金優惠存款屬政策性存款，不在提存範圍。"],"pos":0.08249,"w":1},{"id":"M-294","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬主管機關對於金融機構流動性風險之規範？","opts":["法定準備金","最低流動比率","存放比率","資本適足率"],"ans":4,"exp":["📝 解析：法定準備、流動準備比率、存放比都是流動性管理指標；資本適足率衡量資本承擔風險能力，屬資本與清償能力規範。"],"pos":0.08327,"w":1},{"id":"M-295","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"銀行承辦授信業務之基本原則，下列何者非屬之？","opts":["公開性","安全性","流動性","收益性"],"ans":1,"exp":["📝 解析：銀行授信基本原則為安全性、流動性、收益性（另含公益性、成長性）；借戶資料須保密，公開性不是授信原則。"],"pos":0.08405,"w":1},{"id":"M-307","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託法之規定，信託依設立方式之不同分為三種，下列何者非屬之？","opts":["契約信託","遺囑信託","宣言信託","法定信託"],"ans":4,"exp":["📝 解析：依信託法，信託依設立方式分為契約信託、遺囑信託與宣言信託（法人為公益宣言自為受託人）；沒有法定信託這一類。"],"pos":0.08482,"w":1},{"id":"M-308","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"委託人將財產權移轉予受託人，使依委託人意旨，為受益人利益管理或處分財產之法律關係為下列何者？","opts":["委任","信託","寄託","讓與擔保"],"ans":2,"exp":["📝 解析：依信託法§1，委託人將財產權移轉予受託人，由受託人依信託本旨為受益人利益管理或處分財產，即為信託。"],"pos":0.0856,"w":1},{"id":"M-309","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"信託關係之委託人，須將其信託財產權主體變更為下列何者之名義？","opts":["受益人","受託人","信託監察人","第二受益人"],"ans":2,"exp":["📝 解析：信託須將財產權移轉，信託財產名義變更為受託人所有，由受託人以自己名義管理處分。"],"pos":0.08638,"w":1},{"id":"M-310","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"委託人將其船舶信託移轉予受託人，使依委託人意旨管理或處分，稱為下列何種信託？","opts":["動產信託","不動產信託","金錢信託","權利信託"],"ans":1,"exp":["📝 解析：依民法，船舶屬不動產以外之物，為動產，以船舶為標的的信託屬動產信託。"],"pos":0.08716,"w":1},{"id":"M-311","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"委託人將其土地信託移轉予受託人，使依委託人意旨管理或處分，稱之為下列何種信託？","opts":["不動產信託","動產信託","地上權信託","租賃權信託"],"ans":1,"exp":["📝 解析：以土地或建物為信託財產者稱為不動產信託；地上權、租賃權信託是以權利為標的。"],"pos":0.08794,"w":1},{"id":"M-312","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"「以給付一定數額之金錢為標的」之債權信託，稱之為下列何種信託？","opts":["金錢信託","金錢債權信託","動產信託","不動產信託"],"ans":2,"exp":["📝 解析：以金錢債權（如應收帳款、貸款債權）為信託財產者稱為金錢債權信託；金錢信託則是直接交付現金。"],"pos":0.08872,"w":1},{"id":"M-313","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"委託人將股票信託移轉予受託人管理，稱為下列何種信託？","opts":["金錢信託","金錢債權信託","有價證券信託","動產信託"],"ans":3,"exp":["📝 解析：以股票、債券等有價證券為信託財產交由受託人管理，稱為有價證券信託。"],"pos":0.08949,"w":1},{"id":"M-314","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者得擔任信託財產之受託人？","opts":["未成年人","受監護或輔助宣告之人","破產人","經主管機關許可經營信託業務之公司"],"ans":4,"exp":["📝 解析：依信託法§21，未成年人、受監護或輔助宣告之人及破產人不得為受託人；經許可經營信託業務的公司則可擔任。"],"pos":0.09027,"w":1},{"id":"M-315","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關受託人對受益人之責任，下列敘述何者正確？","opts":["得承諾擔保本金","得擔保最低收益率","不得承諾擔保本金或最低收益率","僅得對大戶承諾擔保本金"],"ans":3,"exp":["📝 解析：依信託業法，信託業不得承諾擔保本金或最低收益率，以免扭曲信託由受益人承擔投資盈虧的本質，對大戶也不例外。"],"pos":0.09105,"w":1},{"id":"M-316","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"受託人處理信託事務，下列敘述何者錯誤？","opts":["應依信託本旨處理","應以善良管理人之注意處理","自有財產得與信託財產合併管理","受託人管理不當致信託財產發生損害時應予賠償"],"ans":3,"exp":["📝 解析：依信託法§24，受託人應將信託財產與自有財產及其他信託財產分別管理，不得合併；其餘皆為受託人義務。"],"pos":0.09183,"w":1},{"id":"M-317","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何種制度係以自己為財產名義權利人，為他人利益管理財產？","opts":["信託","寄託","委任","代理"],"ans":1,"exp":["📝 解析：信託中受託人以自己名義成為財產權利人，但為受益人利益管理；寄託、委任、代理都不移轉財產名義。"],"pos":0.09261,"w":1},{"id":"M-318","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關委任與信託之敘述，下列何者錯誤？","opts":["信託關係之委託人須將財產權移轉給受託人","委任關係之委任人無須將財產權移轉給受任人","委任人管理或處分受任財產之效果歸屬於受任人","委任人並不因委任關係之成立而喪失其管理或處分財產之權限"],"ans":3,"exp":["📝 解析：委任是受任人以委任人名義處理事務，其效果歸屬於委任人而非受任人；其餘敘述都正確。"],"pos":0.09339,"w":1},{"id":"M-319","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"委託人以其享有之租賃權為信託標的，將之移轉與受託人管理使用，稱之為下列何種信託？","opts":["租賃權信託","地上權信託","專利權信託","金錢信託"],"ans":1,"exp":["📝 解析：以租賃權為信託財產移轉給受託人管理使用者，稱為租賃權信託，屬權利信託的一種。"],"pos":0.09416,"w":1},{"id":"M-320","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關信託財產之敘述，下列何者錯誤？","opts":["受託人死亡時信託財產不屬於其遺產","受託人破產時信託財產不屬於其破產財團","受託人關於信託財產之占有，承繼委託人占有之瑕疵","屬於信託財產之債權與不屬於信託財產之債務得互相抵銷"],"ans":4,"exp":["📝 解析：依信託法§13，屬於信託財產之債權與不屬於該信託財產之債務不得互相抵銷，以維持信託財產獨立性；其餘敘述皆正確。"],"pos":0.09494,"w":1},{"id":"M-321","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"信託關係消滅時，除信託行為另有訂定外，有關信託財產之歸屬，下列何者為第一順位？","opts":["國庫","受託人","目的事業主管機關","享有全部信託利益之受益人"],"ans":4,"exp":["📝 解析：依信託法§65，信託關係消滅時，除信託行為另有訂定外，信託財產第一順位歸屬享有全部信託利益之受益人，其次為委託人或其繼承人。"],"pos":0.09572,"w":1},{"id":"M-322","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有價證券中之股票及公司債券，除須依目的事業主管機關規定，於證券上載明其為信託財產外，尚須通知下列何者，始得對抗該公司？","opts":["證券期貨商","證券交易所","發行公司","經濟部"],"ans":3,"exp":["📝 解析：依信託法§4，以股票或公司債券為信託者，非經通知發行公司，不得對抗該公司。"],"pos":0.0965,"w":1},{"id":"M-323","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託法規定，公益信託之監督機關為下列何者？","opts":["金融監督管理委員會","目的事業主管機關","法院","財政部"],"ans":2,"exp":["📝 解析：信託法規定公益信託由目的事業主管機關監督（例如教育類歸教育部、社福類歸衛福部），法院監督的是一般私益信託。"],"pos":0.09728,"w":1},{"id":"M-324","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於信託業法規定信託業得經營之信託業務？","opts":["金錢信託","不動產信託","專利權信託","商譽信託"],"ans":4,"exp":["📝 解析：信託業法 §16 列舉金錢、有價證券、動產、不動產、專利權、著作權等財產權信託；商譽無法獨立移轉，不能作為信託財產。"],"pos":0.09805,"w":1},{"id":"M-325","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"主管機關基於風險考量，依信託業法規定，信託業辦理委託人不指定營運範圍或方法之金錢信託，其營運範圍下列何者非屬之？","opts":["現金","銀行存款","短期票券","上市股票"],"ans":4,"exp":["📝 解析：信託業法規定不指定營運範圍之金錢信託，限運用於現金及銀行存款、公債、公司債、金融債券、短期票券等低風險標的；上市股票風險較高，不在範圍內。"],"pos":0.09883,"w":1},{"id":"M-326","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託業法規定，信託業得經營之業務項目，下列何者非屬之？","opts":["著作權信託","人格權信託","專利權信託","有價證券信託"],"ans":2,"exp":["📝 解析：信託財產必須是可移轉的財產權；人格權（如姓名、肖像、名譽）專屬於本人，不能移轉，故不得信託。著作權、專利權、有價證券都可信託。"],"pos":0.09961,"w":1},{"id":"M-327","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託業法規定，營業信託契約之訂定，應以何種方式為之？","opts":["書面","口頭","電話","錄音"],"ans":1,"exp":["📝 解析：信託業法 §19 規定營業信託契約應以書面為之，並載明信託目的、財產種類、管理運用方法等事項，以保障委託人權益。"],"pos":0.10039,"w":1},{"id":"M-328","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列哪一種契約信託，可以口頭為之或書面為之？","opts":["民事信託","金錢信託","有價證券信託","不動產信託"],"ans":1,"exp":["📝 解析：民事信託適用信託法，契約屬不要式，口頭或書面皆可成立；金錢、有價證券、不動產等由信託業承作的營業信託須依信託業法以書面訂約。"],"pos":0.10117,"w":1},{"id":"M-329","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬金融資產證券化條例所指之資產？","opts":["汽車貸款債權","房屋貸款債權","信用卡債權","不動產"],"ans":4,"exp":["📝 解析：金融資產證券化條例的標的是汽車貸款、房貸、信用卡債權等金融債權；不動產則另依不動產證券化條例辦理。"],"pos":0.10195,"w":1},{"id":"M-330","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關金融資產證券化之特性，下列何者錯誤？","opts":["由創始機構發行有價證券","現金流量可委由服務機構代為管理","金融資產證券化得採信用增強機制","所受讓特定金融資產為信用評等之基礎"],"ans":1,"exp":["📝 解析：證券化是創始機構把資產移轉給特殊目的機構（受託機構或特殊目的公司），再由特殊目的機構發行受益證券，不是創始機構自己發行，故(1)錯。"],"pos":0.10272,"w":1},{"id":"M-331","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"有關金融資產證券化之創始機構將金融資產移轉予特殊目的機構之會計項目，下列何者正確？","opts":["出售資產","借入款項","同業往來","票據貼現"],"ans":1,"exp":["📝 解析：證券化要求「真實出售」，創始機構把金融資產移轉給特殊目的機構，會計上作出售資產處理，才能達到風險隔離、資產移出帳外的效果。"],"pos":0.1035,"w":1},{"id":"M-332","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依金融資產證券化條例之規定，受益人會議係由下列何者召集之？","opts":["創始機構或受託機構","受託機構或信託監察人","服務機構或信託監察人","監督機構或服務機構"],"ans":2,"exp":["📝 解析：依金融資產證券化條例，受益人會議由受託機構或信託監察人召集，代表全體受益證券持有人決議重大事項。"],"pos":0.10428,"w":1},{"id":"M-333","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依不動產證券化條例規定，所稱不動產管理機構，下列何者非屬之？","opts":["不動產投資業","營造業","信託業","建築經理業"],"ans":3,"exp":["📝 解析：不動產證券化條例所稱不動產管理機構是受託機構委任管理不動產的建築經理業、營造業、不動產投資業等；信託業本身是受託機構，不是管理機構。"],"pos":0.10506,"w":1},{"id":"M-334","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託法規定，信託行為有害於委託人之債權人權利者，債權人應如何主張權利？","opts":["向受託人主張信託契約無效","聲請法院撤銷信託行為","聲請召開債權人會議","聲請強制執行信託財產"],"ans":2,"exp":["📝 解析：信託法 §6 規定信託行為有害委託人之債權人權利時，債權人得聲請法院撤銷該信託行為，避免債務人藉信託脫產。"],"pos":0.10584,"w":1},{"id":"M-335","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託法規定，有關信託關係消滅原因，下列何者正確？","opts":["委託人死亡","受託人破產","信託目的不能完成","委託人喪失行為能力"],"ans":3,"exp":["📝 解析：信託法 §62 規定信託關係因信託行為所定事由發生，或因信託目的已完成或不能完成而消滅，故(3)正確。依 §8，信託關係不因委託人或受託人死亡、破產或喪失行為能力而消滅（信託行為另有訂定者除外），所以(1)(2)(4)都不是消滅原因；受託人破產只是其任務終了、另選新受託人。"],"pos":0.10661,"w":1},{"id":"M-336","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託法及信託業法相關規定，信託業應負之義務，下列何者錯誤？","opts":["忠實義務","分別管理義務","保證收益義務","善良管理人注意義務"],"ans":3,"exp":["📝 解析：信託業應負忠實義務、分別管理義務及善良管理人注意義務；信託業法明定信託業不得承諾擔保本金或最低收益，故無保證收益義務。"],"pos":0.10739,"w":1},{"id":"M-337","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"依信託業法規定，有關信託業之利害關係人，下列何者錯誤？","opts":["擔任信託業之負責人","持有信託業資本總額 5%以上者","對信託財產具有運用決定權者","擔任信託業定型化契約之審定人員"],"ans":4,"exp":["📝 解析：信託業法 §7 所稱利害關係人包括信託業負責人、持股5%以上股東、對信託財產有運用決定權者等；定型化契約審定人員不在其列。"],"pos":0.10817,"w":1},{"id":"M-370","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"金融機構經營拆款業務所得之利息收入，應繳納多少營業稅？","opts":["5%","20%","25%","免徵"],"ans":4,"exp":["📝 解析：營業稅法 §8 第 1 項第 32 款：經營新臺幣拆款及外幣拆款之銷售額免徵營業稅（佣金及手續費除外），所以拆款利息免徵。"],"pos":0.10895,"w":1},{"id":"M-371","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"目前拆款市場的交割清算，大多採用下列何種方式辦理？","opts":["央行支票","央行同資系統","財金網路系統","ATM 轉帳"],"ans":2,"exp":["📝 解析：金融同業拆款的資金交割，大多透過中央銀行同業資金調撥清算系統（央行同資系統）即時撥轉清算。"],"pos":0.10973,"w":1},{"id":"M-372","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不得作為流動準備？","opts":["超額準備","金融業互拆借差","國庫券","股票"],"ans":4,"exp":["📝 解析：流動準備須為可迅速變現的低風險資產，如超額準備、同業互拆借差、國庫券、可轉讓定存單；股票價格波動大，不得列入。"],"pos":0.11051,"w":1},{"id":"M-517","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據銀行法及信託投資公司管理規定，下列何者不屬於信託投資公司之主要業務範疇？","opts":["募集共同信託基金","辦理生產事業之直接投資","收受支票存款與活期存款","受託經管各種財產"],"ans":3,"exp":["📝 解析：依銀行法，信託投資公司可辦理信託、受託經管財產、直接投資等，但不得收受支票存款與活期存款，那是商業銀行業務。"],"pos":0.11128,"w":1},{"id":"M-538","s":"all","ch":"常識｜銀行業務","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"銀行實施「強制休假」或「定期職務輪調」制度，在內部控制層面上，其最核心的法律與風險控管目的是什麼？","opts":["節省企業在例假日的加班費支出，降低營運成本","透過他人代理職務，增加發現長期隱匿舞弊或不法交易的機會","培養員工全方位的金融專業技能，作為未來升遷的參考指標","確保員工身心健康，符合勞動基準法對工時與休假之要求"],"ans":2,"exp":["📝 解析：強制休假與職務輪調讓他人代理職務，可揭露長期隱匿的舞弊或不法交易，是內部控制的重要防弊措施。"],"pos":0.11206,"w":1},{"id":"M-014","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非次級市場交易？","opts":["個別投資人透過他的經紀商買入中鋼公司股票","機構法人透過它的經紀商出售一些台積電股票","台塑公司透過承銷商發行新股","上述均為次級市場之交易"],"ans":3,"exp":["📝 解析：公司透過承銷商發行新股、直接募得資金，屬初級（發行）市場；投資人透過經紀商買賣已發行股票才是次級市場。"],"pos":0.11284,"w":1},{"id":"M-015","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列那個市場主要是買賣已發行流通的證券？","opts":["發行市場","短期資金市場","初級市場","次級市場"],"ans":4,"exp":["📝 解析：次級市場（流通市場）是買賣已發行證券的市場；發行市場即初級市場，負責新證券的募集。"],"pos":0.11362,"w":1},{"id":"M-021","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"證券自營商主要從事何種業務？","opts":["證券商自行買賣有價證券","受他人委託買賣證券","包銷公司所發行之證券","代理證券結算交割"],"ans":1,"exp":["📝 解析：證券自營商以自有資金、自己名義買賣有價證券並自負盈虧；受託買賣是經紀商、包銷是承銷商業務。"],"pos":0.1144,"w":1},{"id":"M-022","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"何種證券商為發行市場主要參與者？","opts":["經紀商","承銷商","自營商","以上皆非"],"ans":2,"exp":["📝 解析：承銷商協助企業發行並銷售新證券，是發行市場的主要參與者；經紀商、自營商主要活動於次級市場。"],"pos":0.11518,"w":1},{"id":"M-023","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"承銷商在初次公開發行市場(IPO)所扮演的主要角色為：","opts":["為其本身的投資考量，購買所有證券的發行量","針對單一大額法人機構投資資金","對多位投資者宣傳並募集資金，使發行總額銷售完","提供大額投資者融資融券"],"ans":3,"exp":["📝 解析：承銷商在IPO中負責評估定價、對眾多投資人推介並銷售，使發行額募足；不是為自身投資買下全部證券。"],"pos":0.11595,"w":1},{"id":"M-024","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"證券經紀商所扮演的角色為：","opts":["對新發行的證券提供評估的價格","根據其本身持有特定證券的部位進行買賣造市","受理委託執行買賣雙方之間的交易","以本身的帳戶來買賣證券"],"ans":3,"exp":["📝 解析：經紀商受客戶委託代為下單買賣，收取手續費；用自有帳戶買賣或造市屬自營商，評估新證券價格屬承銷商。"],"pos":0.11673,"w":1},{"id":"M-025","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"臺灣證券交易所按組織類型乃為下列何種市場？","opts":["集中市場","自營商交易市場","店頭市場","發行市場"],"ans":1,"exp":["📝 解析：臺灣證券交易所提供集中競價撮合的交易場所，屬集中市場；店頭市場由櫃買中心經營。"],"pos":0.11751,"w":1},{"id":"M-029","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列證券金融公司的業務何者為非？","opts":["對客戶的授信","對證券商的轉融通","結算交割","融資融券"],"ans":3,"exp":["📝 解析：證券金融公司辦理融資融券、對證券商轉融通等授信業務；結算交割由臺灣集中保管結算所辦理。"],"pos":0.11829,"w":1},{"id":"M-031","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"目前集中市場、櫃買市場之結算交割作業，以及有價證券的保管，乃委託下列何者機構辦理？","opts":["臺灣證券集中保管結算所","櫃檯買賣中心","臺灣證券交易所","證券商"],"ans":1,"exp":["📝 解析：集中市場與櫃買市場的款券結算交割及有價證券保管，均由臺灣集中保管結算所辦理。"],"pos":0.11907,"w":1},{"id":"M-034","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬次級市場的功能?","opts":["提供投資人調節其證券投資組合的場所","提供投資人認購新發行證券的場所","提供投資人變現其證券的場所","有助於初級市場的發展"],"ans":2,"exp":["📝 解析：次級市場提供調整投資組合、變現的場所，並因流動性佳而帶動初級市場；認購新發行證券屬初級市場功能。"],"pos":0.11984,"w":1},{"id":"M-036","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列關於次級市場中「集中市場」與「店頭市場」的敘述，何者正確？","opts":["只有在證券交易所進行的「集中市場」才屬於次級市場","「店頭市場」主要針對未上市（櫃）證券，採取議價或系統媒合方式，亦屬次級市場範疇","在次級市場買賣證券時，資金是直接在投資人與發行證券的公司之間流動","所有的次級市場交易都必須在實體營業場所進行，不可透過數位網路系統完成"],"ans":2,"exp":["📝 解析：店頭市場（櫃買）採議價或系統媒合，也是次級市場的一部分；次級市場的資金在投資人之間流動，不流向發行公司，且可透過網路交易。"],"pos":0.12062,"w":1},{"id":"M-050","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"證券買賣雙方或他們的經紀商(Broker)在一個集中的交易場所利用人工或電腦撮合進行交易所形成的市場，謂之：","opts":["集中市場","店頭市場","短期市場","長期市場"],"ans":1,"exp":["📝 解析：買賣雙方透過經紀商在集中交易場所以人工或電腦撮合成交，是集中市場（如臺灣證券交易所）的定義。"],"pos":0.1214,"w":1},{"id":"M-051","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"由座落於不同地點的交易商(Dealer)對於其所交易的證券向投資人報價，只要投資人願意接受交易商的報價，即可完成交易而形成的市場，謂之：","opts":["集中市場","店頭市場","短期市場","長期市場"],"ans":2,"exp":["📝 解析：由分散各地的交易商報價、投資人接受報價即成交，屬店頭市場（議價市場）的特徵。"],"pos":0.12218,"w":1},{"id":"M-054","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據我國「證券交易法」第 6 條針對「有價證券」的法律定義，下列敘述何者最為正確？","opts":["僅限於實體紙本印刷的股票或債券","政府債券不屬於證券交易法規範的有價證券","有價證券之權利證書、認股權利證書等，均視為有價證券","只要是具備價值的契約，不論主管機關是否核定，皆視為該法之有價證券"],"ans":3,"exp":["📝 解析：依證交法第6條，有價證券包括政府債券、公司股票、公司債及經主管機關核定者；新股認購權利證書、權利證書等視為有價證券，不限實體。"],"pos":0.12296,"w":1},{"id":"M-061","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"相較於一般的現金增資（公開承銷），企業選擇以「私募」方式籌措資金，通常具備下列哪一項特徵或優勢？","opts":["由於不需對外公開招募，發行程序與時效通常較為簡便迅速","能夠立刻且大幅度地提高公司股票在次級市場的每日交易量與流通籌碼","私募發行新股完全不需要經過股東會決議，僅需董事長一人批准即可","因為投資人承擔較低的風險，所以私募的籌資成本一定比公開發行更低"],"ans":1,"exp":["📝 解析：私募對象限特定人、免向大眾公開招募，程序較簡便快速；但依證交法第43條之6仍需股東會特別決議，且有轉讓限制、不會增加流通量。"],"pos":0.12374,"w":1},{"id":"M-062","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"股票的本益比係指：","opts":["股價/每股盈餘","每股盈餘/股價","股價/每股股利","股價/每股淨值"],"ans":1,"exp":["📝 解析：本益比（P/E）＝股價÷每股盈餘，表示投資人願意為每1元盈餘支付的價格倍數。"],"pos":0.12451,"w":1},{"id":"M-063","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為散戶最常使用之申購股票方式：","opts":["競價拍賣","詢價圈購","洽特定人承銷","公開申購"],"ans":4,"exp":["📝 解析：新股承銷中，公開申購採抽籤配售，散戶最常參與；競價拍賣與詢價圈購多由法人參與。"],"pos":0.12529,"w":1},{"id":"M-067","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"外國企業來臺灣以存託憑證方式籌措資金，稱之發行：","opts":["美國存託憑證(ADR)","臺灣存託憑證(TDR)","全球存託憑證(GDR)","歐洲可轉換公司債(ECB)"],"ans":2,"exp":["📝 解析：外國企業來臺發行、以新臺幣交易的存託憑證稱為臺灣存託憑證（TDR）。"],"pos":0.12607,"w":1},{"id":"M-073","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者並不屬於強化公司治理的措施？","opts":["擴大獨立董事強制設置範圍","鼓勵企業善盡社會責任","限制員工跳槽以留住人才","強制設置薪資報酬委員會"],"ans":3,"exp":["📝 解析：擴大獨立董事設置、強制設薪酬委員會、推動企業社會責任都是公司治理措施；限制員工跳槽與公司治理無關。"],"pos":0.12685,"w":1},{"id":"M-074","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"上市（櫃）公司依規定，財務報表及重大訊息須在何處公告？","opts":["公開資訊觀測站","國內報紙","上市（櫃）公司自家網站","奇摩或鉅亨網"],"ans":1,"exp":["📝 解析：依證交法及證交所／櫃買中心規定，上市櫃公司財報與重大訊息須於公開資訊觀測站申報公告。"],"pos":0.12763,"w":1},{"id":"M-075","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"上市（櫃）公司之年度財務報告，自 101 年會計年度開始，最遲應於年度終了後幾個月內公告並申報？","opts":["二個月","三個月","四個月","以上皆非"],"ans":2,"exp":["📝 解析：依證交法第36條，上市櫃公司年度財務報告應於會計年度終了後三個月內公告並申報（101年起適用）。"],"pos":0.1284,"w":1},{"id":"M-076","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"上市（櫃）公司之股東常會應於每會計年度終了後幾個月內召開？","opts":["一個月","二個月","三個月","六個月"],"ans":4,"exp":["📝 解析：依公司法第170條，股東常會應於每會計年度終了後六個月內召開。"],"pos":0.12918,"w":1},{"id":"M-097","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一項敘述「不符合」普通股的基本特性？","opts":["擁有剩餘財產分配權，但受償順序排在債權人與特別股股東之後","具有無限責任，當公司資產不足清償債務時，股東須以個人財產負擔賠償","享有盈餘分配權，可獲得公司派發的現金股利或股票股利","透過選舉董事或監察人，間接行使對公司的管理監督權"],"ans":2,"exp":["📝 解析：股份有限公司股東僅就所認股份負有限責任（公司法第154條），不必以個人財產清償公司債務；其餘為普通股的基本權利。"],"pos":0.12996,"w":1},{"id":"M-108","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一項金融交易行為屬於「初級市場」的範疇？","opts":["政府為了公共建設支出，發行「新公債」向大眾籌資","某投資人因為急需用錢，在證券 APP 上賣出持有的台積電股票","基金經理人在集中市場根據指數權重調整持股部位","散戶投資人彼此交換手中的實體股票憑證"],"ans":1,"exp":["📝 解析：政府發行新公債直接向投資人籌資，屬初級（發行）市場；其餘都是已發行證券在投資人間轉手，屬次級市場。"],"pos":0.13074,"w":1},{"id":"M-109","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在台灣的多層次資本市場架構中，關於「興櫃市場」的功能與標的，下列敘述何者為錯誤？","opts":["興櫃股票必須先經由兩家以上證券商推薦方可掛牌","興櫃市場是提供已上市股票進行盤後鉅額交易的場所","興櫃市場的股票在性質上屬於「未上市、未上櫃」之股票","興櫃公司在符合一定條件後，可申請轉為上櫃或上市公司"],"ans":2,"exp":["📝 解析：興櫃市場供未上市櫃的公開發行公司股票交易，須經兩家以上證券商推薦，之後可申請上櫃或上市；鉅額交易是集中市場另一制度，與興櫃無關。"],"pos":0.13152,"w":1},{"id":"M-112","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"臺灣證券交易所上市股票買賣，多少股以下的交易即屬零股買賣？","opts":["999 股","99 股","9 股","1 股"],"ans":1,"exp":["📝 解析：上市股票交易單位一張為1,000股，未滿一張即999股以下的交易屬零股交易。"],"pos":0.1323,"w":1},{"id":"M-113","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"臺灣企業赴美國以存託憑證方式籌措資金，稱之發行：","opts":["臺灣存託憑證(TDR)","美國存託憑證(ADR)","歐洲可轉換公司債(ECB)","浮動利率債券(FRN)"],"ans":2,"exp":["📝 解析：臺灣企業到美國發行、以美元在美國市場交易的存託憑證稱為美國存託憑證（ADR）。"],"pos":0.13307,"w":1},{"id":"M-114","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"定期公開資訊中，資訊內容最具即時及攸關性者為：","opts":["營業額公告","年報","取得與處分資產報告","財務報告"],"ans":1,"exp":["📝 解析：上市櫃公司須於每月10日前公告上月營業額，頻率最高、最即時；年報、財報為年度或季度資訊。"],"pos":0.13385,"w":1},{"id":"M-115","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某上市櫃公司廠房突然發生火警，該公司隨即在公開資訊觀測站發布訊息說明損失。試問： 這類因「突發事件」而產生且最具即時性的公開資訊，在實務上稱為：","opts":["財務季報公告","重大資訊之公開（重大訊息）","年度營業報告書","辦理增資之公開說明書"],"ans":2,"exp":["📝 解析：火災等突發事件對股價有重大影響，公司須依重大訊息規定即時於公開資訊觀測站揭露，屬重大資訊公開。"],"pos":0.13463,"w":1},{"id":"M-116","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者金融商品不是國內上市公司到海外籌措資金的方式？","opts":["TDR","ADR","GDR","HKDR"],"ans":1,"exp":["📝 解析：TDR是外國企業來臺灣發行的存託憑證，不是國內公司赴海外籌資工具；ADR、GDR、HKDR才是國內公司到海外發行的方式。"],"pos":0.13541,"w":1},{"id":"M-137","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"A 上市公司董事會決議預計合併 B 上市公司，在該併購消息公開前，下列何者「不屬於」法律禁止買賣股票的範圍？","opts":["A 公司之董事、經理人","A 公司大樓內不具資訊優勢且未獲悉消息的保全人員","從財務顧問打電話時無意中偷聽到該消息的配偶","協助併購進行的法律顧問或財務顧問"],"ans":2,"exp":["📝 解析：證交法第157條之1禁止董事、經理人、因職業獲悉消息者（顧問）及從其獲悉消息之人買賣；未獲悉消息的保全人員不在範圍內。"],"pos":0.13619,"w":1},{"id":"M-138","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"知悉重大消息的內部人，在重大消息公開後幾小時後，才可以進行買賣股票？","opts":["6 小時","12 小時","18 小時","24 小時"],"ans":3,"exp":["📝 解析：依證交法第157條之1，內部人於重大消息明確後至公開後18小時內不得買賣該公司股票。"],"pos":0.13696,"w":1},{"id":"M-164","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"國內證券市場上認購權證的發行人為？","opts":["證券金融公司","臺灣證券交易所","綜合證券商","證券投資信託公司"],"ans":3,"exp":["📝 解析：國內認購（售）權證由經主管機關許可的綜合證券商（具自營及承銷資格）發行，證交所只負責審核上市，證金、投信都不是發行人。"],"pos":0.13774,"w":1},{"id":"M-165","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"申請股票上櫃必須有幾家以上證券商書面推薦？","opts":["1 家","2 家","3 家","4 家"],"ans":2,"exp":["📝 解析：依櫃買中心上櫃審查準則，申請上櫃須經2家以上證券商書面推薦，其中1家為主辦推薦證券商，負責輔導與評估。"],"pos":0.13852,"w":1},{"id":"M-166","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"A 股除權前一營業日收盤價 60 元，無償配股(股票股利)每股2 元，則除權參考價為：","opts":["58 元","50 元","48 元","40 元"],"ans":2,"exp":["📝 解析：股票股利2元＝每股配0.2股（面額10元），除權參考價＝60÷(1＋0.2)＝50元。"],"pos":0.1393,"w":1},{"id":"M-167","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"一般發行公司申請股票上市，申請時須已依公司法設立登記屆滿：","opts":["1 年","2 年","3 年","4 年"],"ans":3,"exp":["📝 解析：依證交所《有價證券上市審查準則》§4 第 1 項第 1 款，一般發行公司申請上市時須已依公司法設立登記屆滿 3 年以上；公營事業或公營事業轉為民營者不受此限。對照上櫃只要求設立滿 2 個完整會計年度。"],"pos":0.14008,"w":1},{"id":"M-168","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"何種承銷方式所決定出來的價格較具市場性？","opts":["競價拍賣","詢價圈購","洽商銷售","公開申購配售"],"ans":1,"exp":["📝 解析：競價拍賣由投資人自行出價、依價格高低得標，承銷價由市場競標決定，最能反映市場供需。"],"pos":0.14086,"w":1},{"id":"M-169","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"國內股票漲跌幅的限制係指：","opts":["當日開盤價的上、下 10%的範圍內成交","當日開盤競價基準的上、下10%的範圍內成交","當日開盤價的上、下 5%的範圍內成交","當日開盤競價基準的上、下5%的範圍內成交"],"ans":2,"exp":["📝 解析：上市櫃股票漲跌幅為當日開盤競價基準（通常為前一日收盤價）上下10%，不是以當日開盤價計算。"],"pos":0.14163,"w":1},{"id":"M-170","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"證券商應多久計算一信用帳戶之整戶及各筆融資融券擔保維持率？","opts":["每日","每週","每月","每季"],"ans":1,"exp":["📝 解析：證券商須每日計算信用帳戶整戶及各筆融資融券擔保維持率，低於規定比率時即發出追繳通知。"],"pos":0.14241,"w":1},{"id":"M-171","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何種承銷方式較具公平性及股權分散？","opts":["競價拍賣","詢價圈購","洽商銷售","公開申購配售"],"ans":4,"exp":["📝 解析：公開申購配售採抽籤方式，每人機會均等且申購數量有限制，最具公平性並有助股權分散。"],"pos":0.14319,"w":1},{"id":"M-172","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"大學生小明剛開立證券戶，並透過手機 APP 成功買進與賣出一張台灣上市公司股票。試問： 在不考慮任何券商手續費折扣的情況下，小明完成這趟買賣流程，除了股票本身的價款外， 總共會面臨哪些法定的交易成本？","opts":["買進與賣出時皆須支付證券交易稅，但不需支付手續費","買進與賣出時皆須支付券商手續費，但不需支付證券交易稅","買進與賣出時皆須支付券商手續費，但「證券交易稅」僅在賣出時課徵","買進與賣出時皆須支付券商手續費，但 「證券交易稅」僅在買進時課徵"],"ans":3,"exp":["📝 解析：買賣雙方都要付券商手續費（上限0.1425%），證券交易稅只在賣出時由賣方繳納（股票0.3%，現股當沖減半）。"],"pos":0.14397,"w":1},{"id":"M-173","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"目前國內股票市場證券交易手續費收取的對象為：","opts":["僅就買方收取","僅就賣方收取","買進、賣出雙方均收取","買進、賣出雙方均不須收取"],"ans":3,"exp":["📝 解析：券商經紀手續費於買進與賣出時都向委託人收取；證交稅才只向賣方課徵。"],"pos":0.14475,"w":1},{"id":"M-174","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"目前國內股票市場證券交易，所謂鉅額交易係指買或賣同一種有價證券，交易數量在多少交易單位以上？","opts":["100 單位","500 單位","1,000 單位","5,000 單位"],"ans":2,"exp":["📝 解析：依證交所規定，單一證券一次買賣達500交易單位以上（或總額達一定金額）即屬鉅額交易，可透過鉅額交易制度成交。"],"pos":0.14553,"w":1},{"id":"M-175","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"自2020 年 3 月起，台灣證券交易所針對「盤中時段」（09:00 - 13:25）股票買賣，全面採行下列何種交易制度，以提升交易效率並與國際接軌？","opts":["盤中時段（09:00 - 13:25）採行 「連續競價」","開盤與收盤時段採行「連續競價」","全天交易時段均採行「集合競價」","盤中時段採行「人工喊價」與「電腦競價」並行"],"ans":1,"exp":["📝 解析：證交所自2020年3月23日起盤中全面改採逐筆交易（連續競價），開盤及收盤仍維持集合競價。"],"pos":0.1463,"w":1},{"id":"M-176","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"盤後定價交易係指每日收盤後，有價證券依照集中交易市場何種價格進行定價交易的方式？","opts":["開盤價","收盤價","平盤價","平均價"],"ans":2,"exp":["📝 解析：盤後定價交易於收盤後（14:00～14:30）以當日集中市場收盤價為成交價格撮合。"],"pos":0.14708,"w":1},{"id":"M-177","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"關於當日沖銷，下列敘述何者正確？","opts":["不收取融資利息","不收取融券手續費","當日沖抵額度可以循環使用","交割須款券預先收足"],"ans":1,"exp":["📝 解析：融資買進與融券賣出同日沖銷，資金未跨日占用，因此不計融資利息；融券手續費仍照收，其餘選項也不符當日沖銷規定。"],"pos":0.14786,"w":1},{"id":"M-178","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"融券的成本不包括下列何者？","opts":["交易稅","融券手續費","交易手續費","融券利息"],"ans":4,"exp":["📝 解析：融券者要付交易稅、交易手續費及融券手續費（借券費）；融券保證金與賣出價款反而由券商計息付給投資人，不是成本。"],"pos":0.14864,"w":1},{"id":"M-180","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者係屬上市股票的場外交易？","opts":["一般交易","鉅額交易","盤後交易","以上皆非"],"ans":4,"exp":["📝 解析：一般交易、鉅額交易、盤後定價交易都在證交所集中市場進行，均不屬場外交易，故以上皆非。"],"pos":0.14942,"w":1},{"id":"M-227","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"積極的投資人較可能投資下列那一種股票?","opts":["低本益比股票","高本益比股票","低市價淨值比股票","低市價現金流量比股票"],"ans":2,"exp":["📝 解析：高本益比股票反映市場對高成長的期待，波動與風險較大，較受積極型投資人青睞；低本益比、低淨值比屬價值型。"],"pos":0.15019,"w":1},{"id":"M-234","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"如果目前某檔股票的真實價值遠高於其市場價值，投資人應該","opts":["增加其在投資組合內之權數","降低其在投資組合內之權數","出清此股票","不需變動投資組合"],"ans":1,"exp":["📝 解析：真實價值高於市價代表股價被低估，未來有上漲空間，應提高其在投資組合中的權數。"],"pos":0.15097,"w":1},{"id":"M-235","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列關於「高風險高報酬」觀念的理解，哪一項敘述是正確的？","opts":["追求高報酬通常需承擔高風險，但高風險不保證一定有高報酬","股市因為風險高，所以其投資收益在任何期間都高於銀行存款","風險越高代表獲利機率越高，因此積極型投資人應專挑風險最高者","只要投資時間夠長，高風險投資就絕對不會產生任何帳面虧損"],"ans":1,"exp":["📝 解析：高報酬通常伴隨高風險，但承擔高風險只代表結果波動大，不保證一定獲得高報酬；其餘選項都是絕對化的錯誤說法。"],"pos":0.15175,"w":1},{"id":"M-236","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"","stem":"投資BBB 股票，成本每股是 20 元，賣出價格是 22 元，投資期間收到現金股息 3 元，如果不考慮交易成本，則投資報酬率是","opts":["25%","10%","0%","40%"],"ans":1,"exp":["📝 解析：報酬率＝(資本利得2元＋股息3元)÷成本20元＝5÷20＝25%。"],"pos":0.15253,"w":1},{"id":"M-238","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"投資人如何降低其投資組合之系統風險？","opts":["系統風險只要透過分散投資風險性資產就可降低","系統風險是不可分散之風險，所以投資組合無法降低系統風險","系統風險是可以透過部份投資無風險性資產來降低","以上皆非"],"ans":3,"exp":["📝 解析：系統風險無法靠分散風險性資產消除，但把部分資金改放無風險資產，可降低整體組合的β與系統風險暴露。"],"pos":0.15331,"w":1},{"id":"M-239","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列那一敘述何者正確： A.假設其他條件一樣，股票之系統風險越高，其股票市場價值越高；B.假設其他條件一樣，股票之風險貼水越低，其股票市場價值越高","opts":["只有 B.正確","A.、B.都正確","只有A.正確","A.、B.都不正確"],"ans":1,"exp":["📝 解析：系統風險越高，投資人要求報酬率越高、折現後價值越低，A錯；風險貼水越低則折現率越低、價值越高，B對。"],"pos":0.15409,"w":1},{"id":"M-523","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"目前臺灣股市（集中市場）的成交撮合機制，下列敘述何者最為正確？","opts":["由交易員在場內以人工喊價方式決定價格","採「逐筆交易」之全自動電腦撮合（盤中時段）","仍以人工輔助電腦之半自動方式進行","以人工電話詢價報價為主"],"ans":2,"exp":["📝 解析：臺灣集中市場自2020年3月23日起盤中改採逐筆交易，由電腦全自動撮合；開盤與收盤仍採集合競價。"],"pos":0.15486,"w":1},{"id":"M-530","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於「本益比」在財務評價上的實質意義，下列敘述何者最為正確？","opts":["衡量公司目前股價相對於每股帳面價值（Book Value）的溢價倍數","代表在公司未來獲利維持現狀的前提下，投資人收回購買股價成本所需的預計年數","用以評估公司將當年度盈餘撥配為現金股利比例高低的指標","衡量公司每一單位的總資產，在證券市場中所能創造出的股價市值倍數"],"ans":2,"exp":["📝 解析：本益比＝股價÷每股盈餘，可解讀為盈餘不變下回收投資成本所需年數；股價淨值比、股利發放率是其他指標。"],"pos":0.15564,"w":1},{"id":"M-531","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在台灣證券市場中，依現行規定，大多數 IPO 案件在進行大眾「公開申購」之前，會先採取何種方式來決定發行價格與初步配售？","opts":["透過「競價拍賣」讓合格投資人投標，並依拍賣結果訂定後續申購價格","由金管會直接根據公司淨值設定固定價格，不開放市場參與","先在電視媒體進行廣告宣傳，由點擊率最高者獲得認購權","完全交由銀行間拆款市場的利率高低來決定發行價格"],"ans":1,"exp":["📝 解析：我國IPO常先以競價拍賣由合格投資人投標，再依得標結果訂定承銷價辦理公開申購，兼顧價格發現與散戶參與。"],"pos":0.15642,"w":1},{"id":"M-533","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一項措施，最能直接反映我國近年來強化「公司治理」的政策方向？","opts":["規定所有上市櫃公司均須設置「薪資報酬委員會」，監控董監酬金","限制公司盈餘不得進行分配，以累積公司自有資本","取消獨立董事制度，改由大股東自行決定經營策略","減少公司對外公開財務資訊的頻率，以降低行政成本"],"ans":1,"exp":["📝 解析：依證券交易法§14-6，上市櫃公司應設置薪資報酬委員會監督董監與經理人酬金，是強化公司治理的具體措施。"],"pos":0.1572,"w":1},{"id":"M-534","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依據現行規定，上市（櫃）公司除年度財務報告外，針對「第一季、第二季及第三季」之財務報告，應於各季終了後多久期限內完成公告申報？","opts":["30 天內","45 天內","60 天內","90 天內"],"ans":2,"exp":["📝 解析：依證券交易法§36，上市櫃公司第一、二、三季財報應於每季終了後45日內公告申報，年度財報則為3個月內。"],"pos":0.15798,"w":1},{"id":"M-535","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據「公司法」規定，上市（櫃）公司召開「股東常會」時，應於會議召開前多久期限內， 將開會事由、日期及地點通知各股東？","opts":["15 日前","20 日前","30 日前","60 日前"],"ans":3,"exp":["📝 解析：依公司法§172，公開發行公司股東常會應於開會30日前通知各股東，股東臨時會則為15日前。"],"pos":0.15875,"w":1},{"id":"M-543","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"假設小明每日的單日買賣額度為 500 萬元。小明今天早上買進 300 萬元的股票並於盤中賣出完成「當日沖銷」。若小明想在下午收盤前再次買進股票，試問：在現行制度下，小明當日沖銷委託成交後之「沖抵額度」為多少？","opts":["僅剩200 萬元，因為額度不可重複計算","仍有 500 萬元，因為當日沖抵後的額度可以循環使用","僅剩0 萬元，因為當沖交易會加倍佔用額度","仍有 300 萬元，但僅限於買進同一檔股票"],"ans":2,"exp":["⚠ 依題庫選 (2)「仍有 500 萬元，額度可循環使用」，但與現行規定相反。證交所／櫃買中心當日沖銷交易規定：當沖的買進與賣出金額都列入單日買賣額度計算（反向沖銷的那筆委託不列入），且「買賣額度沖抵後不得於當日循環使用」。依現行規定，小明買進 300 萬元已占用額度、賣出沖銷不會回補，下午只剩 200 萬元，應為 (1)。考試請照官方答案 (2)。"],"pos":0.15953,"w":1},{"id":"M-550","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據資產定價模型，折現率會隨風險增加而上升。若其他條件相同，下列哪一項變動會導致股票的「市場價值」上升？","opts":["投資人要求的風險貼水下降","該股票的系統風險上升","市場整體的風險規避程度增加","該資產的不可分散風險增加"],"ans":1,"exp":["📝 解析：股價是未來現金流的折現值，風險貼水下降使折現率降低，股價隨之上升；其餘選項都會推高折現率、壓低股價。"],"pos":0.16031,"w":1},{"id":"M-557","s":"all","ch":"常識｜證券市場與交易","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於「基本面分析」與「技術面分析」的差異，下列敘述何者正確？","opts":["基本面分析研究成交量與 K 線圖；技術面分析研究財務報表","基本面分析旨在評估企業的「內在價值」；技術面分析旨在尋找「買賣時點」","技術面分析通常較適合極長期的價值投資；基本面分析則適合短線沖銷","基本面分析認為股價與市場供需無關；技術面分析則認為股價僅與天氣有關"],"ans":2,"exp":["📝 解析：基本面分析研究財報與總經以估算內在價值；技術面分析研究價量與K線型態，用來判斷買賣時點。"],"pos":0.16109,"w":1},{"id":"M-027","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非為投信公司之業務？","opts":["發行共同基金","代客操作","全權委託投資","收購委託書"],"ans":4,"exp":["📝 解析：投信可募集發行共同基金及經營全權委託投資（俗稱代客操作）；收購委託書不是投信業務，且受公開發行公司委託書規則嚴格限制。"],"pos":0.16187,"w":1},{"id":"M-030","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"若以臺灣的市場狀況來看，對證券投資顧問公司的服務需求之理由，下列何者非？","opts":["散戶投資人占多數","投資事業的專業分工","一般投資人缺乏廣泛且精確的資訊","可以聯合炒作股票"],"ans":4,"exp":["📝 解析：臺灣散戶多、資訊取得不易、需要專業分工，因此需要投顧服務；聯合炒作股票是證交法禁止的操縱行為，不是正當需求。"],"pos":0.16265,"w":1},{"id":"M-065","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"境外基金需經核准方得在我國境內募集及銷售，下列何者不是合法的銷售機構？","opts":["證券投資信託事業","證券投資顧問事業","資產管理顧問公司","證券經紀商"],"ans":3,"exp":["📝 解析：依境外基金管理辦法，境外基金可由投信、投顧、證券經紀商擔任總代理或銷售機構（另含銀行、信託業等）；資產管理顧問公司不是合法銷售機構。"],"pos":0.16342,"w":1},{"id":"M-066","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列何種類型的基金適合短期資金停泊的投資人？","opts":["股票型基金","貨幣市場基金","固定收益型基金","保本型基金"],"ans":2,"exp":["📝 解析：貨幣市場基金投資存款與短期票券，風險低、流動性高、可隨時贖回，適合短期資金停泊。"],"pos":0.1642,"w":1},{"id":"M-077","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於我國證券投資信託基金之管理規範，下列何項作為違反了現行法規？","opts":["投資人委託證券商在集中市場買賣指數股票型基金（ETF）","投信公司將基金資產分散配置於數十檔不同的股票或債券","投信公司將所募集之基金款項直接存入其公司自有之銀行帳戶進行保管","基金經理人依據投資說明書之規範，執行資產配置與選股決策"],"ans":3,"exp":["📝 解析：依證券投資信託及顧問法，基金資產須交由基金保管機構（銀行）獨立保管，與投信自有財產分離，投信不得存入自家帳戶。"],"pos":0.16498,"w":1},{"id":"M-079","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"有關國內貨幣市場基金之描述，何者為非？","opts":["主要投資標的為銀行存款、短期票券及附買回交易","加權平均存續期間不得大於 180 日","不得投資於股票或其他具股權性質之有價證券","具保本性質，每單位淨資產價值逐日平穩上升，不會下降"],"ans":4,"exp":["📝 解析：貨幣市場基金投資存款、短期票券與附買回交易，加權平均存續期間不得超過180日；但它仍是投資產品，不保本，淨值也可能下跌。"],"pos":0.16576,"w":1},{"id":"M-117","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"理財專員在規劃高齡客戶的投資組合時，應優先考慮資產的穩健性。下列四種不同屬性的證券投資信託基金，何者最符合穩健型老年人的投資需求？","opts":["集中投資於單一高成長產業的 「主題型基金」","投資標的具備高流動性且提供最低收益保證的「保本型基金」","以槓桿操作追求倍數獲利的「衍生性商品基金」","鎖定具有爆發力但缺乏盈餘支撐的「生技醫療基金」"],"ans":2,"exp":["📝 解析：高齡客戶重視本金穩健與流動性，保本型基金較適合；主題型、槓桿衍生性、高波動生技基金風險都偏高。"],"pos":0.16654,"w":1},{"id":"M-120","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"就投資管理而言，認為市場隨時存在價格失衡之證券，而利用研究分析選出價格低估之證券，以求績效擊敗大盤之管理方式稱為?","opts":["被動式管理(passive management)","部位式管理(position management)","主動式管理(active management)","效能式管理(effective management)"],"ans":3,"exp":["📝 解析：主動式管理認為市場存在錯誤定價，透過研究選股、擇時以超越大盤；被動式管理則追蹤指數。"],"pos":0.16732,"w":1},{"id":"M-219","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在台灣目前的共同基金市場中，哪一種基金類型在發行種類與資產規模上佔據絕對多數的主流地位？","opts":["開放型基金","封閉型基金","兩者種類數量相同","視市場多空循環而定，無明顯差異"],"ans":1,"exp":["📝 解析：國內封閉型基金多已轉型或清算，目前發行檔數與資產規模絕大多數為開放型基金（含ETF）。"],"pos":0.16809,"w":1},{"id":"M-220","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"基金經理人掌握增減基金持股比率的時機，這就是一種：","opts":["積極式(主動式)的資產配置(Asset allocation)","消極式(被動式)的資產配置","精挑細選證券(Selection)","以上皆非"],"ans":1,"exp":["📝 解析：依市場判斷調整股票持股比率、掌握進出時機，屬擇時的積極式（主動式）資產配置，而非單純選股。"],"pos":0.16887,"w":1},{"id":"M-221","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者正確？ A.就投資組合管理而言，積極式的操作包括尋找股價偏低的股票來投資；B.就投資組合管理而言，消極式的操作包括購買指數型基金","opts":["A.、B.都正確","只 A.正確","只 B.正確","A.、B.都不正確"],"ans":1,"exp":["📝 解析：尋找被低估的股票是主動式操作，追求超越大盤；買指數型基金只求貼近大盤，是消極式操作，兩者都正確。"],"pos":0.16965,"w":1},{"id":"M-222","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金控公司員工退休基金如果重視投資風險之分散，其退休基金股票組合中對於金融類股的權數最好應該要：","opts":["降低權數，以規避員工收益過度集中之分散","加重權數，因為自認為相當了解此一產業","不變","零持股"],"ans":1,"exp":["📝 解析：金控員工的薪資與職涯已集中在金融業，退休基金再重押金融股會加重集中風險，應降低金融類股權數。"],"pos":0.17043,"w":1},{"id":"M-223","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"企業推動員工持股信託作為退休規劃，雖有助於激勵員工，但在投資學原理中，下列哪一項敘述通常「不被視為」其主要優點？","opts":["有助於公司股權結構的穩定","分散員工個人財富對單一產業或公司的依賴風險","提供員工分享公司獲利成長的機會","作為人才留任工具以降低員工流動率"],"ans":2,"exp":["📝 解析：員工持股信託讓員工財富更集中在任職公司，反而加重而非分散對單一公司的依賴風險；穩定股權、分享獲利、留才才是其優點。"],"pos":0.17121,"w":1},{"id":"M-224","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"收入穩定的年輕投資人較適合投資下列那一種基金?","opts":["積極成長型基金","保本型基金","固定收益型基金","債券型基金"],"ans":1,"exp":["📝 解析：年輕且收入穩定者投資期限長、風險承受度高，適合長期報酬較高的積極成長型基金。"],"pos":0.17198,"w":1},{"id":"M-225","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在各類股票型基金的分類中，若投資人偏好投資於盈餘成長率高、市價相對淨值較高，但具備較強市場動能的標的，這屬於何種基金的操作風格？","opts":["積極成長型基金","被動指數化基金","穩定價值型基金","高股息低波動基金"],"ans":1,"exp":["📝 解析：偏好盈餘成長快、高市價淨值比、具動能的股票，是成長型風格，對應積極成長型基金。"],"pos":0.17276,"w":1},{"id":"M-226","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列那一種股票型基金較屬於保守型投資人所投資的?","opts":["積極成長型股票基金","價值型股票基金","中小型股基金","高本益比股票基金"],"ans":2,"exp":["📝 解析：價值型基金投資本益比、淨值比較低且多有穩定股利的股票，波動較小，較適合保守型投資人。"],"pos":0.17354,"w":1},{"id":"M-228","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者正確？ A.投信投顧公司代客操作應顧及職業道德；B.投信投顧公司代客操作應建立防火牆","opts":["A.、B.都正確","只 A.正確","只B.正確","A.、B.都不正確"],"ans":1,"exp":["📝 解析：代客操作須遵守忠實誠信的職業道德，並與自營、其他客戶間建立防火牆避免利益衝突，兩者皆正確。"],"pos":0.17432,"w":1},{"id":"M-229","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者正確？ A.投信投顧公司代客操作應顧及客戶的投資目標與限制條件；B.投信投顧公司代客操作應顧及客戶的財富背景與承擔風險的限度","opts":["A.、B.都正確","只A.正確","只B.正確","A.、B.都不正確"],"ans":1,"exp":["📝 解析：依適合度原則，代客操作須了解客戶投資目標、限制條件、財務背景與風險承受度，兩者皆正確。"],"pos":0.1751,"w":1},{"id":"M-230","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列敘述何者不正確？","opts":["投信投顧公司代客操作應顧及客戶的投資目標","投信投顧公司代客操作應顧及客戶的投資限制條件","投信投顧公司代客操作應顧及客戶的財務狀況","投信投顧公司代客操作不需考慮防火牆的建立"],"ans":4,"exp":["📝 解析：代客操作必須建立防火牆，防止資訊流用與利益衝突；說不需考慮防火牆是錯的，其餘選項皆屬適合度要求。"],"pos":0.17588,"w":1},{"id":"M-231","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列敘述何者較正確？","opts":["投資人應該相信基金經理人的專業知識與能力，但不一定能保證獲利","因為專業經理人的專業知識與能力都佳，所以操作績效一定佳","投資人應該相信有線電視(第四台)投顧解盤節目推薦之股票","投資人應該相信有線電視(第四台)投顧解盤節目推薦進出股市之時機"],"ans":1,"exp":["📝 解析：專業經理人能提高勝率但無法保證獲利；第四台投顧解盤推薦並不可靠，且「保證獲利」說法本身就違規。"],"pos":0.17665,"w":1},{"id":"M-232","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者正確？ A.只要簽定充份授權合約，投顧代客操作就可以不管投資人的年齡與財務狀況，積極操作。B.如果客戶是退休人員，投顧代客操作就應該注意投資安全性。","opts":["A.、B.都正確","只A.正確","只 B.正確","A.、B.都不正確"],"ans":3,"exp":["📝 解析：即使全權委託，業者仍須依客戶年齡與財務狀況操作（適合度義務），A錯；退休客戶風險承受度低，應重視安全，B對。"],"pos":0.17743,"w":1},{"id":"M-233","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者正確？ A.投信基金經理人不應該一方面替公家退撫基金操盤，同時私下替個人大戶代客操作。B.投顧公司應該定期與委託操作之客戶保持聯繫，告知績效近況與對未來證券市場之看法。","opts":["A.、B.都正確","只A.正確","只 B.正確","A.、B.都不正確"],"ans":1,"exp":["📝 解析：經理人同時私下代大戶操作有利益衝突且違規，A對；投顧應定期向委任客戶報告績效與市場看法，B對。"],"pos":0.17821,"w":1},{"id":"M-237","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依據法規，非經主管機關核准之事業或個人，不得經營證券投資信託業務。針對「私募集金」 的行為，下列哪一項說明符合法律規範？","opts":["只有經核准設立的投信業者得向特定對象募集私募基金","私人只要對象為親友，即可合法募集資金進行投資","投顧公司不需經過額外申請即可直接募集私募基金","私募集金因對象特定，故不受證券投資信託及顧問法之規範"],"ans":1,"exp":["📝 解析：依證券投資信託及顧問法，私募基金只能由經核准的投信事業向特定人募集；私人向親友集資代操屬非法吸金，投顧亦不得直接私募。"],"pos":0.17899,"w":1},{"id":"M-240","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在共同基金的實務運作中，下列哪一項描述最符合「開放型基金」的特質？","opts":["投資人買賣基金之價格，係依據市場供需在集中市場撮合產生","無論市場環境如何，基金均保證提供優於銀行定存的絕對收益","基金經理人通常致力於獲取優於標竿指數的表現","為降低風險，開放型基金依法不得投資於具備波動性的股票資產"],"ans":3,"exp":["📝 解析：主動型開放基金經理人以打敗標竿指數為目標；開放型基金以淨值申贖、不保證收益，也可投資股票。"],"pos":0.17977,"w":1},{"id":"M-241","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"某基金的市場波動度是 9.9%，而同一時間市場波動度是 9%，則該基金的β值是？","opts":["1.2","0.09","1.1","以上皆非"],"ans":3,"exp":["📝 解析：題目假設基金與市場完全相關，β＝基金波動度÷市場波動度＝9.9%÷9%＝1.1。"],"pos":0.18054,"w":1},{"id":"M-242","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者較正確？ A.針對全國基金績效評比時，不管基金經理人管的是何種基金，只要報酬率最高，基金經理人績效就是最好；B.針對全國基金績效評比時，不管基金經理人管的是何種基金，只要調整風險後的報酬率最高，基金經理人績效就是最好","opts":["A.、B.都正確","A.較正確","B.較正確","A.、B.都不正確"],"ans":3,"exp":["📝 解析：不同類型基金風險不同，只比原始報酬率不公平；以夏普指數等風險調整後報酬比較才合理，故B較正確。"],"pos":0.18132,"w":1},{"id":"M-243","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述何者較正確？ A.專門投資高科技產業股票的基金，其最適合用來比較績效的標竿 (Benchmark)是股票市場指數；B.投資人如果自己無專業投資知識，只好精挑細選基金來投資，這也是一種積極式的投資策略","opts":["A.、B.都正確","A.較正確","B.較正確","A.、B.都不正確"],"ans":3,"exp":["📝 解析：高科技基金應以科技類股指數為標竿，用大盤比較不適當，A錯；自行精挑基金也是主動選擇，屬積極式策略，B對。"],"pos":0.1821,"w":1},{"id":"M-244","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"股票型基金經理人作挑選證券決策時，較會考慮：","opts":["那一類別資產(如股或債)有較佳之展望？","那一產業有較佳之展望？","要不要決定買那一種股票指數型商品？","那一證券有較多利多的小道消息？"],"ans":2,"exp":["📝 解析：股票型基金的選股決策會先比較產業前景再挑個股；股債配置屬資產配置決策，靠小道消息則不專業。"],"pos":0.18288,"w":1},{"id":"M-245","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"投資人在挑選基金時比較不會受到下列哪項因素之影響？","opts":["基金公司聲譽","基金的績效","基金規模","基金經理人的性別"],"ans":4,"exp":["📝 解析：挑選基金看的是公司聲譽、績效、規模等與管理能力相關的因素，經理人性別與績效無關。"],"pos":0.18366,"w":1},{"id":"M-246","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於「被動式投資策略」在大型退休基金（如：退撫基金）的實務應用，下列敘述何者正確？","opts":["其核心目標是複製標竿指數表現，最常見的做法是投資指數型商品","該策略高度依賴經理人挑選個別證券的能力","經理人需具備精準預測市場進出場時機的技術","為了分散風險，該策略應將大部分資金投入於不特定之熱門標的"],"ans":1,"exp":["📝 解析：被動式投資以複製標竿指數為目標，常透過指數型基金或ETF執行，不依賴選股與擇時能力。"],"pos":0.18444,"w":1},{"id":"M-247","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"如果軍公教人員退撫基金採積極式操作之策略，可將基金 A.部份委託國內專業基金經理人管理；B.部份委託國外專業基金經理人管理","opts":["不能採用 A.法","不能採用 B.法","A.及B.法皆可用","A.及B.法皆不可用"],"ans":3,"exp":["📝 解析：退撫基金可委託國內與國外專業經理人代操（委外經營），兩種方式都可採用以追求超額報酬。"],"pos":0.18521,"w":1},{"id":"M-248","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述，何者為真：A.封閉型基金有時候會產生折價之現象；B.開放型基金則是以淨值贖回，所以無折價之現象","opts":["只有 A.為真","只有 B.為真","A.與 B.都為真","A.與 B.都不真"],"ans":3,"exp":["📝 解析：封閉型基金在市場交易，市價可能低於淨值而折價；開放型基金以淨值向投信申購贖回，沒有折溢價問題。"],"pos":0.18599,"w":1},{"id":"M-249","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列敘述，何者為真：A.封閉型基金是在集中市場交易；B.開放型基金（ETF 除外）也可以在集中市場交易","opts":["只有 A.為真","只有 B.為真","A.與 B.都為真","以上皆非"],"ans":1,"exp":["📝 解析：封閉型基金於集中市場掛牌交易，A對；一般開放型基金（ETF除外）只能向投信或銷售機構申購贖回，不在集中市場交易，B錯。"],"pos":0.18677,"w":1},{"id":"M-250","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"投資人每月固定投入 5,000 元申購某共同基金，關於「基金淨值」與「申購單位數」之關係，下列說明何者正確？","opts":["基金淨值愈低，同樣的金額可以買到愈多的基金單位","基金淨值愈高，同樣的金額可以買到愈多的基金單位","「定期定額」的優點在於淨值上升時可以累積更多單位數","購入單位數的多寡與基金淨值變動之間沒有直接關係"],"ans":1,"exp":["📝 解析：申購單位數＝投入金額÷淨值，淨值愈低，同樣5,000元可買到愈多單位，這也是定期定額攤平成本的原理。"],"pos":0.18755,"w":1},{"id":"M-251","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在資產管理實務中，關於「定期定額」投資策略的描述，下列何者最適當？","opts":["該策略隱含 「基金淨值長期趨勢向上」且最終將超過平均成本的假設","該策略主要針對專業操盤人， 透過精準擇時來獲利","投資人應在淨值低迷時停止扣款，待市場轉強後再重新啟動投資","此策略的目標在於單次投入大筆資金，以追求特定時點的絕對報酬"],"ans":1,"exp":["📝 解析：定期定額靠低檔多買、高檔少買攤平成本，前提是淨值長期向上、最後高於平均成本；不需擇時，也不是單筆投入。"],"pos":0.18833,"w":1},{"id":"M-252","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在共同基金的分類中，封閉型基金與一般開放型基金最大的不同點在於價格決定方式。試問：下列何者「不屬於」封閉型基金的特點？","opts":["投資人買賣的價格是由證券集中市場的供需撮合決定","基金規模在存續期間內原則上不會隨投資人買賣而變動","投資人若想變現， 需在次級市場轉讓而非向投信申回","基金的市價大部份時間會與其內含淨值完全相等"],"ans":4,"exp":["📝 解析：封閉型基金市價由市場供需決定，常與淨值有折溢價，不會大部分時間完全等於淨值；其餘都是封閉型特點。"],"pos":0.18911,"w":1},{"id":"M-253","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是開放型基金的特性？","opts":["買賣價格是依交易所市價","基金沒有贖回壓力","發行單位數是非固定的","基金大部份時間是處於折價狀態"],"ans":3,"exp":["📝 解析：開放型基金隨投資人申購贖回增減發行單位數，以淨值計價、有贖回壓力；依市價交易與常折價是封閉型特性。"],"pos":0.18988,"w":1},{"id":"M-254","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是投資共同基金的好處：","opts":["分散投資風險","專業機構管理","基金經理人保證獲利","具有良好的流通性"],"ans":3,"exp":["📝 解析：基金具分散風險、專業管理與流動性等好處，但投資有風險，經理人不得保證獲利。"],"pos":0.19066,"w":1},{"id":"M-255","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在共同基金實務中，開放型基金與封閉型基金在價格決定上有顯著差異。下列關於開放型基金贖回價格的敘述，何者正確？","opts":["投資人僅能以買進時的原始成本賣回給基金公司","贖回價格是由投資人與基金公司在集中市場議價後決定","贖回價格直接與基金資產的淨值掛鉤，而非市場供需撮合的價格","贖回價格一律固定為基金的面額，不隨投資標的損益波動"],"ans":3,"exp":["📝 解析：開放型基金贖回價格依贖回日的每單位淨值計算，隨資產損益波動，不經市場撮合也不固定為面額。"],"pos":0.19144,"w":1},{"id":"M-256","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在資產管理實務中，對沖基金與傳統共同基金最大的不同點在於其靈活的操作手段。下列何者是對沖基金常見的運作方式？","opts":["透過放空、套利及衍生性商品交易，追求與市場相關性較低的絕對報酬","嚴格限制投資組合的周轉率，主要採取長期持有的被動式策略","為了分散風險，規定不能針對單一資產類別進行高度槓桿操作","交易對象僅限於集中市場掛牌之證券，不參與私募或店頭市場交易"],"ans":1,"exp":["📝 解析：對沖基金可運用放空、套利、槓桿及衍生性商品，追求與大盤相關性低的絕對報酬，操作彈性遠大於共同基金。"],"pos":0.19222,"w":1},{"id":"M-257","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"以下何者不是共同基金操作手法或目的：","opts":["獲利目標是要擊敗標竿之報酬率","積極買賣衍生性商品","追求相對報酬","以上皆非"],"ans":2,"exp":["📝 解析：共同基金多以打敗標竿、追求相對報酬為目標，衍生性商品主要用於避險且受法規限制，積極買賣衍生品是對沖基金手法。"],"pos":0.193,"w":1},{"id":"M-258","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"","stem":"以下何者是一般對沖基金操作手法？ A：套利，B：積極買賣衍生性商品","opts":["只有 A 正確","只有B 正確","A 與 B 都正確","A 與B 都不正確"],"ans":3,"exp":["📝 解析：對沖基金常見手法包括套利、放空、槓桿與積極操作衍生性商品，A、B皆正確。"],"pos":0.19377,"w":1},{"id":"M-537","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依據我國現行法規，貨幣市場基金在投資標的上受到嚴格限制，下列哪一項金融商品是貨幣市場基金禁止投資的對象？","opts":["國庫券","銀行承兌匯票","具股權性質之轉換公司債","銀行存款"],"ans":3,"exp":["📝 解析：貨幣市場基金只能投資短期、高流動性的貨幣市場工具與銀行存款，不得投資股票或具股權性質的轉換公司債。"],"pos":0.19455,"w":1},{"id":"M-547","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在投資組合管理中，有關積極式與消極式操作方式的組合，下列哪一項敘述正確？","opts":["積極式：尋找股價偏低的股票投資；消極式：購買指數型基金","積極式：長期持有固定權重資產；消極式：利用技術分析頻繁進出","積極式：投資於與指數成分相同的標的；消極式： 透過基本面分析選股","積極式：採取買入持有策略；消極式：試圖利用市場錯誤定價獲利"],"ans":1,"exp":["📝 解析：積極式策略試圖找出被低估的標的以擊敗大盤；消極式策略則複製指數，例如購買指數型基金。"],"pos":0.19533,"w":1},{"id":"M-548","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"從風險管理角度視之，金控公司員工的所得來源與公司經營狀況高度相關。為達成良好的資產配置分散效果，其退休基金對金融相關產業的持股權數應如何調整？","opts":["降低權數，以規避員工總體資產（人力資本與退休金）的系統性風險","加重權數，以發揮產業資訊優勢與內部研究專長","無須調整，僅需按指數成分股比例進行被動式投資","視市場行情，由基金經理人隨意動態調整"],"ans":1,"exp":["📝 解析：員工的薪資（人力資本）已高度曝險於金融業，退休基金應降低金融股權重，避免薪資與退休資產同時受創。"],"pos":0.19611,"w":1},{"id":"M-549","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在全權委託投資業務中，為了落實「誠信原則」與「透明化管理」，下列哪一項敘述最符合法規精神？","opts":["只要客戶不反對，投信投顧從業人員可同時在不同機構間進行私人代客操作","經理人可運用操作公家基金之資訊優勢，私下提供特定大戶投資建議以增加個人收入","定期聯繫客戶會干擾經理人的操作判斷，因此除非客戶主動要求，否則不應主動告知績效","建立利益衝突防範機制，防止經理人私下承接業務，並維持與客戶良好的資訊溝通"],"ans":4,"exp":["📝 解析：全權委託應落實誠信與資訊透明，建立利益衝突防範機制、禁止經理人私下代操，並定期向客戶報告績效。"],"pos":0.19689,"w":1},{"id":"M-551","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在資產管理實務中，關於「適合度」與「策略」的敘述，下列何者最為適當？","opts":["產業型基金應以該產業指數為「標竿」，且「選基金」本身即是一種試圖擊敗大盤的積極策略","為了簡化評比，所有股票型基金均應統一使用大盤加權指數作為唯一標竿","積極式投資策略僅限於直接買賣個別股票，挑選基金則屬於被動式投資","只要投資人自覺缺乏專業知識， 其所進行的任何基金投資行為皆應定義為被動式策略"],"ans":1,"exp":["📝 解析：產業型基金應以對應的產業指數為比較標竿；投資人主動挑選基金本身就是試圖擊敗大盤的積極策略。"],"pos":0.19767,"w":1},{"id":"M-552","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在基金運作實務中，關於不同類型基金的「交易場域」，下列哪一項說明最符合現行規範？","opts":["封閉型基金僅能向基金公司申購與買回，無法在證券交易所進行交易","一般開放型基金因流動性佳，故與封閉型基金一樣皆可在集中市場自由買賣","封閉型基金透過集中市場撮合價格；一般開放型基金則是透過投信或通路申贖","所有的共同基金（含開放型與封閉型）其定價機制均由集中市場供需決定"],"ans":3,"exp":["📝 解析：封閉型基金在集中市場掛牌，依市場供需撮合價格；一般開放型基金則向投信或銷售通路依淨值申購、買回。"],"pos":0.19844,"w":1},{"id":"M-554","s":"all","ch":"常識｜基金與投信投顧","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當基金經理人進行「由下而上」的投資決策時，下列哪一項最可能是其主要的判斷依據？","opts":["針對特定產業或個別證券的成長潛力進行深入分析","判斷全球總體經濟趨勢以決定現金持有比例","比較不同國家市場間的匯率風險與報酬表現","分析市場波動率以決定是否買進避險性質的衍生性金融商品"],"ans":1,"exp":["📝 解析：由下而上是從個別公司或產業的基本面與成長潛力選股；由上而下才是先看總體經濟再決定資產配置。"],"pos":0.19922,"w":1},{"id":"M-038","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據金融資產之特性，下列何者「不屬於」典型的衍生性金融商品？","opts":["股票選擇權","利率交換","股票型共同基金","指數期貨"],"ans":3,"exp":["📝 解析：選擇權、利率交換、指數期貨的價值衍生自標的資產，屬衍生性商品；股票型基金直接持有股票，是集合投資工具而非衍生性商品。"],"pos":0.2,"w":1},{"id":"M-055","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"期貨交易，指依國內外期貨交易所或其他期貨市場之規則或實務，從事衍生自商品、貨幣、 有價證券
