於是與客戶分享","關於客戶的基本資料或買賣證券資料，基於職業道德之保密原則，不對外洩漏","為了業務需要，業務人員可以自行製作誇大績效的文宣，以吸引並招攬客戶"],"ans":3,"exp":["📝 解析：客戶基本資料及買賣資料應依保密義務與個人資料保護法不對外洩漏；任意調閱、分享公司機密、誇大文宣皆違規。"],"pos":0.84591,"w":1},{"id":"E-142","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員不應該有下列何種行為？","opts":["以職務上所知悉消息，告知第三人","不得利用客戶名義或帳戶，為自己或第三人買賣","不得有隱瞞、利誘客戶之行為","接受客戶委託買賣時，不得以自己之計算為買入或賣出之相對行為"],"ans":1,"exp":["📝 解析：職務上知悉的消息不得告知第三人，否則違反保密義務，涉及重大消息時更可能構成內線交易；其餘三項都是正確的禁止規範。"],"pos":0.84669,"w":1},{"id":"E-154","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理全權委託業務，下列陳述何者有誤?","opts":["不得從事足以損害委任人權益之交易","得對無權過問之同仁洩漏客戶資料","不得違反契約、內部作業規範、內部控制等行為","不得為與委任人有利益衝突之第三人從事代客操作業"],"ans":2,"exp":["📝 解析：全權委託業務對客戶資料負保密義務，不得洩漏給無權過問的同仁；其餘三項都是正確的禁止事項。"],"pos":0.84747,"w":1},{"id":"E-168","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理全權委託業務，下列敘述何者為非？","opts":["對於客戶資料，沒有保密之義務","不可誤導客戶不正確之價值及理財觀念","應充分告知客戶產品之性質與內容","應避免不當銷售或推介之行為"],"ans":1,"exp":["📝 解析：全權委託業務對客戶資料負有保密義務，說沒有保密義務即錯；不誤導、充分告知、避免不當推介都正確。"],"pos":0.84825,"w":1},{"id":"E-212","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為客戶管理運用資產應告知客戶相關資訊，以下何者為錯誤的？","opts":["應定期告知財產目錄","應將客戶之資產運用情形告知其他客戶","應定期告知財產損益情況","應定期告知財產管理運用紀錄"],"ans":2,"exp":["📝 解析：為客戶管理運用資產應定期告知財產目錄、損益與運用紀錄；把某客戶資產運用情形告訴其他客戶，違反保密義務及個人資料保護法。"],"pos":0.84903,"w":1},{"id":"E-214","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員以電子媒體方式與客戶聯繫業務，下列何者是錯誤的？","opts":["所採取的措施應顧及不同業務的風險","應確保傳輸安全","應確保收受者確實收受聯繫之內容","不用先取得客戶同意即可以電子媒體聯繫"],"ans":4,"exp":["📝 解析：以電子媒體與客戶聯繫須先取得客戶同意，並依業務風險採取措施、確保傳輸安全與確實送達；未經同意逕以電子方式聯繫是錯的。"],"pos":0.84981,"w":1},{"id":"E-317","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶資料，不應有下列何種行為？","opts":["妥為保管","不得出售","應有保密之義務","提供同業參考"],"ans":4,"exp":["📝 解析：客戶資料應妥為保管、不得出售並負保密義務；提供給同業參考違反保密義務及個人資料保護法。"],"pos":0.85058,"w":1},{"id":"E-320","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶資料處理方式，以下何者為非？","opts":["不得對外任加討論","不得任意對外發表","得對無權過問之同仁洩漏","不得擅自利用客戶資料為自己進行交易而謀取利益"],"ans":3,"exp":["📝 解析：客戶資料不得對外討論或發表，也不得自用謀利；即使對內，也不得洩漏給無權過問的同仁。"],"pos":0.85136,"w":1},{"id":"E-411","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬後，擅自將所蒐集客戶之個人資料，轉交給第三人， 該行為如何？","opts":["正常行為","異常行為","適法行為","違法行為"],"ans":4,"exp":["📝 解析：招攬時蒐集的個資只能在特定目的範圍內利用，擅自轉交第三人違反個人資料保護法，屬違法行為。"],"pos":0.85214,"w":1},{"id":"E-412","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員得否蒐集或利用他人個人資料？","opts":["不可以","視情況而定","可以","可以，但須依相關法規辦理"],"ans":4,"exp":["📝 解析：金融業因業務需要可蒐集、處理及利用個人資料，但必須符合個人資料保護法的特定目的、告知與當事人同意等規定。"],"pos":0.85292,"w":1},{"id":"E-413","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員違反相關法律之規定，致當事人權益受損者，應負之責任為何？","opts":["損害賠償責任","道義責任","不需負責","以上皆是"],"ans":1,"exp":["📝 解析：違法致當事人權益受損，應依民法及個人資料保護法等負損害賠償責任，而非僅負道義責任。"],"pos":0.8537,"w":1},{"id":"E-415","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬，於下列何時，應對客戶資料盡保密之義務？","opts":["業務員在職時或離職後","僅於業務員招攬業務時","僅於業務員將資料歸檔時","以上皆非"],"ans":1,"exp":["📝 解析：保密義務不因離職而終止，業務員在職期間及離職後都必須對客戶資料保密。"],"pos":0.85447,"w":1},{"id":"E-416","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為金融從業人員從事保險業務招攬時，應注意之事項？","opts":["除非有法律規定， 否則不得洩露客戶資料","妥善保管客戶資料，避免讓不相關的第三人取得","不得銷售或販賣客戶資料","以上皆是"],"ans":4,"exp":["📝 解析：除法律規定外不得洩露、妥善保管避免第三人取得、不得販賣客戶資料，三者都是招攬時應盡的保密義務。"],"pos":0.85525,"w":1},{"id":"E-417","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於業務上獲取客戶之個人資料，應以何種態度面對？","opts":["不得隨意直接或間接對第三人洩露","只要非出於故意之揭露，即無庸負責","以漠不關心態度面對","基本資料可以洩露無妨"],"ans":1,"exp":["📝 解析：業務上取得的客戶個資不得直接或間接洩露給第三人；過失洩露依個人資料保護法仍須負責，基本資料同樣受保護。"],"pos":0.85603,"w":1},{"id":"E-418","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶資料之維護，應如何處理才算適當？","opts":["客戶特別叮嚀時再注意就好","應盡善良管理人之注意義務","可用以換取利益","視與客戶關係而定"],"ans":2,"exp":["📝 解析：維護客戶資料應盡善良管理人的注意義務，不因客戶是否叮嚀或關係親疏而降低標準，更不得拿來換取利益。"],"pos":0.85681,"w":1},{"id":"E-419","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於經手業務所得知之客戶訊息，應抱持如何態度始屬適當？","opts":["可在市場上交換獲取利益","反正我不洩露，別人也會洩露","本於職業道德，應予維護","視狀況而定"],"ans":3,"exp":["📝 解析：經手業務得知的客戶訊息應本於職業道德予以保密維護，不可拿到市場交換利益，也不能以別人也會洩露為藉口。"],"pos":0.85759,"w":1},{"id":"E-422","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融服務事業基於金控共同行銷策略：","opts":["不須經客戶同意，可將客戶之基本資料、財務資料相互利用","必須經客戶同意，方可將客戶之基本資料、財務資料相互利用","若未經客戶同意，僅可將客戶之基本資料相互流利用，財務資料不可利用","若未經客戶同意，僅可將其客戶之財務資料相互流利用，基本資料不可利用"],"ans":2,"exp":["📝 解析：依金融控股公司法、個人資料保護法及共同行銷相關規範，子公司間交互運用客戶基本資料與財務資料須經客戶同意，不得擅自互用。"],"pos":0.85837,"w":1},{"id":"E-427","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業對於其客戶個人資料之處理方式，何者敘述有誤?","opts":["依照個人資料保護法辦理","可放置公開場所，以便其他同仁隨時連絡服務","須經客戶同意，方可將客戶之基本資料、財務資料通用","資訊人員應對客戶資料具保密之義務"],"ans":2,"exp":["📝 解析：客戶個資應依個人資料保護法妥善保管，放在公開場所任人取閱會造成外洩；經同意才可通用資料、資訊人員負保密義務的敘述都正確。"],"pos":0.85914,"w":1},{"id":"E-428","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應本保密原則，忠實執行業務，何者敘述有誤?","opts":["可提供客戶委託之事項予依法進行調查之主管機關或檢調單位","如經客戶同意，可將客戶之基本資料、財務資料互為通用","可為了保護個人隱私，以非真實姓名從事金融商品交易分析","未能出示身分證明文件者，可拒絕就其個人資料申請查詢"],"ans":3,"exp":["📝 解析：以非真實姓名從事金融商品交易違反實名制及洗錢防制規定，不能以保護隱私為由；配合依法調查、經同意互用資料、無身分證明拒絕查詢都正確。"],"pos":0.85992,"w":1},{"id":"E-430","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是金融服務業之從業人員必須禁止的行為？","opts":["交付給客戶公司未公佈的財報","交付給客戶公司依法已公開的資訊","交付給客戶公司的商業機密","以上皆非"],"ans":2,"exp":["📝 解析：公司依法已公開的資訊本來就可提供給客戶；未公佈的財報屬未公開重大資訊、商業機密也應保密，兩者都禁止交付。"],"pos":0.8607,"w":1},{"id":"E-431","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"基於職務的關係而獲得的客戶資料，金融服務業之從業人員應該如何做才正確？","opts":["由於大環境不佳，基於自己未來生活著想，可以將客戶資料轉賣給別人","必須忠於保密原則，絕不對外洩露","隨意丟棄，不整理","以上皆是"],"ans":2,"exp":["📝 解析：因職務取得的客戶資料必須恪守保密原則；轉賣違反個人資料保護法，隨意丟棄也可能造成外洩。"],"pos":0.86148,"w":1},{"id":"E-436","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於證券商的商業機密，身為公司的員工，不可對第三者透露？","opts":["客戶及其買賣交易證券的相關資料","公司名稱、營業處所、聯絡電話、電子郵件信箱等資料","公司官方網站提供的資訊","以上皆是"],"ans":1,"exp":["📝 解析：客戶身分及其買賣交易資料屬證券商營業秘密，不得透露給第三者；公司名稱、地址電話、官網資訊本來就是公開資訊。"],"pos":0.86226,"w":1},{"id":"E-438","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理業務應予保密，下列何者為非?","opts":["客戶資料","商品機密","公司業務機密","業務簡介"],"ans":4,"exp":["📝 解析：客戶資料、商品機密、公司業務機密都需保密；業務簡介是對外說明業務的公開資料，不屬保密範圍。"],"pos":0.86304,"w":1},{"id":"E-439","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理業務對客戶資料之保密，以下何者為非？","opts":["客戶基本資料無須保密","客戶帳務資料應予保密","客戶信用資料應予保密","客戶投資及保險資料應予保密"],"ans":1,"exp":["📝 解析：客戶基本資料同樣受個人資料保護法保護，必須保密；帳務、信用、投資及保險資料當然也應保密。"],"pos":0.86381,"w":1},{"id":"E-440","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"為保護客戶資料，以下措施何者是錯誤的？","opts":["應使用安全的軟硬體設備以安全傳輸","應建立防火牆機制防止非法存取","應限制客戶登錄公司網站","應依業務權責限制使用資料人員"],"ans":3,"exp":["📝 解析：保護客戶資料應採安全傳輸設備、建置防火牆並依權責限制使用人員；限制客戶登錄公司網站與資料保護無關，反而妨礙服務。"],"pos":0.86459,"w":1},{"id":"E-441","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列何種情況得運用客戶資料與子公司間進行共同行銷？","opts":["與客戶簽訂契約","經客戶書面同意","選項(1)或(2)","以上皆非"],"ans":3,"exp":["📝 解析：依金控子公司間共同行銷相關規範及個人資料保護法，與客戶簽訂契約或取得客戶書面同意，即可運用客戶資料進行共同行銷。"],"pos":0.86537,"w":1},{"id":"E-443","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員使用公司機密文件，以下何者有誤？","opts":["如非必要應儘量免用或減少副本","機密文書誤繕誤印之廢紙應予回收再利用","非經權責主管人員核准，不得攜出辦公處所","會議使用之機密資料，會議結束應當場收回"],"ans":2,"exp":["📝 解析：機密文件誤繕誤印的廢紙應以碎紙等方式銷毀，不可回收再利用以免外洩；減少副本、未經核准不得攜出、會後當場收回都正確。"],"pos":0.86615,"w":1},{"id":"E-444","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受託管理客戶財產時應注意保密事項，以下何者是錯誤的？","opts":["管理決策執行過程應保守秘密","受託交易之執行應保守秘密","受託操作績效佳之交易決策應供自營部位參考","管理決策與交易之執行嚴禁洩露或不當使用"],"ans":3,"exp":["📝 解析：受託管理客戶財產的決策與交易屬機密，不得洩露或不當使用；把客戶操作決策提供自營部位參考，可能被用來搶先或跟單交易而損害客戶。"],"pos":0.86693,"w":1},{"id":"E-445","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"公司委任第三人處理相關事務，受任第三人應注意下列保密事項，何者為錯誤？","opts":["客戶資料得提供關係企業促銷業務","客戶資料不得外洩","客戶資料不得不當利用","客戶資料之使用應建立內部控制機制"],"ans":1,"exp":["📝 解析：受任第三人只能在委任目的範圍內使用客戶資料，並應建立內控、不得外洩或不當利用；提供關係企業促銷屬目的外利用，違反個人資料保護法。"],"pos":0.8677,"w":1},{"id":"E-446","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"以下所述有關客戶資訊之使用，何者是錯誤的？","opts":["於公司內部應設置防火牆防止資訊外洩","為提高業務績效，得提供予非相關業務人員使用","拒絕提供予其他非辦理業務人員使用","應適當監管以防止客戶之資訊不當交流或不當共用"],"ans":2,"exp":["📝 解析：客戶資訊應設防火牆並適當監管，只限辦理業務人員使用；為提高業績提供給非相關業務人員，屬不當交流共用。"],"pos":0.86848,"w":1},{"id":"E-447","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"妥慎保管客戶資料，確認與客戶相關資料及客戶隱私之保密性，屬下列何項原則？","opts":["保密原則","能力原則","資訊公開原則","客觀性原則"],"ans":1,"exp":["📝 解析：妥慎保管客戶資料、確保客戶隱私不外洩，正是保密原則的核心內容。"],"pos":0.86926,"w":1},{"id":"E-448","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶之相關資料：","opts":["可任意放置","可隨便公開","不須保密","確實保密"],"ans":4,"exp":["📝 解析：客戶相關資料應確實保密，不能任意放置、隨便公開或視為不需保密。"],"pos":0.87004,"w":1},{"id":"E-450","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"若有第三人欲索取當事人之帳戶資料，何者為非？","opts":["須經當事人書面同意方可為之","須主動積極提供之，以表現金融從業人員之熱誠","經當事人之法定代理人書面同意方可為之","依保密原則，可直接拒絕對方之要求"],"ans":2,"exp":["📝 解析：第三人索取帳戶資料須經當事人或其法定代理人書面同意，否則應依保密原則拒絕；主動積極提供違反保密義務。"],"pos":0.87082,"w":1},{"id":"E-452","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"從業人員對於自客戶取得之機密資料應盡保密義務，所謂保密原則下列何者正確？","opts":["不得以任何方式洩露予與執行該業務無關之人","不得為交付目的以外之利用","應以善良管理人之注意義務管理之","以上皆是"],"ans":4,"exp":["📝 解析：保密原則包括不得洩露給與業務無關之人、不得為交付目的以外的利用、應以善良管理人注意義務管理，三者皆是。"],"pos":0.8716,"w":1},{"id":"E-454","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"從業人員對於所屬公司之機密資料在下列何種情形下可不適用「保密原則」？","opts":["於資料揭露前已為公眾所知","依相關法令要求被揭露者，非因從業人員違反保密義務者","(1)及(2)","以上皆非"],"ans":3,"exp":["📝 解析：揭露前已為公眾所知的資料，或依法令要求揭露且非因從業人員違反保密義務者，不再適用保密原則，故(1)(2)都是。"],"pos":0.87237,"w":1},{"id":"E-455","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列何人對於公司本身或客戶之資訊，除經授權或法律規定公開外，應負有保密責任？","opts":["董事","監察人","經理人","以上皆是"],"ans":4,"exp":["📝 解析：董事、監察人、經理人對公司本身及客戶資訊，除經授權或法律規定公開外，都負有保密責任。"],"pos":0.87315,"w":1},{"id":"E-456","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶的資料，應如何處理？","opts":["予以保密","未經客戶同意，提供給關係企業做行銷","告知同事給予參考","讓其他客戶瞭解"],"ans":1,"exp":["📝 解析：客戶資料應予保密；未經同意提供關係企業行銷、告知同事或讓其他客戶知道，都屬不當洩露。"],"pos":0.87393,"w":1},{"id":"E-457","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員得知客戶個人資料，應如何處理？","opts":["予以保密","可用於私人用途","販售給非法單位","隨意揭露給他人"],"ans":1,"exp":["📝 解析：客戶個資應予保密，不得私用、販售或隨意揭露，否則違反個人資料保護法並可能負民刑事責任。"],"pos":0.87471,"w":1},{"id":"E-458","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在公共場所不得有之行為：","opts":["談論公司重要機密","談論國家大事","談論藝文趣事","談論個人未來計畫"],"ans":1,"exp":["📝 解析：在公共場所談論公司重要機密可能被旁人聽到而外洩；談論國家大事、藝文趣事或個人計畫並無保密問題。"],"pos":0.87549,"w":1},{"id":"E-459","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為客戶辦理財富管理，對客戶本身的資產、各項資料及隱私都應該妥慎保管不得洩露或不當使用，以符合下列何種原則？","opts":["利益衝突原則","保密原則","禁止原則","告知原則"],"ans":2,"exp":["📝 解析：妥慎保管客戶資產、資料與隱私，不得洩露或不當使用，屬於保密原則。"],"pos":0.87626,"w":1},{"id":"E-460","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於取自客戶之相關資料或資訊應不得為下列之行為？","opts":["公開","販售","複製","以上皆是"],"ans":4,"exp":["📝 解析：取自客戶的資料不得公開、販售或擅自複製，以免外洩或遭不當利用，三者皆禁止。"],"pos":0.87704,"w":1},{"id":"E-461","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對公司或其客戶之資訊，除經授權或法律規定公開外，應負有保密義務，理由為何？","opts":["可能為競爭對手所利用","洩露未公開資訊之後對公司有所損害","洩露未公開資訊之後對客戶有所損害","以上皆是"],"ans":4,"exp":["📝 解析：未公開資訊外洩可能被競爭對手利用，也會對公司及客戶造成損害，因此從業人員負有保密義務。"],"pos":0.87782,"w":1},{"id":"E-462","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"妥善保管客戶資料，確保客戶相關資料及客戶隱私之保密性，是屬下列哪一原則之表現?","opts":["守法原則","保密原則","能力原則","誠信原則"],"ans":2,"exp":["📝 解析：妥善保管客戶資料、確保客戶隱私的保密性，是保密原則的表現。"],"pos":0.8786,"w":1},{"id":"E-463","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對客戶之資料，應盡到如何之注意義務？","opts":["刑法第十三條過失之注意義務","自己之事務之注意義務","受僱人之注意義務","善良管理人之注意義務"],"ans":4,"exp":["📝 解析：從業人員受託處理客戶事務，對客戶資料須盡善良管理人之注意義務，標準高於處理自己事務的注意。"],"pos":0.87938,"w":1},{"id":"E-466","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對經辦業務所取得之客戶資料，下列行為何者是正確的？","opts":["可販售予第三人","不可販售予其他客戶，但可以跟其他同業交換","可提供給自己親友開設的公司參考","除法律另有規定外，應保守秘密"],"ans":4,"exp":["📝 解析：經辦業務取得的客戶資料，除法律另有規定外應保守秘密；販售、與同業交換或提供親友公司參考都違反保密義務。"],"pos":0.88016,"w":1},{"id":"E-468","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列有關金融從業人員對於客戶資料之陳述，何者為是？","opts":["得對外任加討論","不得任意對外發表","得對無權過問之同仁洩漏","沒有保密的之義務"],"ans":2,"exp":["📝 解析：從業人員對客戶資料負有保密義務，不得任意對外發表，也不得向無權過問的同仁洩漏。"],"pos":0.88093,"w":1},{"id":"E-469","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶資料處理方式，下列何者為正確？","opts":["得提供他人使用","得向他人出售、洩露","不得出售或提供他人使用","可與同業交換使用"],"ans":3,"exp":["📝 解析：客戶資料不得出售或提供他人使用，與同業交換同樣違反個人資料保護法。"],"pos":0.88171,"w":1},{"id":"E-470","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"為強化客戶對金融機構的信賴，金融從業人員對客戶資料之處理，以下敘述何者正確？","opts":["對於客戶資料之保密應依據相關主管機關之法令規定辦理，善盡對客戶資料保密之職責","對於客戶資料之保密，除法令規定外，未經客戶簽訂契約或書面表示同意前，不得以任何方式洩露往來客戶之相關業務資料","若發生客戶資料外洩時，應依內部之通報程序向相關主管報告，儘速研議緊急補救措施，並審酌案件內容通報主管機關或治安單位","以上皆是"],"ans":4,"exp":["📝 解析：依法令善盡保密職責、除法令外未經客戶契約或書面同意不得洩露、外洩時依程序通報主管並研議補救及通報主管機關或治安單位，三者皆正確。"],"pos":0.88249,"w":1},{"id":"E-473","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列對金融從業人員保密義務之敍述，何者正確？","opts":["離開原職後即不受拘束","客戶因個人資料洩露所受損害全數由公司賠償，相關人員完全免責","只要不洩露客戶資訊，用來獲取財務利益無妨","以上皆非"],"ans":4,"exp":["📝 解析：保密義務離職後仍存在；洩露者須依個人資料保護法及民法負責，不因公司賠償而免責；利用客戶資訊謀利也違反忠實義務，故三者皆錯。"],"pos":0.88327,"w":1},{"id":"E-474","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列就金融從業人員對客戶資料之保密原則的陳述何者正確？","opts":["不得透露予依法所進行調查行為之主管機關或司法人員","不得透露予公司指定之授權人員","應妥慎保管客戶資料","提供關係企業進行業務促銷"],"ans":3,"exp":["📝 解析：應妥慎保管客戶資料；對依法調查的主管機關、司法人員及公司授權人員可依規定提供，未經同意提供關係企業促銷則違反保密。"],"pos":0.88405,"w":1},{"id":"E-528","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員之自律行為何者為非？","opts":["未經許可，不得在公司工作時間內，兼任公司以外之任何職務","對於公司各項文件、函電、簿冊、圖表、典章制度、公物等，得以攜出並對外談論","對職務上所獲悉之任何未經公司同意公開之營業資訊負有絕對保密義務","非經主管許可，不得擅自對外發表任何有關公司業務之意見"],"ans":2,"exp":["📝 解析：公司文件、函電、簿冊、典章制度等應妥善保管保密，不得任意攜出或對外談論，故(2)錯誤；其餘為正確自律行為。"],"pos":0.88482,"w":1},{"id":"E-558","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，下列應遵守之事項何者有誤？","opts":["依據客戶風險之承受度提供客戶適當之商品","避免不當銷售或推介之行為","不可販售客戶資料，惟可提供給自己親友開設的公司參考","廣泛了解客戶之家庭背景、生涯規劃"],"ans":3,"exp":["📝 解析：客戶資料依個人資料保護法不得販售，也不得提供給親友公司使用，故(3)錯誤；其餘為落實適合度的正確作法。"],"pos":0.8856,"w":1},{"id":"E-006","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"期貨業應建立內部控制制度包括洗錢防制相關規定，並經下列何者通過？","opts":["股東大會","董事會","董事長","總經理"],"ans":2,"exp":["📝 解析：期貨業的內部控制制度（含防制洗錢及打擊資恐規範）應經董事會通過，以落實董事會的治理責任。"],"pos":0.88638,"w":1},{"id":"E-007","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"洗錢行為不包括下列何者？","opts":["使用自己之所得與他人進行交易","隱匿特定犯罪所得或掩飾其來源","收受、持有或使用他人之特定犯罪所得","妨礙或危害國家對於特定犯罪所得之調查、沒收或追徵"],"ans":1,"exp":["📝 解析：洗錢防制法第 2 條所稱洗錢包括：隱匿特定犯罪所得或掩飾其來源、妨礙或危害國家對特定犯罪所得之調查發現保全沒收或追徵、收受持有或使用他人之特定犯罪所得，以及使用「自己之特定犯罪所得」與他人進行交易。選項 (1) 只說使用自己之所得（不是特定犯罪所得），屬正常交易，不構成洗錢；(2)(3)(4) 都是法定洗錢行為。"],"pos":0.88716,"w":1},{"id":"E-010","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"洗錢防制法所稱金融機構，不包括下列何者？","opts":["證券商","期貨商","銀樓業","證券投資顧問事業"],"ans":3,"exp":["📝 解析：依洗錢防制法，銀樓業屬「指定之非金融事業或人員」；證券商、期貨商、證券投資顧問事業才屬金融機構。"],"pos":0.88794,"w":1},{"id":"E-012","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融機構應建立洗錢防制內部控制與稽核制度，內容應包括下列哪些事項？","opts":["防制洗錢之作業及控制程序","定期舉辦防制洗錢之在職訓練","指派專人負責協調監督防制洗錢作業之執行","以上皆是"],"ans":4,"exp":["📝 解析：防制洗錢內控制度應包含作業及控制程序、定期在職訓練、指派專責人員協調監督執行，三項皆是。"],"pos":0.88872,"w":1},{"id":"E-042","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶開戶之相關文件，應為何種處理：","opts":["可幫客戶作假","不須提供任何文件","應確實查核客戶提供相關文件之正確性","不須查證"],"ans":3,"exp":["📝 解析：開戶須確實查核客戶身分與文件真實性，這是洗錢防制法要求的確認客戶身分程序，不得造假或省略查證。"],"pos":0.88949,"w":1},{"id":"E-064","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"銀行受理開戶時，應實施雙重身分證明文件查核及留存該身分證明文件。若屬個人開戶，下列那些證件可以當作證明文件？","opts":["戶口名簿","駕照","健保卡","以上皆是"],"ans":4,"exp":["📝 解析：個人開戶的雙重身分證明，除身分證外，第二證件可用戶口名簿、駕照、健保卡等具辨識力文件，三者皆可。"],"pos":0.89027,"w":1},{"id":"E-107","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"為防制洗錢，金融服務業對達一定金額以上通貨交易需要向下列何者申報？","opts":["警政署刑事警察局","法務部調查局","金融監督管理委員會","國家安全局"],"ans":2,"exp":["📝 解析：依洗錢防制法，金融機構對達一定金額（新臺幣 50 萬元）以上之通貨交易，應向法務部調查局申報。"],"pos":0.89105,"w":1},{"id":"E-108","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"當知悉客戶是利用他人名義而無授權書時，從事金融商品交易：","opts":["如果客戶承諾補具授權書，可先接受其委託進行金融商品交易","應拒絕接受其委託進行金融商品交易","有條件地接受其委託進行金融商品交易","報經主管同意，即可接受其委託進行金融商品交易"],"ans":2,"exp":["📝 解析：知悉客戶以他人名義交易又無授權書時應拒絕受理，不能以事後補件、有條件接受或主管同意替代，以防人頭帳戶與洗錢。"],"pos":0.89183,"w":1},{"id":"E-121","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員接受客戶委託買賣有價證券，應注意是否有涉及違法洗錢情事，下列何者為不正常的交易態樣？","opts":["由同一客戶代替或透過多個其他客戶名義或帳戶執行買賣","由客戶本人親自用電話委託買賣","客戶在營業場所當面委託買進或賣出","客戶自行以電子下單系統下單委託買賣"],"ans":1,"exp":["📝 解析：同一客戶透過多個他人名義或帳戶交易，是典型的疑似洗錢與人頭帳戶態樣；本人以電話、臨櫃或電子下單都屬正常委託。"],"pos":0.89261,"w":1},{"id":"E-164","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受理開戶時應由客戶提供應備之證件核驗，如客戶拒絕提供者，下列何者行為是不被允許的？","opts":["應予婉拒受理","仍予受理以提升業績","經確實查證身分屬實後始予辦理","應與客戶充分溝通，請客戶配合證件核驗"],"ans":2,"exp":["📝 解析：客戶拒絕提供證件時應婉拒或溝通請其配合；為業績仍予受理，違反洗錢防制法確認客戶身分之義務。"],"pos":0.89339,"w":1},{"id":"E-191","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融服務業對達一定金額以上通貨交易未依規定申報者，最高可處多少罰鍰？","opts":["新台幣五萬元","新台幣五十萬元","新台幣五百萬元","新台幣一千萬元"],"ans":4,"exp":["📝 解析：依洗錢防制法，金融機構對達一定金額（新臺幣50萬元）以上通貨交易未依規定申報者，處新臺幣50萬元以上1,000萬元以下罰鍰，最高1,000萬元。"],"pos":0.89416,"w":1},{"id":"E-194","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"為防制洗錢，金融服務業應拒絕客戶開戶的情形有哪些？","opts":["客戶使用假名開戶","客戶持用變造身分證明文件","客戶提供之文件資料無法進行查證","以上皆是"],"ans":4,"exp":["📝 解析：依洗錢防制法及金融機構防制洗錢辦法，客戶疑似使用假名或人頭、持偽變造身分文件、所提文件無法查證者，應拒絕建立業務關係，故皆是。"],"pos":0.89494,"w":1},{"id":"E-264","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"與開戶相關疑似洗錢的樣態包括下列哪些？","opts":["客戶無正當理由開立多個帳戶","數個不同客戶之帳戶，均留存相同通訊地址","客戶之地址或工作地點與金融服務業所在地距離遙遠且無法作合理之解釋","以上皆是"],"ans":4,"exp":["📝 解析：無正當理由開多個帳戶、多個客戶留存相同地址、地址或工作地點遙遠且無合理解釋，都是疑似洗錢表徵中的開戶樣態。"],"pos":0.89572,"w":1},{"id":"E-265","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"與交易相關疑似洗錢的樣態包括下列哪些？","opts":["開戶後立即有大額交易","一年以上無交易之帳戶突然大額交易","數個帳戶均委由同一人代理從事交易","以上皆是"],"ans":4,"exp":["📝 解析：開戶後立即大額交易、一年以上未往來帳戶突然大額交易、多個帳戶由同一人代理交易，都屬疑似洗錢交易表徵。"],"pos":0.8965,"w":1},{"id":"E-272","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"與轉帳相關疑似洗錢的樣態包括下列哪些？","opts":["交易人約定轉帳之銀行帳戶，位於洗錢高風險國家或地區","客戶於一定期間存入多筆帳款，但甚少交易，又迅速移轉","一年以上無交易之帳戶突然頻繁存入多筆款項，且迅速移轉","以上皆是"],"ans":4,"exp":["📝 解析：約定轉帳帳戶位於洗錢高風險國家或地區、多筆存入少交易後迅速移轉、久未往來帳戶突然頻繁存入並迅速移轉，都是疑似洗錢的轉帳表徵。"],"pos":0.89728,"w":1},{"id":"E-432","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴客戶帳戶類的交易態樣？","opts":["無正當理由開立多個帳戶，且實質受益人為同一人者","客戶係屬重要政治性職務人員，但意圖規避正確且完整的填寫申請表格，或未充分說明其資金或有價證券之來源正當性者","以不同公司名義但皆有相同之法定代表人或有權簽署人，開立數個帳戶者","以上皆是"],"ans":4,"exp":["📝 解析：依證券商公會疑似洗錢態樣，無正當理由開多個帳戶且實質受益人相同、重要政治性職務人員規避填表或未說明資金來源、不同公司同一代表人開多戶，皆屬帳戶類態樣。"],"pos":0.89805,"w":1},{"id":"E-434","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴交易類的交易態樣？","opts":["新開戶或一定期間內無交易之帳戶突然大額交易者","客戶突然大額匯入或買賣冷門、小型或財務業務不佳之有價證券， 且無合理原因者","無正當理由短期內連續大量買賣特定股票者","以上皆是"],"ans":4,"exp":["📝 解析：新戶或久未交易帳戶突然大額交易、無合理原因大額買賣冷門或財務不佳股票、無正當理由短期大量買賣特定股票，都是證券商公會列舉的交易類可疑態樣。"],"pos":0.89883,"w":1},{"id":"E-521","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於洗錢防制法所稱金融機構？","opts":["票券金融公司","證券集中保管事業","人力銀行","信用卡公司"],"ans":3,"exp":["📝 解析：洗錢防制法所稱金融機構包括票券金融公司、證券集中保管事業、信用卡公司等；人力銀行只是求職媒合平台，不屬金融機構。"],"pos":0.89961,"w":1},{"id":"E-526","s":"all","ch":"道德｜洗錢防制與打擊資恐","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員依據洗錢防制法之規定，不得有下列何種行為？","opts":["掩飾或隱匿因自己或他人重大犯罪所得財物或財產上利益者","收受、搬運、寄藏或收買他人因重大犯罪所得財物或財產上利益者","洩露或交付關於申報疑似洗錢交易或洗錢犯罪嫌疑之文書、 圖畫、消息或物品者","以上皆是"],"ans":4,"exp":["📝 解析：依洗錢防制法 §2，隱匿特定犯罪所得或掩飾其來源、收受持有或使用他人之特定犯罪所得都屬洗錢行為；§24 第2項另處罰金融機構等非公務員洩漏或交付疑似洗錢交易申報相關文書、消息或物品，三者皆不得為。題目用的「重大犯罪」是舊法用語，現行法（2024-07-31 修正）稱「特定犯罪」。"],"pos":0.90039,"w":1},{"id":"E-296","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業稽核人員得兼任下列何種職務？","opts":["銀行存款櫃檯人員","證券商債券交易員","保險公司核保人員","以上皆非"],"ans":4,"exp":["📝 解析：依金融機構內部控制及稽核制度相關辦法，稽核人員須具獨立性，不得兼任存款櫃檯、交易、核保等受查業務職務，故以上皆非。"],"pos":0.90117,"w":1},{"id":"E-602","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"以往法律僅處罰民眾要求公務員「違法」辦事的賄賂行為，但現行法律已有所修正。 若民眾對於公務員「依法令應辦理」的事務提供財物，試問：此行為在現行法律下的評價為何？","opts":["基於人情世故，只要公務員沒有違法辦事，送禮者無罪","只要公務員最終沒有收下禮物，送禮的民眾就完全沒有法律責任","僅屬於違反行政規章，透過繳納罰鍰即可解決，不具刑事責任","觸犯「貪污治罪條例」中的「不違背職務行賄罪」"],"ans":4,"exp":["📝 解析：貪污治罪條例 §11 第2項已增訂不違背職務行賄罪，對公務員依法應辦事項交付財物即構成犯罪，不是只有行政責任。"],"pos":0.90195,"w":1},{"id":"E-603","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依據「公務員廉政倫理規範」，公務員在面對有「職務利害關係」者贈送禮品時，下列哪一種處理方式是正確且「不構成違法」的？","opts":["只要禮品價值在五千元以下，公務員就可以安心收下並留作私用","若是因為結婚、生育、遷徙等特殊節慶，接受市價不超過三千元的賀禮","只要是對方主動贈送，公務員被動收下後只要不被檢舉就沒事","為了不傷和氣，先收下禮品，等下回對方有求於己時再退還。"],"ans":2,"exp":["📝 解析：依公務員廉政倫理規範，因結婚、生育、喬遷等受贈市價不超過正常社交禮俗標準（新台幣3,000元）的財物例外允許；其餘選項都違規。"],"pos":0.90272,"w":1},{"id":"E-604","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某廠商為了感謝公務員阿明在審查過程中的「指導」，得知阿明正想買車，便將公司名下市價 100 萬元的公務車，以 10 萬元的象徵性價格賣給阿明。試問：此行為在法律上的看法為何？","opts":["雙方有簽署買賣契約並交付價金，屬於合法的民事買賣行為","這種顯不相當的對價行為，在本質上仍屬於贈與財物或其他不正利益","只要阿明事後有如實向機關申報財產，則低價購車行為即屬合法","法律僅禁止「收受紅包」，對於這種二手商品買賣的價差並無限制"],"ans":2,"exp":["📝 解析：以顯不相當的低價出售財物，差額實質上就是給予財物或不正利益，形式上簽約付款不能改變其賄賂本質。"],"pos":0.9035,"w":1},{"id":"E-605","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"法律上判斷公務員收受的財物是否構成「賄賂」，其最關鍵的判斷標準（要素）為何？","opts":["只要公務員收受財物時有感到「開心」，就具備對價關係","財物的價值是否超過新台幣三千元，低於三千元者一律不構成犯罪","雙方私下是否具有「對價關係」，即給予利益與職務行為之間是否有互為交換的意圖","廠商與公務員是否為國小同學或親戚關係，若是熟識則不構成行賄。"],"ans":3,"exp":["📝 解析：賄賂罪的關鍵是對價關係，即給予利益與公務員職務行為之間有交換意圖；金額大小或熟識與否不是判斷標準。"],"pos":0.90428,"w":1},{"id":"E-606","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"為了防範廉政風險，各機關通常會宣導民眾洽辦業務時應遵循特定原則。下列哪一項敘述最符合「廉能政府」的要求？","opts":["民眾應盡量選擇在私人茶館或咖啡廳約見承辦人，以利溝通案件細節","為了提高效率，民眾可以要求承辦人跳過不必要的審核關卡，先行核發公文","民眾若想了解進度，應直接撥打承辦人的個人私密電話，避免留下官方紀錄","案件申請應於機關辦公場所內公開進行，並留下正式的收文紀錄與進度追蹤"],"ans":4,"exp":["📝 解析：洽辦公務應在機關辦公場所公開進行並留下正式收文與進度紀錄，避免私下接觸、跳過程序或私人聯繫造成廉政風險。"],"pos":0.90506,"w":1},{"id":"E-607","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當公務員遇到有人進行「請託關說」時，依據「《公務員廉政倫理規範》，下列哪一項是正確的標準作業程序？","opts":["為了不讓長官擔心，私下拒絕即可，不需留下任何公文或紀錄","應於三日內簽報其長官並知會政風單位，以利案件透明化並保護自己","若請託者是具有影響力的民意代表，為了機關預算，應盡力配合其要求","只要對方沒有送禮或給錢，單純的口頭要求並不具備法律效力，可以完全無視"],"ans":2,"exp":["📝 解析：依公務員廉政倫理規範，遇請託關說應於三日內簽報長官並知會政風單位，留存紀錄以示透明並保護自己。"],"pos":0.90584,"w":1},{"id":"E-608","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"若公務員收受與其「無職務利害關係」者之贈勞，依據規範，在「偶發而無影響職務之虞」的前提下，每一受贈對象在「一年內」收受財物的總價值不得超過多少？","opts":["新台幣一千元","新台幣三千元","新台幣五千元","新台幣一萬元"],"ans":4,"exp":["📝 解析：公務員廉政倫理規範第2點第3款定義「正常社交禮俗標準」為市價不超過新台幣3,000元，但同一年度來自同一來源受贈財物以新台幣1萬元為限，故選(4)。對無職務利害關係者的餽贈，市價超過該標準時應於受贈之日起三日內簽報長官（第5點）。"],"pos":0.90661,"w":1},{"id":"E-609","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"","stem":"貪污治罪條例所稱之「賄賂或不正利益」與公務員廉政倫理規範所稱之「餽贈財物」，其最大差異在於下列何者之有無？","opts":["競合關係","吸收關係","隸屬關係","對價關係"],"ans":4,"exp":["📝 解析：貪污治罪條例的賄賂或不正利益須與職務行為具對價關係；廉政倫理規範的餽贈財物則不以對價關係為要件。"],"pos":0.90739,"w":1},{"id":"E-610","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一種情境最符合「貪污治罪條例」中「不違背職務行賄罪」的構成要件？","opts":["建築業者為了讓「不合格」的消防安檢過關，私下贈送承辦人現金","民眾為了讓「完全符合法定標準」的申請案能縮短作業時程，致贈高價禮券","酒駕者為了免於被移送法辦，當場掏出數萬元要求警察「不要開單」","廠商為了得標，教唆評選委員將原本最高分的競爭對手評為不及格"],"ans":2,"exp":["📝 解析：申請案完全合法、僅為加快時程送禮，是對公務員不違背職務的行為交付賄賂，構成貪污治罪條例 §11 第2項；其餘選項屬違背職務行賄或教唆。"],"pos":0.90817,"w":1},{"id":"E-611","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"基於「揭弊者保護」核心精神，除了身分保密外，若檢舉人為該機關內部之公務員 （吹哨者），法律應提供何種保護以避免其遭受職場報復？","opts":["應要求檢舉人於機關週會上公開說明檢舉動機，以示負責","應立即核予該檢舉人晉升兩職等，以作為勇於檢舉之補償","應強制該檢舉人立即離職並提供終身退休金，以保障其生活","應保障檢舉人不得因檢舉行為而受免職、解僱、調職或其他不利之處分"],"ans":4,"exp":["📝 解析：揭弊者保護的核心在於保障吹哨者不因檢舉遭免職、解僱、調職或其他不利處分；公開說明、強制離職或晉升補償都不合理。"],"pos":0.90895,"w":1},{"id":"E-612","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"","stem":"檢舉人向有偵查權機關或政風機構檢舉貪污瀆職，必須於何時為之始可能給與獎金？","opts":["犯罪未起訴前","犯罪未發覺前","犯罪未遂前","預備犯罪前"],"ans":2,"exp":["📝 解析：依獎勵保護檢舉貪污瀆職辦法，須在犯罪未發覺前檢舉，並因而起訴或判決，才可能核給獎金。"],"pos":0.90973,"w":1},{"id":"E-613","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在設計公司治理的「吹哨者」管道及保護制度時，為防止制度被濫用為「職場鬥爭」 工具（即惡意誣告），下列何種配套做法較為合理？","opts":["要求所有檢舉人必須先繳納一筆保證金，若檢舉不成立則沒收","建立獨立的調查小組，並規定若證實檢舉人為「故意捏造事實」者，應負相應之申誡或紀律處分","規定只有高階主管才能使用檢舉管道，基層員工不具備檢舉資格","規定所有的檢舉案件都必須先通知被檢舉人，讓雙方進行面對面辯論"],"ans":2,"exp":["📝 解析：合理配套是設立獨立調查小組，並對故意捏造事實的檢舉人予以懲處以防誣告；收保證金、限制資格或強迫對質都會打擊檢舉意願。"],"pos":0.91051,"w":1},{"id":"E-614","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"","stem":"因檢舉同一貪污瀆職案件，最高獎金以新臺幣多少元為限？","opts":["100 萬","300 萬","500 萬","1000 萬"],"ans":4,"exp":["📝 解析：依獎勵保護檢舉貪污瀆職辦法，檢舉同一貪污瀆職案件的獎金最高以新台幣1,000萬元為限。"],"pos":0.91128,"w":1},{"id":"E-615","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"","stem":"檢舉人應以何種方式檢舉貪污瀆職始能核給獎金？","opts":["匿名","委託配偶檢舉","以真實姓名檢舉","以他人名義檢舉"],"ans":3,"exp":["📝 解析：依獎勵保護檢舉貪污瀆職辦法，須以真實姓名檢舉（可受身分保密），匿名或以他人名義檢舉都不給獎金。"],"pos":0.91206,"w":1},{"id":"E-616","s":"all","ch":"道德｜其他","star":1,"n":1,"refs":"","tag":"","stem":"受理檢舉機關之承辦公務員，洩漏貪污瀆職案件檢舉人之資料，最可能觸犯何罪？","opts":["背信罪","洩漏國防以外秘密罪","公務員登載不實罪","湮滅刑事證據罪"],"ans":2,"exp":["📝 解析：檢舉人資料屬應秘密事項，承辦公務員洩漏可能構成刑法 §132 洩漏國防以外秘密罪。"],"pos":0.91284,"w":1},{"id":"M3-003","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"當金融市場管理的品質較佳時，企業發行的 金融產品成本會______，金融工具的流動性會______。","opts":["較低，較低","較高，較低","較低，較高","較高，較高"],"ans":3,"exp":["📝 解析：市場管理品質佳可降低資訊不對稱與交易風險，企業籌資成本因而降低，投資人參與意願提高，流動性也較高。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.91362,"w":1},{"id":"M3-006","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"在金融市場中主管機關訂定法律規範的目的在於：","opts":["增加政府的收入","促進金融市場健全發展與有效經營","增加金融機構的進入障礙","提高金融機構的經營成本"],"ans":2,"exp":["📝 解析：主管機關訂定法規是為維護市場秩序、保護投資人，促進金融市場健全發展與有效經營，而非增加收入或設障礙。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.9144,"w":1},{"id":"M3-008","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"依照國內金融監督管理制度的架構，主管證券相關事業的監理單位為：","opts":["銀行局","保險局","證券期貨局","檢查局"],"ans":3,"exp":["📝 解析：金管會證券期貨局主管證券、期貨及投信投顧事業；銀行局管銀行，保險局管保險，檢查局負責金融檢查。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.91518,"w":1},{"id":"M3-017","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"公司債在以下何種金融市場交易？","opts":["貨幣市場","同業拆款市場","資本市場","芝加哥商品市場"],"ans":3,"exp":["📝 解析：公司債期限多在一年以上，屬資本市場工具；貨幣市場與同業拆款市場則融通一年以內的短期資金。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.91595,"w":1},{"id":"M3-036","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"目前臺灣股市的交易方式以何者為主?","opts":["電腦輔助交易","電腦自動交易","人工喊價交易","場外交易"],"ans":2,"exp":["📝 解析：臺灣集中市場全面由電腦自動撮合，2020年起盤中更採逐筆交易，早已不用人工喊價。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.91673,"w":1},{"id":"M3-037","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"下列何者不是貨幣市場的信用工具？","opts":["商業本票","公司股票","可轉讓定期存單","銀行承兌匯票"],"ans":2,"exp":["📝 解析：商業本票、可轉讓定存單、銀行承兌匯票都是一年內的短期信用工具；股票無到期日，屬資本市場工具。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.91751,"w":1},{"id":"M3-038","s":"all","ch":"113 版才有的舊題（2026 年底前考試才需要）","star":1,"n":1,"refs":"","tag":"📜 113 版","stem":"下列何者不屬於衍生性金融商品？","opts":["股票選擇權","債券期貨","組合式股票基金","利率交換合約"],"ans":3,"exp":["📝 解析：股票選擇權、債券期貨、利率交換的價值皆衍生自標的資產；組合式股票基金是投資多檔股票基金的基金，不屬衍生性商品。","📜 這題只在 113 版題庫（2026 年 12 月 31 日前的考試）；2027 年起的 116 版已刪除。"],"pos":0.91829,"w":1},{"id":"M3-039","s":"all","ch":"113 版才有的舊題（2026 年底 function genSim(s) {
  const blocks = DATA.blocks[s], u = SIMU(s);
  const want = blocks.map(b => b[1] * u), slots = want.map(Math.floor);
  const left = Math.round(NQ(s) * u) - slots.reduce((a, b) => a + b, 0);
  want.map((w, i) => [w - slots[i], i]).sort((a, b) => b[0] - a[0]).slice(0, Math.max(0, left)).forEach(([, i]) => slots[i]++);

    let n = 0;
    const take = q => { picks.push(q); used.add(q.id); n++; };

    for (const x of cand) if (n < k && ok(x.q)) take(x.q);
  });

  const avg = s => mk[s] ? mk[s].reduce((a, b) => a + b, 0) / mk[s].length : null;
  const ms = SUBS.map(avg).filter(v => v != null);
  const parts = [['到今天為止的作業完成度', ti >= 0 ? pd / pm : null, 0.3, ti >= 0 ? `${PLAN[0][0]}～${PLAN[ti][0]} 的作業` : '10/1 才開始算'],
    ['高頻題熟練度', got / HQ.length, 0.4, `${HQ.length} 題高頻題中，上次答對 ${got} 題`],
    ['模擬考', ms.length ? Math.min(...ms) / 100 : null, 0.3, ms.length ? `各科最近 2 次平均：${SUBS.map(s => `${SHORT[s]} ${avg(s) == null ? '—' : Math.round(avg(s))}`).join('、')}（取較低的一科）` : '還沒考過']];

}

/* ---------- 分析 ---------- */
const KIND = pid => /^pred/.test(pid) ? '預測卷' : /^sim-/.test(pid) ? '仿真模擬考' : /^rand-/.test(pid) ? '隨機模擬考' : '歷屆原卷';
const chOf = q => q && (q.ch || (q.ref && ITEMS[q.ref] ? ITEMS[q.ref].ch : null));
const histItems = x => x.ids ? x.ids.map(id => ITEMS[id]) : (paperOf(x.pid) || {items: []}).items;
const histSubj = x => x.s || (x.pid.match(/^(?:rand|sim)-(\w+)$/) || [])[1] || (histItems(x).find(q => q && q.s) || {}).s;
const pct = (c, t) => t ? Math.round(c / t * 100) + '%' : '—';
const phi = z => 1 / (1 + Math.exp(-1.702 * z));
const isCalc = q => q.exp.some(e => /^[①②③④]/.test(e));

function anaData(s) {
  const N = NQ(s), u = SIMU(s), L = POOL[s], comp = ((DATA.sim || {})[s] || {}).comp || {};
  const src = {}, chm = {}, tq = {calc: {s: 0, n: 0}, idea: {s: 0, n: 0}}, cal = [];
  S.hist.forEach(x => {
    if (histSubj(x) !== s) return;
    const g = src[KIND(x.pid)] = src[KIND(x.pid)] || {c: 0, t: 0, sc: []};
    g.sc.push(x.score);
    if (x.est != null && x.ev === 3 && KIND(x.pid) === '仿真模擬考') cal.push((x.adj != null ? x.adj : x.score) - x.est);
    if (!x.r) return;
    histItems(x).forEach((q, i) => {
      if (!q || i >= x.r.length) return;
      const ok = x.r[i] === '1', ch = chOf(q);
      g.t++; if (ok) g.c++;
      if (ch) { const m = chm[ch] = chm[ch] || {c: 0, t: 0, s: 0, ns: 0}; m.t++; if (ok) m.c++; if (x.tm && x.tm[i]) { m.s += x.tm[i]; m.ns++; } }
      if (x.tm && x.tm[i] && q.exp) { const z = tq[isCalc(q) ? 'calc' : 'idea']; z.s += x.tm[i]; z.n++; }
    });
  });
  let pc = 0, pt = 0, n1 = 0, k1 = 0, nRec = 0;
  L.forEach(q => {
    const r = S.rec[q.id];
    if (!r) return;
    nRec++;
    const p = r.p || (r.m ? null : [r.c, r.w]);
    if (p) { pc += p[0]; pt += p[0] + p[1]; }
    if (r.c + r.w === 1) { k1++; if (r.c) n1++; }
  });
  if (pt) src['練習'] = {c: pc, t: pt, sc: []};
  let nf = 0, cf = 0, nw = 0;
  L.forEach(q => { const r = S.rec[q.id]; if (!r) return; if (r.f != null) { nf++; cf += r.f; } if (!r.w) nw++; });
  const ft = nf >= 20 ? (cf + 6) / (nf + 10) : (nw + 6) / (nRec + 10), nwr = (nw + 6) / (nRec + 10), an = 0.25 + 0.5 * (nwr - 0.25);
  let Wall = 0, Wdone = 0;
  const chs = DATA.blocks[s].map(([ch, k], idx) => {
    const Lc = L.filter(q => q.ch === ch);
    let W = 0, Wd = 0, Wr = 0, Wq = 0, undone = 0;
    Lc.forEach(q => {
      const w = q.sw || 0.005, r = S.rec[q.id];
      W += w;
      if (r) { Wd += w; if (r.last) Wr += w; Wq += w * ((r.c + 1) / (r.c + r.w + 2) + (r.last ? 1 : 0)) / 2; } else undone++;
    });
    Wall += W; Wdone += Wd;
    const m0 = Lc.length ? 2 * W / Lc.length : 0, cov = W ? Wd / W : 0;
    const acc0 = Wd + m0 ? (Wq + ft * m0) / (Wd + m0) : ft, mm = chm[ch], wm = 0;
    const acc = mm ? (acc0 + wm * mm.c / mm.t) / (1 + wm) : acc0;
    const p = (1 - u) * (cov * acc + (1 - cov) * an) + u * an;
    return {sec: chm[ch] && chm[ch].ns ? chm[ch].s / chm[ch].ns : null, ns: chm[ch] ? chm[ch].ns : 0, ch, k, idx, n: Lc.length, done: Lc.length - undone, acc: Wd ? Wr / Wd : null, p, loss: k * (1 - p) * 100 / N, m: chm[ch], po: (1 - u) * (cov * acc + (1 - cov) * an)};
  });
  const Eo = chs.reduce((a, c) => a + c.k * c.po, 0), E = chs.reduce((a, c) => a + c.k * c.p, 0), V = chs.reduce((a, c) => a + c.k * c.p * (1 - c.p), 0), need = Math.ceil(N * 0.7);
  const cat = (name, share, f) => {
    const Lq = L.filter(f), d = Lq.filter(q => S.rec[q.id]);
    return {name, share, n: Lq.length, done: d.length, right: d.filter(q => S.rec[q.id].last).length};
  };
  const cats = [cat('⭐ 高頻（考過 2 屆以上）', comp.hi, q => !q.old && q.n >= 2), cat('只考過 1 屆', comp.one, q => !q.old && q.n < 2),
                cat('📜 舊屆題', comp.old, q => q.old)];
  const calc = L.some(isCalc) ? [cat('計算題', null, isCalc), cat('觀念題', null, q => !isCalc(q))] : [];
  const rep = L.filter(q => { const r = S.rec[q.id]; return r && r.w >= 2 && !r.last; }).length;
  return {Eo, nf, an, nwr, tq, cal, pace: subjMin(s) * 60 / N, V, N, u, E, need, pass: nRec >= 60 ? phi((E - need + 0.5) / Math.sqrt(V || 1)) : null, ft, k1, n1, nRec, chs, cats, calc, src, rep,
          cov: Wall ? Wdone / Wall : 0, comp};
}

function anaList(s, k) {
  const L = POOL[s], sw = q => q.sw || 0, by = (a, b) => sw(b) - sw(a);
  if (k === 'w') return {list: L.filter(q => { const r = S.rec[q.id]; return r && r.w >= 2 && !r.last; }).sort(by), title: `${SHORT[s]}｜常錯題`};
  if (k === 'new') return {list: L.filter(q => !S.rec[q.id]).sort(by).slice(0, 40), title: `${SHORT[s]}｜最可能考、還沒做過`};
  const ch = DATA.blocks[s][+k][0], Lc = L.filter(q => q.ch === ch);
  const wrong = Lc.filter(q => S.rec[q.id] && !S.rec[q.id].last).sort(by), fresh = Lc.filter(q => !S.rec[q.id]).sort(by);
  return {list: wrong.concat(fresh).slice(0, 40), title: `${SHORT[s]}｜${ch} 弱點`};
}

function boostPw(q, ft) {
  const r = S.rec[q.id];
  if (!r) return 1 - ft;
  let pw = (r.w + 2 * (1 - ft)) / (r.c + r.w + 2);
  if (!r.last) pw = Math.max(pw, r.w >= 2 ? 0.75 : 0.6);
  else if (!r.w && r.c === 1) pw += 0.1 * Math.min(1, (Date.now() - (r.t || 0)) / 6048e5);
  return pw;
}
function boostList(s, n = 30) {
  const ft = anaData(s).ft, now = Date.now();
  const L = POOL[s].filter(q => q.ans != null).map(q => {
    const r = S.rec[q.id], v = (q.sw || 0.005) * boostPw(q, ft) * (r && now - (r.t || 0) < 72e5 ? 0.3 : 1);
    return {q, v, key: Math.pow(Math.random(), 1 / v)};
  }).sort((a, b) => b.v - a.v).slice(0, n * 3).sort((a, b) => b.key - a.key).slice(0, n);
  return {list: L.map(x => x.q), gain: L.reduce((a, x) => a + x.v, 0) * 100 / NQ(s)};
}

        return `<tr><td>${k}</td><td>${g.t || '—'}</td><td>${g.t ? pct(g.c, g.t) : '—'}</td><td>${g.sc.slice(0, 3).join('、') || '—'}</td></tr>`; }).join('') + '</table></div>';
  });
  h += '<div class="card mut">推估方法：做過的題用「上次對錯」和「歷次作答答對率」各半（只看上次會被重做灌高，只看歷次會被早期錯誤拖低），依考試機率加權；還沒做過的題和真考從沒出過的新題，用亂猜 25% 和你「從沒答錯過的題目比例」的中間值估。這套公式用兩個人共四科的真考成績校正過（四科平均誤差約 3 分），再算出整科分數與及格機率。這是方向不是保證；仿真模擬考的題目多半都練過，分數通常比真考高 5～20 分，不能直接當真考分數看。這次更新前做的模擬考只有分數、沒有逐題紀錄和作答時間；校準是比較每份仿真卷交卷前的推估和實際分數；練習的答對率也含更新前的模擬考作答。提分衝刺的「粗估值」＝每題真考出現機率 × 你答錯的機率加總，換算成分數：代表這份題目學會後，真考期望能多拿的分數。</div>';
  return h;
}

const MK = [null, ['😊', '確定'], ['😐', '不確定'], ['😣', '不會']];
const mkBar = m => `<div class="mk">${[1, 2, 3].map(k => `<button class="${m === k ? 'on' : ''}" data-act="mark" data-arg="${k}" title="${MK[k][1]}" aria-label="${MK[k][1]}">${MK[k][0]}</button>`).join('')}</div>`;
const mkTag = m => `<small>${m ? MK[m][0] : '&nbsp;'}</small>`;
function mkLine(L, ans, mk) {
  const g = [null, [0, 0], [0, 0], [0, 0]];
  L.forEach(q => { const m = (mk || {})[q.id], a = ans[q.id]; if (!m || a == null) return; g[m][0]++; if (isOk(q, a)) g[m][1]++; });
  if (!g[1][0] && !g[2][0] && !g[3][0]) return '';
  return `<p class="mut">${[1, 2, 3].filter(k => g[k][0]).map(k => `${MK[k][0]} ${MK[k][1]} ${g[k][0]} 題，答對 ${g[k][1]}`).join('　')}` +
    `${g[1][0] > g[1][1] ? `<br>⚠ 標「確定」卻答錯 ${g[1][0] - g[1][1]} 題：代表觀念記錯了，比不會的題更要優先看解析` : ''}</p>`;
}

/* ---------- 題目卡 ---------- */
function qCard(q, a, reveal, label) {
  const meta = label || (q.old ? `${q.id}　${q.star ? '⭐'.repeat(q.star) + '　' : ''}📜 舊題 出現 ${q.n} 屆　${esc(q.ch)}` : q.ch ? `${q.id}　${q.tag ? q.tag + '　' : ''}${esc(q.ch)}` : q.id);
  let h = `<div class="card"><div class="meta">${meta}</div><div class="stem">${esc(q.stem)}</div><div class="opts">`;
  const shown = reveal && a !== undefined;
  q.opts.forEach((o, k) => {
    const n = k + 1;
    let c = '';
    if (shown) { if (q.ans == null || n === q.ans) c = 'ok'; else if (n === a) c = 'bad'; }
    else if (a === n) c = 'sel';
    h += `<button class="opt ${c}" data-act="pick" data-arg="${n}" ${shown ? 'disabled' : ''}><b>(${n})</b> ${esc(o)}</button>`;
  });
  h += '</div>';
  if (shown) {
    const ok = a !== 0 && isOk(q, a);
    const tag = a === 0 ? '— 未作答' : ok ? '✔ 答對' : '✘ 答錯';
    h += `<div class="exp ${ok ? 'ok' : 'bad'}" id="exp"><div class="res">${tag}　正解 ${q.ans ? `(${q.ans}) ${esc(q.opts[q.ans - 1])}` : '送分題（任何答案都算對）'}</div>
      ${q.exp.map(e => `<p${e.startsWith('✔') ? ' class="fix"' : ''}>${esc(e)}</p>`).join('')}${q.refs ? `<p class="refs">歷屆出處：${esc(q.refs)}</p>` : ''}</div>`;
  }
  return h + '</div>';
}

/* ---------- 練習 ---------- */
function startSession(list, title, kind) {
  list = list.filter(Boolean);
  if (!list.length) { alert('這個條件下沒有題目'); return; }
  if (S.prefs.shuf) list = shuffle([...list]);
  sess = {list, i: 0, ans: {}, mk: {}, title, kind};
  saveSess();
  view = 'sess'; showQ(true);
}

function saveSess() {
  if (!sess) return;
  sess.t = Date.now();
  S.psess = {ids: sess.list.map(q => q.id), i: sess.i, ans: sess.ans, mk: sess.mk, title: sess.title, kind: sess.kind, t: sess.t};
  save();
}
function resumeSess() {
  const p = S.psess, list = p.ids.map(id => ITEMS[id]).filter(Boolean);
  if (!list.length) { S.psess = {t: Date.now()}; save(); home(); return; }
  sess = {list, i: Math.min(p.i, list.length - 1), ans: Object.assign({}, p.ans), mk: Object.assign({}, p.mk), title: p.title, kind: p.kind, t: p.t};
  view = 'sess'; showQ(true);
}
function sessCard() {
  const p = S.psess;
  if (!p || !p.ids) return '';
  return `<div class="card warn"><b>有沒做完的練習：${esc(p.title)}</b>
    <div class="mut">停在第 ${p.i + 1} / ${p.ids.length} 題，已作答 ${Object.keys(p.ans || {}).length} 題（開啟同步後，手機、電腦都能接著做）</div>
    <button class="primary" data-act="sresume">繼續作答</button><button data-act="sdrop">不做了</button></div>`;
}

function showQ(top) {
  const q = sess.list[sess.i], a = sess.ans[q.id];
  app.innerHTML = `<header class="bar"><button data-act="home">← 返回</button><span>${esc(sess.title)}<br>${sess.i + 1} / ${sess.list.length}</span>
    <button class="fav" data-act="fav">${S.fav[q.id] ? '★' : '☆'}</button></header><main>${qCard(q, a, true)}${mkBar(sess.mk[q.id])}
    <div class="nav"><button data-act="prev" ${sess.i === 0 ? 'disabled' : ''}>上一題</button>
    <button class="primary" data-act="next">${sess.i === sess.list.length - 1 ? '看結果' : '下一題'}</button></div>
    <button class="row" data-act="sgrid">📋 題號總覽（已答 ${Object.keys(sess.ans).length} / ${sess.list.length}，點題號可跳題）</button></main>`;
  if (top) window.scrollTo(0, 0);
  else { const e = document.getElementById('exp'); if (e) e.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }
}

function showSGrid() {
  view = 'sgrid';
  const L = sess.list, c = [0, 0, 0, 0];
  L.forEach(q => c[sess.mk[q.id] || 0]++);
  app.innerHTML = `<header class="bar"><button data-act="sback">← 回題目</button><span>${esc(sess.title)}<br>題號總覽</span><span></span></header><main>
    <div class="card"><div class="mut">點題號跳過去｜綠＝答對、紅＝答錯、藍框＝目前這題<br>😊 確定 ${c[1]}　😐 不確定 ${c[2]}　😣 不會 ${c[3]}　沒標 ${c[0]}</div>
    <div class="grid">${L.map((q, k) => { const a = sess.ans[q.id];
      return `<button class="${a == null ? '' : isOk(q, a) ? 'ok' : 'bad'} ${k === sess.i ? 'cur' : ''}" data-act="sgo" data-arg="${k}">${k + 1}${mkTag(sess.mk[q.id])}</button>`; }).join('')}</div></div></main>`;
  window.scrollTo(0, 0);
}

function summary() {
  view = 'summary';
  S.psess = {t: Date.now()}; save();
  const L = sess.list, done = L.filter(q => sess.ans[q.id] != null);
  const wrongs = done.filter(q => !isOk(q, sess.ans[q.id]));
  const right = done.length - wrongs.length;
  sess.wrongs = wrongs;
  app.innerHTML = `<header class="bar"><button data-act="home">← 返回</button><span>${esc(sess.title)}</span><span></span></header><main>
    <div class="card center"><div class="big">${right} / ${done.length}</div>
    <p>答對率 ${done.length ? Math.round(right / done.length * 100) : 0}%（共 ${L.length} 題，作答 ${done.length} 題）</p>
    ${mkLine(L, sess.ans, sess.mk)}
    ${wrongs.length ? `<button class="primary" data-act="redo">重做這次答錯的 ${wrongs.length} 題</button>` : ''}${L.some(q => sess.mk[q.id] >= 2) ? `<button data-act="smkredo">重做標 😐／😣 的題</button>` : ''}
    <button data-act="home">回首頁</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 模擬考 ---------- */
function mockClock(id) {
  const c = S.cur;
  if (!c) return;
  const now = Date.now();
  c.tm = c.tm || {};
  if (c.tOn && c.tAt) c.tm[c.tOn] = (c.tm[c.tOn] || 0) + Math.min(now - c.tAt, 300000);
  c.tOn = id || null; c.tAt = now;
}
function showMock() {
  view = 'mock';
  mockClock(paperFromCur(S.cur).items[S.cur.i].id);
  const c = S.cur, p = paperFromCur(c), q = p.items[c.i];
  const n = Object.keys(c.ans).length;
  app.innerHTML = `<header class="bar"><button data-act="home">← 暫離</button><span>⏱ <b id="timer"></b><br>${c.i + 1} / ${p.items.length}（已答 ${n}）</span>
    <button class="primary" data-act="submit">交卷</button></header><main>${qCard(q, c.ans[q.id], false, `${p.name}　第 ${c.i + 1} 題`)}${mkBar((c.mk || {})[q.id])}
    <div class="nav"><button data-act="prev" ${c.i === 0 ? 'disabled' : ''}>上一題</button><button data-act="next" ${c.i === p.items.length - 1 ? 'disabled' : ''}>下一題</button></div>
    <div class="card"><div class="mut">題目總覽（藍色＝已作答；題號下面是你的標記 😊 確定　😐 不確定　😣 不會）</div><div class="grid">${p.items.map((x, k) =>
      `<button class="${c.ans[x.id] ? 'done' : ''} ${k === c.i ? 'cur' : ''}" data-act="mgo" data-arg="${k}">${k + 1}${mkTag((c.mk || {})[x.id])}</button>`).join('')}</div></div></main>`;
  tick();
  if (!timerId) timerId = setInterval(tick, 1000);
}

function tick() {
  if (!S.cur) return stopTimer();
  const left = S.cur.end - Date.now();
  if (left <= 0) { stopTimer(); alert('時間到，自動交卷'); submitMock(); return; }
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(left);
}

function submitMock() {
  stopTimer();
  const c = S.cur, p = paperFromCur(c);
  mockClock(null);
  const pre = /^sim-/.test(c.pid) ? anaData(c.pid.slice(4)) : null;
  let right = 0;
  const seen = [0, 0];
  p.items.forEach(q => {
    const a = c.ans[q.id], was = c.fresh != null && !!S.rec[q.id];
    if (a != null) record(q, a, false, 'm');
    else if (q.ans != null) S.wrong[q.id] = Date.now();
    const ok = a != null ? isOk(q, a) : q.ans == null;
    if (ok) right++;
    if (was) { seen[1]++; if (ok) seen[0]++; }
  });
  const score = score100(right, p.items.length);
  const m = S.mock[p.id] || {best: 0, times: 0};
  m.best = Math.max(m.best, score); m.times++; m.t = Date.now();
  S.mock[p.id] = m;
  const used = Math.round((Math.min(Date.now(), c.end) - c.start) / 60000);
  const rs = p.items.map(q => { const a = c.ans[q.id]; return a == null ? (q.ans == null ? '1' : '-') : isOk(q, a) ? '1' : '0'; }).join('');
  S.hist.unshift(Object.assign({pid: p.id, name: p.name, score, used, ts: Date.now(), date: new Date().toLocaleString('zh-TW', {hour12: false}),
    s: (p.items.find(q => q && q.s) || {}).s, r: rs, k: p.items.map(q => (c.mk || {})[q.id] || 0).join(''), tm: p.items.map(q => Math.round(((c.tm || {})[q.id] || 0) / 1000)), est: pre && pre.pass != null ? Math.round(pre.E / pre.N * 100) : null, ev: 3}, paperOf(p.id) ? {} : {ids: c.ids}, c.fresh != null ? {fresh: c.fresh} : {}));
  result = {p, ans: {...c.ans}, mk: {...(c.mk || {})}, score, right, used, i: 0, fresh: c.fresh, adj: simAdj(p, c.fresh, right, seen)};
  if (result.adj) S.hist[0].adj = result.adj.score;
  S.cur = null; save();
  showResult();
}

function simAdj(p, fresh, right, seen) {
  if (fresh == null || !seen[1]) return null;
  const s = (p.items.find(q => q && q.s) || {}).s, N = p.items.length;
  if (!s) return null;
  const want = Math.round(N * SIMU(s)), miss = want - fresh, ft = anaData(s).ft, acc = seen[0] / seen[1];
  if (miss <= 0 || acc <= ft) return null;
  return {want, miss, ft, score: Math.round((right - miss * (acc - ft)) / N * 100)};
}
function showResult() {
  view = 'result';
  const r = result;
  app.innerHTML = `<header class="bar"><button data-act="home">← 首頁</button><span>${r.p.name}</span><span></span></header><main>
    <div class="card center"><div class="big">${r.score} 分</div>
    <p class="${r.score >= 70 ? 'pass' : 'fail'}">${r.score >= 70 ? '及格 🎉' : '未達 70 分'}　答對 ${r.right} / ${r.p.items.length}　用時 ${r.used} 分鐘</p>${r.fresh != null ? `<p class="mut">本卷有 ${r.fresh} 題是你第一次做（模擬真考沒看過的題）</p>` : ''}${r.adj ? `<p class="mut">真考約 ${r.adj.want} 題是從沒出過的新題，這份只有 ${r.fresh} 題是你第一次做；差的 ${r.adj.miss} 題改用你第一次作答的答對率（${Math.round(r.adj.ft * 100)}%）估，換成真考約 <b>${r.adj.score} 分</b></p>` : ''}</div>
    <div class="card"><div class="mut">點題號看解析（綠＝對、紅＝錯或未答；題號下面是你的標記）</div>${mkLine(r.p.items, r.ans, r.mk)}<div class="grid">${r.p.items.map((q, k) => {
      const a = r.ans[q.id]; const ok = a != null ? isOk(q, a) : q.ans == null;
      return `<button class="${ok ? 'ok' : 'bad'}" data-act="rgo" data-arg="${k}">${k + 1}${mkTag((r.mk || {})[q.id])}</button>`; }).join('')}</div>
    <button class="primary" data-act="rwrong" style="margin-top:10px">只看錯題解析</button></div></main>`;
  window.scrollTo(0, 0);
}

function showReview() {
  view = 'review';
  const r = result, list = r.list, q = list[r.i];
  app.innerHTML = `<header class="bar"><button data-act="result">← 成績</button><span>${r.p.name}<br>檢討 ${r.i + 1} / ${list.length}</span><button class="fav" data-act="fav">${S.fav[q.id] ? '★' : '☆'}</button></header>
    <main>${qCard(q, r.ans[q.id] || 0, true)}<div class="nav"><button data-act="prev" ${r.i === 0 ? 'disabled' : ''}>上一題</button>
    <button data-act="next" ${r.i === list.length - 1 ? 'disabled' : ''}>下一題</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 事件 ---------- */
function curQ() {
  if (view === 'sess') return sess.list[sess.i];
  if (view === 'review') return result.list[result.i];
  if (view === 'mock') return paperFromCur(S.cur).items[S.cur.i];
}

function act(a, arg) {
  switch (a) {
    case 'tab': tab = arg; home(); break;
    case 'home': if (view === 'mock') { mockClock(null); save(); } home(); break;
    case 'subj': S.prefs.s = arg; save(); home(); break;
    case 'pday': setPlanDay(+arg); home(); window.scrollTo(0, 0); break;
    case 'pchk': S.plan.chk[arg] = S.plan.chk[arg] > 0 ? -Date.now() : Date.now(); save(); home(); break;
    case 'pstart': {
      const [di, ti] = arg.split('-').map(Number), t = PLAN[di][2][ti];
      const title = t.k === 'hi' || t.k === 'one' ? chName(t.s, t.c) : t.k === 'rev' ? `${SHORT[t.s]}｜⭐⭐ 以上` : '錯題本';
      startSession(taskList(t, di), `${PLAN[di][0]}｜${title}`, t.k === 'wrong' ? 'wrong' : 'hot'); break; }
    case 'start': startSession(hotList(S.prefs.s, arg).filter(q => S.prefs.mode === 'all' ? true :
        S.prefs.mode === 'new' ? !S.rec[q.id] : !S.rec[q.id] || !S.rec[q.id].last), arg || `${SHORT[S.prefs.s]}｜全部章節`, 'hot'); break;
    case 'wstart': startSession(wrongIds(arg).map(id => ITEMS[id]), arg === 'fav' ? '收藏題' : '錯題本', arg === 'fav' ? 'fav' : 'wrong'); break;
    case 'redo': startSession(sess.wrongs, '重做錯題', sess.kind); break;
    case 'fav': { const q = curQ(); if (S.fav[q.id]) { delete S.fav[q.id]; (S.favGone = S.favGone || {})[q.id] = Date.now(); } else S.fav[q.id] = Date.now(); save();
      view === 'review' ? showReview() : showQ(false); break; }
    case 'pick': {
      const n = +arg;
      if (view === 'sess') { const q = sess.list[sess.i]; if (sess.ans[q.id] != null) return;
        sess.ans[q.id] = n; record(q, n, sess.kind === 'wrong', 'p'); saveSess(); showQ(false); }
      else if (view === 'mock') { const q = curQ(); S.cur.ans[q.id] = n; save(); showMock(); }
      break; }
    case 'prev':
      if (view === 'sess' && sess.i > 0) { sess.i--; saveSess(); showQ(true); }
      else if (view === 'mock' && S.cur.i > 0) { S.cur.i--; save(); showMock(); }
      else if (view === 'review' && result.i > 0) { result.i--; showReview(); }
      break;
    case 'next':
      if (view === 'sess') { if (sess.i < sess.list.length - 1) { sess.i++; saveSess(); showQ(true); } else summary(); }
      else if (view === 'mock' && S.cur.i < paperFromCur(S.cur).items.length - 1) { S.cur.i++; save(); showMock(); }
      else if (view === 'review' && result.i < result.list.length - 1) { result.i++; showReview(); }
      break;
    case 'mstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const p = paperOf(arg);
      if (!confirm(`${p.name}\n限時 ${p.min} 分鐘${S.prefs.mshuf ? '、題目隨機順序' : ''}，按確定開始計時。`)) return;
      S.cur = {pid: p.id, ids: mockOrder(p.items.map(q => q.id)), name: p.name, min: p.min, ans: {}, i: 0, start: Date.now(), end: Date.now() + p.min * 60000}; save(); showMock(); break; }
    case 'sstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const min = subjMin(arg), name = `仿真模擬考 ${SHORT[arg]}`, g = genSim(arg);
      if (!confirm(`${name}\n限時 ${min} 分鐘${S.prefs.mshuf ? '、題目隨機順序' : ''}，按確定開始計時。\n（其中 ${g.fresh} 題是你還沒做過的）`)) return;
      S.cur = {pid: `sim-${arg}`, ids: mockOrder(g.ids), name, min, fresh: g.fresh, ans: {}, i: 0, start: Date.now(), end: Date.now() + min * 60000};
      save(); showMock(); break; }
    case 'bstart': { const B = boostList(arg);
      startSession(B.list, `${SHORT[arg]}｜提分衝刺（這份粗估值 ${B.gain.toFixed(1)} 分）`, 'hot'); break; }
    case 'astart': { const [s, k] = arg.split('|'), L = anaList(s, k);
      if (!L.list.length) { alert('這裡沒有需要加強的題目了 👍'); return; }
      startSession(L.list, L.title, 'hot'); break; }
    case 'resume': if (S.cur.end <= Date.now()) { alert('時間已到，自動交卷'); submitMock(); } else showMock(); break;
    case 'abandon': if (confirm('確定放棄這份模擬考？作答不會計分。')) { S.cur = null; save(); home(); } break;
    case 'mgo': S.cur.i = +arg; save(); showMock(); break;
    case 'submit': {
      const left = paperFromCur(S.cur).items.length - Object.keys(S.cur.ans).length;
      if (confirm(left ? `還有 ${left} 題沒作答，確定交卷？` : '確定交卷？')) submitMock(); break; }
    case 'result': showResult(); break;
    case 'rgo': result.list = result.p.items; result.i = +arg; showReview(); break;
    case 'rwrong': {
      result.list = result.p.items.filter(q => { const a = result.ans[q.id]; return !(a != null ? isOk(q, a) : q.ans == null); });
      if (!result.list.length) { alert('全對，沒有錯題！'); return; }
      result.i = 0; showReview(); break; }
    case 'reset': if (confirm('確定清除所有作答紀錄、錯題本、收藏與模擬考成績？')) {
      S = {rec: {}, wrong: {}, fav: {}, mock: {}, hist: [], cur: null, prefs: S.prefs, plan: {chk: {}, snap: {}}, resetAt: Date.now()}; save(); home(); } break;
    case 'syncset': { const t = (document.getElementById('synctoken') || {}).value; if (!t || !t.trim()) return;
      setSyncCfg({token: t.trim()}); syncErr = ''; try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {}
      home(); syncNow(true, 0).then(() => { if (syncErrKind === 'auth') { setSyncCfg({}); home(); } }); break; }
    case 'syncnow': syncNow(true, 0); home(); break;
    case 'synccopy': { const t = syncCfg().token;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('已複製金鑰，到另一台打開「紀錄」分頁貼上'), () => prompt('複製這組金鑰，貼到另一台', t)); break; }
    case 'mark': { const q = curQ(), m = view === 'mock' ? (S.cur.mk = S.cur.mk || {}) : sess.mk;
      if (m[q.id] === +arg) delete m[q.id]; else m[q.id] = +arg;
      if (view === 'mock') { save(); showMock(); } else { saveSess(); showQ(false); } break; }
    case 'sgrid': showSGrid(); break;
    case 'sback': view = 'sess'; showQ(true); break;
    case 'sgo': view = 'sess'; sess.i = +arg; saveSess(); showQ(true); break;
    case 'smkredo': startSession(sess.list.filter(q => sess.mk[q.id] >= 2), '重做標不確定／不會的題', sess.kind); break;
    case 'sresume': resumeSess(); break;
    case 'sdrop': if (confirm('不做這份練習了？（已作答的紀錄會保留）')) { S.psess = {t: Date.now()}; save(); home(); } break;
    case 'syncoff': if (confirm('這台裝置停止同步？（雲端和這台的進度都會保留）')) { setSyncCfg({}); home(); } break;
  }
}

app.addEventListener('click', e => {

  else if (e.key === 'ArrowLeft') act('prev');

/* ---------- 手機電腦同步（GitHub Gist） ---------- */
const SYNC_KEY = 'quizsync_v1', GIST_DESC = 'asd-quiz-sync', SYNC_FILE = KEY + '.json', DIRTY_KEY = 'quizsync_dirty_' + KEY;
// GitHub 每帳號每小時只能改 gist 100 次，兩個網站共用；上傳時間與暫停時間存在共用的 localStorage
const PUT_KEY = 'quizsync_lastput', HOLD_KEY = 'quizsync_hold', PUT_GAP = 90 * 1000, FLUSH_GAP = 15 * 1000, PULL_GAP = 60 * 1000;
let syncBusy = false, syncLast = 0, syncErr = '', syncErrKind = '', syncTimer = null, editVer = 0;
let gistChecked = 0, gistExtra = [], gistOwner = '';
function syncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }
function setSyncCfg(c) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) {} }
const lsNum = k => { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } };
const holdLeft = () => Math.max(0, lsNum(HOLD_KEY) - Date.now());
const putWait = gap => Math.max(holdLeft(), lsNum(PUT_KEY) + gap - Date.now());
function syncLater(ms) {
  clearTimeout(syncTimer);
  if (syncCfg().token) syncTimer = setTimeout(() => syncNow(false), Math.max(4000, ms));
}
function markDirty() {
  editVer++;
  try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {}
  syncLater(putWait(PUT_GAP));
}
function syncFail(kind, msg) { const e = new Error(msg); e.kind = kind; return e; }
async function gh(path, opt) {
  const r = await fetch('https://api.github.com' + path, Object.assign({cache: 'no-store'}, opt,
    {headers: {Authorization: 'Bearer ' + syncCfg().token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'}}));
  if (r.ok) return r.json();
  const h = k => r.headers.get(k), wait = +h('retry-after') || 0, msg = await r.text().catch(() => '');
  if ((r.status === 403 || r.status === 429) && (h('x-ratelimit-remaining') === '0' || wait || /rate limit/i.test(msg))) {
    const until = wait ? Date.now() + wait * 1000 : h('x-ratelimit-remaining') === '0' && +h('x-ratelimit-reset') ? +h('x-ratelimit-reset') * 1000 : Date.now() + 10 * 60 * 1000;
    try { localStorage.setItem(HOLD_KEY, String(until + 5000)); } catch (e) {}
    throw syncFail('hold', 'GitHub 暫停寫入');
  }
  if (r.status === 404 && /^\/gists\/\w+$/.test(path) && syncCfg().gist) throw syncFail('gone', '雲端同步檔不見了');
  if (r.status === 401) throw syncFail('auth', '金鑰無效或已過期，請重新產生');
  if (r.status === 403 || r.status === 404) throw syncFail('auth', '金鑰沒有 gist 權限：請用下面連結產生 ghp_ 開頭、有勾 gist 的金鑰');
  throw syncFail('net', `GitHub 回應錯誤 ${r.status}`);
}
// 同帳號若有多份同步檔（兩台同時第一次設定），一律用最早建立的那份，其他份的進度併進來
async function gistId() {
  const c = syncCfg();
  if (c.gist && Date.now() - gistChecked < 10 * 60 * 1000) return c.gist;
  const list = (await gh('/gists?per_page=100')).filter(x => x.description === GIST_DESC)
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  let g = list[0];
  if (!g) g = await gh('/gists', {method: 'POST', body: JSON.stringify({description: GIST_DESC, public: false,
    files: {'README.md': {content: '手機、電腦題庫進度同步用，請勿刪除'}}})});
  gistExtra = list.slice(1).map(x => x.id);
  if (c.gist && c.gist !== g.id && !gistExtra.includes(c.gist)) gistExtra.push(c.gist);
  gistChecked = Date.now();
  setSyncCfg(Object.assign(syncCfg(), {gist: g.id}));
  return g.id;
}
async function gistFile(g) {
  const f = g.files[SYNC_FILE];
  return f ? (f.truncated ? await (await fetch(f.raw_url, {cache: 'no-store'})).text() : f.content) : null;
}
function shareState(x) {
  return {rec: x.rec, wrong: x.wrong, gone: x.gone || {}, fav: x.fav, favGone: x.favGone || {}, mock: x.mock, hist: x.hist,
          plan: x.plan || {chk: {}, snap: {}}, psess: x.psess || null, resetAt: x.resetAt || 0};
}
function mergeState(L, R) {
  const cut = Math.max(L.resetAt || 0, R.resetAt || 0), ok = t => (t || 0) >= cut, each = (m, f) => Object.entries(m || {}).forEach(f);
  const rec = {};
  [L.rec, R.rec].forEach(m => each(m, ([id, r]) => { if (ok(r.t) && (!rec[id] || (r.t || 0) > (rec[id].t || 0))) rec[id] = r; }));
  const set = (a1, g1, a2, g2) => {
    const add = {}, gone = {};
    [a1, a2].forEach(m => each(m, ([k, t]) => { if (ok(t)) add[k] = Math.max(add[k] || 0, t); }));
    [g1, g2].forEach(m => each(m, ([k, t]) => { if (ok(t)) gone[k] = Math.max(gone[k] || 0, t); }));
    Object.keys(add).forEach(k => { if ((gone[k] || 0) >= add[k]) delete add[k]; });
    return [add, gone];
  };
  [L.wrong, L.gone] = set(L.wrong, L.gone, R.wrong, R.gone);
  [L.fav, L.favGone] = set(L.fav, L.favGone, R.fav, R.favGone);
  const mock = {};
  [L.mock, R.mock].forEach(m => each(m, ([id, x]) => {
    if (!ok(x.t)) return;
    const o = mock[id] || {best: 0, times: 0, t: 0};
    mock[id] = {best: Math.max(o.best, x.best), times: Math.max(o.times, x.times), t: Math.max(o.t || 0, x.t || 0)};
  }));
  const seen = new Set(), hist = [];
  (L.hist || []).concat(R.hist || []).forEach(x => {
    const k = `${x.pid}|${x.ts || x.date}|${x.score}`;
    if (ok(x.ts) && !seen.has(k)) { seen.add(k); hist.push(x); }
  });
  hist.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const lp = L.plan || {}, rp = R.plan || {}, chk = {}, snap = {}, snapT = {};
  [lp.chk, rp.chk].forEach(m => each(m, ([k, v]) => { if (ok(Math.abs(v)) && Math.abs(v) > Math.abs(chk[k] || 0)) chk[k] = v; }));
  new Set(Object.keys(lp.snap || {}).concat(Object.keys(rp.snap || {}))).forEach(k => {
    const a = (lp.snap || {})[k], b = (rp.snap || {})[k], ta = (lp.snapT || {})[k], tb = (rp.snapT || {})[k];
    const useB = b && (!a || (tb || Infinity) < (ta || Infinity)), t = useB ? tb : ta;
    if (t && t < cut) return;
    snap[k] = useB ? b : a;
    if (t) snapT[k] = t;
  });
  const open = {};
  [lp.open, rp.open].forEach(m => each(m, ([k, t]) => { if (ok(t)) open[k] = Math.min(open[k] || Infinity, t); }));
  const psess = [L.psess, R.psess].filter(p => p && ok(p.t)).sort((a, b) => b.t - a.t)[0] || null;
  const day = [lp.day, rp.day].filter(d => d && ok(d.t)).sort((a, b) => b.t - a.t)[0];
  Object.assign(L, {rec, mock, hist: hist.slice(0, 300), plan: Object.assign({chk, snap, snapT, open}, day ? {day} : {}), psess, resetAt: cut});
}
async function syncNow(rerender, gap = PUT_GAP) {
  if (!syncCfg().token || syncBusy) return;
  syncBusy = true;
  const v = editVer, before = JSON.stringify(shareState(S)), owner0 = gistOwner;
  let next = 0;
  try {
    let id = await gistId(), g;
    try { g = await gh('/gists/' + id); } catch (e) {
      if (e.kind !== 'gone') throw e;
      setSyncCfg(Object.assign(syncCfg(), {gist: ''})); gistChecked = 0;
      id = await gistId(); g = await gh('/gists/' + id);
    }
    gistOwner = (g.owner && g.owner.login) || gistOwner;
    for (const xid of gistExtra.splice(0)) {
      try {
        const xraw = await gistFile(await gh('/gists/' + xid));
        if (xraw) { mergeState(S, JSON.parse(xraw)); localStorage.setItem(DIRTY_KEY, '1'); }
      } catch (e) { if (e.kind !== 'gone') throw e; }
    }
    const raw = await gistFile(g);
    const R = raw ? JSON.parse(raw) : null;
    if (R) mergeState(S, R);
    fixMoved();
    save(true);
    if (view === 'sess' && sess && S.psess && S.psess.ids && S.psess.t > (sess.t || 0)) resumeSess();
    const body = JSON.stringify(shareState(S));
    if (R && body === raw) { if (editVer === v) localStorage.removeItem(DIRTY_KEY); }
    else if (!R || localStorage.getItem(DIRTY_KEY)) {
      next = putWait(gap);
      if (!next) {
        try { localStorage.setItem(PUT_KEY, String(Date.now())); } catch (e) {}
        await gh('/gists/' + id, {method: 'PATCH', body: JSON.stringify({files: {[SYNC_FILE]: {content: body}}})});
        if (editVer === v) localStorage.removeItem(DIRTY_KEY);
      }
    }
    syncLast = Date.now(); syncErr = ''; syncErrKind = '';
  } catch (e) {
    if (e.kind === 'hold') { syncErr = ''; syncErrKind = ''; next = holdLeft(); }
    else { syncErr = e.message || String(e); syncErrKind = e.kind || 'net'; }
  }
  syncBusy = false;
  if (view === 'home' && (gistOwner !== owner0 || JSON.stringify(shareState(S)) !== before)) home();
  else document.querySelectorAll('.syncbadge').forEach(el => { el.outerHTML = syncBadge(); });
  if (next) syncLater(next);
  else if (editVer !== v) syncLater(putWait(PUT_GAP));
}
const hhmm = t => new Date(t).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute: '2-digit'});
const syncTime = () => hhmm(syncLast);
function syncBadge() {
  if (!syncCfg().token) return '<div class="mut syncbadge">☁️ 手機、電腦進度同步：到「紀錄」分頁設定一次即可</div>';
  const pend = localStorage.getItem(DIRTY_KEY), hold = holdLeft();
  const s = syncBusy ? '同步中…' : syncErr ? `<span class="fail">同步失敗：${esc(syncErr)}</span>`
    : hold ? `⏳ GitHub 每小時寫入次數已滿，${hhmm(Date.now() + hold)} 後自動上傳（進度已存在這台，不會消失）`
    : !syncLast ? '等待同步' : pend ? `已同步（${syncTime()}），這台的新作答 2 分鐘內自動上傳；要換裝置請先按「立即同步」` : `已同步（${syncTime()}）`;
  return `<div class="mut syncbadge">☁️ ${s}</div>`;
}
function syncCard() {
  if (!syncCfg().token) return `<div class="card"><b>☁️ 手機、電腦進度同步</b>
    <div class="mut">設定一次後，網頁開著時每分鐘下載另一台的進度、做題時約每 1.5 分鐘自動上傳。理財規劃和內控兩個網站共用同一組金鑰，進度分開存。<br>
    ① 電腦登入 GitHub 後打開 <a href="https://github.com/settings/tokens/new?scopes=gist&description=quiz-sync" target="_blank" rel="noopener">這個連結</a>（已自動勾好 gist），「Expiration」選 90 days，拉到最下面按「Generate token」。<br>
    ② 複製 ghp_ 開頭的金鑰，貼到下面，按「開始同步」。<br>
    ③ 手機打開這一頁，貼上同一組金鑰（可以用 LINE 傳給自己）。</div>
    <input id="synctoken" type="password" autocomplete="off" placeholder="貼上 ghp_ 開頭的金鑰" style="width:100%;font:inherit;padding:8px;margin:8px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)">
    <button class="primary" data-act="syncset">開始同步</button>${syncErr ? `<div class="fail">${esc(syncErr)}</div>` : ''}</div>`;
  const who = gistOwner ? `<div class="mut">🔑 雲端帳號 <b>${esc(gistOwner)}</b>・同步檔 <b>${esc((syncCfg().gist || '').slice(0, 6))}</b>（手機和電腦這行要一模一樣，進度才會互通）</div>` : '';
  return `<div class="card"><b>☁️ 手機、電腦進度同步：已開啟</b>${syncBadge()}${who}
    <div class="mut">網頁開著時每分鐘下載另一台的進度；做題時約每 1.5 分鐘自動上傳，切到別的 App／分頁時也會上傳。<b>手機鎖螢幕後網頁會被暫停，換裝置前按「立即同步」最保險。</b></div>
    <button data-act="syncnow">立即同步</button><button data-act="synccopy">📋 複製金鑰（貼到另一台）</button><button data-act="syncoff">這台停止同步</button></div>`;
}
setInterval(() => { if (document.visibilityState === 'visible') syncNow(true); }, PULL_GAP);

const PAGE_VER = '1793033648';

}
