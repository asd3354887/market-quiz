pts":["商場守則","商場資訊","保險業相關自律規範","以上皆是"],"ans":3,"exp":["📝 解析：保險招攬廣告除遵守法令外，還須遵守保險公會訂定的招攬廣告等保險業自律規範。"],"pos":0.64202,"w":1},{"id":"E-485","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"下列有關金融從業人員從事保險招攬所用的文宣、廣告、簡介、商品說明書及建議書等文書，何者為是？","opts":["應標明所屬公司之名稱","內容應與保險公司報經主管機關審查通過之保險單條款、費率及要保書等文件相符","經所屬公司核可同意使用，其內容並應符合主管機關訂定之資訊揭露規範","以上皆是"],"ans":4,"exp":["📝 解析：招攬文書應標明所屬公司名稱、內容須與核准的保單條款、費率、要保書相符，並經公司核可且符合資訊揭露規範，三者皆是。"],"pos":0.6428,"w":1},{"id":"E-486","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬，主張損害補償原則，主要理由為何？","opts":["預防道德危險發生","預防損害發生","預防不當得利發生","以上皆是"],"ans":3,"exp":["📝 解析：損害補償原則讓被保險人只能回復到損失前的狀態，主要目的是防止因保險而不當得利。"],"pos":0.64358,"w":1},{"id":"E-008","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為客戶開戶時，下列敘述何者正確：","opts":["應確實徵信並了解客戶背景，對於不適合投資之客戶應予以拒絕","金融商品適合所有人士，只要有錢即可交易，所以不需了解客戶背景","期貨交易須先存入保證金，所以不需徵信並了解客戶背景","對於年收入達百萬的客戶，不需徵信並了解客戶背景"],"ans":1,"exp":["📝 解析：開戶應落實認識客戶與徵信，依財力及適合度評估，不適合者應拒絕；不因已繳保證金或收入高而免除。"],"pos":0.64436,"w":1},{"id":"E-009","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬證券期貨相關業務時，對於客戶折讓之要求，何者可以接受：","opts":["折讓至客戶本人帳戶","折讓至第三人帳戶","折讓至代理下單者之帳戶","不可削價競爭，故不可有折讓情事"],"ans":1,"exp":["📝 解析：手續費折讓只能退至客戶本人帳戶，不得匯入第三人或代理人帳戶，以防利益輸送與洗錢疑慮。"],"pos":0.64514,"w":1},{"id":"E-016","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商從事證券相關的金融業務廣告或公開舉辦投資理財活動，下列何者符合規定？","opts":["於廣告或活動資料中，僅揭示對公司本身有利之事項","利用傳播媒體從事金融商品販賣，私下自己卻反向操作","業務人員需盡量提供客戶完整且客觀的資訊，不得為了本身業績而作出傷害客戶的行為","直接推薦或勸誘客戶投資買賣個別金融商品"],"ans":3,"exp":["📝 解析：廣告與理財活動應提供完整客觀資訊，不得只揭示有利事項、私下反向操作或直接勸誘客戶買賣個別商品。"],"pos":0.64591,"w":1},{"id":"E-017","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員從事業務招攬，下列何者為錯誤的業務招攬行為?","opts":["不得對過去投資分析之績效作誇大不實之宣傳","任意提供主觀性之投資情報","對有價證券之募集，不得提供未來投資成果之預告","不得對不特定人以收取不相當之對價參加理財投資分析活動，以招攬客戶"],"ans":2,"exp":["📝 解析：業務人員不得任意提供主觀性投資情報招攬客戶；其餘三項都是正確的禁止規範。"],"pos":0.64669,"w":1},{"id":"E-018","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員辦理客戶開戶及徵信時，應該抱持何種態度？","opts":["由於客戶與自己存在親戚關係，所以審查過程可以盡量寬鬆","由於客戶與自己有過節，所以採取嚴格的態度","為了提高客戶投資的意願，因此，本身可以代替其填全部資料，以省去作業程序","以上皆非"],"ans":4,"exp":["📝 解析：開戶徵信應依規定一致審查，不因親疏或恩怨放寬或加嚴，也不得代客戶填寫資料，故以上皆非。"],"pos":0.64747,"w":1},{"id":"E-019","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員招攬業務時，應該如何做，才能提高本身的業績？","opts":["自己掏錢買禮物送給客戶","勤練話術，以博取客戶的信任","培養本身的專業，以專業與誠心來面對及服務客戶","提供上市上櫃公司內線消息給客戶"],"ans":3,"exp":["📝 解析：招攬應以專業與誠意服務客戶來累積業績；送禮屬不當利誘，提供內線消息更違反證交法 §157-1 內線交易禁止規定。"],"pos":0.64825,"w":1},{"id":"E-020","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"依證券交易法規定，證券商非加入同業公會不得開業，而加入證券商同業公會必須簽屬會員自律公約並承諾共同信守之。下列何者是屬於證券商會員應共同信守的基本要求？","opts":["不得有破壞同業共同利益之情事","不得有破壞同業信譽之情事","不得以不當之方法直接或間接阻礙其他會員之業務發展或參與公平之競爭","以上皆是"],"ans":4,"exp":["📝 解析：證券商同業公會會員自律公約要求會員不得破壞同業共同利益與信譽，也不得以不當方法阻礙其他會員業務或公平競爭，三項皆屬基本要求。"],"pos":0.64903,"w":1},{"id":"E-022","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商於開業前需加入證券商同業公會並簽署會員自律公約，下列何者是屬於證券商會員應共同信守的基本要求？","opts":["不得以不當之方法直接或間接阻礙其他會員之業務發展或參與公平之競爭","為取得競爭優勢，不擇手段向同業大量挖角","為爭取業績， 採取不合理、不正當之價格競爭行為","為顧及同業和諧，對同業之違規行為，即使知情，亦不應主動檢舉"],"ans":1,"exp":["📝 解析：自律公約要求公平競爭、不得以不當方法阻礙同業；不擇手段挖角、不合理削價競爭皆違反公約，知悉同業違規亦不應包庇。"],"pos":0.64981,"w":1},{"id":"E-024","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？","opts":["應依社會一般道德、誠實信用原則","應依保護投資人之精神","應維持公正之證券交易市場","以上皆是"],"ans":4,"exp":["📝 解析：依證券商廣告及營業活動規範，廣告招攬須遵守社會道德與誠信原則、保護投資人精神並維持公正市場，三者皆是。"],"pos":0.65058,"w":1},{"id":"E-025","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商從事廣告、業務招攬及營業促銷活動，應遵守下列何種原則？","opts":["所製作之廣告，應審慎考量廣告對於投資大眾之影響，以免誤導投資大眾之判斷","廣告行為應注意維持合理競爭秩序","對於上市或上櫃、興櫃個別企業營運情況介紹之廣告，應避免過度或任意作主觀上之推斷","以上皆是"],"ans":4,"exp":["📝 解析：廣告須審慎考量對投資大眾的影響以免誤導、維持合理競爭秩序，介紹上市櫃或興櫃公司時避免主觀推斷，三項皆屬應守原則。"],"pos":0.65136,"w":1},{"id":"E-026","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？","opts":["違背或抵觸證券法規或損害證券業信譽之廣告","冒用或使用類似大眾所熟悉之他人名號以混淆投資人","在法令規定之下，以誠實信用原則，忠實告知客戶相關商品的內容","隱匿重要事實，或其他誇大、偏頗之情事，致有誤導或欺罔投資大眾之虞"],"ans":3,"exp":["📝 解析：在法令範圍內以誠信原則忠實告知商品內容才是正確作法；違反法規、冒用他人名號、隱匿或誇大誤導都是廣告禁止事項。"],"pos":0.65214,"w":1},{"id":"E-027","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？","opts":["對個別證券提供上漲或下跌的預示或保證投資利益","截取報章雜誌不實之報導作為廣告內容","以獲利或投資績效為廣告者，未同時報導其風險，以作為平衡報導","以上皆是"],"ans":4,"exp":["📝 解析：對個別證券預示漲跌或保證獲利、引用不實報導、只講獲利績效不揭露風險，皆屬證券商廣告規範禁止事項。"],"pos":0.65292,"w":1},{"id":"E-028","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商及其業務人員從事有關投資型金融商品之廣告，下列敘述何者正確?","opts":["廣告中得以獲利為廣告，只要有事實或理論根據，不須同時報導其風險","未經主管機關核定的金融商品，可先行從事廣告活動測試市場","平面廣告應揭示警語，有聲廣告應以影像或聲音揭示警語","以上皆非"],"ans":3,"exp":["📝 解析：投資型商品廣告須揭示警語，平面以文字、有聲廣告以影像或聲音揭示；以獲利為廣告須同時揭露風險，未經核定之商品也不得先行廣告。"],"pos":0.6537,"w":1},{"id":"E-029","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種行為？","opts":["違背或牴觸證券法規","藉主管機關核准，作為保證獲利之宣傳","為競爭目的，散布損害他人營業信譽之廣告","以上皆是"],"ans":4,"exp":["📝 解析：違背證券法規、藉主管機關核准作保證獲利宣傳、為競爭散布損害他人信譽之廣告，皆為證券商廣告規範所禁止。"],"pos":0.65447,"w":1},{"id":"E-030","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員使用個人部落格或網站聊天室等相關網站進行與營業活動相關之行為，證券商的態度應該如何？","opts":["公司應負監督管理之責","公司不應干涉業務人員之個人行為","公司對業務人員個人行為不必負任何責任","公司應委託徵信公司偷偷監視"],"ans":1,"exp":["📝 解析：業務人員透過部落格、聊天室從事與營業相關之行為仍屬執行業務，證券商應負監督管理責任，不能放任，也不應以違法方式偷偷監視。"],"pos":0.65525,"w":1},{"id":"E-105","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受託買賣時應依下列何者確實迅速執行：","opts":["依客戶全年貢獻額之多寡為執行優先順序","依客戶委託時間之先後為執行優先順序","依客戶交易金額之大小為執行優先順序","以現場客戶為優先，餘依委託時間之先後為執行優先順序"],"ans":2,"exp":["📝 解析：受託買賣應依委託時間先後確實迅速執行，不得依客戶貢獻度、交易金額或是否在現場而有差別待遇。"],"pos":0.65603,"w":1},{"id":"E-112","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員從事法令規定證券業務所為之行為， 下列敘述何者為正確？","opts":["證券商之業務人員所為之行為屬於該業務人員個人之行為，與證券商無關","證券商之業務人員所為之行為不屬於該證券商授權範圍內之行為","證券商之業務人員所為之行為，視為該證券商授權範圍內之行為","證券商之業務人員所為之行為是否為該證券商授權範圍，應由法院判定"],"ans":3,"exp":["📝 解析：依證券商負責人與業務人員管理規則，業務人員從事法定證券業務之行為，視為該證券商授權範圍內之行為，證券商須負責。"],"pos":0.65681,"w":1},{"id":"E-113","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"關於證券商及其業務人員從事證券業務之行為，下列何者為正確？","opts":["為提供客戶完整之服務，替委任人客戶保管印鑑與存摺","同意他人使用第三者之名義執行業務","與委任人客戶為投資金融商品收益共享或損失分擔之約定","以上皆非"],"ans":4,"exp":["📝 解析：代客保管印鑑存摺、同意他人以第三者名義執行業務、與客戶約定收益共享損失分擔，皆為證券商負責人與業務人員管理規則禁止行為，故皆非。"],"pos":0.65759,"w":1},{"id":"E-114","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"關於證券商及其業務人員從事證券業務之行為，下列何者為正確？","opts":["與委任人客戶為投資商品標的收益共享或損失分擔之約定","以真實姓名為客戶提供市場分析資訊","與委任人客戶有金錢借貸的來往","反向買賣其推介予客戶之金融商品"],"ans":2,"exp":["📝 解析：以真實姓名為客戶提供市場分析資訊是正確作法；收益共享損失分擔、與客戶金錢借貸、反向買賣推介商品皆被禁止。"],"pos":0.65837,"w":1},{"id":"E-115","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商受託買賣非集中交易市場且具衍生性商品性質之外國有價證券時，應確認及注意何種事項？","opts":["應了解委託人客戶之所得與資金來源、風險偏好及投資目的與需求等，以確認其足以承擔該商品之相關風險","不得受理非專業投資人委託買賣超過其適合等級之商品","考量商品之特性、保本程度、商品設計之複雜度、投資地區市場風險、及商品期限等事項，將商品至少分為三個風險等級","以上皆是"],"ans":4,"exp":["📝 解析：受託買賣具衍生性質之外國有價證券須瞭解客戶、將商品至少分三個風險等級，且不得受理非專業投資人買賣超過其適合等級之商品，三者皆是。"],"pos":0.65914,"w":1},{"id":"E-116","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商經營營業處所衍生性金融商品業務，為提昇交易業務品質，並確保交易相對人權益，下列證券商的行為何者為正確？","opts":["交易相對人應承擔各種風險，證券商提供各種等級之商品供客戶選擇","交易相對人自行決定及承擔風險，不必預告商品之風險","應依據個別衍生性金融商品交易之風險特性、設計複雜度及期限等因素，評定其風險等級","各種客戶皆可為交易相對人，開完戶即可提供衍生性金融商品供客戶選擇"],"ans":3,"exp":["📝 解析：證券商應依商品風險特性、設計複雜度及期限等評定風險等級，並據以做適合度評估與風險預告；不分客戶任意提供商品屬違規。"],"pos":0.65992,"w":1},{"id":"E-117","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商經營營業處所衍生性金融商品交易業務，為提昇其交易業務品質，並確保交易相對人權益，下列證券商的行為何者為正確？","opts":["所有證券商從業人員皆可推薦衍生性金融商品給客戶","不得對其商品說明書等行銷文件誇大報酬或隱匿相關交易風險","隨時報告其交易帳戶的資產增減的狀態","不必對一般資深客戶進行評估"],"ans":2,"exp":["📝 解析：衍生性商品說明書等行銷文件不得誇大報酬或隱匿風險；推介人員須具資格，且對所有客戶都要做適合度評估。"],"pos":0.6607,"w":1},{"id":"E-118","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"依現行法令規定，證券商辦理財富管理業務，提供客戶執行資產配置之服務，是基於何種法律關係及基礎辦理此項業務？","opts":["以信託方式辦理","以相互信任方式辦理","完全依客戶指示方式辦理","任由業務人員自由決定方式辦理"],"ans":1,"exp":["📝 解析：依證券商辦理財富管理業務相關規定，證券商為客戶執行資產配置服務係以信託方式辦理，須兼營信託業務。"],"pos":0.66148,"w":1},{"id":"E-119","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券經紀商接受委託人客戶開戶及委託買賣有價證券，下列敘述何者為正確？","opts":["任何委託人客戶皆可接受其開戶並買賣有價證券","必須先與委託人客戶辦妥受託契約及開戶相關手續，才可接受其委託買賣有價證券","接受委託人客戶訂立委託契約及受託買賣，得由未登記合格之負責人、經理人及業務人員承辦之","可代替委託人客戶決定下單買賣有價證券"],"ans":2,"exp":["📝 解析：須先與客戶簽訂受託契約並辦妥開戶手續才能受託買賣；承辦人員須為登記合格人員，且不得代客戶決定買賣。"],"pos":0.66226,"w":1},{"id":"E-120","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商辦理客戶開戶買賣有價證券，要注意事項為何？","opts":["與客戶簽訂受託買賣有價證券契約並辦妥開戶手續","應指派專人作契約內容之說明及有關證券買賣程序之講解","對客戶辦理徵信並詳實評估客戶的投資能力","以上皆是"],"ans":4,"exp":["📝 解析：開戶須簽訂受託契約辦妥手續、指派專人說明契約與買賣程序，並辦理徵信評估投資能力，三者皆是。"],"pos":0.66304,"w":1},{"id":"E-174","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為提供投資人良好的服務，下列敘述何者有誤？","opts":["應瞭解並遵守相關法令之規定，不得有違反或幫助他人違反法令之行為","應確實掌握客戶之資力、投資經驗與目的，以提供適當之服務，謀求客戶之最大利益","應盡善良管理之責任及注意， 代客戶保管有價證券或其他資產","應妥慎保管客戶資料，禁止洩露機密資訊或有不當使用之情事"],"ans":3,"exp":["📝 解析：從業人員不得代客戶保管有價證券或其他資產，證券商負責人與業務人員管理規則明文禁止；守法、瞭解客戶、資料保密皆正確。"],"pos":0.66381,"w":1},{"id":"E-202","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員發現客戶的交易資料有異常時，應該如何處理？","opts":["為了避免上級責怪，自己私下改正","一方面告知主管，另一方面則與客戶做確認","與客戶確認即可","若不影響整體作業的流程，為了避免麻煩，可以忽略它"],"ans":2,"exp":["📝 解析：發現客戶交易資料異常應同時通報主管並向客戶確認，以便及時更正並留存紀錄；私下改正或忽略可能掩蓋錯帳甚至舞弊。"],"pos":0.66459,"w":1},{"id":"E-203","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"對於證券商之業務人員執行業務而言，下列敘述何者正確？","opts":["為了自己前途著想，可以把A 公司機密帶去 B 公司，以獲取更高的職位","只要不要太張揚，可以利用公司未公開的資訊，以家人的戶頭投資來獲利","若遇總體經濟環境不佳等因素，使得客戶資產的規模縮水，基於善良管理原則，仍要告知客戶","有時接受供應商的招待，也算是一種正常的交際活動"],"ans":3,"exp":["📝 解析：基於善良管理人注意義務，客戶資產因景氣等因素縮水仍應如實告知；帶走前公司機密、利用未公開資訊以家人帳戶獲利、接受供應商招待都違反職業道德。"],"pos":0.66537,"w":1},{"id":"E-204","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商辦理財富管理業務，對客戶之收費應如何處理？","opts":["列為公司機密","提供財富管理服務實際收取之手續費、推介銷售商品獲取之佣金及其他名義費用向客戶充分告知","將牌告之收費標準充分揭露","客戶有詢問時才告知大概情形"],"ans":2,"exp":["📝 解析：依證券商辦理財富管理業務相關規範，應將實際收取的手續費、推介商品獲取的佣金及其他名義費用向客戶充分告知，不能只揭露牌告或等客戶問才說。"],"pos":0.66615,"w":1},{"id":"E-205","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券經紀商接受客戶委託買賣有價證券，於成交後，證券業務人員應即時回報客戶， 作成買賣報告書交付客戶，每月編製對帳單分送客戶，其主要目的為：","opts":["增加公司員工的工作內容","創造社會的工作機會","確認交易及買賣委託之完成","維持與客戶的友好關係"],"ans":3,"exp":["📝 解析：即時回報、交付買賣報告書及每月寄送對帳單，目的在讓客戶確認交易及委託已完成並核對無誤，及早發現錯帳或盜賣。"],"pos":0.66693,"w":1},{"id":"E-269","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應忠實執行客戶之委託，下列敘述何者正確?","opts":["客戶的委託損及其權益，仍然忠實執行不用告知","A 客戶口頭表示想跟隨 B 客戶的買賣，即應確實代 A 跟單","未經確認客戶之委託內容即逕行代其買賣","確實明白客戶的指示內容才執行委託，避免犯錯"],"ans":4,"exp":["📝 解析：忠實執行委託的前提是確實明白客戶指示；委託損及客戶權益應告知，口頭跟單或未經確認逕行買賣都可能構成未經授權交易。"],"pos":0.6677,"w":1},{"id":"E-270","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於受託執行業務時，下列何者非禁止行為?","opts":["教育客戶利用電子系統買賣，以爭取買賣時間","如客戶業務繁忙，請其事先在委託書蓋章，再代理買賣","代客戶領取密碼","為節省時間，先替客戶買賣，結帳後再請客戶填寫買賣委託書"],"ans":1,"exp":["📝 解析：教客戶使用電子下單是正當服務；預蓋委託書再代為買賣、代領密碼、先交易後補委託書，都違反證券商負責人與業務人員管理規則的代客操作禁令。"],"pos":0.66848,"w":1},{"id":"E-271","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為能使客戶儘速交易，下列行為何者可接受?","opts":["可先行交易，開戶文件後補即可","事先告知客戶備妥開戶所需證明文件","接受未經授權之代理開戶","熟識的客戶免辦理開戶作業即可交易"],"ans":2,"exp":["📝 解析：事先請客戶備妥開戶文件可合法加速流程；先交易後補文件、受理未經授權的代理開戶、熟客免開戶，都違反開戶與身分確認規定。"],"pos":0.66926,"w":1},{"id":"E-274","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是證券商之業務人員執行業務公平對待客戶應秉持的原則？","opts":["優先考慮自己的業績","協助客戶炒作股價","應本誠實及信用原則","完全維護公司利益"],"ans":3,"exp":["📝 解析：證券商業務人員應本誠實及信用原則公平對待客戶；以自己業績或公司利益優先、協助炒作股價都違法或違反職業道德。"],"pos":0.67004,"w":1},{"id":"E-275","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"證券商辦理財富管理業務，下列敘述何者為正確？","opts":["係透過業務人員，依據客戶需求，提供資產配置或財務規劃等顧問諮詢或金融商品銷售業務，以及以信託方式為客戶進行財務規劃、執行或辦理資產配置","證券商經營財富管理業務應符合規定資格條件並經證券主管機關核准","證券商人員辦理財富管理業務，應具備財富管理業務人員之資格條件；如涉及其他金融特許事業之規範者，其人員之資格條件，應另依各業之規定辦理","以上皆是"],"ans":4,"exp":["📝 解析：依證券商辦理財富管理業務相關規範，財管業務內容如(1)所述、須符合資格並經主管機關核准、人員須具資格並依各業規定辦理，皆正確。"],"pos":0.67082,"w":1},{"id":"E-277","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商辦理財富管理業務推廣時，下列敘述何者為正確？","opts":["加強對客戶宣導金融常識，提升客戶風險辨識能力，俾利建立正確理財觀念","證券商宜採防止財富管理業務人員收受佣金回扣，或接受招待等不當利益之措施","證券商宜採防止財富管理業務人員未經客戶授權，擅自為客戶進行交易，或私自挪用客戶款項之措施","以上皆是"],"ans":4,"exp":["📝 解析：財管推廣應宣導金融常識提升客戶風險辨識能力、防止人員收受回扣招待、防止未經授權交易或挪用客戶款項，皆屬正確措施。"],"pos":0.6716,"w":1},{"id":"E-278","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"對於證券商之業務人員而言，下列敘述何者正確？","opts":["由於獲悉某上市公司內部未公開訊息，然受限於在證券商上班，因此，只能利用人頭戶來買賣該公司股票以獲取利益","對於客戶資產帳面價值的增減，為了不讓客戶壓力太大，善意的謊言是必要的","若客戶答應，除了公司契約外，私下亦可與客戶另訂一份","以上皆非"],"ans":4,"exp":["📝 解析：以人頭戶交易未公開消息違反證交法§157-1、對資產增減說謊違反誠信、私下與客戶另訂契約違反管理規則，三者皆錯，故以上皆非。"],"pos":0.67237,"w":1},{"id":"E-279","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？","opts":["辦理受託買賣有價證券時，有隱瞞、詐欺或其他足以致人誤信之行為","以他人或親屬名義供客戶申購、買賣有價證券","接受客戶委託買賣有價證券時， 同時以自己之計算為買入或賣出之相對行為","以上皆是"],"ans":4,"exp":["📝 解析：證券商負責人與業務人員管理規則明文禁止：隱瞞詐欺致人誤信、以他人或親屬名義供客戶買賣、受託時以自己計算為相對買賣，三者都不得為。題庫 PDF 印 (1)，但證基會 113.9.23 修正公告已改為 (4) 以上皆是，以公告為準。"],"pos":0.67315,"w":1},{"id":"E-280","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"一個具有誠信的證券商及其從業人員，其基本該遵守的行為規範為何？","opts":["服務誠信","財務與公司的紀錄誠信","善盡保密之責","以上皆是"],"ans":4,"exp":["📝 解析：具誠信的證券商應做到服務誠信、財務與公司紀錄誠信及善盡保密之責，三者都是基本行為規範。"],"pos":0.67393,"w":1},{"id":"E-281","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"對證券商及其業務人員而言，下列何者屬於「正當利益」？","opts":["佣金收入","私下收受一袋的黃金","私下收受供應商的回扣","與客戶間私下簽約的利益"],"ans":1,"exp":["📝 解析：佣金是依契約公開收取的正當業務收入；私下收受黃金、供應商回扣或與客戶私下簽約的利益都屬不當利益。"],"pos":0.67471,"w":1},{"id":"E-282","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"為促進證券業遵循法規及落實金融消費者保護，下列何者為證券業及其業務人員向客戶提供衍生性金融商品交易服務公平對待客戶應秉持之原則？","opts":["應以善良管理人之注意義務及忠實義務，本誠實信用原則為之","客戶為自己的親朋好友，因此釋放出未公開資訊供其投資參考","對於與法律相關的文件，為保護客戶予以銷毀及竄改","為服務及保護客戶，提供客戶經過美化的績效報告"],"ans":1,"exp":["📝 解析：依公平待客原則及證券商衍生性商品交易規範，應以善良管理人注意義務與忠實義務、本誠實信用原則服務客戶；洩漏未公開資訊、銷毀竄改文件、美化績效都違法。"],"pos":0.67549,"w":1},{"id":"E-283","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？","opts":["以職務上所知悉之消息，從事上市或上櫃有價證券買賣之交易活動","利用客戶名義或帳戶買賣有價證券","洩漏客戶委託事項及其他職務上所獲悉之秘密","以上皆是"],"ans":4,"exp":["📝 解析：依證券商負責人與業務人員管理規則，利用職務消息買賣上市櫃證券、利用客戶名義或帳戶買賣、洩漏客戶委託事項及職務秘密，均為禁止行為。"],"pos":0.67626,"w":1},{"id":"E-284","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員執行業務應本誠實及信用原則下列敘述，何者為正確？","opts":["考量客戶的身體不好，當管理資產發生減損時，選擇不告知","為了獲取更高利益，可以私下與客戶訂立契約","對客戶作贏利之保證或分享利益之證券買賣","受理辦妥受託契約之客戶買賣有價證券"],"ans":4,"exp":["📝 解析：受理已辦妥受託契約的客戶買賣是正常程序；隱瞞資產減損、私下另訂契約、對客戶保證獲利或分享利益，皆為管理規則禁止事項。"],"pos":0.67704,"w":1},{"id":"E-285","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？","opts":["依據法令規定執行業務","招攬、媒介、促銷未經核准之有價證券或其衍生性商品","依據客戶委託事項及條件，執行有價證券之買賣","受理客戶本人開戶"],"ans":2,"exp":["📝 解析：招攬、媒介、促銷未經核准的有價證券或其衍生性商品，違反證券商負責人與業務人員管理規則；其餘三項都是合法正常業務。"],"pos":0.67782,"w":1},{"id":"E-286","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？","opts":["挪用或代客戶保管有價證券、款項、印鑑或存摺","向不特定多數人推介買賣特定之股票","利用客戶名義或帳戶買賣有價證券","以上皆是"],"ans":4,"exp":["📝 解析：挪用或代保管客戶款券印鑑存摺、向不特定多數人推介買賣特定股票、利用客戶名義或帳戶買賣，皆為證券商負責人與業務人員管理規則的禁止行為。"],"pos":0.6786,"w":1},{"id":"E-297","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為正當行為？","opts":["利用本公司或個人名義與客戶間有款券借貸關係或挪用情事、為款券借貸之媒介","代理客戶保管存摺、印鑑或有價證券","未經核准，不得全權代理客戶買賣有價證券","利用為客戶操作金融商品之便，為自身利益作價"],"ans":3,"exp":["📝 解析：「未經核准不得全權代理客戶買賣」是正確的守法行為；與客戶款券借貸或媒介、代保管存摺印鑑、利用操作之便為自身作價都屬禁止行為。"],"pos":0.67938,"w":1},{"id":"E-347","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為公司內部人員執行證券期貨經紀業務時，為避免利益衝突：","opts":["應優先執行公司內部人員之委託","應依公司內部人員及客戶委託時間之先後順序執行","應依委託金額多寡決定執行順序","應由金融從業人員自行決定"],"ans":2,"exp":["📝 解析：受託買賣應依委託時間先後順序執行，不得讓公司內部人員插隊優先成交而犧牲客戶；依金額多寡或由從業人員自行決定順序也不公平。"],"pos":0.68016,"w":1},{"id":"E-425","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"當金融從業人員知悉客戶未經授權利用他人名義從事商品交易時：","opts":["應接受其委託並為其保守秘密","在客戶承諾補具授權書的情況下，先接受其委託進行交易","拒絕接受其委託進行交易","可有條件地接受其委託進行交易"],"ans":3,"exp":["📝 解析：客戶未經授權利用他人名義交易屬違法借名，可能涉及洗錢或操縱市場，應拒絕受託；保密配合、先做再補授權或有條件接受都不當。"],"pos":0.68093,"w":1},{"id":"E-435","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"有關證券商管理相關法令對保密及不得為之行為規範，誰應該遵守？","opts":["證券商之負責人","證券商之業務人員","證券商本身","以上皆是"],"ans":4,"exp":["📝 解析：證券商管理相關法令的保密及禁止行為規範，證券商本身、負責人及業務人員都必須遵守。"],"pos":0.68171,"w":1},{"id":"E-437","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"關於證券之從業人員職業道德行為之保密規範，下列敘述何者為非？","opts":["未經主管機關同意，不得對執行職務無關之人洩漏主管機關金融檢查報告","出席公司股東會領取該公司議事手冊或年報","不得洩漏或交付依洗錢防制法規定向法務部調查局申報疑似洗錢交易案件相關資料","證券商對於非應依法令所為之查詢，不得洩漏客戶委託事項及其他業務上所獲悉之秘密"],"ans":2,"exp":["📝 解析：出席股東會領取議事手冊或年報是股東正常權利，與保密規範無關；不洩漏金檢報告、依洗錢防制法申報的疑似洗錢資料及客戶委託事項才屬保密規範。"],"pos":0.68249,"w":1},{"id":"E-498","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人執行務應本誠實及信用原則，下列何者是其本於職業道德而不得有之行為？","opts":["約定與客戶共同承擔買賣有價證券之交易損失，而從事證券買賣","對於客戶買賣證券之委託成交立刻回報","客戶開戶時必須向客戶說明契約內容的重要事項","以公司及業務人員之名義接受客戶委託買賣證券"],"ans":1,"exp":["📝 解析：依證券商負責人與業務人員管理規則，業務人員不得與客戶約定分享利益或共同承擔損失；即時回報成交、開戶時說明契約重要事項都是應盡義務。"],"pos":0.68327,"w":1},{"id":"E-499","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為證券主管機關對於證券商負責人與業務人員管理的規範事項？","opts":["證券商之業務人員應參加證券主管機關或其指定機構辦理之職前訓練與在職訓練","禁止證券商負責人與業務人員利用職務之機會，從事虛偽、詐欺或其他足致他人誤信之活動","執行業務之人員應符合主管機關規定之資格條件","以上皆是"],"ans":4,"exp":["📝 解析：依證券商負責人與業務人員管理規則，業務人員須參加職前與在職訓練、符合資格條件，並禁止利用職務從事虛偽詐欺等行為，三者都是規範事項。"],"pos":0.68405,"w":1},{"id":"E-500","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"為促進證券業遵守法規及落實金融消費者保護，證券商業務人銷售衍生性金融商品不得有下列何者行為？","opts":["與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益","擅自修改或製作相關標準文件交付予客戶","擅自為客戶進行交易，或私自挪用客戶款項","以上皆是"],"ans":4,"exp":["📝 解析：銷售衍生性商品不得約定分享利益或承擔損失、收受不當利益，不得擅改或自製標準文件，也不得擅自交易或挪用客戶款項，三者皆禁止。"],"pos":0.68482,"w":1},{"id":"E-501","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是證券商訂定衍生性金融商品銷售人員之行為與操守準則應包含之事項?","opts":["不得與客戶約定投資收益分享或損失分攤之承諾","規範禁止收受或提供不當報酬或饋贈","不得以任何方式向客戶提供建議買賣訊息","以上皆是"],"ans":4,"exp":["📝 解析：證券商衍生性商品銷售人員行為與操守準則應納入禁止承諾收益分享或損失分攤、禁止收受或提供不當報酬饋贈、不得向客戶提供建議買賣訊息等事項。"],"pos":0.6856,"w":1},{"id":"E-502","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"為促進證券業遵循法規及落實金融消費者保護之公平對待客戶原則，證券商從事結構型商品之銷售或提供相關資訊及行銷文件不得有下列何種情形？","opts":["使人誤信能保證本金之安全或保證獲利","提供贈品或以其他利益勸誘他人購買結構型商品","誇大過去之業績或攻訐同業之陳述","以上皆是"],"ans":4,"exp":["📝 解析：依證券商公會結構型商品銷售自律規範，行銷文件不得使人誤信保本保獲利、不得以贈品或利益勸誘，也不得誇大業績或攻訐同業，三者皆禁止。"],"pos":0.68638,"w":1},{"id":"E-503","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是證券商及其從業人員執行業務關於職業道德的行為規範？","opts":["對客戶提供金融商品與服務應注意誠信與公平交易","保護並適當使用公司資產","執行業務必須遵循法令規章","以上皆是"],"ans":4,"exp":["📝 解析：證券商從業人員道德規範包含誠信公平對待客戶、保護並適當使用公司資產、依法令規章執行業務，三項都屬之。"],"pos":0.68716,"w":1},{"id":"E-507","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於證券商及其從業人員執行業務應遵守的執業道德規範？","opts":["忠實執行工作，並以事實為根據","以政府的法令及公司內部管理規章的規定為準則，嚴明紀律， 保守機密","公司與員工、員工與員工、公司與客戶、員工與客戶間互相尊重，相互配合","以上皆是"],"ans":4,"exp":["📝 解析：忠實執業並以事實為據、以法令及內規為準則嚴守紀律與機密、公司員工客戶間相互尊重配合，均屬證券商從業人員執業道德規範。"],"pos":0.68794,"w":1},{"id":"E-508","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之從業人員日常執行業務應該遵守何種規定？","opts":["遵守政府的相關法令規定","若遇到利益衝突事項，應主動向上級報告","遵守公司所制訂的內部管理規章制度","以上皆是"],"ans":4,"exp":["📝 解析：從業人員須遵守政府法令、公司內部管理規章，遇利益衝突應主動向上級報告，三者都是日常執業應遵守的規定。"],"pos":0.68872,"w":1},{"id":"E-511","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為確保證券商從業人員在公司遵守法令執行業務的作法？","opts":["設置法令遵循單位專責負責推動","對公司員工施以適當合宜的法規訓練","內部稽核單位將公司法令遵循制度執行情形列入查核","以上皆是"],"ans":4,"exp":["📝 解析：設置法令遵循單位、辦理法規訓練、由內部稽核查核法遵執行情形，都是證券商確保員工依法執業的內控作法。"],"pos":0.68949,"w":1},{"id":"E-575","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商接受法人、其他機構或特定自然人授權買賣有價證券，為避免交易紛爭及業務人員操縱舞弊，下列何者不是證券商應注意的事項?","opts":["應提供特別資訊與服務","應確保客戶委託係依公平及衡平方式予以執行","應注意依相關規定適當保存完善之執行委託紀錄及交易憑證","應確定經紀部門及自營部門間應有適當之防火牆"],"ans":1,"exp":["📝 解析：證券商應公平執行委託、保存委託紀錄與交易憑證、經紀與自營部門設防火牆；對特定客戶提供特別資訊與服務違反公平原則。"],"pos":0.69027,"w":1},{"id":"E-576","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"依證券交易法規定，證券商非加入證券商同業公會不得開業，而加入證券商同業公會必須簽署會員自律公約並承諾共同信守之。證券商經營有價證券經紀業務，下列何者不是應共同信守的基本要求 ?","opts":["不得散布不實資訊，誤導投資大眾","不得策動他人聯手炒作股票","不得從事非法之股票仲介交易","散播不實言論，中傷其他會員"],"ans":4,"exp":["📝 解析：(1)至(3)都是以「不得」表述的應信守要求；(4)寫成「散播不實言論中傷其他會員」，本身是違規行為而非應信守的要求。"],"pos":0.69105,"w":1},{"id":"E-579","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"依證券交易法規定，證券商非加入證券商同業公會不得開業，而加入證券商同業公會必須簽署會員自律公約並承諾共同信守之。證券商經營有價證券經紀業務，下列何者不是應共同信守的基本要求 ?","opts":["對客戶提供、揭露之資訊可依客戶之重要程度而有特殊不同之待遇","應主動發掘或舉發內部業務人員之違規事件﹔對同業之違規行為，若知情者，亦應主動檢舉","應盡協助維護市場交易秩序及防杜不法交易之義務","應落實洗錢防制注意事項及徵信制度"],"ans":1,"exp":["📝 解析：證券商對客戶提供或揭露資訊應公平一致，不得依客戶重要程度差別待遇，故(1)錯；主動檢舉違規、維護交易秩序、落實洗錢防制都是應信守要求。"],"pos":0.69183,"w":1},{"id":"E-581","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商業務人員辦理衍生性金融商品交易業務，於交易相對人要求確認其身分時，應如何處理 ?","opts":["請客戶自行打電話給公司確認","應配合出示身分證明文件或識別證件","立刻報警處理","不予理會，要辦不辦隨客戶便"],"ans":2,"exp":["📝 解析：交易相對人要求確認業務人員身分時，應主動出示身分證明或識別證件，以防冒名詐騙並保障雙方。"],"pos":0.69261,"w":1},{"id":"E-584","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商為證券市場的重要專業中介機構，是受高度監理的行業，基於公平、誠實、守信、透明原則從事證券商業活動。為落實誠信經營，並防範不誠信行為，下列何者屬於證券商規範從業人員於執行業務時應注意的事項 ?","opts":["禁止公司人員直接或間接提供、收受、承諾或要求不正當利益","應避免與涉有不誠信行為之代理商、供應商、客戶或其他商業往來對象從事商業交易","禁止提供或承諾任何疏通費","以上皆是"],"ans":4,"exp":["📝 解析：依證券商誠信經營守則相關規範，禁止提供收受不正當利益、避免與不誠信對象往來、禁止提供疏通費，三者皆是。"],"pos":0.69339,"w":1},{"id":"E-587","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是證券商之業務人員執行業務符合法令規定之行為 ?","opts":["與客戶約定替其操作股票，且每獲利達特定額度即可進行分潤","不代客戶保管存摺、印鑑、蓋妥章之空白取款條","辦理上市承銷案之詢價圈購配售作業，利用他人帳戶認購上開股票，並於上市首5 日賣出","為避免客戶發生違約交割，代為媒介他人借貸所需款項，以便交割"],"ans":2,"exp":["📝 解析：依證券商負責人與業務人員管理規則，業務人員不得代客保管存摺印鑑；約定分潤、利用他人帳戶認購承銷股、媒介借貸交割款都違法。"],"pos":0.69416,"w":1},{"id":"E-595","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員執行業務應本誠實及信用原則，下列何者不是其本於職業道德而不得有之行為 ?","opts":["知悉客戶有利用公開發行公司尚未公開而對其股票價格有重大影響之消息或有操縱市場行為之意圖，而拒絕接受委託買賣","辦理有價證券承銷業務之人員與發行公司或其相關人員間有獲取不當利益之約定","向客戶或不特定多數人提供某種有價證券將上漲或下跌之判斷","向不特定多數人推介買賣特定之股票"],"ans":1,"exp":["📝 解析：知悉客戶要利用內線或操縱市場而拒絕受託是正確行為；承銷人員收受不當利益、提供漲跌判斷勸誘、向不特定人推介個股都是管理規則禁止事項。"],"pos":0.69494,"w":1},{"id":"E-596","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商辦理基金銷售業務，為提升對基金投資人之服務並保障其權益，證券商及其基金銷售業務人員應有如何的自律規範 ?","opts":["應盡善良管理人之注意義務，本誠實信用原則，辦理基金銷售業務","應充分了解客戶，並評估確認客戶對基金產品之適合度","證券商辦理基金銷售業務之人員應具備規定之資格條件","以上皆是"],"ans":4,"exp":["📝 解析：證券商銷售基金應盡善良管理人注意義務、落實認識客戶與適合度評估，銷售人員須具備規定資格，三者皆是。"],"pos":0.69572,"w":1},{"id":"E-600","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商經營有價證券承銷、自行買賣、受託買賣等業務，應由何人執行 ?","opts":["公司一般職員","公司董事或監察人","依證券商負責人及業務人員管理規則規定登記合格之業務人員","以上人員皆可"],"ans":3,"exp":["📝 解析：依證券商負責人與業務人員管理規則，承銷、自營、經紀業務須由登記合格的業務人員執行，一般職員或董監事不能代替。"],"pos":0.6965,"w":1},{"id":"E-601","s":"all","ch":"道德｜證券商從業規範","star":1,"n":1,"refs":"","tag":"","stem":"證券商經營業務應以公平、合理之方式為之，不得以不合理之收費招攬或從事業務， 其收取費用應考量下列何種因素 :","opts":["應考量相關營運成本、交易風險、合理利潤及客戶總體貢獻度等因素","鑒於市場競爭激烈，為順利爭取到業務，不必多考慮公司的營運成本及獲利","應考量競爭同業收費情形，殺價跟進招攬客戶，爭取業務","任由證券商營業主管或營業人員自行決定"],"ans":1,"exp":["📝 解析：依證券商自律規範，收費應考量營運成本、交易風險、合理利潤與客戶總貢獻度，不得以不合理低價惡性競爭或任由個人決定。"],"pos":0.69728,"w":1},{"id":"E-074","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"一位投顧從業人員告訴投資人：「你應該買台鹽股票，這支股票保證六個月內給你 100 ％的報酬。」他違反了以下哪一原則？","opts":["禁止為獲利或損失負擔之保證","公平分配原則","忠實誠信原則","專業原則"],"ans":1,"exp":["📝 解析：證券投資顧問事業管理規則禁止對投資人保證獲利或負擔損失，宣稱保證六個月 100% 報酬即屬違反。"],"pos":0.69805,"w":1},{"id":"E-075","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"關於金融服務業從事投顧業務製發宣傳文件敘述，何者有誤？","opts":["不得保證獲利或負擔損失","以非向公會登記之名稱為之","不得藉卜筮或怪力亂神方式為之","不得擾亂交易市場秩序"],"ans":2,"exp":["📝 解析：投顧製發宣傳文件須使用向公會登記之名稱，以非登記名稱為之即屬違規；其餘三項都是正確的禁止事項。"],"pos":0.69883,"w":1},{"id":"E-076","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事投顧業務時舉辦投資說明會時，若發表證券市場之投資意見涉及何種事項時應同時說明研判依據？","opts":["市場分析","產業趨勢","行情研判","以上皆是"],"ans":4,"exp":["📝 解析：投顧於說明會發表市場分析、產業趨勢或行情研判等投資意見時，均應同時說明研判依據，三者皆是。"],"pos":0.69961,"w":1},{"id":"E-077","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於舉辦投顧業務投資分析活動時，可引用何者宣傳，保證推介投資標的獲利或承擔其損失？","opts":["感謝函","雜誌報導","推薦書","以上皆非"],"ans":4,"exp":["📝 解析：投顧不得藉任何方式保證推介標的獲利或承擔損失，感謝函、雜誌報導、推薦書都不能作為此類宣傳，故皆非。"],"pos":0.70039,"w":1},{"id":"E-078","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事投信業務者，廣告宣傳方式，包括下列何者？ (I) 投資說明書(II) 公開說明書(III) 傳單(IV) 電子郵件","opts":["I、II","II、III、IV","I、II、IV","I、 II、III、IV"],"ans":4,"exp":["📝 解析：依投信投顧公會廣告行為規範，以各種方式向大眾傳遞之資料皆屬廣告宣傳方式，投資說明書、公開說明書、傳單及電子郵件均包括在內。"],"pos":0.70117,"w":1},{"id":"E-079","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"以下金融從業人員從事投信投顧之業務推廣與招攬行為，哪一項是明顯地違反所謂 「公平競爭原則」？","opts":["提供客戶基金申購手續費優惠來促銷新基金","散佈同業之不實資料","提供客戶有關同業與自己公司類似產品及手續費或經理費費率差異比較表","以上皆是"],"ans":2,"exp":["📝 解析：散布同業不實資料屬詆毀同業，明顯違反公平競爭原則；手續費優惠與客觀的費率比較表則屬正當競爭。"],"pos":0.70195,"w":1},{"id":"E-080","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事投信投顧之業務推廣招攬行為，下列何者不需標示警語？","opts":["基金產品廣告","全權委託投資業務廣告","單純登載投資管理專門知識","以上皆非"],"ans":3,"exp":["📝 解析：單純登載投資管理專門知識不涉及特定商品推介，無須標示警語；基金產品與全權委託業務廣告都須揭示警語。"],"pos":0.70272,"w":1},{"id":"E-081","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是境外基金投資人須知第一部份基金專屬資訊應涵蓋內容？","opts":["基金運用狀況（如基金淨資產組成、最近十年度各年度基金報酬率、最近五年度各年度基金之費用率等）","基金基本資料（如基金名稱、基金成立日、基金型態、國內銷售基金級別等）","有關申購、買回及轉換境外基金之方式","投資人應負擔費用之項目及其計算方式（含經理費、保管費、反稀釋費用等）"],"ans":3,"exp":["📝 解析：申購、買回及轉換方式屬境外基金投資人須知第二部分的一般資訊；基金運用狀況、基本資料、投資人應負擔費用才是第一部分基金專屬資訊。"],"pos":0.7035,"w":1},{"id":"E-082","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"依境外基金投資人須知第二部分規定，投資人因境外基金之募集及銷售業務與境外基金總代理人或銷售機構發生爭議時得以下列何種方式尋求協助？","opts":["向金管會或中華民國證券投資信託暨顧問商業同業公會申訴","向證券投資人及期貨交易人保護中心申請調處","向財團法人金融消費評議中心申請評議","以上皆是"],"ans":4,"exp":["📝 解析：境外基金爭議可向金管會或投信投顧公會申訴、向投保中心申請調處，或依金融消費者保護法向金融消費評議中心申請評議，三者皆可。"],"pos":0.70428,"w":1},{"id":"E-083","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事投顧業務舉辦投資講習會，應遵守那些原則？","opts":["不提供涉及個股未來買賣價位研判","不散布誇大資料取信他人","不對不特定人涉及指數預期","以上皆是"],"ans":4,"exp":["📝 解析：投顧舉辦講習會不得提供個股未來買賣價位研判、不得散布誇大資料，也不得對不特定人涉及指數預期，三者皆須遵守。"],"pos":0.70506,"w":1},{"id":"E-084","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列哪些金融從業人員從事投信投顧之業務推廣與招攬行為是明顯地違反所謂「公開原則」？(I) 向客戶說明與分析產品特性與報酬率，但相關風險、提前贖回罰金及費用成本卻一概省略；(II) 向客戶說明與分析產品特性；(III) 向客戶說明與分析產品特性，並強調如投資該產品得享有稅負上優惠，卻不仔細說明是基於何種理由及內容，始得享有是項優惠。","opts":["I, II","II, III","I, III","I, II, III"],"ans":3,"exp":["📝 解析：(I) 省略風險、提前贖回罰金與費用，(III) 強調稅負優惠卻不說明依據，都隱匿重要資訊而違反公開原則；(II) 單純說明產品特性並未違反。"],"pos":0.70584,"w":1},{"id":"E-085","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"財神證券投資信託(股)公司發行之本國募集投資海外之證券投資信託基金，廣告宣傳可用下列何種方式？","opts":["刊登從成立以來的全部績效資料","宣稱該區域經濟穩定成長，是絕對安全、無風險的投資環境","預計年投資報酬率可以達 15%以上","預測新台幣未來還會貶值"],"ans":1,"exp":["📝 解析：刊登成立以來全部績效屬完整揭露，可作為廣告；宣稱絕對安全無風險、預估報酬率或預測匯率走勢都違反廣告規範。"],"pos":0.70661,"w":1},{"id":"E-086","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"欣欣證券投資信託(股)公司如擬於平面刊登廣告，其警語表示方式應注意以下哪幾點？","opts":["以粗體印刷顯著標示","不得小於廣告上其他部分之最小字體","一般人在快速閱覽相關廣告時，均顯而易見","以上皆是"],"ans":4,"exp":["📝 解析：平面廣告警語應以粗體顯著標示、字體不小於廣告其他部分最小字體，且讓一般人快速閱覽時顯而易見，三者皆是。"],"pos":0.70739,"w":1},{"id":"E-087","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列有關證券投資信託事業以基金績效和業績數字為廣告或促銷內容之敘述，何者為非？","opts":["保本型基金如須採用複雜計算機制者，可無須註明","任何基金績效及業績數字均需註明使用資料之來源和日期","不得為基金投資績效預測","成立滿三年的基金，應以最近三年全部績效為圖表或曲線表示"],"ans":1,"exp":["📝 解析：保本型基金若採複雜計算機制，更應註明計算方式，不能省略；註明資料來源日期、不得預測績效、滿三年以最近三年全部績效表示皆正確。"],"pos":0.70817,"w":1},{"id":"E-088","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"大大證券投資信託(股)公司擬企劃廣告活動，下列何者非可引用之資料來源？","opts":["財團法人中華民國證券暨期貨市場發展基金會評選之金彝獎","台北金融研究發展基金會評選之金鑽獎","嘉實資訊","網路部落格"],"ans":4,"exp":["📝 解析：廣告引用資料須為客觀公正來源，如證基會金彝獎、台北金融研究發展基金會金鑽獎或專業資訊公司；網路部落格不具客觀可信度。"],"pos":0.70895,"w":1},{"id":"E-089","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"有關會員及其銷售機構從事廣告及營業活動行為規範所稱之「廣告」，何項敘述不正確？","opts":["以促進業務為目的","發佈新聞稿","基金收益分配公告","運用傳播媒體為工具"],"ans":3,"exp":["📝 解析：廣告指以促進業務為目的、運用傳播媒體等工具傳遞資訊，發佈新聞稿也屬之；基金收益分配公告是依法辦理的公告，不屬廣告。"],"pos":0.70973,"w":1},{"id":"E-090","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為不當的私募基金業務行為？","opts":["向銀行業者進行私募","向一般投資人進行私募","不得進行一般型廣告","向金融控股公司進行私募"],"ans":2,"exp":["📝 解析：私募依證交法 §43-6 只能向銀行、金控等機構或符合條件之特定人為之，且不得為一般性廣告；向一般投資人私募即屬不當。"],"pos":0.71051,"w":1},{"id":"E-091","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是證券投信公司的基金銷售機構？","opts":["票券業","證券經紀商","人身保險業","銀行"],"ans":1,"exp":["📝 解析：投信基金可委由銀行、信託業、證券經紀商及人身保險業等擔任銷售機構；票券業不在得擔任基金銷售機構之列。"],"pos":0.71128,"w":1},{"id":"E-092","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"證券投資信託基金銷售機構的責任包括？","opts":["應充分知悉客戶之風險承受度","完成申購前交付簡式公開說明書","注意客戶疑似洗錢之行為","以上皆是"],"ans":4,"exp":["📝 解析：基金銷售機構須瞭解客戶風險承受度、申購前交付簡式公開說明書，並注意疑似洗錢交易，三者皆屬其責任。"],"pos":0.71206,"w":1},{"id":"E-093","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"何者非選擇基金公司的重要條件？","opts":["投資研究能力強","良好的聲譽與操守","經常於媒體曝光","基金績效佳"],"ans":3,"exp":["📝 解析：選擇基金公司應看投資研究能力、聲譽操守與績效表現；經常在媒體曝光與經營品質沒有必然關係。"],"pos":0.71284,"w":1},{"id":"E-103","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"曉華有一筆定存到期，想要運用從事期貨交易，但礙於常常出差無法注意行情變化， 金融從業人員可以：","opts":["建議她僅買選擇權，最多損失權利金","建議她授權給其他營業員代理下單交易","建議她找合法的期經公司代操","建議並介紹她授權給期貨作手"],"ans":3,"exp":["📝 解析：無暇盯盤者可委託合法期貨經理事業全權委託操作；交由營業員代為下單或地下作手代操皆違法，只買選擇權也未解決無法注意行情的問題。"],"pos":0.71362,"w":1},{"id":"E-109","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"喬大公司為做期貨避險，找上金融從業人員開戶買賣，下列何者為是：","opts":["法人不需徵信","因為期貨交易為保證金交易，不需徵信","不論證券或期貨等，業務員受託前應先對客戶辦理徵信，了解客戶背景","客戶交易目的為避險，就不需再徵信"],"ans":3,"exp":["📝 解析：不論證券或期貨、自然人或法人、避險或投機，受託前都應先辦理徵信以瞭解客戶背景與交易能力。"],"pos":0.7144,"w":1},{"id":"E-110","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"張三的客戶因期貨交易失利，決定全數出金，張三應如何交付客戶剩餘的權利金：","opts":["以轉帳方式撥款至與客戶書面約定之存款帳戶","以轉帳方式撥款至客戶來電時指示之存款帳戶","以現金方式請客戶親臨期貨商簽收確認","以支票禁背方式請客戶親臨期貨商簽收確認"],"ans":1,"exp":["📝 解析：期貨商出金應以轉帳撥入客戶書面約定之存款帳戶，不得依電話指示改匯或以現金、支票交付，避免冒領與糾紛。"],"pos":0.71518,"w":1},{"id":"E-165","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務，為期精確銷售或推介適合客戶之商品，應廣泛了解客戶之：","opts":["家庭背景","生涯規劃","風險偏好","以上皆是"],"ans":4,"exp":["📝 解析：辦理全權委託應廣泛瞭解客戶家庭背景、生涯規劃與風險偏好等，才能推介適合商品，三者皆是。"],"pos":0.71595,"w":1},{"id":"E-166","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務，下列何者行為是不被允許的？","opts":["從事足以損害委任人權益之交易","從事逾越委任人授權範圍之交易","違反契約、內部作業規範、內部控制等行為","以上皆是"],"ans":4,"exp":["📝 解析：全權委託不得從事損害委任人權益或逾越授權範圍之交易，也不得違反契約、內部作業規範與內控，三者皆禁止。"],"pos":0.71673,"w":1},{"id":"E-167","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列所述金融從業人員辦理全權委託業務應廣泛了解客戶之事項，何者有誤？","opts":["投資需求","投資經驗","是否提供餽贈","財務狀況"],"ans":3,"exp":["📝 解析：瞭解客戶應包含投資需求、投資經驗與財務狀況；客戶是否提供餽贈與適合度無關，收受餽贈反而是禁止行為。"],"pos":0.71751,"w":1},{"id":"E-171","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理全權委託業務，下列敘述何者為非？","opts":["應遵守相關法令規定","不可利用委任人之交易帳戶，為自己交易","可將委任操作契約，轉讓他人","不可將已成交之買賣委託，由委任人名義改為其他第三人"],"ans":3,"exp":["📝 解析：全權委託契約基於信任關係，不得將委任操作契約轉讓他人；其他三項都是正確規範。"],"pos":0.71829,"w":1},{"id":"E-175","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事全權委託投資業務，不得為下列何種行為？","opts":["直接或間接提供或接受金錢或其他利益","無故洩漏公司基金或全權委託帳戶之機密","使人誤信能保證本金之安全或保證獲利者","以上皆是"],"ans":4,"exp":["📝 解析：全權委託不得收受或提供不當利益、無故洩漏基金或帳戶機密，也不得使人誤信保證本金或獲利，三者皆禁止。"],"pos":0.71907,"w":1},{"id":"E-176","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事全權委託投資業務，如發現客戶（委任人）有下列何種情形時，應拒絕簽訂全權委託投資契約？","opts":["係未成年人未有法定代理人者","受破產之宣告未經復權者","係法人或其他機構，卻未能提出該法人或該機構出具之授權證明者","以上皆是"],"ans":4,"exp":["📝 解析：依全權委託投資業務相關規定，委任人為未成年人而無法定代理人、受破產宣告未復權，或法人未提出授權證明者，均應拒絕簽約。"],"pos":0.71984,"w":1},{"id":"E-177","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員欲從事全權委託投資業務者，於簽訂全權委託投資契約前，下列敘述何者為正確？","opts":["指派專人與客戶討論，充分瞭解其資力、投資經驗、投資目的或需求","向客戶告知相關法令限制並詳細說明全權委託投資之相關事項，並交付全權委託投資說明書","如擬從事證券相關商品交易，應再交付客戶全權委託期貨暨選擇權交易風險預告書","以上皆是"],"ans":4,"exp":["📝 解析：簽約前應指派專人瞭解客戶資力與目的、告知法令限制並交付全權委託投資說明書，從事期貨選擇權交易須另交風險預告書，三者皆是。"],"pos":0.72062,"w":1},{"id":"E-178","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"天心證券投資信託公司簽訂全權委託契約時，應於契約載明？","opts":["負有保密義務","盡善良管理人之注意義務","對委任事務之報告義務","以上皆是"],"ans":4,"exp":["📝 解析：全權委託契約應載明保密義務、善良管理人注意義務及委任事務報告義務，三者皆是。"],"pos":0.7214,"w":1},{"id":"E-195","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員向客戶進行顧問業務招攬行為時，下列敘述何者妥適?","opts":["提供精美贈品，勸誘客戶當場簽約及繳付顧問費用","應提供客戶合理之契約審閱期間","可向客戶提供金融商品明確之價位預測，以博取客戶之好感，有利於日後簽訂委任契約","以某位簽約客戶最近 1 星期內獲利20﹪之個案，作為宣傳之主要訴求"],"ans":2,"exp":["📝 解析：投顧招攬應給予客戶合理契約審閱期間；以贈品勸誘當場簽約、提供明確價位預測、以個案短期獲利作宣傳，均違反投顧招攬與廣告規範。"],"pos":0.72218,"w":1},{"id":"E-196","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業於接受客戶委任簽訂全權委託契約前，下列那一事項毋須先向客戶說明?","opts":["公司之背景","每一位交易決定人員之學經歷與操作績效","某位客戶控告公司不當運用其所存入之委任資金，一審判處公司勝訴，但客戶不服上訴，目前仍在法院審理中","金融商品於特定價位買賣保證獲利"],"ans":4,"exp":["📝 解析：簽約前應說明公司背景、交易決定人員學經歷與績效及重大訴訟等資訊；「特定價位保證獲利」本身是禁止的獲利保證，不是應說明事項。"],"pos":0.72296,"w":1},{"id":"E-197","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"某金融服務業甲之交易決定人員李經理，預計於農曆年後跳槽至乙公司任職，下列敍述何者正確?","opts":["李經理通知所有委任客戶，與甲公司辦理解約，並於過完年後委由乙公司全權處理交易事宜","李經理直接將所有委任客戶之帳務，轉交另一位交易決定人員吳經理繼續處理","甲公司事先告知委任客戶，並由委任客戶決定是否與甲公司解約，或同意委由其他交易決定人員繼續操作","李經理將所有委任客戶之留倉部位予以平倉，結算損益，並靜待委任客戶決定是否解約或同意委由其他交易決定人員繼續操作"],"ans":3,"exp":["📝 解析：全權委託契約是客戶與公司間的契約，交易決定人員異動應由公司事先告知，由客戶決定解約或同意換人操作；個人不得帶走客戶、擅自轉手或平倉。"],"pos":0.72374,"w":1},{"id":"E-235","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務，下列何者有助於避免糾紛之發生？","opts":["推廣文宣應清楚、公正及不誤導投資人","充分告知產品所涉風險之性質與內容","向投資人說明產品之可能最大損失","以上皆是"],"ans":4,"exp":["📝 解析：全權委託業務文宣應清楚公正不誤導、充分告知風險性質與內容並說明可能最大損失，三者都能減少日後糾紛。"],"pos":0.72451,"w":1},{"id":"E-236","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務，為避免糾紛，應遵守下列何種事項？","opts":["充分揭露商品所涉及風險之性質與內容","不得有誤導客戶之情事","提醒客戶於交易前應充分審度本身財務狀況及風險承受度，始決定是否進行投資","以上皆是"],"ans":4,"exp":["📝 解析：全權委託業務應充分揭露風險、不得誤導，並提醒客戶審度自身財務狀況與風險承受度再決定投資，三者都是避免糾紛的必要作為。"],"pos":0.72529,"w":1},{"id":"E-242","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員接受客戶委任，提供證券投資顧問服務前，應先向客戶揭露何種資訊， 並與客戶簽訂書面證券投資顧問契約，以確定雙方之權利義務?","opts":["過去業績","收費之基準及數額","介紹未經主管機關核備之投資商品","以上皆非"],"ans":2,"exp":["📝 解析：依證券投資顧問事業管理規則，提供顧問服務前應揭露收費基準及數額並簽訂書面契約；強調過去業績或介紹未經核備商品都不當。"],"pos":0.72607,"w":1},{"id":"E-243","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"投信事業從事基金管理業務，有何種告知客戶義務？","opts":["提供有關公司之充份資料， 包括公司及其分公司之營業地址、公司經營業務之種類與限制，以及代表公司執行業務並可能與客戶有所聯繫的人員之身分和職位","客戶得要求公司揭露其財務狀況，公司應提供可公開之財務報表資料，不得拒絕","向客戶揭露其收費之基準及數額，所有會影響對客戶的收費、相關費用或將費用調高之做法，應符合公平與誠信原則；調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報","以上皆是"],"ans":4,"exp":["📝 解析：投信應提供公司資料、應客戶要求提供可公開財報、揭露收費基準並以公平誠信方式調費且揭露於協議書與定期表件，三者都是告知義務。"],"pos":0.72685,"w":1},{"id":"E-244","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事全權委託投資業務，下列哪些事項必須告知客戶？","opts":["報酬與收費方式","如有從事證券相關商品交易，其交易風險、交易特性與法律限制","簽約後可要求解約之事由及期限","以上皆是"],"ans":4,"exp":["📝 解析：全權委託簽約前須告知報酬與收費方式、證券相關商品交易風險與法律限制，以及簽約後得解約的事由與期限，皆屬應告知事項。"],"pos":0.72763,"w":1},{"id":"E-245","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事基金管理業務，下列哪些事項必須告知客戶？","opts":["收費基準及數額","研究或分析報告與投資結果","公司經營業務之種類與限制","以上皆是"],"ans":4,"exp":["📝 解析：從事基金管理業務應告知收費基準及數額、研究或分析報告與投資結果、公司經營業務種類與限制，皆屬應告知事項。"],"pos":0.7284,"w":1},{"id":"E-246","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"發發投顧公司透過電腦選股每日提供前五大飆股名單給客戶而不告知任何理由或原因。發發公司有無違反告知義務？","opts":["有","無，因為報告只對特定人提供","無，因為系統經多年驗證，並非怪力亂神","無，因為涉及公司之智慧財產權，可不提供給客戶"],"ans":1,"exp":["📝 解析：投顧提供投資建議應有合理分析基礎並告知依據；只給飆股名單不說明理由即違反告知義務，與提供對象、系統驗證或智財權無關。"],"pos":0.72918,"w":1},{"id":"E-247","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"以下有關金融服務業從事投信業務對客戶收費資訊之陳述，何者有誤？","opts":["應向客戶揭露收費之基準及數額","所有會影響對客戶之收費或將調高之做法，都應符合公平誠信原則","向所有客戶收取的費用都必須一樣","調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報"],"ans":3,"exp":["📝 解析：收費應揭露基準與數額、調整須符合公平誠信並揭露彙報；但不同客戶可依契約或規模收取不同費用，「所有客戶費用必須一樣」是錯的。"],"pos":0.72996,"w":1},{"id":"E-248","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"購買基金之客戶要求投資信託公司揭露其財務狀況，公司人員應採取何者措施？","opts":["得拒絕提供任何資料","不得拒絕提供可公開之財務報表資料","公司人員視情況隨興提供資料","只提供口頭說明資料"],"ans":2,"exp":["📝 解析：客戶要求揭露財務狀況時，投信不得拒絕提供可公開的財務報表資料，也不能隨興或僅以口頭說明。"],"pos":0.73074,"w":1},{"id":"E-249","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"基金通路報酬之揭露原則為何？","opts":["依基金別揭露","依公司別揭露","依註冊地別揭露","不必揭露"],"ans":1,"exp":["📝 解析：依基金通路報酬揭露規範，銷售機構應以「基金別」揭露自各基金取得的通路報酬，讓投資人看出每檔基金的利益衝突程度。"],"pos":0.73152,"w":1},{"id":"E-250","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"基金通路報酬揭露內容之通知方式為？","opts":["公開網站","電子郵件","對帳單","以上皆可"],"ans":4,"exp":["📝 解析：通路報酬揭露內容可透過公開網站、電子郵件或對帳單等方式通知投資人，方式不限一種，故以上皆可。"],"pos":0.7323,"w":1},{"id":"E-324","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務應遵守事項，下列敘述何者為非？","opts":["得向顧客收受不當佣金、酬金","應避免不當銷售或推介之行為","不得向他人出售、洩漏客戶資料","應遵守相關法令規定"],"ans":1,"exp":["📝 解析：全權委託業務人員不得向顧客收受不當佣金、酬金；避免不當推介、不得洩漏客戶資料、遵守法令都是正確事項。"],"pos":0.73307,"w":1},{"id":"E-331","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"投信投顧從業人員為廣告、公開說明會及其他營業促銷活動時，不得有下列何種行為?","opts":["藉主管機關對某項產品或業務之核准，作為證實該申請事項或誤導投資人認為主管機關已保證投資價值或獲利之宣傳","提供贈品或其他利益以招攬客戶","對同業為攻訐之廣告","以上皆是"],"ans":4,"exp":["📝 解析：依投信投顧廣告及營業促銷規範，不得藉主管機關核准誤導為保證獲利、不得以贈品或其他利益招攬（法令許可者除外）、不得攻訐同業，皆禁止。"],"pos":0.73385,"w":1},{"id":"E-332","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"證券投信事業對於有業務往來的證券商，應採何種管理事項?","opts":["應簽訂書面約定，將退還手續費捐予慈善機構","定期對財務、業務及服務品質作評比","除退還的手續費之外，得接受證券商的其它利益","以上皆是"],"ans":2,"exp":["📝 解析：投信應定期評比往來證券商的財務、業務及服務品質；證券商退還的手續費應歸入基金資產，不得捐贈或另收受證券商其他利益。"],"pos":0.73463,"w":1},{"id":"E-333","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"依據忠實誠信原則，下列哪一項非投信投顧從業人員執行業務時應有的行為？","opts":["遵守契約規定","以善良管理人之注意義務本誠實信用原則執行業務","考慮客戶的財務狀況適度分散投資","依所有人的最佳利益行事，包含客戶、公司及股東"],"ans":4,"exp":["📝 解析：忠實誠信義務要求以客戶最佳利益優先；「依所有人最佳利益行事，包含公司及股東」會在衝突時犧牲客戶，不符原則。"],"pos":0.73541,"w":1},{"id":"E-336","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事投資顧問事業其從業人員應以善良管理人之注意處理受任事務，除應遵守主管機關發布之相關函令外，並應確實遵守何種事項？","opts":["不得收受委託者資金， 代理從事證券投資行為","除法令另有規定或委託者另有指示外，對因委任關係而得知委託者之財產狀況及其他之個別情況，應保守秘密，不得洩漏予任何第三人","不得另與委託者為證券投資收益共享、損失分擔之約定","以上皆是"],"ans":4,"exp":["📝 解析：依證券投資顧問事業管理規則，投顧不得收受委託者資金代為投資、應對客戶財產狀況保密、不得約定收益共享損失分擔，皆須遵守。"],"pos":0.73619,"w":1},{"id":"E-395","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務應遵守事項，下列敘述何者有誤？","opts":["應公正對待客戶避免糾紛之發生","應確實瞭解客戶之財務狀況","應確實瞭解客戶投資需求及承擔潛在損失的能力","可利用客戶資料為自己謀取利益"],"ans":4,"exp":["📝 解析：全權委託應公正對待客戶，並瞭解其財務狀況、投資需求與承擔損失能力；利用客戶資料替自己謀利違反忠實與保密義務。"],"pos":0.73696,"w":1},{"id":"E-396","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理全權委託業務，為避免利益衝突，應遵守下列何種事項？","opts":["不得與委任人有利益衝突之第三人從事全權委託業務，以及從事足以損害委任人權益之交易","可利用委任人之交易帳戶，為自己從事交易","可利用委任人之交易帳戶，為委任人以外之第三人從事交易","以上皆是"],"ans":1,"exp":["📝 解析：依全權委託投資業務相關規定，不得為與委任人有利益衝突的第三人從事全權委託或損害委任人權益的交易；利用委任人帳戶為自己或第三人交易都禁止。"],"pos":0.73774,"w":1},{"id":"E-397","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理全權委託業務，下列敘述何者有誤？","opts":["不得與客戶約定分享利益或共同承擔損失","不得利用客戶帳戶或名義為自己從事交易","不得利用他人或自己名義供客戶從事交易","得任意對外發表客戶資料"],"ans":4,"exp":["📝 解析：全權委託禁止與客戶約定分享利益或分擔損失、禁止借用客戶帳戶或供客戶借名交易；客戶資料應保密，不得任意對外發表。"],"pos":0.73852,"w":1},{"id":"E-398","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理全權委託業務，下列敘述何者正確？","opts":["應避免利益衝突","得與客戶約定分享利益","得對外任加討論客戶資料","得將已成交之買賣委託，由委任人名義改為其他第三人"],"ans":1,"exp":["📝 解析：全權委託應避免利益衝突；與客戶約定分享利益、對外討論客戶資料、將已成交委託改為第三人名義，都是法規禁止行為。"],"pos":0.7393,"w":1},{"id":"E-401","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不符合投信管理基金的利益衝突處理原則?","opts":["管理一個以上基金的經理人， 不得對同一支股票及具有股權性質之債券，有同時或同日作相反投資決定","公司進行自有資金交易時，應優先執行基金買賣，並以利於公司之成交價格分配予客戶","經手人員知悉公司管理基金或全權委託帳戶為同一種股票或其衍生性商品的交易時，不得於該買賣前後7 個營業日內進行個人交易","經手人員買入某種股票及具股權之衍生性商品須持有至少30 日"],"ans":2,"exp":["📝 解析：公司自有資金與基金同時交易時應以基金（客戶）利益優先，不得以有利於公司的成交價格分配給客戶，故(2)錯；其餘三項為投信經理守則的規定。"],"pos":0.74008,"w":1},{"id":"E-402","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"依據投信投顧公會會員自律公約，會員對其與客戶間或不同客戶之間的利益衝突情事，處理原則為?","opts":["應避免之","以口頭約定作為依據","以多數客戶之利益為依據","以損益標準作為處理原則"],"ans":1,"exp":["📝 解析：投信投顧公會會員自律公約規定，會員與客戶間或不同客戶間的利益衝突應避免之，而非以口頭約定、多數客戶利益或損益為處理依據。"],"pos":0.74086,"w":1},{"id":"E-403","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"依據投信投顧公會訂定之投資顧問從業人員行為準則規定，經手人員為本人帳戶投資何項商品，應事先以書面報經督察主管或所屬部門主管核准?","opts":["國內上市股票","國內上櫃公司股票","國內具股權性質之衍生性商品","以上皆是"],"ans":4,"exp":["📝 解析：依投資顧問從業人員行為準則，經手人員為本人帳戶投資國內上市、上櫃股票及具股權性質之衍生性商品，都應事先以書面報經督察主管或部門主管核准。"],"pos":0.74163,"w":1},{"id":"E-404","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"當一個基金經理人管理一個以上基金時，應遵守那些事項？","opts":["公司應建立「中央集中下單制度」","將投資決策及交易過程予以獨立","落實職能區隔之「中國牆」制度","以上皆是"],"ans":4,"exp":["📝 解析：經理人管理多檔基金時，公司應建立中央集中下單制度、使投資決策與交易過程分離，並以中國牆落實職能區隔，避免基金間不公平對待。"],"pos":0.74241,"w":1},{"id":"E-405","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"投資顧問事業從業人員行為準則針對經手人員及利害關係人帳戶往來有所規範。所謂的利害關係人不包括：","opts":["未成年子女","本人","配偶利用他人名義投資衍生性金融商品而間接受有利益者","以上皆非"],"ans":4,"exp":["📝 解析：利害關係人帳戶涵蓋本人、配偶、未成年子女，以及利用他人名義投資而直接或間接受有利益者，三項都包括在內，故選「以上皆非」。"],"pos":0.74319,"w":1},{"id":"E-406","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"林莉莉轉換生涯跑道，從銀行財務部主管轉任投信基金經理人，依據證券投資信託事業經理守則，就林莉莉的個人交易資料下列敘述何者為正確？","opts":["不用申報，因為是到職前所為的交易","股票交易不用申報","只有以自己名義進行之交易投資必須申報","以上皆非"],"ans":4,"exp":["📝 解析：依證券投資信託事業經理守則，經手人員到職後應申報本人及利害關係人（含配偶、未成年子女、借名者）的持股與交易，不因是到職前交易或股票交易而免申報。"],"pos":0.74397,"w":1},{"id":"E-407","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"發發公司向全權委託經理人張三表示，如果該公司的全權委託績效報酬三個月內成長兩成，將免費提供其使用在林口高爾夫球場的公司會員證為期一個月。三個月後發發公司的委託資金代操績效如期成長達到了兩成，張三應該：","opts":["不顧公司主管反對，仍執意接受該邀約","未向公司報告逕自接受該邀約","接受該邀約，因為這不是金錢餽贈","應拒絕，並依公司所訂規範辦理"],"ans":4,"exp":["📝 解析：會員證雖非現金，但以績效為條件收受客戶利益有利益衝突之虞，應拒絕並依公司規範辦理；未報告或不顧主管反對逕自接受都違規。"],"pos":0.74475,"w":1},{"id":"E-408","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"基金銷售時有關贈品之規範為何？","opts":["可以送贈品","不可以送贈品","可以送贈品但不能超過新台幣200 元","無規範"],"ans":2,"exp":["📝 解析：投信投顧公會「會員及其銷售機構從事廣告及營業活動行為規範」禁止以贈品、定存加碼等利益勸誘他人購買基金。新臺幣 200 元上限只適用於「不與申購結合」、鼓勵投資人索取基金資料的宣導贈品，不能作為銷售基金的贈品，所以 (3) 不對，(2) 正確。"],"pos":0.74553,"w":1},{"id":"E-409","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何種人員不得以特定身分取得初次上市之股票？","opts":["基金經理人","交易部主管","全權委託投資經理人","以上皆是"],"ans":4,"exp":["📝 解析：依投信經理守則，基金經理人、交易部門主管、全權委託投資經理人等經手人員，不得以特定人身分取得初次上市（櫃）股票，以防利益衝突。"],"pos":0.7463,"w":1},{"id":"E-410","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"圓滿投信招待光明證券新竹分公司人員五天四夜泰國之旅作為基金銷售目標達成之獎勵，請問是否可行？","opts":["可以接受，因為非金錢報酬","不能接受","經主管機關核准即可","向分公司主管報備即可"],"ans":2,"exp":["📝 解析：投信以出國旅遊招待銷售機構人員作為達標獎勵，屬不當利益輸送，會誘使銷售人員偏離客戶利益推介；非金錢報酬也不行，報備或核准亦無法合法化。"],"pos":0.74708,"w":1},{"id":"E-421","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業如經客戶同意以電子郵件方式寄送對帳單者：","opts":["應比照網路交易認證機制，須透過憑證機構之資料加密等功能，始得傳送予期貨交易人","經客戶同意，不需網路交易認證機制，只需有客戶電子郵件信箱即可寄送","電子郵件寄送方式，只要能取得客戶的電子郵件閱讀回條，即可不需網路交易認證機制","為預防電腦駭客取得客戶資料，不可以電子郵件方式寄送對帳單"],"ans":1,"exp":["📝 解析：以電子郵件寄送對帳單涉及客戶交易資料，期貨業相關規定要求比照網路交易認證機制，透過憑證機構加密等功能確保安全，不能只憑信箱或閱讀回條。"],"pos":0.74786,"w":1},{"id":"E-472","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"進行全權委託投資業務之金融從業人員得將客戶帳戶往來資料透露給誰？","opts":["同集團的投顧公司","人事部門主管","投信旗下基金的經理人","以上皆非"],"ans":4,"exp":["📝 解析：全權委託客戶的帳戶往來資料應保密，同集團投顧、人事主管或投信基金經理人都與該業務無關，均不得透露。"],"pos":0.74864,"w":1},{"id":"E-563","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"證券投信投顧公會會員自律公約，適用於：","opts":["投信投顧業務人員","投顧事業負責人","證券投資信託事業","以上皆是"],"ans":4,"exp":["📝 解析：投信投顧公會會員自律公約適用於會員公司（投信、投顧事業）及其負責人與業務人員，三者皆是。"],"pos":0.74942,"w":1},{"id":"E-566","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"投顧事業業務廣告如違反相關規範，投信投顧公會應進行查證，對於涉有違反規範之情事者將如何處理？","opts":["提證期局審議","提消保會議處","直接報金管會","提公會自律委員會審議"],"ans":4,"exp":["📝 解析：投信投顧業務廣告涉違規時，由投信投顧公會查證後提交公會自律委員會審議，屬業者自律機制。"],"pos":0.75019,"w":1},{"id":"E-568","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"以下哪一行為不違反投信投顧會員自律公約？","opts":["基金經理人接受客戶旅遊招待","證券分析人員根據未公開訊息做出投資建議","新進的全權委託經理人依據報載及從友人同事處所得訊息管理代操資金","以在投信投顧公會登記的名稱進行業務招攬，並提供公司經主管機關核准之營業執照字號"],"ans":4,"exp":["📝 解析：以公會登記名稱招攬並提供核准營業執照字號是合規作法；接受客戶招待、依未公開訊息建議、憑傳聞管理代操資金都違反自律公約。"],"pos":0.75097,"w":1},{"id":"E-569","s":"all","ch":"道德｜投信投顧與期貨規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不違反投信投顧公會會員自律公約？","opts":["向上市公司募集基金，並將經理之基金投資於該上市公司股票","不洩露所管理的基金或委任人委任事項的相關資訊","向上櫃公司募集基金，且承諾將該資金投資於該上櫃公司服票","在未經核准前，接受客戶預約認購基金"],"ans":2,"exp":["📝 解析：不洩露基金或委任事項資訊是自律公約要求的保密義務；向上市櫃公司募集並投資其股票有利益衝突，未經核准前預約認購亦違規。"],"pos":0.75175,"w":1},{"id":"E-061","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡業務代表推廣卡片時，應遵守下列何種事項？","opts":["注意服裝儀容","配帶名牌及名片且明確標示發卡機構名稱","應妥善保管申請人資料，不得挪作他用","以上皆是"],"ans":4,"exp":["📝 解析：信用卡推廣人員應注意服裝儀容、配戴標明發卡機構名稱之名牌與名片，並妥善保管申請人資料不得挪用，三者皆須遵守。"],"pos":0.75253,"w":1},{"id":"E-062","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"發卡機構之行銷人員從事下列行為何者不正確？","opts":["自行勾選未經客戶同意申請之卡片","確認客戶申請之卡片","確認客戶資料無誤才送件","確認客戶申請人本人身分，以免冒名申請"],"ans":1,"exp":["📝 解析：不得未經客戶同意自行勾選申請卡片；確認申請卡別、資料正確及申請人本人身分，是防止冒名申請的必要程序。"],"pos":0.75331,"w":1},{"id":"E-063","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"銀行辦理現金卡業務時，下列敘述那一項是正確的？","opts":["以卡辦卡","以名片辦卡","送贈品","審慎核給信用額度"],"ans":4,"exp":["📝 解析：現金卡應依申請人還款能力審慎核給信用額度；以卡辦卡、以名片辦卡及以贈品促銷均屬主管機關禁止的浮濫發卡行為。"],"pos":0.75409,"w":1},{"id":"E-067","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理授信案件時，應於何時辦理徵信？","opts":["視客戶交情而定","應於核貸前先辦理徵信","不需辦理徵信","視客戶是否提供酬謝金而定"],"ans":2,"exp":["📝 解析：授信應於核貸前完成徵信以評估還款能力；依交情、酬謝金決定或不徵信，都違反授信審慎原則，後者更涉收賄。"],"pos":0.75486,"w":1},{"id":"E-072","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"銀行受理開戶時，下列何者為非？","opts":["應核對開戶人確為本人","由開戶人依約定當面親自簽名或蓋章","留存開戶人身分證影本","自行勾選未經客戶同意申請之事項"],"ans":4,"exp":["📝 解析：開戶須核對本人、由本人親簽或蓋章並留存身分證明影本；自行勾選客戶未同意申請的事項屬違規行為。"],"pos":0.75564,"w":1},{"id":"E-122","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？","opts":["應依主管口頭指示辦理","應依業務績效考量辦理","應依與客戶簽訂契約之本旨辦理","應依公司之最大利益辦理"],"ans":3,"exp":["📝 解析：以契約受託執行業務應依契約本旨辦理，不能以主管口頭指示、業績或公司利益凌駕契約約定。"],"pos":0.75642,"w":1},{"id":"E-123","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？","opts":["應依契約所定運用範圍執行投資或交易","雖非為契約約定投資範圍，應爭取市場先機先行投資","如違反契約約定，應經客戶口頭同意才可執行","如逾越契約運用範圍得於事後通知客戶"],"ans":1,"exp":["📝 解析：應依契約所定運用範圍執行投資或交易；逾越範圍即屬違約，不能以搶先機、口頭同意或事後通知補救。"],"pos":0.7572,"w":1},{"id":"E-124","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員與客戶訂定契約內容，以下何者為是？","opts":["無論是否違法，應依客戶需求訂定契約","契約內容不得違反主管機關業務相關規定","為爭取考績，契約內容應完全依照對金融業較有利的條件訂定","為達到業績要求，應說服客戶簽約購買與其風險屬性不相符之投資商品"],"ans":2,"exp":["📝 解析：契約內容不得違反主管機關規定；違法約定、只對金融業有利的條款或推銷與風險屬性不符的商品都違反公平待客。"],"pos":0.75798,"w":1},{"id":"E-125","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受託管理運用財產時，以下何者為是？","opts":["應依相關規定登記財產","財產應登記於從業人員名下","財產應登記於主管名下","財產應登記於公司名下"],"ans":1,"exp":["📝 解析：受託管理之財產應依相關規定辦理登記（如信託財產登記），不得登記於從業人員、主管名下或混入公司財產。"],"pos":0.75875,"w":1},{"id":"E-127","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員受託管理運用財產時，以下何者為是正確的？","opts":["將客戶之存款移轉至員工存款以提高收益率","挪用客戶之資金以補足其他客戶之交易損失","未經客戶同意以客戶之資產提供作為交易保證金","不得運用客戶資產償還金融從業人員私人之債務"],"ans":4,"exp":["📝 解析：客戶資產不得用於償還從業人員私人債務；移轉客戶存款、挪補其他客戶損失、未經同意充作保證金都屬挪用侵占。"],"pos":0.75953,"w":1},{"id":"E-128","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受託管理運用財產時，以下何者為是？","opts":["應與自有財產共同管理","應與自有財產分別管理","應與自有財產共同記帳","應將較有利交易價格給自有財產"],"ans":2,"exp":["📝 解析：信託法 §24：受託人應將信託財產與其自有財產及其他信託財產分別管理，信託財產為金錢者得以分別記帳方式為之，故選 (2)。與自有財產共同管理或共同記帳會混淆財產歸屬；把較有利的交易價格留給自有財產則違反忠實義務，屬利益衝突。"],"pos":0.76031,"w":1},{"id":"E-129","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員受託執行業務時，以下何者是正確的？","opts":["依規應寄送交易報告書及對帳單給客戶，但配合客戶口頭要求不用寄，就無須寄送以節省成本","幫助客戶保管存摺","紀錄客戶資料應就各客戶分別保存完整且正確紀錄","向客戶推介商品時，將非存款但會定期配息的金融商品，與定期存款比擬，以引導客戶忽略風險而進行投資"],"ans":3,"exp":["📝 解析：客戶紀錄應分戶保存完整且正確；依規應寄的交易報告與對帳單不可省略，代保管存摺、把配息商品比擬定存誤導都違規。"],"pos":0.76109,"w":1},{"id":"E-131","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受客戶委託執行業務，以下何種行為不正確？","opts":["為客戶保管存摺或存單","執行投資人員不得兼任保管投資財產","製作正確或適當記錄","提供存摺、存單或定期投資報告"],"ans":1,"exp":["📝 解析：從業人員不得為客戶保管存摺或存單；投資執行與保管分離、製作正確紀錄、提供存摺或定期報告都是正確作法。"],"pos":0.76187,"w":1},{"id":"E-132","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受客戶委託執行業務，如具有投資運用決定權，不得兼任以下何種業務？","opts":["兼任投資執行人員","兼任投資資產保管人員","兼任投資交割人員","以上皆是"],"ans":4,"exp":["📝 解析：為落實內部牽制，具投資運用決定權者不得兼任投資執行、資產保管或交割人員，三者皆不得兼任。"],"pos":0.76265,"w":1},{"id":"E-133","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理管理運用客戶資產應如何處理會計報告？","opts":["應依照主管指示作定期報告","應依照業績考量編製獲利報告","應依照契約約定及主管機關規定作定期報告","應推測客戶預期獲益率編製會計報告"],"ans":3,"exp":["📝 解析：管理運用客戶資產應依契約約定及主管機關規定定期提出報告，不能依主管指示、業績考量或推測報酬編製。"],"pos":0.76342,"w":1},{"id":"E-134","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"以下何者是正確的？","opts":["客戶不得請求閱覽其帳戶明細","客戶不得請求對事務處理情形提供說明","經客戶請求，應於合理營業時間內對事務之處理情形提供說明","客戶財產帳冊屬於業務機密，客戶不得請求閱覽"],"ans":3,"exp":["📝 解析：依信託法 §32，委託人或受益人得請求閱覽帳簿並請求說明事務處理情形，業者應於合理營業時間內提供說明。"],"pos":0.7642,"w":1},{"id":"E-139","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"辦理客戶資產或財物的保管時應依下列何項原則辦理？","opts":["善良管理原則","追求利潤原則","強制公開原則","互惠原則"],"ans":1,"exp":["📝 解析：保管客戶資產或財物應盡善良管理人之注意義務（信託法 §22 亦有明定），而非以追求利潤或互惠為原則。"],"pos":0.76498,"w":1},{"id":"E-143","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"溢收客戶新台幣壹佰元，但是已聯絡不到客戶，請問下列處置何者正確？","opts":["捐給慈善機構","交給主管","充當公費","掛在帳上"],"ans":4,"exp":["📝 解析：溢收款項仍屬客戶所有，聯絡不到時應掛帳列為暫收款待客戶領回，不得捐贈、私交主管或充當公費。"],"pos":0.76576,"w":1},{"id":"E-144","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員進行徵授信業務時，下列何者為非？","opts":["徵信時須詳實審查客戶財務及信用狀況","利害關係人授信須符合法令規定","定期辦理覆審","為達成自身績效，可忽視授信客戶可能潛藏之倒帳風險"],"ans":4,"exp":["📝 解析：授信須詳實徵信、利害關係人授信依銀行法規定辦理並定期覆審；為績效忽視倒帳風險違反授信審慎原則。"],"pos":0.76654,"w":1},{"id":"E-155","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理衍生性商品業務時，應遵循下列何者事項？","opts":["可幫助客戶遞延、隱藏損失","可幫助客戶粉飾財務報表","可幫助客戶提前認列收入","不得利用衍生性商品幫助客戶遞延、隱藏損失或虛報、提前認列收入等"],"ans":4,"exp":["📝 解析：依金融機構辦理衍生性金融商品業務相關規定，不得利用衍生性商品協助客戶遞延、隱藏損失或虛報、提前認列收入。"],"pos":0.76732,"w":1},{"id":"E-157","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理催收業務時，下列行為何者為非？","opts":["應對債務人表明身分","不得有脅迫、辱罵債務人之不當收債行為","不得對第三人進行催討","得向債務人收取額外費用"],"ans":4,"exp":["📝 解析：催收應表明身分、不得脅迫辱罵或向無關第三人催討，也不得向債務人收取法令或契約以外的額外費用。"],"pos":0.76809,"w":1},{"id":"E-158","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理催收業務時，下列何者為應遵守之事項？","opts":["不得違反公共利益","僅能對債務人本人及其保證人催收","不得對非債務之第三人干擾或催討","以上皆是"],"ans":4,"exp":["📝 解析：催收不得違反公共利益，僅能向債務人本人及保證人催收，不得干擾或催討非債務人之第三人，三者皆是。"],"pos":0.76887,"w":1},{"id":"E-170","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員遇有存戶遺忘或未及時領回銀行存摺時，應採取下列何措施？","opts":["可代客保管存摺","應即設簿登記，交指定主管人員集中保管","不發函或電告通知客戶僅需等待洽領","以上皆非"],"ans":2,"exp":["📝 解析：存戶遺忘存摺時應即設簿登記並交指定主管集中保管，並通知客戶領回；承辦人員不得私自代客保管。"],"pos":0.76965,"w":1},{"id":"E-208","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員處理管理運用業務如涉及有價證券之投資應揭露風險，以下何者為錯誤的？","opts":["應依產品特性揭露投資風險","屬信託財產運用範圍無須揭露風險","應於交付客戶之公開說明書中揭露風險","應揭露業務所涉及之各類風險"],"ans":2,"exp":["📝 解析：涉及有價證券投資應依產品特性揭露各類風險並載於公開說明書；即使屬信託財產運用範圍仍須揭露，信託架構不能免除風險告知義務。"],"pos":0.77043,"w":1},{"id":"E-213","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員處理管理運用業務之通知與報告義務為何？","opts":["應就事務之處理情形定期報告客戶","應依契約約定為必要之通知","應公告事項應依相關規定辦理","以上皆是"],"ans":4,"exp":["📝 解析：處理管理運用業務應定期報告處理情形、依契約為必要通知，並依法令辦理公告事項，三者皆屬通知與報告義務。"],"pos":0.77121,"w":1},{"id":"E-216","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"信託業從業人員與客戶簽訂契約，以下敘述何者為非？","opts":["於訂約前並應先行提供契約或文件內容予客戶閱覽","應盡合理注意使客戶於簽訂契約前有充分機會考慮條款","應就客戶所提出疑義詳細說明之","不需要先跟客戶說明契約之重要內容"],"ans":4,"exp":["📝 解析：信託業簽約前應提供契約供客戶審閱、給予充分考慮機會並解答疑義，且必須說明契約重要內容；「不需說明重要內容」是錯的。"],"pos":0.77198,"w":1},{"id":"E-234","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構在接獲被害人反映，發現有冒名申請信用卡案件時，應如何處理？","opts":["不作任何通報","儘速通報相關單位，避免損害擴大","要求被害人負擔損失","以上皆非"],"ans":2,"exp":["📝 解析：發現冒名申辦信用卡應儘速通報聯徵中心等相關單位並停用卡片，避免損害擴大；被冒名者是受害人，不應負擔損失。"],"pos":0.77276,"w":1},{"id":"E-238","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員遇有客戶遺留印鑑、存摺及已蓋章之空白取款條等憑證文件時，應如何處理？","opts":["私自代客保管","立即交由金融機構指定人員妥善保管","為避免糾紛，不予處理","逕行銷燬"],"ans":2,"exp":["📝 解析：客戶遺留的印鑑、存摺及已蓋章取款條屬高風險憑證，應立即交由機構指定人員依程序保管，防止冒領；私自保管或銷毀都不當。"],"pos":0.77354,"w":1},{"id":"E-241","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受理存款開戶作業，下列敘述何者正確？","opts":["依據主管機關規定辦理身分證明文件查核","受理開戶時應向客戶宣導，如提供帳戶供非法使用應負法律責任","開戶後發現可疑之客戶，應以電話、書面或實地查訪等方式再確認，並做適當處理","以上皆是"],"ans":4,"exp":["📝 解析：存款開戶應依規定查核身分證明、宣導提供帳戶給他人非法使用須負法律責任，開戶後發現可疑應再查證處理，以防人頭帳戶，皆正確。"],"pos":0.77432,"w":1},{"id":"E-289","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為客戶管理運用財產，管理運用之利益應如何處理？","opts":["不得以任何名義享有利益","得與他人交換而享有利益","得與客戶以代付差旅費方式分享利益","得與客戶約定收益共享或損失分擔"],"ans":1,"exp":["📝 解析：依信託業法及忠實義務，管理運用客戶財產除約定報酬外不得以任何名義享有利益，也不得與客戶約定收益共享、損失分擔或變相分利。"],"pos":0.7751,"w":1},{"id":"E-293","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"運用委託人之信託財產，以下敘述何者為非?","opts":["不得侵占委託人之信託資產，移轉至自己或他人的帳戶","應依委託人指定的用途運用信託資金","可以挪用委託人交付之資金來彌補自身交易的虧損。","不得執行不正當之交易，從中獲利"],"ans":3,"exp":["📝 解析：信託財產應依委託人指定用途運用，不得侵占、挪用或從事不正當交易獲利；挪用信託資金彌補自身虧損屬侵占背信，是錯的。"],"pos":0.77588,"w":1},{"id":"E-318","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構應約束業務代表不得從事下列行為？","opts":["故意毀損同業之申請書架","故意破壞同業之各項宣傳品","洩露信用卡申請人之個人資料","以上皆是"],"ans":4,"exp":["📝 解析：依信用卡業務自律規範，業務代表不得毀損同業申請書架、破壞同業宣傳品，也不得洩露申請人個資，皆為禁止行為。"],"pos":0.77665,"w":1},{"id":"E-323","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應依何項考量辦理徵信？","opts":["誠信公正原則","個人好惡","公司規模大小","政商關係良好與否"],"ans":1,"exp":["📝 解析：徵信應依誠信公正原則客觀評估借戶，不應受個人好惡、公司規模或政商關係影響。"],"pos":0.77743,"w":1},{"id":"E-326","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理授信業務，以下敘述何者正確？","opts":["與客戶洽談應保持懇切之態度","應本平等互惠及誠信公平原則","將有關約定事項載明於書面，並讓客戶充分瞭解","以上皆是"],"ans":4,"exp":["📝 解析：授信業務應態度懇切、本平等互惠及誠信公平原則，並將約定事項載明於書面使客戶充分瞭解，皆正確。"],"pos":0.77821,"w":1},{"id":"E-328","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構辦理催收欠款業務時，以下敘述何者正確？","opts":["不得違反公共利益","不得以損害他人為主要目的","應依誠實及信用原則行使權利","以上皆是"],"ans":4,"exp":["📝 解析：依民法§148，行使權利不得違反公共利益或以損害他人為主要目的，並應依誠實及信用方法；信用卡催收同樣適用，故皆是。"],"pos":0.77899,"w":1},{"id":"E-329","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構對於信用卡業務需要所登載及製播廣告，應遵守下列何者事項？","opts":["避免造成消費者有不當擴張個人信用之價值觀","必須依據法令規範確實登載規定警語","必須充分揭露費用及利率","以上皆是"],"ans":4,"exp":["📝 解析：信用卡廣告應避免鼓勵過度擴張信用、依法登載警語（如循環信用利率警語）並充分揭露費用與利率，皆屬應遵守事項。"],"pos":0.77977,"w":1},{"id":"E-371","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"信託業應信守的業務經營原則，以下所述何者為錯誤的？","opts":["業務經營應瞭解並遵守相關法令規定","為避免客戶擔心不用揭露必要資訊","應盡專家的注意義務維護客戶利益","應妥慎保管客戶往來交易資料，避免不當使用情事發生"],"ans":2,"exp":["📝 解析：信託業應遵守法令、盡善良管理人注意義務並妥善保管客戶資料；依信託業法應充分揭露必要資訊，不能以避免客戶擔心為由隱匿。"],"pos":0.78054,"w":1},{"id":"E-377","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"以下所述何者違反防止利益衝突？","opts":["資訊交互運用應注意內部資訊控管流程","信託專責部門應指派專人負責內部資訊控管流程","客戶信託財產內容得提供其他部門分析運用","共用營業設備應注意內部資訊控管流程"],"ans":3,"exp":["📝 解析：客戶信託財產內容屬機密，未經客戶同意不得提供其他部門分析運用；資訊交互運用與共用設備須遵守內部資訊控管流程，並由信託專責部門指派專人負責。"],"pos":0.78132,"w":1},{"id":"E-449","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"所謂保密原則，下列何者為非？","opts":["對存款人的法定代理人不必保密","客戶的住址資料必須保密","存款餘額 100 萬元以上才須保密，100 萬元以下請示主管即可","保密對象包含駐守銀行的警察"],"ans":3,"exp":["📝 解析：依銀行法 §48，銀行對客戶存款、放款或匯款等資料應保守秘密，不論金額大小；以100萬元為界、低於即可請示主管提供，顯然錯誤。"],"pos":0.7821,"w":1},{"id":"E-464","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"有關銀行授信資料，下列敘述何者為正確？","opts":["應有保密之義務","不得向他人出售、 洩露","不得提供自己或他人使用","以上皆是"],"ans":4,"exp":["📝 解析：銀行授信資料屬客戶機密，依銀行法 §48 及個人資料保護法應保密，不得出售、洩露或提供自己或他人使用。"],"pos":0.78288,"w":1},{"id":"E-465","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡推廣人員與特約商店辦理簽約時所檢附之合約資料，應如何處理？","opts":["妥為保管","不得移做他用","不將資料外洩給第三人","以上皆是"],"ans":4,"exp":["📝 解析：特約商店簽約資料屬客戶資料，推廣人員應妥為保管、不得移作他用，也不得外洩給第三人。"],"pos":0.78366,"w":1},{"id":"E-467","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構之聘雇人員對於客戶資料，下列何者為正確？","opts":["應有保密之義務","不得向他人出售、洩露","不得提供自己或他人使用","以上皆是"],"ans":4,"exp":["📝 解析：信用卡發卡機構人員對持卡人資料負保密義務，不得出售、洩露，也不得提供自己或他人使用。"],"pos":0.78444,"w":1},{"id":"E-513","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者不用具備法定人員資格條件？","opts":["從事信託業務的人員","僅處理文件收發人員","督導信託業務的主管","信託部門主管"],"ans":2,"exp":["📝 解析：信託業務人員、督導信託業務主管與信託部門主管都須符合信託業人員資格條件；僅做文件收發的行政人員不從事信託業務，不需法定資格。"],"pos":0.78521,"w":1},{"id":"E-514","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"有關人員資格之規定，以下所述何者為錯誤的？","opts":["信託業僱用業務人員雖未符合資格得予試用","信託業僱用新員工時應考量是否具有資格","信託業應取得新進員工符合資格證明文件","未符合相關資格不得調派擔任信託業務人員"],"ans":1,"exp":["📝 解析：依信託業人員資格相關規定，未符合資格者不得擔任信託業務人員，沒有「先試用」的例外，故(1)錯誤。"],"pos":0.78599,"w":1},{"id":"E-520","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不得擔任票券金融公司之董事或經理人？","opts":["該票券金融公司監察人二親等以內之血親","該票券金融公司監察人一親等姻親","該票券金融公司監察人之配偶","以上皆是"],"ans":4,"exp":["📝 解析：依票券商負責人及業務人員管理規則 §10，票券金融公司監察人之配偶、二親等以內之血親或一親等姻親，不得擔任同一票券金融公司之董事或經理人（政府或法人之自然人代表亦適用），避免監察人與被監督者有親屬關係導致監督失靈，三者皆是。"],"pos":0.78677,"w":1},{"id":"E-531","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"關於金融服務業從事授信業務之規範，下列敘述何者有誤？","opts":["對於授信客戶，應本公平誠信及權利義務對等原則，將有關約定事項訂明於契約並告知之","對授信案件應力求公正客觀並兼顧自身利益與社會公益","對人員之晉用應循正當途徑延攬，並長期有計畫培訓，以充實專業知識，並提高素質","為保障自身利益，對授信客戶重大不良訊息不宜互相通報"],"ans":4,"exp":["📝 解析：授信業務應建立同業間重大不良訊息通報機制以控管信用風險，不能為保障自身利益而不通報，故(4)錯誤。"],"pos":0.78755,"w":1},{"id":"E-553","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構辦理催收欠款業務時，下列何項為應遵守之事項？","opts":["不得違反公共利益","僅能對債務人本人及其保證人催收","不得對非債務之第三人之干擾或催討","以上皆是"],"ans":4,"exp":["📝 解析：依信用卡業務機構管理及催收相關規範，催收不得違反公共利益、僅能向債務人及保證人催收、不得干擾非債務人第三人，三者皆是。"],"pos":0.78833,"w":1},{"id":"E-554","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"信用卡發卡機構之行銷人員從事下列行為何者不正確？","opts":["自行勾選未經客戶同意申請之卡片","確認客戶申請之卡片","確認客戶資料無誤才送件","確認申請人本人身分， 以免冒名申請"],"ans":1,"exp":["📝 解析：行銷人員不得未經客戶同意代為勾選申請卡片；確認申請卡別、資料正確與本人身分以防冒名，才是正確作法。"],"pos":0.78911,"w":1},{"id":"E-555","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"銀行辦理催收業務時，下列敘述何項為非？","opts":["不得違反公共利益","僅能對債務人本人及其保證人催收","應有保密之義務","得對非債務之第三人干擾或催討"],"ans":4,"exp":["📝 解析：銀行催收只能向債務人本人及保證人為之，不得對非債務人第三人干擾或催討，故(4)錯誤。"],"pos":0.78988,"w":1},{"id":"E-560","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理徵信工作，以下敘述何者有誤？","opts":["徵信人員應依誠信公正原則，辦理徵信工作","為謀徵信工作迅速完成，徵信單位對於經常往來客戶，毋需再辦理徵信","徵信人員對徵信資料應依法嚴守秘密","辦理徵信，除另有規定外，應以直接調查為主，間接調查為輔"],"ans":2,"exp":["📝 解析：依銀行公會徵信準則，經常往來客戶仍須依規定定期辦理徵信，不得為求快速省略，故(2)錯誤。"],"pos":0.79066,"w":1},{"id":"E-562","s":"all","ch":"道德｜銀行與信託從業規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員遇客戶結購外幣現鈔或旅行支票時，以下敘述何者正確？","opts":["結購外幣現鈔或旅行支票後，請客戶當面點清","提醒客戶妥為保管，以免被竊或遺失","請客戶將旅行支票與購買合約書分開保管，避免兩者同時被竊或遺失而無法申請掛失","以上皆是"],"ans":4,"exp":["📝 解析：外幣現鈔與旅行支票交付時應請客戶當面點清、提醒妥善保管，旅支與購買合約應分開存放以便掛失，三者皆正確。"],"pos":0.79144,"w":1},{"id":"E-044","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員之業務行為規範，下列何者為錯誤？","opts":["應確實告知客戶之權利與義務","須與客戶簽訂相關之買賣契約書或相關文件以供日後糾紛之確認","得與客戶私自約定或提供特定利益、對價以促銷金融商品","須告知客戶買賣之金融商品可能面臨的風險與損失"],"ans":3,"exp":["📝 解析：不得與客戶私自約定或提供特定利益、對價促銷商品；告知權利義務、簽訂契約、揭露風險與損失都是應有規範。"],"pos":0.79222,"w":1},{"id":"E-048","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員下列行為何者為非？","opts":["主動提供商品相關資訊","私下接受客戶禮品及招待","寄送生日卡片","適時的電話問候"],"ans":2,"exp":["📝 解析：私下收受客戶禮品招待可能影響執行業務的公正性而生利益衝突，屬禁止行為；提供資訊、寄卡片、電話問候為正常服務。"],"pos":0.793,"w":1},{"id":"E-050","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員向供應商或客戶建議或徵求業務時，下列何種行為是被禁止的？","opts":["提出任何對等交換的建議","表示可能因為對方不接受而取消服務或業務","可能因為對方的接受而給予特別的服務或業務","以上皆是"],"ans":4,"exp":["📝 解析：以對等交換、威脅取消服務或因接受而給特別待遇來推動業務，都屬以不當交換條件影響交易，三者皆被禁止。"],"pos":0.79377,"w":1},{"id":"E-106","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於受理客戶買賣時：","opts":["不可以有進行對作或跟單之行為","同意客戶不需要出具授權書，可以提供帳戶供他人使用","為規避繳稅，提供自己或他人帳戶供客戶使用","為牟取客戶最大利益，逕行為客戶設定獲利、停損點"],"ans":1,"exp":["📝 解析：從業人員不得與客戶對作或跟單以免利益衝突；出借帳戶、為規避稅負提供帳戶、逕自為客戶設定停損獲利點皆屬違規。"],"pos":0.79455,"w":1},{"id":"E-137","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員受託執行業務時，下列何者為非？","opts":["客戶利益置於公司或個人的利益之上","受託人必須揭露與客戶的利益衝突","受託人應公平對待所有客戶，不得偏袒某一客戶","受託人應以公司之利益為最高利益"],"ans":4,"exp":["📝 解析：受託人應將客戶利益置於公司與個人之上、揭露利益衝突並公平對待客戶；以公司利益為最高利益違反忠實義務。"],"pos":0.79533,"w":1},{"id":"E-141","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者行為有誤？","opts":["將客戶私下轉介於其他同業或交易商","依公司及相關法令規範，執行客戶所託之業務","事先與客戶簽訂受託執行業務範圍之約定書","誠實告知客戶受託業務執行之結果"],"ans":1,"exp":["📝 解析：私下把客戶轉介給同業或交易商，違反對所屬機構的忠實義務並可能涉及不當利益；其餘依法執行、事先約定、誠實告知皆正確。"],"pos":0.79611,"w":1},{"id":"E-146","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"在接受客戶委託時，應將誰的利益置於其他利益之上？","opts":["委託的客戶","公司","自己","其他大客戶"],"ans":1,"exp":["📝 解析：依忠實義務，接受委託時應將委託客戶的利益置於公司、自己及其他客戶之上。"],"pos":0.79689,"w":1},{"id":"E-147","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員基於職業道德應如何對待客戶，下列何者行為是不對的？","opts":["公平對待所有的客戶","將客戶的利益置於公司利益或員工利益之上","將公司利益或員工利益置於客戶的利益之上","以客戶最高利益行事"],"ans":3,"exp":["📝 解析：把公司或員工利益置於客戶利益之上違反忠實義務；公平對待客戶、客戶利益優先、以客戶最高利益行事都是正確作法。"],"pos":0.79767,"w":1},{"id":"E-163","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"下列陳述何者為金融從業人員應遵守之事項？","opts":["不可利用客戶名義為自己從事交易","可利用客戶名義為自己從事交易","可利用客戶名義供他人從事交易","以上皆非"],"ans":1,"exp":["📝 解析：不得利用客戶名義或帳戶為自己或他人交易，否則構成借用帳戶並與客戶產生利益衝突。"],"pos":0.79844,"w":1},{"id":"E-200","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"證券商辦理財富管理業務，為防範內線交易及利益衝突，對於辦理財富管理業務人員之規範，下列何者為正確？","opts":["不得接受客戶不合法交易","從客戶獲知其買賣某標的商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣","應明確告知客戶執行財富管理業務人員之所屬部門，不得有混淆客戶之行為","以上皆為正確"],"ans":4,"exp":["📝 解析：證券商財富管理規範要求人員不得接受不合法交易、獲悉客戶交易訊息有利益衝突之虞不得買賣該標的、須告知所屬部門避免混淆，三者皆正確。"],"pos":0.79922,"w":1},{"id":"E-201","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"為防範利益衝突及保護營業秘密，證券商之董事、監察人及受僱人員等內部人員獲悉承銷部門出售其包銷取得之股票或自營部門欲為買賣股票種類者，下列敘述何者為正確？","opts":["於承銷部門出售或自營部門買賣前，不得為同種類股票之買賣委託","為服務客戶，立刻將此消息告知主要客戶先為買賣同種類股票","自己或通知親朋好友先為買賣同種類股票","立刻報告直屬主管因應處理"],"ans":1,"exp":["📝 解析：內部人獲悉承銷部門出售包銷股票或自營部門買賣計畫屬營業秘密，在其出售或買賣前不得為同種類股票委託；轉告客戶或親友搶先交易屬利益衝突。"],"pos":0.8,"w":1},{"id":"E-207","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員處理事務應盡善良管理人之注意義務，下列何者為錯誤的行為？","opts":["告知客戶投資運用之風險","告知客戶應給付相關款項及費用","未告知客戶處理業務有利益衝突","告知客戶公司相關資料"],"ans":3,"exp":["📝 解析：善良管理人應告知風險、費用及公司資料；處理業務若有利益衝突卻未告知客戶，違反忠實義務與利益衝突揭露要求，是錯誤行為。"],"pos":0.80078,"w":1},{"id":"E-223","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"有關公司之重大訊息，應：","opts":["於公司未公開前提供給客戶","基於合法方式取得後提供給客戶","於公司未公開前促使他人利用該訊息獲私利","將此訊息運用於非法用途上"],"ans":2,"exp":["📝 解析：公司重大訊息只能以合法方式取得、在公開後使用；未公開前提供他人或促使他人利用，可能構成證交法§157-1內線交易。"],"pos":0.80156,"w":1},{"id":"E-276","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"證券商辦理財富管理業務，下列何者為證券商為防範內線交易及利益衝突之機制？","opts":["有關業務人員直接或間接接受客戶或第三人之饋贈應訂定規範標準或管理措施","辦理財富管理業務之人員，不得接受客戶不合法交易，從客戶獲知其買賣某標的商品之相關訊息， 有利益衝突或不當得利之虞者，不得從事該等標的之買賣","加強控管辦理財富管理業務之人員，不得與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益，致影響其專業判斷與職務執行之客觀性","以上皆是"],"ans":4,"exp":["📝 解析：對饋贈訂定規範、禁止接受不合法交易及利用客戶訊息買賣、禁止與客戶分享利益分擔損失或收受不當利益，皆為財管業務防範內線交易及利益衝突機制。"],"pos":0.80233,"w":1},{"id":"E-287","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應忠實執行業務，以下何種行為是錯誤的？","opts":["不得因執行業務而享有個人不當利益","故意設計交易行為以掩飾利害關係人交易","不得對客戶有虛偽、詐欺行為","不得對客戶有足致客戶誤信之行為"],"ans":2,"exp":["📝 解析：忠實執行業務要求不享不當利益、不得虛偽詐欺或誤導；故意設計交易以掩飾利害關係人交易，是規避利益衝突控管的錯誤行為。"],"pos":0.80311,"w":1},{"id":"E-288","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事信託業務，以下何種行為是錯誤的?","opts":["具運用決定權人，如有不法之利益時，應拒絕投資運用","提供客戶內線交易訊息","明知不適當之投資，不得故意建議客戶投資","有不法利益，不得故意建議客戶進行交易"],"ans":2,"exp":["📝 解析：提供客戶內線消息可能使雙方違反證交法§157-1；其餘三項（拒絕不法利益、不建議不當投資）都是信託從業人員應有的正確行為。"],"pos":0.80389,"w":1},{"id":"E-295","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對不當利益應：","opts":["可接受招待","不可收現金，有價證券則不限","不得接受","可收禮品"],"ans":3,"exp":["📝 解析：從業人員不得接受任何不當利益，現金、有價證券、招待或禮品都可能影響專業判斷的客觀性。"],"pos":0.80467,"w":1},{"id":"E-299","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員不得有下列何種行為？","opts":["參加專業證照之考試以提昇自身素質","配合政府金融政策，促進經濟發展，善盡社會責任","利用客戶名義或帳戶，為自己從事交易","以上皆是"],"ans":3,"exp":["📝 解析：利用客戶名義或帳戶為自己交易屬禁止行為；參加證照考試、配合政策善盡社會責任都是應鼓勵的行為。"],"pos":0.80545,"w":1},{"id":"E-300","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員與客戶間之往來：","opts":["不得接受禮品或收取任何有價值物品","可收禮品","可收現金","可收現金及禮品"],"ans":1,"exp":["📝 解析：為維持客觀公正、避免利益衝突，從業人員與客戶往來不得接受禮品或收取任何有價值物品，現金與禮品皆不可收。"],"pos":0.80623,"w":1},{"id":"E-301","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為金融從業人員爭取業務時之禁止行為？","opts":["與往來客戶或相關人員有不當利益之約定","收受往來客戶或相關人員之不當利益","(1)、(2)皆是","(1)、(2)皆非"],"ans":3,"exp":["📝 解析：與客戶或相關人員約定不當利益、收受其不當利益，兩者都是爭取業務時的禁止行為，故(1)、(2)皆是。"],"pos":0.807,"w":1},{"id":"E-302","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應遵守忠實義務原則，故：","opts":["仍可從事內線交易","禁止短線交易，禁止不當得利","應與客戶發生衝突","不一定要遵守法規"],"ans":2,"exp":["📝 解析：忠實義務要求客戶利益優先，禁止短線交易與不當得利；內線交易、與客戶衝突、不守法都違反此原則。"],"pos":0.80778,"w":1},{"id":"E-321","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員得以何種名義，向顧客收受不當佣金、酬金？","opts":["個人","經理","主管機關","以上皆非"],"ans":4,"exp":["📝 解析：不論以個人、經理或主管機關名義，都不得向顧客收受不當佣金或酬金，故以上皆非。"],"pos":0.80856,"w":1},{"id":"E-322","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員不宜參與下列行為或交易？","opts":["利用短線操作參與投機性之證券交易","與其他非個人財力所及之有關投機性之交易","藉親友之名義從事交易","以上皆是"],"ans":4,"exp":["📝 解析：短線投機、超出個人財力的投機交易及藉親友名義交易，都可能產生利益衝突或影響專業判斷，皆不宜參與。"],"pos":0.80934,"w":1},{"id":"E-335","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"發發證券公司向基金經理人小王表示，如果在該公司下單量三個月內成長兩成，將免費供其使用在陽明山的渡假別墅一星期。小王完整向公司報告了這件事，三個月後在發發證券的下單量成長達到了兩成，小王於是接受了這個渡假邀約。小王有違反忠實誠信原則嗎？","opts":["有，小王是基金經理人不得接受證券商退還之手續費或其他利益","沒有，因為這不是金錢餽贈","沒有，因為他已經向公司報告","沒有，因為他可以接受第三人提供的間接利益"],"ans":1,"exp":["📝 解析：基金經理人不得接受證券商退還手續費或其他利益（含招待使用別墅），以下單量換取個人利益直接損害基金受益人，即使已向公司報告也不行。"],"pos":0.81012,"w":1},{"id":"E-348","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"張三因職務得知公司即將與某公司合併為一則大利多消息，下列何種行為較適當：","opts":["利用他人名義大筆買進公司股票","私下告知客戶該項訊息，使其蒙利","以配偶名義大筆買進公司股票","在消息未公開前或公開後 18 小時內，不得自行或以他人名義買入公司股票"],"ans":4,"exp":["📝 解析：依證交法 §157-1，因職務獲悉重大消息者，於消息明確後未公開前或公開後18小時內，不得自行或以他人名義買賣該公司股票；其餘選項皆屬內線交易或洩密。"],"pos":0.81089,"w":1},{"id":"E-352","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員因職務關係獲悉足以影響金融商品價格未公開之重大消息時：","opts":["應即以書面報告並列管保密","應廣為眾知，造福親朋好友","應立即為客戶交易，牟取其最大利益","應立即利用他人名義交易，牟取個人最大利益"],"ans":1,"exp":["📝 解析：獲悉未公開重大消息應依內部程序以書面報告並列管保密；告知親友、替客戶或借他人名義交易，都可能構成證交法 §157-1 內線交易。"],"pos":0.81167,"w":1},{"id":"E-357","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"若發生金融服務業之業務人員對其與客戶之利益衝突或不同客戶間之利益衝突情事時，應如何處理：","opts":["以個別客戶對公司之貢獻度為依據","以契約約定為依據","以多數客戶之利益為依據","以損益標準為處理原則"],"ans":2,"exp":["📝 解析：業務人員與客戶或不同客戶間發生利益衝突時，應以雙方契約約定為處理依據，不能以客戶貢獻度、多數客戶利益或公司損益來決定。"],"pos":0.81245,"w":1},{"id":"E-359","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"在證券業所提供的業務服務過程中，下列那種情事不屬於利益衝突的範圍？","opts":["符合法令之受託買賣上市櫃股票交易","提供給客戶之金融商品或服務，與公司有直接或間接之不合規利益","未經公司同意，擅自雇用自己的親友在公司任職","未依公司規定在外自行開業或兼任其他職務"],"ans":1,"exp":["📝 解析：依法受託買賣上市櫃股票是證券商正常業務，不屬利益衝突；與公司有不合規利益、擅自安插親友任職、未依規定在外兼職都屬利益衝突。"],"pos":0.81323,"w":1},{"id":"E-360","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，何謂利益衝突？","opts":["各獨立的個體， 會因某一方的利益被歸優先，而使另一方可能蒙受損失","利益衝突一定會造成雙方獲利","利益衝突一定是某一方觸犯法律","以上皆非"],"ans":1,"exp":["📝 解析：利益衝突指各自獨立的主體間，一方利益被優先考量時，另一方可能因此受損；它不一定使雙方獲利，也不一定已經觸法。"],"pos":0.81401,"w":1},{"id":"E-361","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，利益衝突若以代理制度來解釋，是指那兩方面的人發生利益衝突？","opts":["受益人及受託人","受託人及委託人","受益人及委託人","受託人及經理人"],"ans":2,"exp":["📝 解析：以代理（委任）關係解釋，受託人（代理人）可能為自身利益而犧牲委託人（本人）利益，利益衝突即發生在受託人與委託人之間。"],"pos":0.81479,"w":1},{"id":"E-362","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，以下何項屬於利益衝突的含意？","opts":["數種正當利益存在有彼此競爭矛盾的現象","利益衝突屬於一種狀態或情境","避免利益衝突亦屬道德範疇","以上皆是"],"ans":4,"exp":["📝 解析：利益衝突是多種正當利益彼此競爭矛盾的狀態或情境，本身未必違法，但如何避免屬於職業道德範疇，三項敘述皆正確。"],"pos":0.81556,"w":1},{"id":"E-363","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，在利益衝突當中若與親屬牽涉到關係，當中的親屬不包括：","opts":["子女","父母","配偶","房客"],"ans":4,"exp":["📝 解析：利益衝突所指的親屬是配偶、父母、子女等具親屬或家庭關係者；房客只是租賃關係，不屬親屬。"],"pos":0.81634,"w":1},{"id":"E-364","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，下列那種情況可能發生利益衝突？","opts":["為個人私利竊取公司機密","透過公司財產或資訊以取得獲利","與公司為業務之競爭","以上皆是"],"ans":4,"exp":["📝 解析：竊取公司機密圖私利、利用公司財產或資訊獲利、與公司從事業務競爭，都是個人利益與公司利益衝突的典型情況。"],"pos":0.81712,"w":1},{"id":"E-365","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，下列何種狀況屬於利益衝突的問題？","opts":["經辦人員常常接受供應商招待、私下收受回扣","員工有轉換跑道的打算","有親戚朋友在同業任職","參加同業聯誼活動"],"ans":1,"exp":["📝 解析：經辦人員常接受供應商招待、私收回扣，會影響採購判斷而犧牲公司利益，屬利益衝突；有轉職打算、親友在同業、參加聯誼本身並不構成。"],"pos":0.8179,"w":1},{"id":"E-366","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"防止利益衝突是從事金融服務業職業道德的要項，關於利益衝突所謂之「利益」，若將利益分成財產上利益，及非財產上利益，下列何者屬非財產上的利益？","opts":["汽車及房子","現金、存款、外幣、有價證券","利用公司資源，進而獲取跳槽機會","具有經濟價值或得以金錢交易取得之利益"],"ans":3,"exp":["📝 解析：汽車房屋、現金存款外幣證券及可用金錢交易取得者都是財產上利益；利用公司資源換取跳槽機會則屬非財產上利益。"],"pos":0.81868,"w":1},{"id":"E-367","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"為了防範公司可能與客戶或員工發生利益衝突的問題，下列何者是公司的內部管理規章應規範的內容？","opts":["組織架構與人員資格條件","風險管理制度","內部控制制度","以上皆是"],"ans":4,"exp":["📝 解析：防範利益衝突須從組織架構與人員資格條件、風險管理制度及內部控制制度著手，三者都應納入內部管理規章。"],"pos":0.81946,"w":1},{"id":"E-369","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"在證券市場中，下列何者存在有利害衝突關係？","opts":["公開發行公司與證券承銷商之間對於公司發行證券募集資金承銷價格之訂定","上市(櫃)公司與證券投資人之間對於公司資訊公開之期求","上市(櫃)公司經營者與股東之間對於公司利益之考量","以上皆是"],"ans":4,"exp":["📝 解析：發行公司希望承銷價高、承銷商顧及銷售；投資人要求充分揭露、公司未必樂意；經營者與股東利益也未必一致，三者都存在利害衝突。"],"pos":0.82023,"w":1},{"id":"E-370","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"以下何者之間於辦理業務時可能有利益衝突情事？","opts":["行使投資運用時客戶與從業人員間","銷售商品時客戶與其他客戶間","辦理業務時客戶與金融集團其他子公司間","以上皆是"],"ans":4,"exp":["📝 解析：代客投資時客戶與從業人員之間、銷售時不同客戶之間、客戶與金融集團其他子公司之間，都可能發生利益衝突。"],"pos":0.82101,"w":1},{"id":"E-372","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"以下何種行為有利益衝突之虞？","opts":["向放款客戶強力推銷無法賣出之金融商品","為全權委託客戶購入公司本身股票","將客戶之信託財產投資公司利害關係人發行之股票","以上皆是"],"ans":4,"exp":["📝 解析：向放款客戶強推滯銷商品、為全權委託客戶買進自家股票、將信託財產投資利害關係人發行的股票，都是犧牲客戶圖利公司或關係人，有利益衝突之虞。"],"pos":0.82179,"w":1},{"id":"E-373","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"以下何者不得參與投資決策？","opts":["與業務相關人員有利害關係者","投資決策人員","具有運用決定權人","以上皆是"],"ans":1,"exp":["📝 解析：與業務相關人員有利害關係者參與投資決策，可能藉機圖利關係人，應迴避；投資決策人員與具運用決定權人本來就是決策者。"],"pos":0.82257,"w":1},{"id":"E-374","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"應如何建置利害關係人檔案？","opts":["隨便填填交差了事","應詳實提供資料並定期更新","稽核人員查到再提供","應參考其他同仁所填資料填寫"],"ans":2,"exp":["📝 解析：利害關係人檔案是公司辨識關係人交易、防範利益衝突的依據，應詳實提供並定期更新，不可敷衍、等稽核查到才補或照抄他人。"],"pos":0.82335,"w":1},{"id":"E-375","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行資產管理事務時，為避免與公司發生利益衝突，應避免以下何種行為？","opts":["購買公司發行之有價證券","購買公司之不動產","由公司購買客戶委託管理的財產","以上皆是"],"ans":4,"exp":["📝 解析：管理客戶資產時，用客戶財產買公司發行的證券或公司不動產，或由公司買入客戶委託的財產，都屬自我交易，易犧牲客戶利益，皆應避免。"],"pos":0.82412,"w":1},{"id":"E-376","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員與客戶間辦理利害關係交易行為時，得採取何種措施？","opts":["告知利益衝突之情形並取得客戶書面同意","無須取得客戶之書面同意","不得拒絕接受有利益衝突之委託","應為公司積極爭取業務，接受委託"],"ans":1,"exp":["📝 解析：與客戶進行利害關係交易時，應充分告知利益衝突情形並取得客戶書面同意，否則應拒絕受託；不可未經同意逕行辦理或為業績硬接。"],"pos":0.8249,"w":1},{"id":"E-378","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於業務往來之公司，其董事、監察人或經理人無法以客觀及有效率的方式處理公務時：","opts":["應特別注意前述人員所屬之關係企業資金貸與或為其提供保證、 重大資產交易、進(銷)貨往來之情事","隨意由前述人員進行私人利益輸送之交易","隨意由前述人員利用職務之便進行投機交易","隨意由前述人員利用各種管道進行洗錢交易"],"ans":1,"exp":["📝 解析：往來公司董監經理人無法客觀處理公務時，應特別注意其關係企業資金貸與、背書保證、重大資產交易及進銷貨等利益輸送風險；其餘選項任其不當交易顯然錯誤。"],"pos":0.82568,"w":1},{"id":"E-379","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"擔任公司之董事、監察人或經理人：","opts":["可使用公司之財產圖利自己","應避免圖私利之機會","以不正當之方法圖利自己","利用公司之財產圖利自己之親朋好友"],"ans":2,"exp":["📝 解析：董事、監察人、經理人對公司負忠實義務，應避免圖私利的機會，不得利用公司財產為自己或親友謀利。"],"pos":0.82646,"w":1},{"id":"E-380","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業之董監事對與本公司有利害關係之交易，應採取下列何項原則辦理？","opts":["善良管理原則","公平競爭原則","專業原則","利益迴避原則"],"ans":4,"exp":["📝 解析：董監事對與本公司有利害關係的交易應遵循利益迴避原則，例如公司法 §206 規定董事對議案有自身利害關係時不得加入表決。"],"pos":0.82724,"w":1},{"id":"E-381","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"有關利益衝突，下列敘述何者為非？","opts":["個人投資如可能對公司產生利益衝突，應避免之","金融從業人員得隨時擔任同業之負責人，不須任何同意","利用公司資源發現屬於公司的機會，不得據為己有","不得接受客戶提供之優惠待遇"],"ans":2,"exp":["📝 解析：擔任同業負責人與公司有競業及利益衝突，依公司法競業禁止規定及金融業負責人兼職限制，須經同意或核准，不能隨時任意擔任。"],"pos":0.82802,"w":1},{"id":"E-384","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"公司董事、監察人或經理人，對下列何種行為應予避免？","opts":["對於本身及客戶之資訊負有保密責任","透過使用公司資產、資訊或藉由職務之便以獲取私利","遵循法令規章","保護並適當使用公司資產"],"ans":2,"exp":["📝 解析：董監經理人應保密、守法並保護公司資產；利用公司資產、資訊或職務之便獲取私利屬利益衝突，應予避免。"],"pos":0.82879,"w":1},{"id":"E-386","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業董事對董事會所列議案如有涉其本身利害關係致損及該公司利益之虞時， 應採行下列何種措施？","opts":["自行迴避，不加入表決","加入表決","本身不加入表決，但代理其他董事行使其表決權","依其自由意志為之"],"ans":1,"exp":["📝 解析：依公司法 §206 準用 §178，董事對議案有自身利害關係致有害公司利益之虞時，不得加入表決，也不得代理其他董事行使表決權。"],"pos":0.82957,"w":1},{"id":"E-387","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業應注意下列哪些人，會因其在公司擔任董事、監察人或經理人職務之便而獲得不當利益，為避免利益衝突，應予迴避？","opts":["本人及配偶","父母及子女","兄弟姐妹","以上皆是"],"ans":4,"exp":["📝 解析：應迴避對象包括本人、配偶、父母、子女及兄弟姊妹等關係密切者，避免其因董監經理人職務之便取得不當利益，三者皆是。"],"pos":0.83035,"w":1},{"id":"E-388","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"若某項活動、利益或關係可能妨礙從業人員追求公司及客戶之最高利益行事之能力時，應保持警覺，此屬何種行為？","opts":["能力原則","防範利益衝突行為","客觀性原則","誠信原則"],"ans":2,"exp":["📝 解析：對可能妨礙為公司及客戶最高利益行事的活動、利益或關係保持警覺，正是防範利益衝突行為的核心要求。"],"pos":0.83113,"w":1},{"id":"E-389","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業董事、監察人或經理人在公司擔任職務時應避免下列何人獲得不當利益？","opts":["配偶","父母","子女","以上皆是"],"ans":4,"exp":["📝 解析：董監經理人應避免配偶、父母、子女等關係人因其職務獲得不當利益，三者都包括在內。"],"pos":0.83191,"w":1},{"id":"E-390","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業應避免董事、監察人或經理人進行以下何者行為？","opts":["透過使用公司財產、 資訊或藉由職務之便而有圖私利之機會","透過使用公司財產、資訊或藉由職務之便以獲取實質利益","與公司競爭","以上皆是"],"ans":4,"exp":["📝 解析：董監經理人不得利用公司財產、資訊或職務之便製造圖私利機會或獲取實質利益，也不得與公司競爭，三種行為都應避免。"],"pos":0.83268,"w":1},{"id":"E-391","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"為避免與客戶之利益衝突，下列何者不正確？","opts":["於法律許可範圍內為客戶之利益執行專業判斷","視客戶之忠誠度再決定執行業務之程度","不受客戶忠誠與否之影響","不受個人利益、其他客戶利益或任何其他人意願之影響"],"ans":2,"exp":["📝 解析：應在法律許可範圍內為客戶利益做專業判斷，不受個人利益、其他客戶或客戶忠誠度影響；依忠誠度決定服務程度屬差別待遇，不正確。"],"pos":0.83346,"w":1},{"id":"E-392","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"有關利益衝突原則，下列何者正確？","opts":["公司得要求員工不得擁有非公開資訊而從事任何事業體或個人之交易","公司得要求員工不得有內線交易行為","公司得要求員工避免以非法套裝商品強迫客戶購買","以上皆是"],"ans":4,"exp":["📝 解析：公司可要求員工不得持非公開資訊交易、不得內線交易、不得以非法搭售強迫客戶購買，三者都是防範利益衝突的正當規範。"],"pos":0.83424,"w":1},{"id":"E-393","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員處理某項業務時，若與公司之利益發生衝突應採取何種方式？","opts":["基於利益衝突原則應予以迴避","仍應繼續辦理","因對自己有利，更應加強爭取該業務","將該業務轉移給自己的配偶來執行"],"ans":1,"exp":["📝 解析：業務與公司利益衝突時應依利益迴避原則迴避，不可繼續承辦、為己爭取，或轉給配偶承辦來規避。"],"pos":0.83502,"w":1},{"id":"E-394","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員銷售對自己有利益的商品，如果該商品不符合客戶的需求，將會違反什麼原則？","opts":["能力原則","利益衝突原則","損失原則","以上皆是"],"ans":2,"exp":["📝 解析：推銷對自己有利但不符客戶需求的商品，是把個人利益置於客戶利益之上，違反利益衝突（客戶利益優先）原則，也違反適合度要求。"],"pos":0.8358,"w":1},{"id":"E-400","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"為維持市場交易之公平性，金融從業人員可否利用公司內部資訊擅自為自己或相關人員進行交易而謀取利益？","opts":["可以","不可以","客戶同意即可","視交易金額高低而定"],"ans":2,"exp":["📝 解析：利用公司內部資訊替自己或相關人交易謀利，破壞市場公平並可能構成證交法 §157-1 內線交易，不因客戶同意或金額大小而例外。"],"pos":0.83658,"w":1},{"id":"E-453","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"基於職務關係而獲悉與業務相關尚未公開之重大消息，於該重大消息未公開前不得為誰使用？","opts":["自己","客戶","其他第三者","以上皆是"],"ans":4,"exp":["📝 解析：未公開重大消息在公開前不得供自己、客戶或任何第三者使用，否則可能構成證交法 §157-1 內線交易或洩密。"],"pos":0.83735,"w":1},{"id":"E-471","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"投信投顧公會會員對於公司負責人與受僱人基於職務關係而獲悉公開發行公司尚未公開的重大消息，應如何規範？","opts":["應訂定內部處理程序","獲悉消息者應立即向公司指定人員或部門提出書面報告","(1)及(2)","以上皆非"],"ans":3,"exp":["📝 解析：依投信投顧公會規範，會員應訂定未公開重大消息的內部處理程序，獲悉者應立即向公司指定人員或部門提出書面報告，以防內線交易。"],"pos":0.83813,"w":1},{"id":"E-509","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"資本市場是信用市場，市場參與者相互間的信用是市場存在的基礎及價值，因此，證券交易法對於破壞市場信用的行為，通常會處以最嚴厲的處分，下列何者不屬於破壞市場信用的行為？","opts":["內線交易","人為操縱股價","員工加班不依法給加班費","有價證券之募集、發行、私募或買賣有虛偽、詐欺或其他足致他人誤信之行為"],"ans":3,"exp":["📝 解析：內線交易、操縱股價、募集發行買賣有虛偽詐欺均屬證交法 §157-1、§155、§20 規範的破壞市場信用行為；未給加班費屬勞基法問題，與市場信用無關。"],"pos":0.83891,"w":1},{"id":"E-518","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員基於職務關係而獲悉與業務相關，但尚未公開之重大消息時，應如何處理?","opts":["可事前散發消息給客戶","只洩露給親朋好友","不得為自己、客戶、其他第三人利用該未公開之重大消息獲利","自己私下獲利"],"ans":3,"exp":["📝 解析：依證交法 §157-1 內線交易禁止規定，獲悉未公開重大消息者不得為自己、客戶或第三人利用該消息買賣獲利，也不得洩露給他人。"],"pos":0.83969,"w":1},{"id":"E-530","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為發揚自律精神，應共同信守之規範，下列何者除外？","opts":["董監事對與本人有利害關係之交易，自行迴避","對客戶之資料，除基於法令規定外，應保守秘密","爭取業務時，與相關公司或人員間有不當利益之約定或收受","不以脅迫、利誘或其他不正當方式，獲取其他同業之行銷機密或其交易人相對資料"],"ans":3,"exp":["📝 解析：爭取業務時與相關公司或人員約定或收受不當利益屬利益衝突與不當得利，違反自律規範；其餘三項（迴避、保密、不以不正方法取得同業機密）皆應信守。"],"pos":0.84047,"w":1},{"id":"E-536","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員基於職務之故而獲悉與業務相關尚未公開之重大消息時，應如何處理？","opts":["利用所得之資訊為自己取得最佳之利益","將該未公開資訊提供給自己的客戶，以牟取利益","基於職業道德規範，重大消息未公開之前不應利用該資訊獲取利益，且資訊之運用須符合法令規定","利用此未公開資訊為自己、客戶或自己的親友作內線交易以獲取利益"],"ans":3,"exp":["📝 解析：依證交法 §157-1，未公開重大消息不得用於自己、客戶或親友交易獲利，資訊運用須符合法令，其餘選項都構成內線交易。"],"pos":0.84125,"w":1},{"id":"E-550","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"對於金融從業人員之行為，下列何者為非？","opts":["不應利用公司內部資訊為自己謀取利益","可與客戶約定分享利益或共同承擔損失","不可利用客戶帳戶或名義為自己從事交易","不可將他人或自己帳戶供客戶從事交易"],"ans":2,"exp":["📝 解析：與客戶約定分享利益或共同承擔損失屬法令明文禁止的行為（如證券商負責人與業務人員管理規則），故(2)錯誤。"],"pos":0.84202,"w":1},{"id":"E-561","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於推介或銷售投資型金融商品時，不得有下列何者行為？","opts":["向業者收受佣金回扣","未經客戶授權，擅自為客戶進行交易","私自挪用客戶款項","以上皆是"],"ans":4,"exp":["📝 解析：收受業者佣金回扣、未經授權代客交易、挪用客戶款項均屬違法或違反職業道德的行為，三者都不得為之。"],"pos":0.8428,"w":1},{"id":"E-565","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不得接受上市、上櫃公司、證券承銷商所提供利益或其它利益?","opts":["各金融事業公會會員","金融事業負責人","金融從業人員","以上皆是"],"ans":4,"exp":["📝 解析：為避免利益衝突，公會會員、金融事業負責人及從業人員都不得接受上市櫃公司或承銷商提供的利益，三者皆是。"],"pos":0.84358,"w":1},{"id":"E-570","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員自律規範中，有關個人交易須申報的帳戶規範對象為：","opts":["以自己名義開立之帳戶","配偶之帳戶","配偶利用他人名義持有者之他人帳戶","以上皆是"],"ans":4,"exp":["📝 解析：個人交易申報範圍包括本人名義帳戶、配偶帳戶，以及配偶利用他人名義持有的帳戶，以防規避利益衝突控管。"],"pos":0.84436,"w":1},{"id":"E-571","s":"all","ch":"道德｜利益衝突與內線交易","star":1,"n":1,"refs":"","tag":"","stem":"吳自強是一位證券分析人員，他從上市公司 ABC 的員工處得知 ABC 產品設計發生重大瑕疵，並且主要客戶因此已經取消大部分的訂單。吳自強發現該消息尚未公佈，吳自強應該：","opts":["立即向公司指定人員或部門提出書面報告","透露消息給報章雜誌媒體","依據公平公正原則通知所有客戶","通知親朋好友放空該 ABC 公司股票"],"ans":1,"exp":["📝 解析：獲悉未公開重大消息應立即向公司指定人員或部門書面報告，不得洩露或利用；告知媒體、客戶或親友放空都可能觸犯證交法 §157-1。"],"pos":0.84514,"w":1},{"id":"E-015","s":"all","ch":"道德｜客戶資料保密與個資","star":1,"n":1,"refs":"","tag":"","stem":"證券商之業務人員平常執行業務，下列敘述何者為正確？","opts":["基於業務之便，可以任意調閱客戶資料","工作時無意間看見公司機密，基於服務客戶與利益共享，
