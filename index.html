"opts":["財政部","法務部調查局","金融監督管理委員會","警察局"],"ans":2,"exp":["📝 解析：依洗錢防制法，金融機構發現疑似洗錢交易，應向法務部調查局（洗錢防制處）申報。"],"pos":0.42957,"w":1},{"id":"M-536","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融機構在辦理達一定金額以上之通貨交易申報時，應於交易發生後之幾個「營業日」內， 向哪一個法定的指定機構完成申報？","opts":["三個營業日內，向中央銀行申報",")五個營業日內，向法務部調查局申報","七個營業日內，向金融監督管理委員會申報","十個營業日內， 向內政部警政署申報"],"ans":2,"exp":["📝 解析：依金融機構防制洗錢辦法，新台幣50萬元以上通貨交易應於交易完成後5個營業日內向法務部調查局申報。"],"pos":0.43035,"w":1},{"id":"M-102","s":"all","ch":"常識｜其他","star":1,"n":1,"refs":"","tag":"","stem":"下列何者係指金融資產之變現能力或指無法以合理價格軋平部位所產生之風險？","opts":["作業風險","信用風險","市場風險","流動性風險"],"ans":4,"exp":["📝 解析：流動性風險指資產無法及時以合理價格變現，或無法以合理價格軋平部位所生的風險；作業、信用、市場風險定義不同。"],"pos":0.43113,"w":1},{"id":"M-119","s":"all","ch":"常識｜其他","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是市場風險(Market risk)?","opts":["利率之變化","通貨膨脹率之變化","特定企業之營運變化","全球石油危機"],"ans":3,"exp":["📝 解析：市場風險（系統性風險）來自利率、通膨、全球能源危機等影響全體市場的因素；特定企業營運變化屬個別（非系統）風險，可分散。"],"pos":0.43191,"w":1},{"id":"M-555","s":"all","ch":"常識｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在資訊不完全的競爭性投標或拍賣中，贏得標案的人往往因為對該資產的估值過於樂觀，導致最終標價高於資產的內在價值（或市場公認價值）。試問：這種「得標即虧損」或「支付過高代價」的心理與經濟現象，在財務學上稱為什麼？","opts":["羊群效應","贏家的詛咒","沉沒成本謬誤","公地悲劇"],"ans":2,"exp":["📝 解析：贏家的詛咒指競標中得標者往往是估值最樂觀的人，因而出價過高，最終付出超過資產內在價值的代價。"],"pos":0.43268,"w":1},{"id":"M-556","s":"all","ch":"常識｜其他","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在行為財務學中，「股市動能」指的是資產價格在一段時間內呈現「強者恆強、弱者恆弱」的趨勢。下列關於投資人行為與動能現象的敘述，何者不屬於或無法解釋股市動能現象？","opts":["投資人存在「處置效果」，傾向過早賣出獲利股票並長期持有虧損股票","市場呈現「強者恆強、弱者恆弱」的價格延續趨勢","投資人為了讓帳面美觀，急於買入帳面已獲利的股票，但因不願實現損失而賣出賠錢股票","投資人具備「損失趨避」心理，對損失的痛苦感遠大於相同金額獲利的快樂感"],"ans":3,"exp":["📝 解析：選項(3)把處置效果扭曲成刻意買進已獲利股票美化帳面，概念錯置，無法解釋動能；處置效果與損失趨避常被用來解釋價格延續。"],"pos":0.43346,"w":1},{"id":"E-011","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"為提供多元化之服務，金融從業人員：","opts":["得保管客戶之存摺及印章，以代其進行資金調度","得代客戶提領保證金以省卻客戶舟車勞頓之苦","得代領對帳單，並於日後面交客戶","應提供客戶多元化商品資訊"],"ans":4,"exp":["📝 解析：從業人員不得保管客戶存摺印章、代領保證金或對帳單，以免挪用與糾紛；應做的是提供客戶多元化商品資訊。"],"pos":0.43424,"w":1},{"id":"E-023","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"證券商之從業人員應該如何充實自己，以建立「證券專業」的形象，並以專業服務客戶？","opts":["藉由培養閱讀專業報章雜誌的習慣、參加相關專業的教育訓練、取得專業證照，以充實自己的專業知識","多加利用自己本身獲取的內線消息，幫助客戶賺錢","以贈品來博取客戶對自己的好感","善用自己本身的人情攻勢，來行銷商品"],"ans":1,"exp":["📝 解析：專業形象靠持續閱讀、參加訓練與取得證照累積；利用內線消息違法，以贈品或人情攻勢行銷則不是以專業服務客戶。"],"pos":0.43502,"w":1},{"id":"E-043","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事業務推廣與招攬時，應秉持之原則，下列何者為錯誤？","opts":["誠實信用原則","客戶資料保密原則","利益迴避原則","利潤至高原則"],"ans":4,"exp":["📝 解析：招攬應秉持誠實信用、客戶資料保密、利益迴避等原則；利潤至高原則把業者利益放在客戶之前，違反職業道德。"],"pos":0.4358,"w":1},{"id":"E-046","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於執行業務時，下列何者為是？","opts":["適時提供其他客戶相關的資料以供參考","應先向客戶收取保證金以避免客戶流失","向客戶提供有關公司之充分資料，應包括公司之營業地址、公司營業之種類與限制","為提供完善服務，儘可能保管客戶之有價證券、款項、印鑑或存摺"],"ans":3,"exp":["📝 解析：應向客戶揭露公司營業地址、業務種類與限制等資料；提供他客戶資料違反保密，預收保證金及代保管有價證券、印鑑、存摺皆不允許。"],"pos":0.43658,"w":1},{"id":"E-049","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非為專業之金融從業人員應有之行為？","opts":["提供客戶良好的服務品質","提供符合客戶需求之商品","確認並瞭解客戶之需求","以自己的利益優先考量，進而侵占客戶利益"],"ans":4,"exp":["📝 解析：從業人員應以客戶利益為優先，以自身利益為先甚至侵占客戶利益，違反忠實義務並可能涉及刑責。"],"pos":0.43735,"w":1},{"id":"E-051","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員與客戶維持良好關係，最主要的基礎是？","opts":["有服務的熱誠與專業能力","經常送禮","提供內線消息","以上皆非"],"ans":1,"exp":["📝 解析：與客戶的長久關係建立在服務熱誠與專業能力上；經常送禮屬不當利誘，提供內線消息則違反證交法 §157-1。"],"pos":0.43813,"w":1},{"id":"E-053","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員提供客戶相關建議前，下列行為何者為非","opts":["充分收集相關資料","審慎分析各種商品特性","無須做任何事先準備","考量客戶之經濟能力"],"ans":3,"exp":["📝 解析：提供建議前應蒐集資料、分析商品特性並考量客戶經濟能力；毫無準備就給建議違反專業原則。"],"pos":0.43891,"w":1},{"id":"E-056","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於業務推廣與招攬時，要成為專業從業人員除須符合特定的專業技術認可外，尚須具備下列何一重要條件：","opts":["崇高的道德水準","創造大量的業績","廣泛的人際關係","以上皆非"],"ans":1,"exp":["📝 解析：專業從業人員除具備專業技術認可外，還須有崇高的道德水準；業績多寡與人際關係並非專業的核心條件。"],"pos":0.43969,"w":1},{"id":"E-060","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"客戶得不到好的意見，錯買了非需要之金融商品，主要歸因於：","opts":["從業人員欠缺必要的知識","從業人員欠缺專業倫理道德","客戶過於信任從業人員，未盡瞭解相關資訊內容","以上皆是"],"ans":4,"exp":["📝 解析：客戶錯買不需要的商品，可能源於從業人員專業不足或欠缺倫理，也與客戶過度信任、未瞭解資訊有關，三者皆是成因。"],"pos":0.44047,"w":1},{"id":"E-066","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員推廣業務時，應遵守下列何種事項？","opts":["注意服裝儀容","配帶明確標示公司名稱之名牌及名片","應妥善保管申請人資料，不得挪作他用","以上皆是"],"ans":4,"exp":["📝 解析：推廣業務應注意儀容、配戴標明公司名稱之名牌與名片，並妥善保管申請人資料不挪作他用，三者皆是。"],"pos":0.44125,"w":1},{"id":"E-068","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行業務時，不應有下列何種行為？","opts":["登載損害同業信譽之廣告","故意毀損同業之申請書架","故意破壞同業之各項宣傳品","以上皆是"],"ans":4,"exp":["📝 解析：登載損害同業信譽之廣告、毀損同業申請書架或破壞宣傳品，都是不公平競爭行為，三者皆不應為。"],"pos":0.44202,"w":1},{"id":"E-138","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員提供客戶服務並維持必要的知識及技能，此為下列何者原則？","opts":["誠信原則","忠實義務原則","保密原則","專業原則"],"ans":4,"exp":["📝 解析：維持執行業務所需的知識與技能並以此服務客戶，屬專業原則的要求。"],"pos":0.4428,"w":1},{"id":"E-140","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"接受客戶受託執行之業務，何者得為之？","opts":["明顯違反相關法令規定者","收受客戶酬庸，而未損及公司利益者","未經主管機關核准承辦之業務活動","符合相關法令規定，且業經主管機關核准之業務"],"ans":4,"exp":["📝 解析：只能承辦符合法令且經主管機關核准之業務；違反法令、收受客戶酬庸或未經核准之業務皆不得為之。"],"pos":0.44358,"w":1},{"id":"E-145","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於受託執行業務時，下列何者正確？","opts":["盡一切可能確認並瞭解客戶的需求，如同處理自己業務一般","盡全力持守榮譽及廉潔以維護所屬公司之信譽","應遵守專業行為規範","以上皆是"],"ans":4,"exp":["📝 解析：盡力瞭解客戶需求如同處理自己業務、維護所屬公司信譽、遵守專業行為規範，都是受託執行業務的正確態度。"],"pos":0.44436,"w":1},{"id":"E-148","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬善良管理人之原則？","opts":["為客戶適度分散投資風險","集中購買單一投資商品","以高獲利高風險商品為推介目標","未告知投資風險"],"ans":1,"exp":["📝 解析：善良管理人應盡合理注意，為客戶適度分散投資風險；集中單一商品、偏重高風險或未告知風險都不符合。"],"pos":0.44514,"w":1},{"id":"E-149","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應以自己的專業知識替客戶選擇合適的商品，在執行時應遵守之原則為？","opts":["最大誠信原則","從業人員利益最大化原則","金融商品風險最大化原則","以上皆是"],"ans":1,"exp":["📝 解析：以專業替客戶選擇商品應本最大誠信原則；追求從業人員利益或風險最大化都違反職業道德。"],"pos":0.44591,"w":1},{"id":"E-151","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員幫客戶遞送契約或申請書時，發現客戶於文件上遺漏簽名，下列行為何者為非？","opts":["通知客戶至公司營業場所親自補簽","不用通知，自行幫客戶簽名","親自送自客戶家中，請客戶親自補簽","與客戶於約定地點，送請客戶親自補簽"],"ans":2,"exp":["📝 解析：文件漏簽須由客戶本人補簽；從業人員自行代簽屬偽造文書，其餘請客戶親自補簽的方式都可行。"],"pos":0.44669,"w":1},{"id":"E-153","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理衍生性商品業務時，應本持下列何項原則？","opts":["誠信原則","守法原則","善良管理原則","以上皆是"],"ans":4,"exp":["📝 解析：辦理衍生性商品業務應秉持誠信、守法與善良管理原則，三者皆是。"],"pos":0.44747,"w":1},{"id":"E-162","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行業務時，應本持下列何者原則？","opts":["善良管理原則","保密原則","誠信公正原則","以上皆是"],"ans":4,"exp":["📝 解析：執行業務應秉持善良管理、保密及誠信公正原則，三者皆是。"],"pos":0.44825,"w":1},{"id":"E-172","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"客戶申辦業務檢附之文件內含瑕疵時，下列敘述何者正確？","opts":["應確實檢視，審慎評估處理方式","應視與客戶之交情決定受理與否","仍照常予辦理，並向客戶示意要求其提供酬謝金或封口費","以上皆非"],"ans":1,"exp":["📝 解析：文件有瑕疵時應確實檢視並審慎評估處理方式（如請客戶補正）；依交情決定受理或索取酬謝金、封口費皆不當。"],"pos":0.44903,"w":1},{"id":"E-173","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"王大明是一位證券分析人員，因為在餐廳吃飯時偶然聽到日日紅公司員工的談話，回辦公室後就把分析報告中對日日紅公司股票的建議由買進改為賣出。王大明違反了什麼原則？","opts":["保密原則","公平原則","專業原則","忠實誠信原則"],"ans":3,"exp":["📝 解析：分析報告應以審慎專業分析與合理依據為基礎；憑偶然聽到的片段談話就改變投資建議違反專業原則，若屬未公開重大消息更涉內線交易。"],"pos":0.44981,"w":1},{"id":"E-217","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應提供客戶充足且必要之資訊，須告知客戶投資之風險及其所從事投資之決定或交易過程。此為以下何項原則？","opts":["資訊公開原則","能力原則","保密原則","客觀性原則"],"ans":1,"exp":["📝 解析：提供充足必要資訊、告知投資風險及投資決定或交易過程，正是資訊公開原則的定義；能力、保密、客觀性原則各有不同內涵。"],"pos":0.45058,"w":1},{"id":"E-218","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應秉持下列何種原則以提供客戶充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之相關資訊，並向客戶快速揭露最新之資訊？","opts":["專業誠信原則","資訊公開原則","善良管理原則","守法原則"],"ans":2,"exp":["📝 解析：資訊公開原則要求提供客戶充足必要資訊、告知風險與投資決定或交易過程，並快速揭露最新資訊。"],"pos":0.45136,"w":1},{"id":"E-222","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"從業人員提供客戶充足必要的資訊，告知客戶投資的風險及從事投資決定或交易過程之實質資訊等，是屬於下列何種職業道德原則？","opts":["客觀原則","資訊公開原則","利益衝突原則","保密原則"],"ans":2,"exp":["📝 解析：提供充足必要資訊並告知投資風險、投資決定或交易過程的實質資訊，屬資訊公開原則。"],"pos":0.45214,"w":1},{"id":"E-224","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"從業人員接受客戶的委託後應符合資訊公開原則來提供服務，何謂資訊公開原則？","opts":["提供客戶充足必要、投資可能的風險及投資決定等相關資訊","為提供最佳的服務，可將所有的資訊均反應給客戶","將所有未公開的資訊提供給客戶作內線交易","將客戶的資料提供給相關合作廠商"],"ans":1,"exp":["📝 解析：資訊公開原則是提供客戶充足必要、與投資風險及投資決定相關的資訊；不是把所有資訊（含未公開消息）都給客戶，更不得外洩客戶資料。"],"pos":0.45292,"w":1},{"id":"E-226","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"目前金融商品多樣化，客戶做任何投資或購買各種金融商品，最需要的就是金融商品的資訊，我們應該如何做資訊揭露？","opts":["提供給客戶足夠的資訊","提供給客戶從事投資決定或交易過程應有的資訊","告知客戶投資的風險，並快速揭露最新資訊","以上皆是"],"ans":4,"exp":["📝 解析：資訊揭露應提供足夠資訊、提供投資決定與交易過程應有的資訊，並告知風險、快速揭露最新資訊，三者都是資訊公開原則內容。"],"pos":0.4537,"w":1},{"id":"E-227","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"在提供專業服務過程中，從業人員不得有下列哪些行為？","opts":["任何欺瞞、詐騙行為","不實陳述或故意做錯","誤導客戶","以上皆是"],"ans":4,"exp":["📝 解析：欺瞞詐騙、不實陳述或故意做錯、誤導客戶都違反誠信原則，提供專業服務時一律禁止。"],"pos":0.45447,"w":1},{"id":"E-229","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員提供充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之資訊，不包括？","opts":["交易標的投資風險","交易標的之市場流通性","其他銷售公司之獲利能力","投資所收取之費用"],"ans":3,"exp":["📝 解析：應揭露的是與客戶投資決策相關的資訊，如投資風險、市場流通性與費用；其他銷售公司的獲利能力與客戶投資無直接關聯，不在必要資訊之列。"],"pos":0.45525,"w":1},{"id":"E-231","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"各上市上櫃公司金融服務業應於何處揭露其所訂定之道德行為準則？","opts":["年報","公開說明書","公開資訊觀測站","以上皆是"],"ans":4,"exp":["📝 解析：依上市上櫃公司訂定道德行為準則參考範例，公司應於年報、公開說明書及公開資訊觀測站揭露其道德行為準則，故皆是。"],"pos":0.45603,"w":1},{"id":"E-232","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬金融從業人員之資訊公開原則？","opts":["告知客戶投資風險","告知客戶從事投資決定之相關資訊","告知客戶交易過程之相關資訊","以上皆是"],"ans":4,"exp":["📝 解析：資訊公開原則包括告知客戶投資風險、投資決定相關資訊及交易過程相關資訊，故皆是。"],"pos":0.45681,"w":1},{"id":"E-266","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員張三因疏忽未依客戶指示買賣，結帳時才發現錯誤，下列哪一種處理方式較正確?","opts":["請客戶念在多年交情，承認該筆交易","視損益情況，如果獲利可不用處理","誠實告知客戶及公司,協商解決方法","將錯就錯，等客戶發現再處理"],"ans":3,"exp":["📝 解析：因疏忽未依指示交易應誠實告知客戶及公司並協商解決；以交情施壓、看盈虧決定處理或將錯就錯，都違反誠信與忠實義務。"],"pos":0.45759,"w":1},{"id":"E-267","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員面臨客戶交易虧損時，如何處理才適當?","opts":["保證與客戶共同承擔損失","竄改客戶交易資料、美化帳單","為免責備、避不見面","以誠懇的態度告知客戶實際狀況"],"ans":4,"exp":["📝 解析：客戶虧損時應誠懇告知實際狀況；保證共擔損失為法規禁止，竄改帳單屬偽造，避不見面則是失職。"],"pos":0.45837,"w":1},{"id":"E-268","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員因個人疏忽，未在申購截止日前向公司提出客戶之商品申購書，下列何者敘述為正確處理態度?","opts":["銷毀客戶的申購書,假裝沒有這回事","誠實告知客戶及公司，協商解決方法","宣稱已繳件，推諉是收件經辦遺失申購書","視客戶態度來決定避不見面或告知協商"],"ans":2,"exp":["📝 解析：個人疏失致未及申購應誠實告知客戶及公司協商解決；銷毀申購書、推諉他人或避不見面都違反誠信原則。"],"pos":0.45914,"w":1},{"id":"E-290","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行業務，以下何種行為是正確的？","opts":["有偽造之行為","有詐欺之行為","有足致客戶誤信之行為","應秉忠實信用原則處理事務"],"ans":4,"exp":["📝 解析：執行業務應秉忠實信用原則處理事務；偽造、詐欺及足致客戶誤信之行為都屬禁止。"],"pos":0.45992,"w":1},{"id":"E-291","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員不得有下列何者足致客戶誤信之行為？","opts":["偽造相關文件","故意誤導客戶所投資運用標的之風險","故意誤導客戶收取之費用及其付款方式","以上皆是"],"ans":4,"exp":["📝 解析：偽造文件、故意誤導投資標的風險、故意誤導費用與付款方式，都屬足致客戶誤信的行為，皆不得為。"],"pos":0.4607,"w":1},{"id":"E-292","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行業務何種行為符合誠實原則？","opts":["對於客戶未來投資報酬，故意提供不適當之預測","誤導客戶可能之績效","對所投資產品之價值正確詳實記錄","誤導客戶所投資運用標的之風險"],"ans":3,"exp":["📝 解析：對所投資產品價值正確詳實記錄符合誠實原則；故意提供不當報酬預測、誤導績效或風險都違反誠實原則。"],"pos":0.46148,"w":1},{"id":"E-294","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"應以誠信之態度提供專業服務，誠信係由誠實與公正所組合，不能附屬於個人利益， 以上敘述屬於何項原則？","opts":["資訊公開原則","誠信原則","客觀性原則","能力原則"],"ans":2,"exp":["📝 解析：誠信原則強調誠實與公正、不附屬於個人利益，正是題幹描述的定義。"],"pos":0.46226,"w":1},{"id":"E-298","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為金融從業人員應有之行為？","opts":["私自從事未經主管機關核准之業務","故意隱瞞有重大喪失債信情事","隱匿尚有未執行完畢之刑事責任","不得私自於同業兼任相關職務"],"ans":4,"exp":["📝 解析：不得私自於同業兼任相關職務，以免利益衝突與洩密；私自從事未核准業務、隱瞞債信喪失或未執行完畢的刑責都違反規範。"],"pos":0.46304,"w":1},{"id":"E-303","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融機構對交易對手承諾事項負有進行交易之義務，係基於下列何種原則？","opts":["專業原則","保密原則","忠實誠信原則","管理謹慎原則"],"ans":3,"exp":["📝 解析：對交易對手承諾的事項負有履行交易的義務，是忠實誠信原則的體現，維繫市場信賴。"],"pos":0.46381,"w":1},{"id":"E-304","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"對公司有控制能力之法人股東，應訂定相關之執行職務守則以為遵循，此為擔任董事、監察人之何種義務？","opts":["忠實與注意義務","保密義務","善良管理義務","守法義務"],"ans":1,"exp":["📝 解析：依上市上櫃公司治理實務守則，有控制能力的法人股東擔任董事、監察人時應踐行忠實與注意義務，並訂定代表人執行職務守則。"],"pos":0.46459,"w":1},{"id":"E-305","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"對公司有控制能力之法人股東或其代表人，於參加股東會應本於何項原則，行使其投票權？","opts":["誠信原則","能力原則","善良管理原則","守法原則"],"ans":1,"exp":["📝 解析：依上市上櫃公司治理實務守則，有控制能力的法人股東代表人參加股東會，應本於誠信原則及所有股東最大利益行使投票權。"],"pos":0.46537,"w":1},{"id":"E-306","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應遵守善良管理原則，故應盡善良管理人之責任及注意義務。以下何者為是？","opts":["不管客戶風險","不提供客戶服務","對客戶說謊","為客戶適度分散風險， 並提供最佳之專業服務"],"ans":4,"exp":["📝 解析：善良管理人注意義務要求以專業審慎態度為客戶適度分散風險並提供最佳服務；不顧風險、不提供服務、說謊都違反之。"],"pos":0.46615,"w":1},{"id":"E-307","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"身為金融從業人員應保持尊嚴，不得有玷辱職業信譽之任何行為，且與委託人間應有之約定，應如何應對？","opts":["可以違反","視情況違反","不得違反","以上皆非"],"ans":3,"exp":["📝 解析：從業人員應保持尊嚴並遵守與委託人間的約定，不得違反，這是誠信與守約的基本要求。"],"pos":0.46693,"w":1},{"id":"E-309","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"客戶將資產委託給金融從業人員從事投資，身為一位優秀的金融從業人員，應為公司及客戶盡何種責任及義務？","opts":["善良管理人之責任及注意義務","提供內線交易","隨時透露客戶財產狀況給其他人","以上皆非"],"ans":1,"exp":["📝 解析：受託投資應盡善良管理人之責任及注意義務；提供內線交易、透露客戶財產狀況都違法。"],"pos":0.4677,"w":1},{"id":"E-311","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員若有代為收付金錢之行為者應遵守下列何項行為規範？","opts":["收現但轉以自己之支票付款","收到客戶款項應馬上歸繳公司","收到隔幾天再給公司","存於自己帳戶再處理"],"ans":2,"exp":["📝 解析：代收款項應馬上歸繳公司，避免挪用或延誤；改以自己支票付款、延後繳交或存入自己帳戶都屬違規。"],"pos":0.46848,"w":1},{"id":"E-313","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"有關忠實義務原則下列何者正確？","opts":["客戶利益優先","衝突避免、禁止短線交易","禁止不當得利、公平處理","以上皆是"],"ans":4,"exp":["📝 解析：忠實義務原則包括客戶利益優先、避免衝突、禁止短線交易、禁止不當得利及公平處理，故皆是。"],"pos":0.46926,"w":1},{"id":"E-314","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於公司之相關資產，不應採取何種態度？","opts":["以非法手段取得後成為私人財產","使用於正當目的","無論有形或無形資產皆有責任加以保護","不得疏忽大意或浪費"],"ans":1,"exp":["📝 解析：公司有形與無形資產都應保護並用於正當目的、不得疏忽浪費；以非法手段據為己有屬侵占。"],"pos":0.47004,"w":1},{"id":"E-315","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在銷售金融商品時，應對銷售之商品詳細說明，不得為業績而隱藏不告知金融商品應有之風險，係屬何種原則？","opts":["誠實信用原則","內線交易原則","服務原則","善良風俗原則"],"ans":1,"exp":["📝 解析：詳細說明商品且不為業績隱藏風險，屬誠實信用原則；其他選項並非對應此要求的職業道德原則。"],"pos":0.47082,"w":1},{"id":"E-316","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員基於招攬業務時，應秉持誠實信用原則，下列行為何者不屬誠實信用原則？","opts":["客戶對商品有不懂之處應再仔細說明","商品一旦售出，即使客戶對商品內容有疑問也置之不理","客戶交給我們的資料，不可隨意散播","以上皆是"],"ans":2,"exp":["📝 解析：商品售出後對客戶疑問置之不理違反誠實信用原則；仔細說明與保密客戶資料都是正確行為。"],"pos":0.4716,"w":1},{"id":"E-334","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對誰負有忠實誠信義務？","opts":["所有投資大眾","客戶","公司股東","以上皆是"],"ans":2,"exp":["📝 解析：忠實誠信義務的對象是委任的客戶，應以客戶利益為優先。"],"pos":0.47237,"w":1},{"id":"E-337","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"李四是一位證券分析師，於電視上向觀眾分析產業趨勢時，宣稱他取得國外某知名大學商學院MBA 學位，但事實上，李四僅於該校取得商學院學分課程，且真實學歷僅限於國內大學經濟系學士學位。試問李四違反以下哪一原則？","opts":["專業原則","保密原則","公平競爭原則","忠實誠信原則"],"ans":4,"exp":["📝 解析：對外誇大不實學歷以取信觀眾屬虛偽陳述，違反忠實誠信原則。"],"pos":0.47315,"w":1},{"id":"E-338","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"忠實誠信義務原則之主要涵義為：","opts":["客戶利益優先","公司利益優先","個人利益優先","以上皆是"],"ans":1,"exp":["📝 解析：忠實誠信義務的核心是客戶利益優先，公司或個人利益不得凌駕客戶利益。"],"pos":0.47393,"w":1},{"id":"E-342","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業推動重點業務或專案，不符客戶或從業人員之利益時，從業人員應採取之態度？","opts":["消極抵抗","設法將利益移轉給客戶","不合則去","勇於建言，提供個人專業意見"],"ans":4,"exp":["📝 解析：公司重點業務若不符客戶或從業人員利益，應循正當管道勇於建言、提供專業意見；消極抵抗、私下移轉利益或一走了之都不是負責任的作法。"],"pos":0.47471,"w":1},{"id":"E-343","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬業務時遇市場對手競爭時，應保持如何態度？","opts":["惡意攻訐同業","以平常心，給予客戶專業建議","刻意扭曲，陷人錯誤判斷","隱惡揚善，規避責任"],"ans":2,"exp":["📝 解析：面對同業競爭應公平競爭、以專業建議服務客戶；惡意攻訐、扭曲事實誤導客戶、隱惡揚善規避責任都違反誠信與公平競爭原則。"],"pos":0.47549,"w":1},{"id":"E-351","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員張三這個月的業績只差 500 萬元就達到業績目標，為能達到門檻領到目標獎金，張三應採用下列何種方式較為適當：","opts":["勸誘客戶李四申購商品並保證獲利","商請另一位從業人員轉單給自己，約定獎金分享","借用客戶名義申購商品，領到獎金再贖回","積極拓展業務、爭取客戶，以達到業績目標"],"ans":4,"exp":["📝 解析：應以正當方式積極拓展業務；保證獲利違反禁止保證收益規定，轉單分獎金、借客戶名義申購再贖回則屬虛增業績與冒名交易，均違規。"],"pos":0.47626,"w":1},{"id":"E-356","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是金融服務事業之從業人員關於職業道德的基本條件？","opts":["法令規章遵循","專業之資格、技能、態度、與服務","擅長交際應酬","品德、誠信、責任、與保密"],"ans":3,"exp":["📝 解析：職業道德的基本條件是法令遵循、專業資格技能與服務態度、品德誠信責任與保密；擅長交際應酬並非職業道德要件。"],"pos":0.47704,"w":1},{"id":"E-358","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業之業務人員面對本身業績與公司規定衝突時，應該如何面對？","opts":["為了本身業績考量，可以忽略它","以公司的規定為主","先把公司提供的金融商品或服務銷售出去，再向上級反應","以上皆非"],"ans":2,"exp":["📝 解析：業績壓力不能凌駕公司規定與內控，應以公司規定為主；為業績忽略規定，或先銷售再向上反應，都是違規行為。"],"pos":0.47782,"w":1},{"id":"E-382","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"客戶利益優先及禁止不當得利是屬於下列何者原則？","opts":["公開原則","忠實義務原則","保密原則","能力原則"],"ans":2,"exp":["📝 解析：忠實義務原則要求以客戶利益為優先、不得利用職務不當得利；公開原則重資訊揭露，保密原則重資料保護，能力原則重專業。"],"pos":0.4786,"w":1},{"id":"E-383","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列就金融從業人員之敘述何者為非？","opts":["與自身利益相關的業務應該迴避","因業務知悉公司股票將上漲，不可以事先買進","客戶的餽贈不能收受","只要對公司有益， 所有法律規範可以先行放下"],"ans":4,"exp":["📝 解析：守法是職業道德的底線，不能因對公司有利就擱置法律；迴避自身利益相關業務、不做內線交易、不收客戶餽贈都正確。"],"pos":0.47938,"w":1},{"id":"E-385","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員基於維護公司利益不應有何種表現？","opts":["知悉授信客戶財務狀況惡化，應立即告知主管，並加以妥善處理","當利率可能出現鉅幅波動而侵蝕公司獲利時，應主動告知主管","不得收受競爭對手之酬庸，以洩露公司內部機密","為了績效考量，隱瞞自身職務之缺失"],"ans":4,"exp":["📝 解析：主動回報授信客戶惡化與利率風險、不收競爭對手酬庸洩密都是維護公司利益；為績效隱瞞自身職務缺失會擴大損害，不應為之。"],"pos":0.48016,"w":1},{"id":"E-433","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"證券商之從業人員，如發現公司內部有違反法令規章或職業道德之情事時，下列何者是最好的作法？","opts":["與自己沒有利害關係，假裝沒有看到","私下告訴同業的朋友","立刻向公司總經理或董事長或其他適當人員呈報","直接向檢調機關檢舉"],"ans":3,"exp":["📝 解析：發現公司內部違法或違反職業道德情事，應立即向總經理、董事長或稽核法遵等適當人員呈報，循內部機制處理；視而不見或私下告訴同業都不當。"],"pos":0.48093,"w":1},{"id":"E-451","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"身為金融從業人員不得有下列何種行為？","opts":["對客戶委託交易事項嚴加保密","對職務上所知悉之秘密，盡其保密之責","對外散播誇大、偏頗或不實之訊息，有礙金融市場之穩定","對於所擁有、使用、管理或交易之紀錄資料保持合理之正確性及完整性"],"ans":3,"exp":["📝 解析：對外散播誇大、偏頗或不實訊息會影響金融市場穩定，甚至涉及證交法散布流言；保密委託事項、維持紀錄正確完整則是應盡義務。"],"pos":0.48171,"w":1},{"id":"E-480","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員行為準則下列何者正確？","opts":["在法律範圍內自由經營","在道德範圍內自由經營","不影響公眾利益自由經營","以上皆是"],"ans":4,"exp":["📝 解析：從業人員可在法律、道德範圍內且不影響公眾利益的前提下自由經營業務，三項界線同時適用。"],"pos":0.48249,"w":1},{"id":"E-488","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於執行業務時，下列敘述何者正確?","opts":["不得同意或默許他人使用自己之名義執行業務","經主管要求，得同意他人使用自己之名義執行業務","為公司業績考量，得默許他人使用自己之名義執行業務","未考取執照前，得借用其他業務員名義執行業務"],"ans":1,"exp":["📝 解析：從業人員不得同意或默許他人使用自己名義執行業務，也不得借用他人名義；即使主管要求或為了業績亦同，各業管理規則皆明文禁止。"],"pos":0.48327,"w":1},{"id":"E-491","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為金融從業人員應有的職業道德?","opts":["對於內部業務人員之違規事件，應主動向主管報告","對於內部業務人員之違規事件，應代為掩護以維持同事情誼","對於內部業務人員之違規事發暗自竊喜並落井下石","對於同業之違規應大加韃伐，自家公司違規則無所謂"],"ans":1,"exp":["📝 解析：發現內部人員違規應主動向主管報告，不可代為掩護、落井下石，或對同業與自家公司採雙重標準。"],"pos":0.48405,"w":1},{"id":"E-492","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"關於金融服務業之敘述，下列何者為非?","opts":["得秉持誠信公平原則，儘速處理交易糾紛","得從事地下金融活動以牟取客戶及公司之最大利益","得確實遵守洗錢防制法及相關規定","得建立完備的內控內稽制度並確實執行"],"ans":2,"exp":["📝 解析：金融服務業應秉持誠信公平處理糾紛、遵守洗錢防制法、落實內控內稽；從事地下金融活動屬違法行為。"],"pos":0.48482,"w":1},{"id":"E-494","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應確實遵守法令規範，如有觸法經主管機關發函要求暫停職務者，則下列行為何者適當?","opts":["為不影響客戶權益，照常執行業務","依法暫停執行業務並自我改進","借用其他業務人員之名義執行業務","以未收到發函為藉口，拒絕暫停執行業務"],"ans":2,"exp":["📝 解析：遭主管機關要求暫停職務時應依法停止執行業務並自我改進；照常執業、借用他人名義或以未收到公文推託都違法。"],"pos":0.4856,"w":1},{"id":"E-495","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於執行工作時，如發現其他人員有不法情事，何者敘述適當?","opts":["應通報內部權責單位處理","基於保密原則，假裝若無其事","當機立斷，直接請其改正","與其交換條件，牟取自身利益"],"ans":1,"exp":["📝 解析：發現其他人員有不法情事，應通報內部權責單位（如稽核、法遵）依程序處理；假裝不知、私下處理或藉機交換利益都不當。"],"pos":0.48638,"w":1},{"id":"E-496","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"從事證券及金融相關專門職業，有那些特性 ?","opts":["維持高度職業倫理道德的承諾","強制性再教育訓練的專業要求","利他主義態度的普及","以上皆是"],"ans":4,"exp":["📝 解析：專門職業的特性包括承諾維持高度職業倫理、接受強制性再教育訓練，以及普遍具備以客戶與社會利益為念的利他態度。"],"pos":0.48716,"w":1},{"id":"E-497","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"對於一個證券或金融從業人員而言，下列何者為最重要的因素？","opts":["服裝儀容","職業道德","人脈","家世背景"],"ans":2,"exp":["📝 解析：金融業以信任為本，職業道德是從業人員最重要的條件；服裝儀容、人脈、家世背景都是次要因素。"],"pos":0.48794,"w":1},{"id":"E-504","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是證券商及其從業人員執行業務關於職業道德的行為規範？","opts":["執行業務避免利益衝突","下班後與親朋好友或同學餐敘","不洩露公司及客戶的機密資料","遵照法令及公司管理規章的規定執行業務"],"ans":2,"exp":["📝 解析：下班與親友餐敘屬私人生活，與執業行為規範無關；避免利益衝突、保密、依法令及公司規章執業才是道德規範內容。"],"pos":0.48872,"w":1},{"id":"E-505","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列關於職業道德的敘述何者為正確？","opts":["消極的職業道德指的是，若有社會大眾或同事監督時能履行職業道德，無人監督或個人獨自承擔工作任務時就放鬆對自己職業道德的約束","被動地遵從職業道德，指的是在客觀行為人的思想深處或個人意識中有職業道德的約束，能夠在關鍵時候體現職業道德精神","主動地遵從職業道德，將職業道德作為自己的一種人生境界，一種人生價值，一種靈魂深處的“剛性”約束","以上皆是"],"ans":4,"exp":["📝 解析：三選項分別正確描述消極（有人監督才守）、被動（內心有約束、關鍵時體現）、主動（內化為人生價值）三種遵從職業道德的層次。"],"pos":0.48949,"w":1},{"id":"E-506","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"如何判斷證券商的業務人員是否具有職業道德？","opts":["持有多種證券、期貨、或銀行、保險的專業證照","不論是否執行業務或在何時何地，均能遵守法規與自律原則","擁有高額的營業業績並領取高額的營業獎金","擁有廣闊的政商及人際關係"],"ans":2,"exp":["📝 解析：職業道德的判斷標準在於是否無論何時何地都自發遵守法規與自律原則；證照多寡、業績高低、人脈廣狹都與道德無關。"],"pos":0.49027,"w":1},{"id":"E-510","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非為充實與增進證券及金融業務人員專業的作法？","opts":["參加軍事訓練","參加公司內部舉辦或外部專業機構辦理之職前訓練","持續定期參加公司內部舉辦及外部專業機構辦理之在職訓練","各種相關證券及金融業專業證照之取得"],"ans":1,"exp":["📝 解析：職前訓練、在職訓練與取得專業證照都能增進金融專業；參加軍事訓練與證券金融專業無關。"],"pos":0.49105,"w":1},{"id":"E-512","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"以下敘述何者為是？","opts":["法規過於專業，經辦人員毋須了解法規","公司主管要求時， 經辦再更新法規即可","經辦人員應隨時注意業務相關法規之更新","以上皆非"],"ans":3,"exp":["📝 解析：經辦人員有義務主動掌握業務相關法規更新，不能以法規太專業為由不懂，也不應等主管要求才更新。"],"pos":0.49183,"w":1},{"id":"E-515","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"以下何者非屬自律範圍？","opts":["核准營業項目","廣告自律規範","會員財務或業務之查核及輔導","訂定各業自律公約"],"ans":1,"exp":["📝 解析：核准營業項目屬主管機關（金管會）的行政權限，不是公會自律範圍；廣告自律、會員查核輔導、訂定自律公約才是公會自律事項。"],"pos":0.49261,"w":1},{"id":"E-516","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"違反會員自律公約之處置，下列何者為非？","opts":["先請示主管機關，核准後再處置","由各業公會依規定辦理","依自律公約規定處分","處分報經各公會理事會決議後執行並報知主管機關"],"ans":1,"exp":["📝 解析：違反自律公約由各業公會依公約處分，經理事會決議後執行再報知主管機關，不需事先請示主管機關核准。"],"pos":0.49339,"w":1},{"id":"E-517","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"違反會員自律公約之處分，以下何者為非？","opts":["處以違約金","停止其應享有之部分或全部權益","責令會員對其所屬人員為適當之處分","終止會員營業執照"],"ans":4,"exp":["📝 解析：公會可處違約金、停止會員權益、責令會員處分所屬人員；營業執照的核發與撤銷屬主管機關權限，公會無權終止。"],"pos":0.49416,"w":1},{"id":"E-519","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應遵守守法原則，故：","opts":["可從事內線交易","不得有違反或幫助他人違反法令之行為","可洩露客戶資料","可違反相關規定"],"ans":2,"exp":["📝 解析：守法原則要求從業人員不得自己違反法令，也不得幫助他人違反法令；內線交易、洩露客戶資料都屬違法。"],"pos":0.49494,"w":1},{"id":"E-522","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在工作場所，下列何者行為不在限制範圍內？","opts":["恐嚇","合作","歧視","騷擾"],"ans":2,"exp":["📝 解析：恐嚇、歧視、騷擾都是職場禁止行為；同事間合作是應鼓勵的正當行為，不在限制範圍內。"],"pos":0.49572,"w":1},{"id":"E-523","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員之職業道德不包含下列何者？","opts":["保護公司資產","保守客戶秘密","個人利益至上","誠信、客觀"],"ans":3,"exp":["📝 解析：金融從業人員應保護公司資產、保守客戶秘密、秉持誠信客觀；「個人利益至上」違反客戶利益優先原則。"],"pos":0.4965,"w":1},{"id":"E-524","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"何者為金融從業人員應有之表現？","opts":["知悉公司有重大舞弊案件，應循正當管道向上級通報","從事不當授信、涉及嚴重違反授信原則之業務","知悉公司財務及業務重大缺失，未向公司內部稽核部門報告","為自己或第三人不法之利益，損害公司之利益"],"ans":1,"exp":["📝 解析：知悉重大舞弊應循正當管道通報；不當授信、隱匿重大缺失不報、為私利損害公司都違反職業道德，後者甚至可能構成背信。"],"pos":0.49728,"w":1},{"id":"E-525","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"身為金融從業人員應共同信守基本之職業道德不包括下列何者？","opts":["守法原則","誠實原則","主觀性原則","保密原則"],"ans":3,"exp":["📝 解析：金融從業人員基本道德原則為守法、誠實（誠信）、保密、客觀等；應是「客觀性」原則，「主觀性原則」不屬之。"],"pos":0.49805,"w":1},{"id":"E-527","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應如何強化自身之法律知識且養成自律精神？","opts":["不定期檢視相關法令之規定，留意是否有更改與增訂之法律規範","參與同業公會所舉辦之在職訓練","秉持守法、誠信原則，在所從事之業務行為上建立誠信與專業精神","以上皆是"],"ans":4,"exp":["📝 解析：持續檢視法令修訂、參加公會在職訓練、在業務上秉持守法誠信，三者都是強化法律知識與自律精神的作法。"],"pos":0.49883,"w":1},{"id":"E-529","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業內部應加強宣導職業道德觀念，並且鼓勵員工於懷疑或發現有人違反法令規章或道德行為準則時之處理，下列何者不適當？","opts":["隱忍不報","向監察人報告","向經理人報告","向內部稽核主管報告"],"ans":1,"exp":["📝 解析：發現違法或違反道德準則時應向監察人、經理人或內部稽核主管等管道舉報；隱忍不報會讓違規擴大，不適當。"],"pos":0.49961,"w":1},{"id":"E-532","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"欲從事未經主管機關核定之業務時，應如何辦理？","opts":["報請公會備查後辦理","俟呈報董事會通過後辦理","經股東大會通過後即可辦理","經主管機關核准後方得辦理"],"ans":4,"exp":["📝 解析：金融業屬特許行業，未經主管機關核定的業務須先經主管機關核准方得辦理，公會備查或董事會、股東會決議都不能取代。"],"pos":0.50039,"w":1},{"id":"E-533","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融相關從業人員之資格條件，下列何項不在優先考慮範圍之內?","opts":["品德","專業","相關經驗","性別"],"ans":4,"exp":["📝 解析：金融從業人員資格條件應以品德、專業與相關經驗為考量；性別不是資格條件，以性別區別也違反性別工作平等法。"],"pos":0.50117,"w":1},{"id":"E-534","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於尚未符合相關人員資格時：","opts":["可經辦各項業務","代理經辦相關業務","不得經辦相關業務","於能力範圍內，仍可執行相關業務"],"ans":3,"exp":["📝 解析：未符合法定人員資格者不得經辦相關業務，不能以代理或「能力所及」為由執行。"],"pos":0.50195,"w":1},{"id":"E-535","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"關於金融從業人員之道德規範，下列敘述何者為正確？","opts":["因為自身的安危，即使知道直屬主管違反法規也不能越級報告","為了同事間和諧的氣氛，我應該將同事私下向客戶收受回扣的事保密","雖然金融從業人員必須保守客戶的秘密，但若家人需要，可以透露一些無所謂","對於客戶的無理要求，仍然必須依公司規定辦理"],"ans":4,"exp":["📝 解析：面對客戶無理要求仍應依公司規定辦理；主管違法可越級通報、同事收回扣不應隱瞞、客戶秘密也不能透露給家人。"],"pos":0.50272,"w":1},{"id":"E-537","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員發現公司內部有涉嫌違反法紀活動時，需透過正當管道向主管機關舉發，下列何者為非法活動？","opts":["內線交易","盜用資金","洗錢","以上皆是"],"ans":4,"exp":["📝 解析：內線交易（證交法）、盜用資金（侵占或背信）、洗錢（洗錢防制法）都是違法行為，發現時應循正當管道舉發。"],"pos":0.5035,"w":1},{"id":"E-538","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"近年來隨著對公眾利益的保護增加，從業人員除應遵守相關法律規範外，另有何種規範相應而生並隨之增加，其旨在藉由本業自我約束力量使市場秩序更臻完善?","opts":["自律規範","作業標準","罰款","擔保"],"ans":1,"exp":["📝 解析：在法律之外由業者自我約束以維持市場秩序的規範稱為自律規範，例如各業公會的自律公約。"],"pos":0.50428,"w":1},{"id":"E-539","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員得遵守下列單位所訂規範？","opts":["從業人員自律規範","政府機關命令","公司規章","以上皆是"],"ans":4,"exp":["📝 解析：金融從業人員須同時遵守政府法令命令、公會自律規範與公司內部規章，三者都要遵守。"],"pos":0.50506,"w":1},{"id":"E-540","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"懲戒違反道德行為準則之員工時，應有下列何者考量？","opts":["逕行公開譴責","逕行吊銷或撤銷相關資格者，不得於媒體公告之，以保障其工作權及隱私權","應給予申復機會及救濟管道","以上皆是"],"ans":3,"exp":["📝 解析：懲戒違反道德準則的員工時應給予申復機會及救濟管道以保程序正當；不宜逕行公開譴責，必要時也可依規定公告處分。"],"pos":0.50584,"w":1},{"id":"E-541","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"道德行為規範應包括何種原則？","opts":["守法原則、誠信原則、自律原則","保密原則、能力原則、資訊公開原則","客戶利益優先原則、利益衝突原則、禁止不當得利原則","以上皆是"],"ans":4,"exp":["📝 解析：金融業道德行為規範的原則包括守法、誠信、自律、保密、專業能力、資訊公開、客戶利益優先、利益衝突避免與禁止不當得利等，三組都屬之。"],"pos":0.50661,"w":1},{"id":"E-542","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在自己的工作領域中，應：","opts":["專注自己及他人之升遷","不參加公司的教育訓練","不斷加強自己的專業知識","不涉獵本業以外之相關知識"],"ans":3,"exp":["📝 解析：金融從業人員應持續進修、不斷加強專業知識以服務客戶；只顧升遷、不參加訓練、不涉獵相關知識都不正確。"],"pos":0.50739,"w":1},{"id":"E-543","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"道德行為規範適用之事業體為何？","opts":["限於上市櫃公司","限於金融產業","限於營利事業","各種事業體均得適用"],"ans":4,"exp":["📝 解析：道德行為規範是普遍的行為準則，任何事業體都可以訂定並適用，不限上市櫃公司、金融業或營利事業。"],"pos":0.50817,"w":1},{"id":"E-544","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"各公司道德行為準則規範之適用層級何者正確？","opts":["董事長","總經理層級以上","部門主管以上","有為公司管理事務及簽名權利之人"],"ans":4,"exp":["📝 解析：依上市上櫃公司訂定道德行為準則參考範例，適用董事、經理人及其他有為公司管理事務及簽名權利之人，不只限高層。"],"pos":0.50895,"w":1},{"id":"E-545","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"對於一個真正專業人員的特質，下列敘述何者正確？","opts":["具有專業才識","遵守最高執業倫理道德標準","具備「慈善」的基本優點及「愛」的觀點","以上皆是"],"ans":4,"exp":["📝 解析：真正的專業人員須具備專業才識、遵守最高執業倫理標準，並有慈善與關懷他人的態度，三者皆是。"],"pos":0.50973,"w":1},{"id":"E-547","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"若僅通過金融市場常識與職業道德考試則可銷售下列何種金融商品？","opts":["保險商品","基金","推介股票","以上皆非"],"ans":4,"exp":["📝 解析：銷售保險、基金或推介股票各需保險業務員、投信投顧業務員、證券商業務員等專屬資格；僅通過本測驗不能銷售上述商品。"],"pos":0.51051,"w":1},{"id":"E-551","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"對於金融從業人員之行為規範，下列何者正確？","opts":["不得涉及賭博情事","應避免不當的交際應酬","應避免不當的餽贈","以上皆是"],"ans":4,"exp":["📝 解析：從業人員不得涉賭，並應避免不當交際應酬與餽贈，以免影響職務公正或產生利益衝突，三者皆正確。"],"pos":0.51128,"w":1},{"id":"E-564","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業應共同信守的基本業務經營原則是：","opts":["專業原則","保密原則","公平競爭原則","以上皆是"],"ans":4,"exp":["📝 解析：金融服務業共同信守的業務經營原則包括專業、保密與公平競爭等，三者皆是。"],"pos":0.51206,"w":1},{"id":"E-567","s":"all","ch":"道德｜職業道德基本原則","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員懷疑公司同事涉及違法情事，應採取以下哪些行動？","opts":["瞭解相關法令的規定避免自己涉及該違法情事","依公司規定報告，防阻非法行為發生","(1)及(2)","以上皆非"],"ans":3,"exp":["📝 解析：懷疑同事違法時，應先了解相關法令避免自己涉入，並依公司規定報告以防阻違法行為，(1)與(2)都應採取。"],"pos":0.51284,"w":1},{"id":"E-013","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事業務廣告及製發宣傳文件：","opts":["不得製作易使客戶誤解金融商品交易與賭博雷同之廣告","僅使用對其有利之資料以誇大其績效","宣稱金融商品交易無風險適合所有人士","得僅強調獲利，但未同時說明相對風險"],"ans":1,"exp":["📝 解析：廣告不得使客戶誤認金融商品交易與賭博雷同，也不得誇大績效、宣稱無風險或只講獲利不揭露風險。"],"pos":0.51362,"w":1},{"id":"E-014","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"為招攬投資人從事金融商品，金融服務業從事業務廣告及製發宣傳文件時：","opts":["可以引用各種推薦書、感謝函、擷取報章雜誌之報導、為保證獲利或負擔損失之類似文字或表示","可以過去之操作績效為獲利保證","內容涉及誇大不實或虛偽陳述","以上敘述皆不得為之"],"ans":4,"exp":["📝 解析：廣告不得引用推薦函或報導作保證、以過去績效保證獲利，也不得誇大不實或虛偽陳述，三種行為皆禁止。"],"pos":0.5144,"w":1},{"id":"E-021","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"為促進證券業遵循法規及落實金融消費者保護，下列何者為證券經紀商及其業務人推介客戶買賣有價證券公平對待客戶之正確作法?","opts":["考慮客戶之資金及收取佣金多寡","視向客戶收取佣金之多寡，依客戶委託資金規劃投資策略","應先評估客戶之投資能力及具備合理之資訊，並不得保證所推介有價證券之價值","使用特定利益或不實廣告利誘客戶購買不符客戶適切性的有價證券"],"ans":3,"exp":["📝 解析：推介前須評估客戶投資能力並具合理資訊依據，且不得保證有價證券價值；依佣金多寡規劃或以特定利益、不實廣告利誘皆違反公平待客。"],"pos":0.51518,"w":1},{"id":"E-031","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員推廣業務時，下列何種行為是錯誤的？","opts":["推廣業務需考量客戶之投資風險承受度","推廣業務需了解客戶投資經驗","推廣經主管機關核准業務","對一般大眾促銷私募商品"],"ans":4,"exp":["📝 解析：私募商品依證交法 §43-6、§43-7 只能向特定人招募，不得對一般大眾公開勸誘或為一般性廣告；其餘三項都是正確推廣作法。"],"pos":0.51595,"w":1},{"id":"E-032","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員推廣投資型業務時，下列何種行為是正確的？","opts":["為提高客戶收益，應推薦有內線消息之明牌","推介經主管機關核准之商品","為達成業績目標，推介自己都無法了解之金融商品","雖沒有合法資格，仍然從事該項推廣業務"],"ans":2,"exp":["📝 解析：應推介經主管機關核准之商品；推薦內線明牌違法，推介自己不懂的商品違反專業原則，無合法資格者亦不得從事招攬。"],"pos":0.51673,"w":1},{"id":"E-033","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理充分瞭解客戶作業，以下何種態度是錯誤的？","opts":["應由客戶所填資料充分知悉客戶狀況","應由客戶所填資料評估客戶狀況","請客戶隨便填一填以便歸檔備查","辦理充分瞭解客戶作業是推介商品非常重要程序"],"ans":3,"exp":["📝 解析：充分瞭解客戶是推介前的重要程序，須依客戶真實填寫的資料評估；請客戶隨便填寫等於架空適合度評估。"],"pos":0.51751,"w":1},{"id":"E-034","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理充分瞭解客戶作業，應充分知悉並評估客戶之狀況，下列何者為是？","opts":["應充分知悉並評估客戶之投資知識及投資經驗","應充分知悉並評估客戶之財務狀況","應充分知悉並評估客戶之承受投資風險程度","以上皆是"],"ans":4,"exp":["📝 解析：瞭解客戶須掌握投資知識與經驗、財務狀況及風險承受程度，作為推介適合商品之依據，三項皆是。"],"pos":0.51829,"w":1},{"id":"E-035","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"以下何者為金融服務業向不特定多數人之銷售行為?","opts":["透過發言人公佈商品內容","透過新聞稿通知媒體商品內容","於傳播媒體宣傳金融商品","以上皆是"],"ans":4,"exp":["📝 解析：透過發言人、新聞稿或傳播媒體公布商品內容，都是向不特定多數人傳遞商品資訊，屬公開銷售招攬行為。"],"pos":0.51907,"w":1},{"id":"E-036","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"以下何者非為金融從業人員向不特定多數人之銷售行為？","opts":["於街頭發放商品廣告 DM","向已簽約客戶說明商品內容","於報章雜誌刊登商品廣告","向記者透漏商品內容並請其代為刊登"],"ans":2,"exp":["📝 解析：向已簽約客戶說明商品屬對特定人的服務；街頭發 DM、報章刊登廣告、請記者代為刊登都是對不特定多數人宣傳。"],"pos":0.51984,"w":1},{"id":"E-037","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬業務時，下列何種商品得以向不特定多數人銷售？","opts":["經主管機關核准之公開募集金融商品","經主管機關核准之國內私募基金","信託集合管理運用帳戶","國內私募有價證券"],"ans":1,"exp":["📝 解析：只有經主管機關核准之公開募集商品可向不特定多數人銷售；私募基金與私募有價證券限特定人，集合管理運用帳戶則限已成立信託關係之委託人。"],"pos":0.52062,"w":1},{"id":"E-038","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員招攬業務時，下列行為何者是正確的？","opts":["得向客戶招攬未經主管機關核准的業務","為提供客戶各種投資機會，將非屬所服務機構可銷售的金融商品推介給客戶","為爭取業績，無須考量商品適合度，應極力推銷收益率最高的商品而避談風險","客戶簽約前應向客戶說明契約內容"],"ans":4,"exp":["📝 解析：簽約前向客戶說明契約內容是金融消費者保護法要求的說明義務；招攬未核准或非本機構可銷售商品、忽視適合度只談收益皆違規。"],"pos":0.5214,"w":1},{"id":"E-039","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬業務時，下列行為何者不宜？","opts":["說明財產之管理運用並非絕無風險","說明公司以往之經理績效無法保證最低收益","請客戶簽約前應詳閱說明書","片斷截取報章雜誌之報導作為促銷資料"],"ans":4,"exp":["📝 解析：片斷截取報章報導容易斷章取義誤導客戶，屬不當招攬；說明有風險、績效不保證、提醒詳閱說明書都是應有作法。"],"pos":0.52218,"w":1},{"id":"E-040","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員準備促銷資料，以下何者為是？","opts":["引用數據、資料作為促銷資料內容時毋須註明出處","引用數據、資料作為促銷資料內容時故意隱匿不利客戶之資訊","促銷資料應載明公司相關資料","故意隱匿資料致誤導投資大眾或客戶"],"ans":3,"exp":["📝 解析：促銷資料應載明公司相關資料以示負責；引用數據須註明出處，不得隱匿不利資訊或誤導客戶。"],"pos":0.52296,"w":1},{"id":"E-041","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬業務時，下列何者不宜？","opts":["作保證獲利或負擔損失之表示","以獲利招攬業務必須同時說明其風險","使用公司名稱應清楚、明確且不得誤導客戶","如涉及比較其他同業應為客觀公平之比較"],"ans":1,"exp":["📝 解析：招攬時不得作保證獲利或負擔損失之表示；以獲利招攬同時說明風險、公司名稱清楚、同業比較客觀公平皆為正確作法。"],"pos":0.52374,"w":1},{"id":"E-045","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在進行商品銷售時，何者行為恰當？","opts":["以個人銷售獎金之高低為依歸， 隱匿該商品可能為客戶帶來之風險","未依客戶要求提供詳實充份之訊息，以誤導客戶進行較不利之商品交易","未事先告知客戶，即自行採取多種商品聯合銷售之行為","詳實告知各項商品之特性、風險與報酬"],"ans":4,"exp":["📝 解析：應詳實告知商品特性、風險與報酬；為獎金隱匿風險、提供不實資訊誤導或未告知即搭售，皆違反金融消費者保護法說明義務。"],"pos":0.52451,"w":1},{"id":"E-047","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"在開發客戶時，下列何者行為不恰當？","opts":["審慎客觀評估客戶之財務狀況","依客戶財務狀況，再推薦最適合客戶的商品","為積極開發客戶，忽略可能存在之風險","參酌客戶與其他金融機構往來的情形"],"ans":3,"exp":["📝 解析：開發客戶仍須評估並揭露風險，為業績忽略風險違反適合度原則；評估財務狀況、參酌與他機構往來情形都是正當作法。"],"pos":0.52529,"w":1},{"id":"E-052","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在行銷商品時應考慮？","opts":["行銷佣金或津貼較多的商品，以提高自己的收入","行銷高風險金融商品，以爭取業績","深入了解客戶需求，提供對客戶最有利最合適的商品","配合公司的營業方針，推展利潤高的商品"],"ans":3,"exp":["📝 解析：應深入了解客戶需求，提供最有利且合適的商品；以佣金高低、業績或公司利潤挑選商品違反適合度與公平待客原則。"],"pos":0.52607,"w":1},{"id":"E-054","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"金融從業人員從事業務推廣或招攬時，下列何者為非？","opts":["應主動推銷","應加強服務","為達到業績，可製作較為誇張的文宣給客戶看","態度應誠懇實在"],"ans":3,"exp":["📝 解析：文宣不得誇大不實，金融消費者保護法要求廣告內容真實；主動推銷、加強服務、態度誠懇都屬正當。"],"pos":0.52685,"w":1},{"id":"E-055","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員行銷商品時應考慮","opts":["公司的營業方針高低","顧客真正的需求","公司的獲利","自身的佣金"],"ans":2,"exp":["📝 解析：行銷應以顧客真正需求為依歸，符合適合度原則；公司方針、公司獲利或自身佣金都不應凌駕客戶需求。"],"pos":0.52763,"w":1},{"id":"E-057","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於客戶於填寫相關資料時，若發現客戶有違反告知之情事應如何處理？","opts":["事不關己，不要理他","即時向客戶求證其真實性","協助造假","自己改正"],"ans":2,"exp":["📝 解析：發現客戶資料可能不實時應即時向客戶求證；置之不理、協助造假或自行改正都會使資料失真並讓自己涉責。"],"pos":0.5284,"w":1},{"id":"E-058","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員若有發生所推薦產品與消費者需求衝突時應如何處理？","opts":["以公司產品為優先","將產品說成與客戶需求相同","以客戶需求為最優先原則","以自己所獲報酬為優先考量"],"ans":3,"exp":["📝 解析：產品與客戶需求衝突時應以客戶需求為最優先，不得把產品曲解成符合需求，也不應以公司產品或自身報酬為先。"],"pos":0.52918,"w":1},{"id":"E-059","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事行銷時，對於廣告文宣應遵守之規定？","opts":["對過去的業績以誇大不實之方式宣導","只報導獲利而不報導風險","勸誘客戶提前解約或贖回","應以公司名義為之，其內容應經公司核可，並符合法令規定"],"ans":4,"exp":["📝 解析：廣告文宣應以公司名義為之、經公司核可並符合法令；誇大業績、只講獲利不講風險、勸誘客戶提前解約或贖回都屬禁止行為。"],"pos":0.52996,"w":1},{"id":"E-065","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員之行銷行為，下列何者有誤？","opts":["應充分告知客戶產品之性質與內容","推廣文宣應清楚、公正及不誤導投資人","應遵守相關法令規定","可自行勾選未經客戶同意申請之事項"],"ans":4,"exp":["📝 解析：不得未經客戶同意自行勾選申請事項；充分告知商品內容、文宣公正不誤導、遵守法令都是正確行銷行為。"],"pos":0.53074,"w":1},{"id":"E-069","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行業務時，下列陳述何者為非？","opts":["與客戶洽談應保持懇切之態度","應秉持公正客觀立場審查","可使用類似大眾所熟悉之他人商標，以混淆客戶","充分告知客戶應徵提之資料"],"ans":3,"exp":["📝 解析：使用類似大眾熟悉之他人商標混淆客戶屬仿冒，亦為公平交易法所禁止；懇切洽談、公正審查、告知應備資料皆正確。"],"pos":0.53152,"w":1},{"id":"E-070","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"登載及製播廣告，應注意下列何款行為？","opts":["避免誤導消費者不正確之價值及理財觀念","廣告應清楚、公正","不得使用類似大眾所熟悉之他人商標，以混淆消費者","以上皆是"],"ans":4,"exp":["📝 解析：廣告應清楚公正、避免誤導消費者不正確的價值與理財觀念，且不得使用類似他人商標混淆消費者，三項皆須注意。"],"pos":0.5323,"w":1},{"id":"E-071","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業製播廣告，不得有下列何種行為？","opts":["損害其他同業信譽之廣告","使用類似大眾所熟悉之他人商標，以混淆消費者","誤導消費者不正確之價值及理財觀念","以上皆是"],"ans":4,"exp":["📝 解析：損害同業信譽、仿用他人商標混淆消費者、誤導不正確理財觀念，皆是金融服務業廣告的禁止事項。"],"pos":0.53307,"w":1},{"id":"E-073","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員之業務推廣文宣，下列何者為是？","opts":["推廣文宣應清楚、公正及不誤導投資人","推廣文宣應讓投資人能適當瞭解產品所涉風險","推廣文宣應避免誤導消費者不正確之價值及理財觀念","以上皆是"],"ans":4,"exp":["📝 解析：推廣文宣應清楚公正不誤導、讓投資人適當瞭解風險，並避免誤導不正確的理財觀念，三者皆是。"],"pos":0.53385,"w":1},{"id":"E-104","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於執行業務時，下列敘述何者較適當：","opts":["以大戶為優先服務的對象，其他客戶有時間再受理","了解你的客戶，對於不適合的客戶應拒絕之","損及客戶權益之事項如為客戶授權，仍應忠實執行不需要告知交易風險","為牟取客戶最大利益，經紀商可逕行為客戶設定獲利、停損點"],"ans":2,"exp":["📝 解析：應落實瞭解客戶，對不適合的客戶婉拒交易；大戶優先、不告知風險、逕自為客戶設定停損獲利點都違反規範。"],"pos":0.53463,"w":1},{"id":"E-111","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"如客戶對金融商品無交易意願，金融從業人員為業績考量應：","opts":["將其從客戶名單刪除，不再提供服務","了解客戶的需求，找尋適合客戶的商品","與客戶約定損失共同承擔，勸誘交易","將客戶轉由其他從業人員服務"],"ans":2,"exp":["📝 解析：客戶無交易意願時應瞭解其需求並找尋適合商品；約定損失共同承擔屬違法勸誘，刪除名單或轉手他人不是服務之道。"],"pos":0.53541,"w":1},{"id":"E-126","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員對高齡客戶提供服務時，以下行為何者正確?","opts":["為讓高齡客戶獲得高收益，盡量推銷天期長、流動性低的金融商品，無需考慮其風險承受度","高齡客戶風險屬性現為最低等級，建議客戶重作充分了解客戶問卷來提高風險屬性至最高等級，以購買高風險之金融商品","利用高齡客戶認知功能下降，誘導其購買不適合的金融商品","公平對待高齡客戶，應忠實執行業務並以善良管理人之注意，提供誠信服務"],"ans":4,"exp":["📝 解析：依金融服務業公平待客原則（含高齡友善要求），應以善良管理人注意誠信服務高齡客戶；推銷長天期低流動商品、誘導重填問卷或利用認知退化皆不當。"],"pos":0.53619,"w":1},{"id":"E-130","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員提供客戶服務時，以下何者為是？","opts":["新種、複雜性高的金融商品不易說明清楚，說錯了反而造成誤解，因此無須向客戶揭露商品及風險資訊","直接代客戶填寫認識客戶作業文件，幫客戶取得最高風險等級，讓客戶可選擇所有商品，對客戶最便利","客戶簽署推介同意書後就可投資所有商品，不必進行適合度評估","以上皆非"],"ans":4,"exp":["📝 解析：複雜商品仍須揭露商品與風險資訊，不得代填瞭解客戶文件拉高風險等級，推介同意書也不能取代適合度評估，三者皆錯。"],"pos":0.53696,"w":1},{"id":"E-135","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"以下何種行為是正確的？","opts":["勸誘客戶以融資方式取得資金，轉為信託財產進行運用","要求客戶辦信用卡否則不與之簽信託契約","要求客戶填寫瞭解客戶作業相關資料","要求客戶與子公司開立證券戶否則無法接受委託投資"],"ans":3,"exp":["📝 解析：要求客戶填寫瞭解客戶作業資料是正確程序；勸誘融資投資、以辦卡或在子公司開戶作為簽約條件都屬不當搭售。"],"pos":0.53774,"w":1},{"id":"E-136","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員之職責要求，下列何者正確？","opts":["只照顧自己親朋好友","只照顧行員","公平對待所有客戶，而不偏袒某一客戶","只照顧 VIP 客戶"],"ans":3,"exp":["📝 解析：從業人員應公平對待所有客戶，不得偏袒親友、行員或 VIP 客戶。"],"pos":0.53852,"w":1},{"id":"E-150","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融商品風險高低不同，對屬於保守型之客戶，從業人員應推薦之商品為何？","opts":["穩健保守型商品","高風險高報酬商品","目前公司主力推薦之商品","公司所有之商品"],"ans":1,"exp":["📝 解析：依適合度原則，保守型客戶應推薦穩健保守型商品，不能推高風險商品或公司主推商品。"],"pos":0.5393,"w":1},{"id":"E-152","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵循下列何者事項？","opts":["應廣泛了解客戶，以期精確銷售或推介適合客戶之商品","應以從業人員自身利益為優先考量","儘量使用類似大眾所熟悉之他人商標，混淆客戶以提升業績","可利用公司內部資訊擅自為自己進行交易而謀取利益"],"ans":1,"exp":["📝 解析：推介投資型商品應廣泛瞭解客戶以推介適合商品；自身利益優先、仿用他人商標混淆、利用內部資訊交易皆違規。"],"pos":0.54008,"w":1},{"id":"E-156","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理衍生性商品業務，下列陳述何者有誤?","opts":["應充分告知投資人產品所涉風險","應向投資人說明產品之可能最大損失","應加強對非專業善意投資人之保護措施","應以從業人員自身利益為優先考量"],"ans":4,"exp":["📝 解析：衍生性商品業務應充分告知風險與可能最大損失，並加強保護非專業投資人；以從業人員自身利益為先違反公平待客。"],"pos":0.54086,"w":1},{"id":"E-159","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列那一項為金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項？","opts":["應避免不當銷售或推介之行為","不得誤導消費者不正確之價值及理財觀念","不得使用類似大眾所熟悉之他人商標，以混淆消費者","以上皆是"],"ans":4,"exp":["📝 解析：推介投資型商品應避免不當銷售、不誤導理財觀念，並不得使用類似他人商標混淆消費者，三者皆是。"],"pos":0.54163,"w":1},{"id":"E-160","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理衍生性商品業務時，不應有下列何種行為？","opts":["於交易契約中揭示可能發生之風險","對客戶善盡風險告知義務","誤導客戶之情事","提醒客戶承作商品之重要注意事項"],"ans":3,"exp":["📝 解析：誤導客戶違反說明義務與公平待客原則；契約揭示風險、善盡風險告知、提醒重要注意事項都是應有作為。"],"pos":0.54241,"w":1},{"id":"E-161","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列關於金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項何者正確？","opts":["應揭露商品的各項特性及風險","商品設計應符合客戶之風險偏好","推介適合客戶之商品","以上皆是"],"ans":4,"exp":["📝 解析：推介投資型商品應揭露商品特性及風險、商品設計符合客戶風險偏好，並推介適合客戶之商品，三者皆是。"],"pos":0.54319,"w":1},{"id":"E-169","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"辦理投資型金融商品推介或銷售業務時，應於受理前進行下列何項程序，以瞭解客戶並幫助客戶瞭解自身投資屬性及適合商品或投資組合？","opts":["請客戶填具客戶資料表，建檔並妥為保存","瞭解客戶投資經驗及風險偏好","瞭解客戶預計投資期限及期望報酬","以上皆是"],"ans":4,"exp":["📝 解析：受理前應請客戶填寫並妥存客戶資料表，瞭解投資經驗、風險偏好、投資期限與期望報酬，三者皆是瞭解客戶程序。"],"pos":0.54397,"w":1},{"id":"E-189","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員為客戶解說開戶文件時，以下敘述何者正確?","opts":["避免提及交易風險，以免嚇跑客戶","必須告知相關交易流程","先請客戶簽署開戶契約，日後有機會再向客戶詳細解說","告知客戶交易的最大風險僅限於手續費"],"ans":2,"exp":["📝 解析：解說開戶文件時應完整說明交易流程與風險；迴避風險、先簽約後解說、宣稱最大風險僅限手續費，都違反充分告知義務。"],"pos":0.54475,"w":1},{"id":"E-190","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在向客戶預告交易風險時，以下敘述何者正確?","opts":["買空賣空交易最適合家徒四壁的人，因為可以一夕致富","建議客戶萬一面臨追繳時，可以先以信用卡預借現金向銀行週轉應急","告知客戶交易的最大風險僅限於手續費的損失","提醒客戶當行情劇烈波動時，其本金有可能完全損失"],"ans":4,"exp":["📝 解析：信用或槓桿交易在行情劇烈波動時可能損失全部本金，應如實預告；鼓吹一夕致富、建議以信用卡預借現金應付追繳都屬不當。"],"pos":0.54553,"w":1},{"id":"E-192","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"交易人張三於週一透過某金融服務業完成一筆金融商品交易，以下敘述何者正確?","opts":["該金融服務業應依規定製作一份對帳資料，寄送給張三","可由該金融服務機構業務員代領交易報告書再轉交客戶","為節省作業成本，未經約定一律以電子方式寄送交易報告書","依客戶要求決定寄送與否"],"ans":1,"exp":["📝 解析：完成交易後，金融服務業應依規定製作並寄送對帳資料給客戶核對；不可由業務員代領轉交、不可未經約定改電子寄送，也不能看客戶要求才寄。"],"pos":0.5463,"w":1},{"id":"E-193","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"交易人張三以電話委託某金融服務業進行金融商品交易，以下敘述何者正確?","opts":["為避免錯誤，接單之業務員可在電話中覆誦張三的委託內容，無誤後再填寫委託書交付執行","成交後，由該金融服務業接單之業務員，以電話向張三進行成交回報並錄音即可，毋須再寄送交易報告書給張三","該金融服務業應將張三之交易報告書，依張三之電話指示交付或寄送，不必依契約約定方式進行","該金融服務業已向張三進行成交回報及寄送交易報告書，善盡充分告知之義務，因此毋須再定期交付或寄送對帳資料給張三，避免浪費資源"],"ans":1,"exp":["📝 解析：電話委託應覆誦確認內容無誤再填委託書執行；成交後仍須依契約方式寄送交易報告書並定期寄對帳單，電話回報不能取代書面通知。"],"pos":0.54708,"w":1},{"id":"E-198","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"若原服務客戶之業務員離職，但客戶仍有未完成之委託事項，則接任之業務員，何者作為較適當?","opts":["告知客戶，由其處理未完成之委託事項","不須通知客戶，自行處理未完成之委託事項","待客戶察覺再告知，否則毋須告知","客戶察覺亦毋需告知，以避免客戶流失"],"ans":1,"exp":["📝 解析：原業務員離職而仍有未完成委託時，接任者應主動告知客戶並由其處理，保障客戶知情權；不告知或等客戶察覺才說都違反誠信。"],"pos":0.54786,"w":1},{"id":"E-199","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"依證券投資人及期貨交易人保護法規定，證券投資人有下列何種情形，保護機構財團法人證券投資人及期貨交易人保護中心得動用保護基金償付之？","opts":["證券投資人買賣有價證券違約交割而受有損失者","證券投資人於所委託之證券商因財務困難失卻清償能力而違約時，其於證券交易市場買賣有價證券並已完成交割義務者","證券投資人買賣有價證券受有損失者","證券投資人買賣有價證券因重大損失而要求精神補償者"],"ans":2,"exp":["📝 解析：依證券投資人及期貨交易人保護法，保護基金僅在證券商因財務困難失卻清償能力而違約時，償付已完成交割義務的投資人；自身違約、一般虧損或精神補償皆不在範圍。"],"pos":0.54864,"w":1},{"id":"E-206","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員執行事務明知有下列事項應告知客戶，何者為是？","opts":["對於契約之重大條款認知錯誤","對於業務執行之重大事項認知錯誤","對於財產管理之重大事項認知錯誤","以上皆是"],"ans":4,"exp":["📝 解析：從業人員明知客戶對契約重大條款、業務執行或財產管理的重大事項認知錯誤，基於誠信及告知義務都應告知更正，故皆是。"],"pos":0.54942,"w":1},{"id":"E-209","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員告知客戶投資風險，以下何者是正確的行為？","opts":["告知信託能隔離風險， 且以信託方式辦理投資可保證本金之安全及獲利","應代為填寫瞭解客戶作業之資料","以招攬業務必須同時說明其風險","太複雜之投資風險無須告知"],"ans":3,"exp":["📝 解析：招攬業務時必須同時說明風險；信託不能保證本金與獲利、不得代客填寫瞭解客戶資料，複雜商品風險更須告知。"],"pos":0.55019,"w":1},{"id":"E-210","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員應注意公平待客，以下行為何者不宜？","opts":["充分了解客戶需求，提供適合的產品","明確告知產品內容、風險與費用","以誇大廣告吸引客戶，誤導客戶相信能保證本金及獲利","提供高齡或身心障礙者友善服務"],"ans":3,"exp":["📝 解析：依金融消費者保護法及公平待客原則，廣告不得誇大不實；以誇大廣告誤導客戶相信保本保息屬不當行為，其餘選項都是公平待客的正確做法。"],"pos":0.55097,"w":1},{"id":"E-211","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理業務如需告知客戶公司相關資料，得以提供公司之相關資料為何？","opts":["公司及其相關分支機構或代理機構之營業地址、聯絡電話","代表公司執行業務的人員之姓名或職稱","代表公司可能與客戶聯繫的人員之姓名或職稱","以上皆是"],"ans":4,"exp":["📝 解析：告知公司資料應包括公司及分支、代理機構的營業地址與電話，以及代表公司執行業務及可能與客戶聯繫人員的姓名或職稱，故皆是。"],"pos":0.55175,"w":1},{"id":"E-215","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"依法令規定應於提供客戶相關文件中揭露風險警語，下列何者無須揭露警語？","opts":["行銷文件","印鑑卡","公開說明書","投資說明書"],"ans":2,"exp":["📝 解析：行銷文件、公開說明書、投資說明書都是提供投資資訊的文件，依法須載明風險警語；印鑑卡只是留存印鑑的作業文件，不需揭露警語。"],"pos":0.55253,"w":1},{"id":"E-219","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員面臨市場競爭時，何者不是正確的表現？","opts":["告知承作短期票券或債券交易之客戶，市場利率近期之波動情形","誠實告知客戶，公司及同業之間金融商品報價之差異","為達公司獲利目標，不擇手段欺瞞客戶所有訊息","針對客戶屬性，建議其承作短期票券或債券之交易"],"ans":3,"exp":["📝 解析：面臨競爭仍應誠實告知利率波動、同業報價差異並依客戶屬性建議；為達獲利目標欺瞞客戶，違反誠信與資訊公開原則。"],"pos":0.55331,"w":1},{"id":"E-220","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"何者不是身為專業金融從業人員之表現？","opts":["在考量公司及自身利益下，不須告知客戶其可能面臨之投資風險","客觀分析適合客戶屬性之投資商品","告知客戶所需之各項商品風險與報酬","當客戶投資標的產生劇幅波動時，主動告知"],"ans":1,"exp":["📝 解析：專業從業人員應客觀分析、告知風險報酬並在標的劇烈波動時主動通知；以公司或自身利益為由不告知風險，違反資訊公開與忠實義務。"],"pos":0.55409,"w":1},{"id":"E-221","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"若有客戶詢問某項商品資訊時，下列何者為不恰當行為？","opts":["拒絕提供或隱瞞市場上相關商品之訊息","在自身專業能力內，提供客戶該項商品之完整資訊","客觀分析該項商品可能面臨的風險","主動積極提供相關商品之資訊"],"ans":1,"exp":["📝 解析：客戶詢問商品時應在專業範圍內完整、客觀提供並主動說明；拒絕提供或隱瞞市場相關訊息違反資訊公開原則。"],"pos":0.55486,"w":1},{"id":"E-225","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員行銷商品時，應","opts":["一味地促銷商品","批評他公司之商品","重要事項先不予告知","主動並詳細說明此商品之特性及應注意事項"],"ans":4,"exp":["📝 解析：行銷時應主動詳細說明商品特性與注意事項；一味促銷、批評他公司商品、隱匿重要事項都違反金融消費者保護法的說明義務。"],"pos":0.55564,"w":1},{"id":"E-228","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列何者行為是金融從業人員的職責？","opts":["讓客戶充分了解商品內容","隱瞞不利銷售的條件","特別強調商品的獲利率","避談商品的風險"],"ans":1,"exp":["📝 解析：從業人員應讓客戶充分了解商品內容（含風險與費用）；隱瞞不利條件、只強調獲利、避談風險都違反金融消費者保護法的說明義務。"],"pos":0.55642,"w":1},{"id":"E-230","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"於業務推廣與招攬時，從業人員向客戶應盡之告知義務，下列何者正確？","opts":["依商品相關內容據實告知","為爭取業績，隱匿部分應告知內容","於告知時，可加入從業人員主觀之想法","以上皆是"],"ans":1,"exp":["📝 解析：告知義務應依商品內容據實告知；隱匿應告知內容或摻入從業人員主觀想法都可能誤導客戶，故只有(1)正確。"],"pos":0.5572,"w":1},{"id":"E-233","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理衍生性操作業務之風險告知，下列何者正確？","opts":["提前解約風險","商品條件變更風險","利率風險","以上皆是"],"ans":4,"exp":["📝 解析：衍生性商品的風險告知應涵蓋提前解約、商品條件變更及利率等市場風險，三者都是應揭露的重要風險。"],"pos":0.55798,"w":1},{"id":"E-237","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於推介或銷售投資型金融商品時，應採取下列何者作為，以確保客戶了解商品性質與可能面臨之風險？","opts":["應充分了解客戶，審酌客戶年齡等情況予以推介或銷售適當之金融商品，並善盡充分告知投資風險內容之職責","誇大金融商品之可能報酬，並勸誘客戶以借款、舉債等方式從事理財投資以增加業績","待客戶要求再告知投資商品可能之風險，否則毋須主動告知","為避免客戶流失，僅告知投資可能之利益， 毋需告知投資風險"],"ans":1,"exp":["📝 解析：推介投資型商品須落實認識客戶與適合度原則，考量年齡等情況並充分告知風險；誇大報酬、勸誘借款投資、不主動告知風險都違反金融消費者保護法。"],"pos":0.55875,"w":1},{"id":"E-239","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在向客戶推介或銷售投資型金融商品時，應告知下列那些事項？","opts":["金融商品名稱及主要投資標的內容","客戶須支付之各項費用說明","可能承受之風險說明","以上皆是"],"ans":4,"exp":["📝 解析：推介投資型商品應告知商品名稱與主要投資標的、客戶須付的各項費用及可能風險，皆是金融消費者保護法要求說明的重要內容。"],"pos":0.55953,"w":1},{"id":"E-240","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員遇客戶臨櫃提領現金(含由他人領款及陪同領款)，經行員判斷有異常者，應如何處理？","opts":["詢問客戶辦理動機與目的","詢問客戶是否認識陪同提款的人","經研判客戶顯屬遭詐騙者，應撥打警政署防範詐騙專線或逕向「110」報案","以上皆是"],"ans":4,"exp":["📝 解析：依銀行臨櫃關懷提問機制，提領異常時應詢問動機目的、是否認識陪同者，研判遭詐騙應撥165反詐騙專線或報110，三者皆正確。"],"pos":0.56031,"w":1},{"id":"E-273","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"客戶李四有一筆定存 500 萬元到期，欲從事商品投資，金融從業人員應：","opts":["建議李四申購高額手續費之商品為自己賺取獎金","依李四需求，建議客戶申購適合自己的商品","視公司本月主推商品為何，建議李四申購該商品","如這個月已達到業績目標，勸誘李四下個月再申購"],"ans":2,"exp":["📝 解析：依適合度原則應按李四的需求與風險承受度建議適合商品；以手續費高低、公司主推或個人業績時程為考量，違反金融消費者保護法與公平待客原則。"],"pos":0.56109,"w":1},{"id":"E-310","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"關於金融從業人員執行業務時，下列敍述何者正確？","opts":["勸誘客戶解約他公司之商品","將他公司之商品作不公平之比較","不散播不實言論及文宣","販售非經主管機關核准之商品"],"ans":3,"exp":["📝 解析：不散播不實言論及文宣符合公平競爭；勸誘客戶解約他公司商品、不公平比較、販售未經核准商品都屬禁止行為。"],"pos":0.56187,"w":1},{"id":"E-312","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員銷售無形的金融商品，因商品無樣品可試用，必須透過從業人員說明， 下列敘述何者為非？","opts":["對商品內容應多做說明使客戶了解","應遵守誠實信用原則","商品已售出，可以不必再理會客戶","不斷地充實本身的專業知識，提供更好的服務"],"ans":3,"exp":["📝 解析：無形商品仰賴說明與售後服務，售出後仍應回應客戶疑問；「已售出可不必理會」違反誠信與公平待客原則。"],"pos":0.56265,"w":1},{"id":"E-319","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融機構登載及製播廣告，不得有下列何款行為？","opts":["損害同業信譽之廣告","使用類似大眾所熟悉之他人商標，以混淆消費者","誤導消費者不正確之價值及理財觀念","以上皆是"],"ans":4,"exp":["📝 解析：金融機構廣告不得損害同業信譽、使用近似他人商標混淆消費者，或誤導不正確的價值與理財觀念，三者皆禁止。"],"pos":0.56342,"w":1},{"id":"E-325","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員應尊重消費者合法權益，當其權益受到侵害時，應如何處理？","opts":["不予受理","請客戶自行負擔損失","秉誠信原則妥適處理","應視與客戶之交情決定受理與否"],"ans":3,"exp":["📝 解析：依金融消費者保護法，消費者權益受損時金融機構應秉誠信原則妥適處理申訴，不得拒絕受理或視交情決定。"],"pos":0.5642,"w":1},{"id":"E-327","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在向客戶推介或銷售金融商品時，以下敘述何者有誤？","opts":["不得委託無相關金融證照之人員從事之","應審酌客戶年齡等情況予以推介或銷售適當之金融商品","善盡充分告知投資風險內容之職責","為賺取佣金，儘量勸誘客戶於短期間內，以多次贖回、再申購金融商品之方式"],"ans":4,"exp":["📝 解析：為賺佣金勸誘客戶短期內多次贖回再申購，屬損害客戶利益的不當銷售；其餘三項都是推介商品應遵守的規範。"],"pos":0.56498,"w":1},{"id":"E-330","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於推介或銷售投資型金融商品時，應依下列原則辦理？","opts":["應本最大誠信及充分揭露原則","不得藉主管機關對金融商品之核准、核備或備查，而使消費者認為政府已對該金融商品提供保證","不得對於過去之業績作誇大不實之宣傳，或對同業為攻訐之廣告","以上皆是"],"ans":4,"exp":["📝 解析：推介投資型商品應本最大誠信及充分揭露原則，不得藉主管機關核准暗示政府保證，也不得誇大過去業績或攻訐同業，故皆是。"],"pos":0.56576,"w":1},{"id":"E-349","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者為反詐騙專線？","opts":["110","113","119","165"],"ans":4,"exp":["📝 解析：165 是警政署反詐騙諮詢專線；110 為報案、119 為消防救護、113 為保護專線（家暴、兒少保護）。"],"pos":0.56654,"w":1},{"id":"E-350","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"常見的金融詐騙招數包括下列哪些？","opts":["騙取受害者信任，讓受害者主動轉出金錢","透過釣魚網站，騙取網銀帳密後轉出金錢","騙取電子支付帳密後，冒充受害者進行交易","以上皆是"],"ans":4,"exp":["📝 解析：取得信任誘使受害人自行匯款、以釣魚網站竊取網銀帳密轉帳、盜用電子支付帳密冒名交易，三者都是常見詐騙手法。"],"pos":0.56732,"w":1},{"id":"E-353","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"萬一疑似遭到金融詐騙，應採取哪些措施保障權益？","opts":["撥打反詐騙專線，確認是否為詐騙電話","報警通知銀行，凍結詐騙帳戶","到警局報案作筆錄取得三聯單，並至銀行填資料申請返還","以上皆是"],"ans":4,"exp":["📝 解析：疑似受騙應撥165查證、報警並通知銀行將詐騙帳戶列警示凍結，再到警局報案取得三聯單向銀行申請返還剩餘款項，三項都正確。"],"pos":0.56809,"w":1},{"id":"E-354","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"要查詢合法證券期貨業者名單，可透過下列哪些單位之網站查詢？","opts":["金管會及所轄單位官網","證券期貨相關公會官網","證券期貨三公會合建之非金管會核准之證券期貨業者及商品警示專區","以上皆是"],"ans":4,"exp":["📝 解析：金管會及證期局等所轄單位官網、證券期貨相關公會官網，以及三公會合建的非核准業者及商品警示專區，都能查詢或比對合法業者。"],"pos":0.56887,"w":1},{"id":"E-355","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員獲悉已影響相關客戶利益之訊息時：","opts":["依客戶之重要性決定是否通知","依與客戶之交情決定是否通知","不須做任何處理","應盡可能公平合理的通知每一位客戶"],"ans":4,"exp":["📝 解析：依公平待客原則，影響客戶利益的訊息應公平合理地通知每位客戶，不可依客戶重要性或交情差別對待，更不能置之不理。"],"pos":0.56965,"w":1},{"id":"E-368","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"證券商為因應金融消費者客戶申訴問題，公司內部應該建制何種機制？","opts":["成立客戶申訴中心","加強對相關經辦及業務人員的教育宣導","強化售後服務","以上皆是"],"ans":4,"exp":["📝 解析：依金融消費者保護法，金融服務業應建立申訴處理機制；設立客戶申訴中心、加強經辦人員教育宣導、強化售後服務都屬之。"],"pos":0.57043,"w":1},{"id":"E-399","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，應遵守之事項何者有誤？","opts":["可與客戶約定分享利益或共同承擔損失","應妥為保管客戶資料","應避免不當銷售或推介之行為","不可利用客戶帳戶或名義為自己謀取不當利益"],"ans":1,"exp":["📝 解析：推介銷售投資型商品不得與客戶約定分享利益或共同承擔損失，以免變相保證收益；保管客戶資料、避免不當銷售、不借客戶帳戶圖利都正確。"],"pos":0.57121,"w":1},{"id":"E-420","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者並非「打詐新四法」之一？","opts":["民事訴訟法特殊強制處分專章","詐欺犯罪危害防制條例","通訊保障及監察法","洗錢防制法"],"ans":1,"exp":["📝 解析：2024年打詐新四法是詐欺犯罪危害防制條例，以及洗錢防制法、通訊保障及監察法、刑事訴訟法（特殊強制處分專章）的修正；選項(1)的民事訴訟法不在其中。"],"pos":0.57198,"w":1},{"id":"E-423","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"對於客戶之申訴或檢舉案件，下列敘述何者適當?","opts":["以積極主動的態度面對及妥善處理","對於申訴或檢舉人之姓名、地址須予以保密","以言詞提出申訴或檢舉之案件， 應留存談話紀錄","以上皆是"],"ans":4,"exp":["📝 解析：處理申訴檢舉應積極主動妥善處理、對申訴或檢舉人的姓名地址保密，以言詞提出者應留存談話紀錄，三者皆適當。"],"pos":0.57276,"w":1},{"id":"E-424","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何者為方便民眾瀏覽、查詢防詐相關資訊的專業網站？","opts":["證券期貨相關公會官網","證券期貨三公會合建之非金管會核准之證券期貨業者及商品警示專區","內政部警政署打詐儀錶板網站","金管會及所轄單位官網"],"ans":3,"exp":["📝 解析：警政署打詐儀錶板彙整詐騙案件統計、常見手法與防詐宣導，是專供民眾瀏覽查詢防詐資訊的網站；其他選項偏重業者資訊或查核合法業者。"],"pos":0.57354,"w":1},{"id":"E-426","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"防範電信詐騙的措施不包括下列何者？","opts":["不接前有「+」號之電話，因為極有可能是詐騙集團變造的國際電話","提供基本資料供對方核對","有懷疑立即掛斷並撥打反詐騙專線諮詢","一接起電話即被掛斷，可能是詐騙集團在篩選有效電話號碼，不要好奇回撥"],"ans":2,"exp":["📝 解析：接到可疑電話不應提供基本資料給對方核對，以免個資遭詐團利用；拒接「+」號國際來電、有疑就掛斷撥165、不回撥響一聲電話都是正確措施。"],"pos":0.57432,"w":1},{"id":"E-429","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"電信詐騙事件為何屢屢得逞？","opts":["常以帳戶被凍結等負面消息引起民眾恐慌，使其在情急之下按指示操作","偽裝成官方、司法人員或可信賴的機構，降低民眾戒心","利用民眾對網路操作的不熟悉，容易被看似正常的網站或連結所騙","以上皆是"],"ans":4,"exp":["📝 解析：詐騙得逞常因製造恐慌讓人倉促操作、假冒官方或可信機構降低戒心、利用民眾不熟網路操作以假網站連結行騙，三者皆是。"],"pos":0.5751,"w":1},{"id":"E-442","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"從事電話行銷行為時，應主動提供下列何訊息讓受話人知悉?","opts":["所屬公司名稱","發話人可供識別的代碼及姓氏","發話目的","以上皆應提供"],"ans":4,"exp":["📝 解析：依電話行銷相關自律規範，應主動告知所屬公司名稱、發話人可識別代碼及姓氏、發話目的，讓受話人判斷是否繼續通話。"],"pos":0.57588,"w":1},{"id":"E-487","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"防範詐騙自保招數有哪些？","opts":["拒接「未顯示來電」電話","線上刷卡前務必確認網站真假","勿輕信操作 ATM 可以解除分期設定而輸入帳號或密碼轉帳","以上皆是"],"ans":4,"exp":["📝 解析：拒接未顯示號碼來電、網購刷卡前確認網站真偽、不相信操作ATM可解除分期付款設定，都是防範詐騙的基本自保方式。"],"pos":0.57665,"w":1},{"id":"E-489","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"詐騙集團會運用 AI 技術模擬親友臉孔及聲音進行詐騙，可以運用下列哪些方式破解？","opts":["請對方在鏡頭前大幅旋轉頸部，深偽影像在側面邊緣常會出現模糊或閃爍破綻","請對方開鏡頭並在臉前快速揮動手掌，AI 可能無法及時處理重疊影像，導致手部變形或呈半透明狀","觀察對方眼睛是否永遠望著固定方向，因為 AI 生成的臉部影像無法轉動眼珠","以上皆是"],"ans":4,"exp":["📝 解析：深偽影像在大幅轉頭、手掌在臉前揮動時，容易出現邊緣模糊、手部變形等破綻，眼神固定不動也是常見特徵，三種方式都可用來識破。"],"pos":0.57743,"w":1},{"id":"E-490","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業及其受僱人員，下列敘述何者有誤?","opts":["對客戶不得有背信、詐欺或侵害客戶權益之行為","不得非法動支或挪用客戶資金","不得為業務之招攬，而為誇大不實、偏頗之廣告宣傳","為招攬業務，得與客戶約定分享利益或共同承擔損失"],"ans":4,"exp":["📝 解析：金融業不得背信詐欺、挪用客戶資金、做誇大不實廣告；為招攬業務與客戶約定分享利益或共同承擔損失，同樣是各業規範明文禁止的行為。"],"pos":0.57821,"w":1},{"id":"E-493","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業及其受僱人員不應以業績為優先考量，對於下列何者應拒絕其交易?","opts":["未完成開戶手續者","經評估逾越其交易能力而無法提供適當擔保者","不適合該金融商品交易者","以上皆是"],"ans":4,"exp":["📝 解析：依認識客戶與適合度原則，未完成開戶、逾越交易能力又無適當擔保、不適合該商品的客戶，都應拒絕交易，不能以業績優先。"],"pos":0.57899,"w":1},{"id":"E-546","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列有關金融從業人員之敘述何者正確？","opts":["向客戶據實告知商品相關內容","不得為所屬公司授權範圍以外之任何承諾","對因執行業務所取得之機密資料應遵守資料保護相關法令規定","以上皆是"],"ans":4,"exp":["📝 解析：據實告知商品內容、不為授權範圍外承諾、依資料保護法令保護業務機密，均符合公平待客與誠信原則。"],"pos":0.57977,"w":1},{"id":"E-548","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員要落實公平待客原則，必須先奠定從業人員認定公平待客之重要性，首要將下列何者列為宗旨","opts":["優先保障公司權益","優先保障集團利益","優先保障金融消費者利益","以上皆是"],"ans":3,"exp":["📝 解析：依金管會金融服務業公平待客原則，宗旨是優先保障金融消費者權益，而非公司或集團利益。"],"pos":0.58054,"w":1},{"id":"E-549","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理投資型金融商品推介或銷售業務時，下列敘述何者正確？","opts":["應保護投資者合法權益","應遵守相關法令規定","推廣文宣應清楚、公正及不誤導投資人","以上皆是"],"ans":4,"exp":["📝 解析：推介銷售投資型商品須保護投資人合法權益、遵守相關法令，文宣也要清楚公正不誤導，三者皆是。"],"pos":0.58132,"w":1},{"id":"E-552","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對於往來客戶，於符合法令規定之範圍內，下列作為何者為是？","opts":["提供客戶充足之資訊，以便其充分瞭解公司業務","當客戶合法權益受到侵害時，應正面回應，並作妥適之處理","確實依據相關法令、公司章程之規定，忠實履行職務","以上皆是"],"ans":4,"exp":["📝 解析：提供客戶充足資訊、客戶權益受侵害時妥適處理、依法令章程忠實履行職務，都是對客戶應有的作為。"],"pos":0.5821,"w":1},{"id":"E-556","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理衍生性金融商品業務應遵守事項，下列敘述何者有誤？","opts":["應提供客戶有關商品之產品內容、交易條件及特性","應說明客戶投資本商品可能之預期收益","應於交易契約中揭示可能發生之風險，對客戶善盡風險告知義務","可與客戶約定分享利益或共同承擔損失"],"ans":4,"exp":["📝 解析：辦理衍生性商品應揭露商品內容、交易條件與風險；與客戶約定分享利益或共擔損失屬禁止行為，故(4)錯誤。"],"pos":0.58288,"w":1},{"id":"E-557","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"有關金融從業人員辦理衍生性金融商品業務，應提醒客戶於交易前充分瞭解之事項， 下列何者為正確？","opts":["商品之性質","相關之財務、會計、稅制或法律等事宜","自行審度本身財務狀況及風險承受度","以上皆是"],"ans":4,"exp":["📝 解析：衍生性商品交易前，客戶應了解商品性質、相關財務會計稅制法律事宜，並自行評估財務狀況與風險承受度，三者皆是。"],"pos":0.58366,"w":1},{"id":"E-559","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員辦理投資型金融商品推介或銷售業務時，為避免糾紛，應遵守下列何種事項？","opts":["應以善良管理人之注意義務及忠實義務，本誠實信用原則執行業務","應依據客戶風險之承受度銷售或推介客戶適當之商品或投資組合","不得銷售或推介逾越客戶財力狀況或合適之投資範圍以外之商品","以上皆是"],"ans":4,"exp":["📝 解析：應盡善良管理人注意義務與忠實義務、依風險承受度推介適當商品、不推介逾越客戶財力的商品，三者都是避免糾紛的要求。"],"pos":0.58444,"w":1},{"id":"E-572","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"為了保護金融消費者權益，讓金融消費爭議能公平、合理、有效的處理，下列何者是最重要且為金融業務整合性的專業法律？","opts":["金融消費者保護法","消費者保護法","個人資料保護法","證券投資人及期貨交易人保護法"],"ans":1,"exp":["📝 解析：金融消費者保護法是專為金融消費爭議處理與金融消費者保護所訂的整合性法律，並據以設立金融消費評議中心。"],"pos":0.58521,"w":1},{"id":"E-573","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是屬於金融消費者保護法所謂的金融消費爭議，而受金融消費者保護法的保護？","opts":["金融消費者與金融服務業間因商品或服務所生之刑事爭議","金融消費者與金融服務業間因商品或服務所生之民事爭議","金融消費者與金融服務業間因商品或服務所生之刑事及民事爭議","金融消費者與金融服務業間所生之任何爭議"],"ans":2,"exp":["📝 解析：金融消費者保護法所稱金融消費爭議，指金融消費者與金融服務業間因商品或服務所生的民事爭議，不含刑事爭議。"],"pos":0.58599,"w":1},{"id":"E-574","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為受金融消費者保護法保護之接受金融服務業提供金融商品或服務的金融消費者？","opts":["專業投資機構","符合一定財力或專業能力之自然人或法人","前述兩項以外的一般自然人或法人","任何接受金融服務業提供金融商品或服務之金融消費者"],"ans":3,"exp":["📝 解析：金融消費者保護法排除專業投資機構及符合一定財力或專業能力的自然人或法人，保護對象是其他一般自然人或法人。"],"pos":0.58677,"w":1},{"id":"E-577","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，下列何者為依金融消費者保護法設立之金融消費爭議處理機構？","opts":["財團法人證券投資人及期貨交易人保護中心","財團法人金融消費評議中心","財團法人中華民國證券暨期貨市場發展基金會","行政院消費者保護會"],"ans":2,"exp":["📝 解析：依金融消費者保護法設立的爭議處理機構是財團法人金融消費評議中心；投保中心依投保法設立，證基會與消保會都不是。"],"pos":0.58755,"w":1},{"id":"E-578","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？","opts":["違反法令、主管機關之規定或自律規範","虛偽、不實、隱匿、或其他足致他人誤信","損害金融服務業或他人營業信譽","以上皆是"],"ans":4,"exp":["📝 解析：依金融服務業從事廣告業務招攬及營業促銷活動辦法，不得違反法令或自律規範、不得虛偽隱匿誤導、不得損害同業或他人信譽，三者皆是。"],"pos":0.58833,"w":1},{"id":"E-580","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？","opts":["故意截取報章雜誌不實之報導作為廣告內容","對於業績及績效作誇大之宣傳","使用之文字或訊息內容使人誤信能保證本金之安全或保證獲利","以上皆是"],"ans":4,"exp":["📝 解析：截取不實報導當廣告、誇大業績、使人誤信保本保獲利，都是金融服務業廣告與招攬辦法禁止的情事。"],"pos":0.58911,"w":1},{"id":"E-582","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融消費者向財團法人金融消費評議中心申請金融消費爭議之評議，下述何種情形將會被決定不受理？","opts":["未先向金融服務業申訴","非屬金融消費爭議","申請已逾法定期限","以上皆是"],"ans":4,"exp":["📝 解析：依金融消費者保護法，未先向金融服務業申訴、非屬金融消費爭議、申請逾法定期限等情形，評議中心應決定不受理。"],"pos":0.58988,"w":1},{"id":"E-583","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"財團法人金融消費評議中心對金融服務業與金融消費者間之金融消費爭議所作出的評議決定書，經送經法院核可者，其法律效力如何？","opts":["與民事確定判決有同一之效力","金融服務業與金融消費者事後可再進行協商","金融服務業得就該事件再次申請評議","金融服務業事後後悔，可不接受評議決定"],"ans":1,"exp":["📝 解析：依金融消費者保護法，評議成立的評議書經法院核可後，與民事確定判決有同一效力，當事人不得再就同一事件起訴或申請評議。"],"pos":0.59066,"w":1},{"id":"E-585","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是屬於金融消費者保護法所稱的金融服務業？","opts":["證券業","銀行業","期貨業","以上皆是"],"ans":4,"exp":["📝 解析：金融消費者保護法所稱金融服務業包括銀行業、證券業、期貨業、保險業、電子票證業等，三者都屬之。"],"pos":0.59144,"w":1},{"id":"E-586","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融消費爭議當事人、爭議處理機構及其人員，對於金融消費爭議事件所提出之申請、各種資料、協商讓步事項或評議過程有保密之義務，在何種狀況下，才可予以公開？","opts":["已經公開者","依法令規定可公開者","經當事人同意者","以上皆是"],"ans":4,"exp":["📝 解析：依金融消費者保護法，爭議相關資料與評議過程原則保密，但已公開、依法令可公開或經當事人同意者得公開，三者皆是。"],"pos":0.59222,"w":1},{"id":"E-588","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"財團法人金融消費評議中心對於金融消費者申請評議之金融消費爭議案件，有那些處理機制？","opts":["未先向該金融服務業經申訴的申請案，先移請該金融服務業先行處理","試行調處","進行評議","以上皆是"],"ans":4,"exp":["📝 解析：評議中心對未先申訴的案件會移請金融服務業先處理，並可試行調處，調處不成再進行評議，三者都是處理機制。"],"pos":0.593,"w":1},{"id":"E-589","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業招攬、播放廣告及進行業務招攬或營業促銷活動時，下列敘述何者為正確？","opts":["對金融消費者所負擔之的義務不得低於所廣告之內容及進行業務招攬或營業促銷活動時對金融消費者所提示之資料或說明","不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事","應確保其廣告內容之真實","以上皆為正確"],"ans":4,"exp":["📝 解析：依金融消費者保護法，業者對消費者所負義務不得低於廣告或招攬時所示內容，廣告須真實且不得虛偽誤導，三者皆正確。"],"pos":0.59377,"w":1},{"id":"E-590","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業對金融消費者進行金融教育宣導，下列敘述何者為正確？","opts":["不得引薦個別金融商品或服務","對金融消費者說金融商品或服務已獲主管機關核准或備查所以保證安全無虞","對應經而未經主管機關核准或備查之金融商品或服務預為宣傳促銷","使用能保證本金之安全或保證獲利之文字或訊息內容"],"ans":1,"exp":["📝 解析：金融教育宣導不得引薦個別金融商品或服務；宣稱經核准即保證安全、預先宣傳未核准商品、保本保獲利用語都被禁止。"],"pos":0.59455,"w":1},{"id":"E-591","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事廣告、業務招攬及營業促銷活動，依法皆受到主管機關的監督管理， 下列利用何種傳播媒體、宣傳工具或方式屬之？","opts":["電腦、傳真、電話、手機簡訊、廣播、跑馬燈","宣傳單、布條、招牌、公車或其他交通工具上之廣告","與公共領域相關之網際網路、電子郵件及電子視訊等","以上皆是"],"ans":4,"exp":["📝 解析：廣告與招攬辦法涵蓋的媒介包括電話簡訊、廣播、宣傳單、招牌、交通工具廣告與網際網路、電子郵件等，三者皆屬之。"],"pos":0.59533,"w":1},{"id":"E-592","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業從事廣告、業務招攬及營業促銷活動，下列敘述何者不是正確的作法？","opts":["應訂定宣傳資料製作規範與散發公布之控管流程","宣傳資料於對外使用前，應按業務種類，先行審核","全權交付廣告公司處理就可以，有問題由廣告公司負全責","應先確認內容無不當、誤導金融消費者、違反法令後始得對外使用"],"ans":3,"exp":["📝 解析：金融服務業應自訂宣傳資料製作規範與審核流程，對廣告內容負最終責任，不能全權交給廣告公司卸責。"],"pos":0.59611,"w":1},{"id":"E-593","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業所提供之金融商品或服務，下列何者不屬於金融消費者保護法所稱之投資型金融商品或服務？","opts":["信託業辦理特定金錢信託業務或特定有價證券信託業務，受託投資國內外有價證券、短期票券或結構型商品","受託買賣非集中市場交易且具衍生性商品性質之外國有價證券業務","受託買賣國內集中交易或櫃檯買賣市場之黃金業務及銀行辦理與客戶間之黃金現貨買賣及保管業務","證券投資信託基金及境外基金"],"ans":3,"exp":["📝 解析：依金融服務業提供金融商品或服務前說明契約重要內容及揭露風險辦法 §6 第2項，投資型商品包括特定金錢信託投資、受託買賣非集中市場具衍生性質之外國有價證券、證券投資信託基金及境外基金等；第7款「黃金及貴金屬業務」但書明文排除受託買賣集中市場或櫃買市場交易之黃金業務及銀行與客戶間黃金現貨買賣及保管業務，故(3)不屬之。"],"pos":0.59689,"w":1},{"id":"E-594","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業與金融消費者訂立提供金融商品或服務之契約前，下列敘述何者為正確？","opts":["應充分了解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度","應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露其風險","金融服務業對於金融消費者個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益","以上皆是"],"ans":4,"exp":["📝 解析：依金融消費者保護法 §9、§10，訂約前應評估適合度、充分說明重要內容並揭露風險，蒐集個資時也須說明權利及拒絕同意的不利益。"],"pos":0.59767,"w":1},{"id":"E-597","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"政府為更積極保護證券投資人，訂定多種專業法律，請問下列何者不屬於此種專業法律？","opts":["證券交易法","組織犯罪防制條例","金融消費者保護法","證券投資人及期貨交易人保護法"],"ans":2,"exp":["📝 解析：證券交易法、金融消費者保護法、證券投資人及期貨交易人保護法都有保護投資人目的；組織犯罪防制條例是處理犯罪組織的刑事法。"],"pos":0.59844,"w":1},{"id":"E-598","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"金融服務業在向金融消費者說明金融商品或服務契約之重要內容及揭露風險，下列何者不是應遵守的基本原則？","opts":["應本於誠實信用原則，並以金融消費者能充分瞭解之文字或其他方式為之","任何說明或揭露之資訊均須應正確完整，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事","應以達到業績目標為最高指導原則","銷售文件之用語應以中文表達並力求淺顯易懂，必要時得附註原文"],"ans":3,"exp":["📝 解析：說明與揭露應本誠信、正確完整不誤導，並以淺顯中文表達；以業績目標為最高指導原則違反公平待客，不是應遵守的原則。"],"pos":0.59922,"w":1},{"id":"E-599","s":"all","ch":"道德｜公平待客與消費者保護","star":1,"n":1,"refs":"","tag":"","stem":"依金融消費者保護法之規定，金融服務業提供金融商品或服務前說明契約重要內容及揭露風險之金融消費者，是指下列何者？","opts":["與金融服務業訂定金融商品或服務契約之契約相對人","契約相對人為無行為能力人者，其法定代理人","契約相對人為限制行為能力人、受輔助宣告人者，其法定代理人、輔助人","以上皆正確"],"ans":4,"exp":["📝 解析：說明與揭露的對象包括契約相對人，以及其為無行為能力或限制行為能力、受輔助宣告人時的法定代理人或輔助人，三者皆是。"],"pos":0.6,"w":1},{"id":"E-001","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險招攬行為，下列那一項是錯的？","opts":["解釋保險商品內容及保單條款","說明填寫要保書注意事項、轉送要保文件及保險單","經所屬公司授權從事保險招攬行為","可以向未經授權公司從事保險招攬行為"],"ans":4,"exp":["📝 解析：依保險業務員管理規則，業務員只能為其所屬並授權的公司從事招攬，不得替未經授權的公司招攬。"],"pos":0.60078,"w":1},{"id":"E-002","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險招攬所用文書、圖畫、廣告文宣，下列那一項是錯的？","opts":["應標明所屬公司之名稱","所屬公司為代理人、經紀人者並應標明往來保險業名稱","保險代理人、經紀人所屬業務員所使用之文書、圖書、廣告文宣,應經往來保險業同意方可使用","廣告文宣之內容 可任意將保險業報經主管機關審查通過之保單條款、費率及要保書文件予以更改"],"ans":4,"exp":["📝 解析：招攬文宣須標明公司名稱並經往來保險業同意，且不得擅改經主管機關審查通過的保單條款、費率及要保書內容。"],"pos":0.60156,"w":1},{"id":"E-003","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於保險業務員登錄後，應專為下列何者從事保險招攬？","opts":["自己","要保人","所屬公司","保險人"],"ans":3,"exp":["📝 解析：依保險業務員管理規則，業務員登錄後應專為其所屬公司從事保險招攬，不得兼為其他公司招攬。"],"pos":0.60233,"w":1},{"id":"E-004","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，對不特定之第三人散播不實言論或文宣，擾亂金融秩序或其他公司營業、信譽，所屬公司如何處分？","opts":["罰鍰處分","減薪處分","停止招攬1 年","不需再作其他處分"],"ans":3,"exp":["⚠ 依題庫選 (3) 停止招攬 1 年。保險業務員管理規則第 19 條第 1 項第 14 款「散播不實言論或文宣，擾亂金融秩序」屬違規事由，但現行條文（114 年 1 月 2 日修正）是由所屬公司「按情節輕重，予以一年以下停止招攬行為之處分」，已不是固定 1 年（修正前為三個月以上一年以下）。罰鍰是主管機關對公司的處分，減薪不是法定處分。考試請照官方答案 (3)。"],"pos":0.60311,"w":1},{"id":"E-005","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員，從事保險業務招攬時，將本人之登錄證提供他人進行招攬、掛名或其他使用者，會受到何處分？","opts":["註銷保險業務員登錄","停止招攬 6 個月","停止招攬 10 個月","停止招攬1 年"],"ans":2,"exp":["⚠ 依題庫選 (2) 停止招攬 6 個月。以登錄證供他人使用或使用他人登錄證，是保險業務員管理規則第 19 條第 1 項第 10 款的違規事由；但現行條文（114 年 1 月 2 日修正）由所屬公司按情節輕重處「一年以下」停止招攬，沒有固定 6 個月。另依同條，最近五年內停止招攬累計達二年者應撤銷登錄，所以單次違規不直接註銷。考試請照官方答案 (2)。"],"pos":0.60389,"w":1},{"id":"E-094","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於登錄後，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。下列何者為登錄證之有效期間？","opts":["2 年","3 年","4 年","5 年"],"ans":4,"exp":["📝 解析：依保險業務員管理規則，登錄證有效期間為 5 年，期滿前應辦妥換證，未換證前不得從事招攬。"],"pos":0.60467,"w":1},{"id":"E-095","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"保險經紀人，應基於下列何者利益，代向保險人洽訂保險契約？","opts":["要保人","被保險人","受益人","保險人"],"ans":2,"exp":["📝 解析：依保險法 §9，保險經紀人是基於被保險人之利益，代向保險人洽訂保險契約或提供相關服務。"],"pos":0.60545,"w":1},{"id":"E-096","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬行為所生之損害，其應與誰負連帶賠償責任？","opts":["自己","所屬公司","介紹人","以上皆是"],"ans":2,"exp":["📝 解析：業務員招攬行為所生損害，其所屬公司依保險業務員管理規則及民法僱用人責任，應與業務員負連帶賠償責任。"],"pos":0.60623,"w":1},{"id":"E-097","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時依法有何義務？A.應出示登錄證 B.應告知授權範圍 C.提供名片","opts":["AC","AB","BC","ABC"],"ans":2,"exp":["📝 解析：依保險業務員管理規則，業務員招攬時應出示登錄證並告知授權範圍；提供名片並非法定義務。"],"pos":0.607,"w":1},{"id":"E-098","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"客戶投保傷害險後由公務員退休轉為從事建築臨時工維生，金融從業人員得知後應如何正確處理？","opts":["與保險無關不必理會","工作辛苦危險，應規勸另覓良職","立即要求客戶向保險公司提出工作變更批改申請","立即請客戶退保"],"ans":3,"exp":["📝 解析：轉任建築臨時工屬職業變更致危險增加，依保險法 §59 應通知保險人，應請客戶辦理職業變更批改以免影響理賠。"],"pos":0.60778,"w":1},{"id":"E-099","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"客戶投保後提出終止保險契約之申請，金融從業人員應如何正確處理？","opts":["提出違約之告訴","可拒絕之","從業人員僅從事招攬工作，故不在服務範圍之內","強制汽車責任保險除有法定原因外，不得終止契約，其他保險則應儘力解說保險重要，如仍欲終止，應同意並協助辦理"],"ans":4,"exp":["📝 解析：強制汽車責任保險法規定除法定原因外不得終止；其他保險可先解說保障的重要性，客戶仍堅持時應尊重並協助辦理終止。"],"pos":0.60856,"w":1},{"id":"E-100","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"客戶投保住宅火險後，為增加收入而將客廳兼營火鍋小吃店，金融從業人員得知後應如何正確處理？","opts":["客戶仍有居住事實，故不影響","立即要求客戶向保險公司提出使用性質變更批改申請","投保當時是住宅，故只能等到保險契約到期後再說","當作不知而不處理，因不知者無罪"],"ans":2,"exp":["📝 解析：住宅兼營火鍋店屬使用性質變更、危險增加，依保險法 §59 應通知保險人，故應請客戶提出使用性質變更批改。"],"pos":0.60934,"w":1},{"id":"E-101","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"以下何者是根據契約或授權書，向保險公司收取費用，並代理經營業務之金融從業人員？","opts":["保險經紀人","保險公證人","保險代理人","以上皆是"],"ans":3,"exp":["📝 解析：依保險法 §8，保險代理人是根據代理契約或授權書向保險人收取費用並代理經營業務；經紀人代被保險人洽訂，公證人辦理查勘理算。"],"pos":0.61012,"w":1},{"id":"E-102","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"以下何者為不得從事保險業招攬之金融從業人員？","opts":["保險業務員","保險公證人","保險代理人","保險經紀人"],"ans":2,"exp":["📝 解析：保險公證人依保險法 §10 辦理保險標的之查勘、鑑定、估價與賠款理算，須維持超然立場，不得從事保險招攬。"],"pos":0.61089,"w":1},{"id":"E-179","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，於下列何者情形不負通知義務?","opts":["為他方所知者","為他方所不知者","已發生者","自己所知者"],"ans":1,"exp":["📝 解析：依保險法 §62，為他方所知、依通常注意為他方所應知，或經他方聲明不必通知者，當事人不負通知義務。"],"pos":0.61167,"w":1},{"id":"E-180","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"保險商品銷售時，下列何者應於保險商品簡介及要保書首頁之明顯處，以鮮明字體標示。","opts":["查閱公司資訊公開說明文件之方式","公司總經理","公司地址","保險費率"],"ans":1,"exp":["📝 解析：依保險業資訊公開相關規定，保險業應於商品簡介及要保書首頁明顯處，以鮮明字體標示「查閱公司資訊公開說明文件之方式」，讓保戶能查詢公司財務業務資訊。"],"pos":0.61245,"w":1},{"id":"E-181","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於金融從業人員招攬保險，利用其身分從事業務上的不當行為？","opts":["招攬過程對客戶有恐嚇、威脅之言語或行動，或有肢體上暴行，經查證屬實者","協助要求醫師開立錯誤或內容不實之診斷及處置證明，或不當誘使要保人或被保險人要求醫師開立錯誤或內容不實診斷及處置證明","未親晤客戶致未能取得保戶親簽之要保相關文件","以上皆是"],"ans":4,"exp":["📝 解析：恐嚇或暴力招攬、協助或誘使醫師開立不實診斷證明、未親晤客戶致未取得親簽文件，都是保險業務員管理規則所列的不當招攬行為，故皆是。"],"pos":0.61323,"w":1},{"id":"E-182","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員在從事保險招攬時應充分瞭解要保人及被保險人之事項，其內容至少應包含？","opts":["要保人及被保險人之基本資料","要保人與被保險人及被保險人與受益人之關係","要保人及被保險人是否符合投保之條件","以上皆是"],"ans":4,"exp":["📝 解析：招攬時須確認要保人及被保險人基本資料、彼此及與受益人的關係，以及是否符合投保條件，以利核保並防範道德風險，三者都是最低必要內容。"],"pos":0.61401,"w":1},{"id":"E-183","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"就身心障礙人士的投保需求，逕行拒絕受理、拒絕協助送件或勸退，會受到何種處分？","opts":["停止招攬3 個月","停止招攬 6 個月","停止招攬 10 個月","停止招攬1 年"],"ans":1,"exp":["📝 解析：依壽險公會「保險業務員協助身心障礙者投保機制」（110.11.24），業務員對身心障礙客戶的投保需求逕行拒絕受理、拒絕協助送件或勸退者，應依保險業務員管理規則 §19Ⅰ⑰ 的懲處登錄參考標準，處停止招攬3個月。"],"pos":0.61479,"w":1},{"id":"E-184","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬保險時不應告知要保人下列那些事項？","opts":["可延欠保費","可退佣","可折讓","以上皆是"],"ans":4,"exp":["📝 解析：延欠保費、退佣、折讓都屬不當招攬誘因；保險業務員管理規則禁止以退佣、折讓等不當利益招攬，也不可暗示可延欠保費，故皆不應告知。"],"pos":0.61556,"w":1},{"id":"E-185","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員招攬保險業務時應告知要保人投保應注意事項，下列何者為非？","opts":["要保人親自填寫並簽章","如何逃稅","若要保人或被保險人為未成年人，需經其法定代理人同意，並於要保書上簽章","應據實說明"],"ans":2,"exp":["📝 解析：投保應注意事項包括親自填寫簽章、未成年人須法定代理人同意並簽章、據實說明；教客戶逃稅屬違法，絕非應告知事項。"],"pos":0.61634,"w":1},{"id":"E-186","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員對保險要保書的各項詢問說明，應如何要求客戶？","opts":["可避重就輕","就個人隱私可不必回答","可任由其自由回答","應據實說明"],"ans":4,"exp":["📝 解析：依保險法§64，要保人對保險人的書面詢問負據實說明義務，隱匿或不實說明可能使保險人解除契約，故應要求客戶據實說明。"],"pos":0.61712,"w":1},{"id":"E-187","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險招攬時，有誠實填寫招攬報告書的義務，下列何者為招攬報告書應包含的內容：","opts":["招攬經過","要保人及被保險人是否投保其他商業保險","家中主要經濟來源者","以上皆是"],"ans":4,"exp":["📝 解析：招攬報告書須如實記載招攬經過、是否投保其他商業保險及家中主要經濟來源等，供保險公司評估風險與適合度，故皆是。"],"pos":0.6179,"w":1},{"id":"E-188","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員有下列哪種情況之一時，不可登錄為保險業務員；如果已登錄者，所屬公司應通知各有關公會註銷其登錄：","opts":["申請登錄之文件有虛偽之記載者","曾犯偽造文書、侵占、詐欺、背信罪，經宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者","受破產之宣告，尚未復權者","以上皆是"],"ans":4,"exp":["📝 解析：依保險業務員管理規則，登錄文件虛偽記載、犯偽造文書等罪刑未執行完畢或執行完畢未逾三年、受破產宣告未復權者，皆不得登錄，已登錄者應註銷。"],"pos":0.61868,"w":1},{"id":"E-251","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於保險業務招攬時，對於被保險人所填要保書，下列何者正確？","opts":["於空白要保書簽名即可","要求被保險人親自填寫並簽名","實務上可代填不用簽名","口頭允諾即可不用填寫"],"ans":2,"exp":["📝 解析：要保書應由要保人、被保險人親自填寫並簽名，以確保據實告知並避免代簽爭議；空白簽名、代填或口頭允諾都不合規定。"],"pos":0.61946,"w":1},{"id":"E-252","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，對被保險人因連續高額投保，與其固定收入顯不相當時，應如何處理？","opts":["盡速收取保費","維護客戶投保權益","了解其動機，若有不良企圖應予以規勸導正","只要保險公司同意即可"],"ans":3,"exp":["📝 解析：連續高額投保且與收入顯不相當可能有道德風險，業務員應了解投保動機並向公司反映，若有不良企圖應規勸導正，不能只顧收保費。"],"pos":0.62023,"w":1},{"id":"E-253","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員收取保險費後下列何者行為是正確的？","opts":["立即繳交保險公司","累積一定數量後整批繳交可提升效率","避免遺失可以轉用自己支票或信用卡繳交","可由賠款扣抵"],"ans":1,"exp":["📝 解析：代收保費應立即繳交保險公司，避免挪用或延誤保單效力；累積整批繳、改用自己支票或信用卡代繳、以賠款扣抵都屬違規。"],"pos":0.62101,"w":1},{"id":"E-254","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，下列何者行為或觀念是錯誤的？","opts":["業務人員對於商品應充分了解","惡性殺價是市場競爭正常行為","對被保險人應作適當的商品規劃","各項權利義務須詳細說明清楚"],"ans":2,"exp":["📝 解析：惡性殺價（如錯價、放佣）屬保險業務員管理規則禁止的不公平競爭，不是正常市場行為；其餘三項都是正確觀念。"],"pos":0.62179,"w":1},{"id":"E-255","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險招攬業務時，下列何種行為是正確的？","opts":["為節省客戶費用，提供錯價、放佣","詳實說明客戶依保險契約的權利義務","為增加業務人力，無須所屬公司同意即可招聘人員","其他國家的商品對客戶較為有利，因此雖然未經我國主管機關核准或備查，仍可向客戶推銷"],"ans":2,"exp":["📝 解析：業務員應詳實說明保險契約權利義務；錯價放佣、未經公司同意招聘人員、推銷未經我國核准的境外保單都違反保險法及保險業務員管理規則。"],"pos":0.62257,"w":1},{"id":"E-256","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員提供保險理賠服務下列何者是正確的？","opts":["提供專業之服務協助，並請申請人據實填寫理賠申請書","提供專業之服務協助，並代填寫理賠申請書","理賠金額可任由申請人要求給付","允諾客戶一定可獲公司理賠"],"ans":1,"exp":["📝 解析：協助理賠應提供專業協助並請申請人據實填寫理賠申請書；代填、任由申請人決定金額或保證一定理賠都可能構成不實或誤導。"],"pos":0.62335,"w":1},{"id":"E-257","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"發現保險契約錯誤記載時，金融從業人員應如何處理才屬正確的？","opts":["只要要保書填寫正確即可","立即送回保險公司更正或重新製作保單","保險從業人員於錯誤處更正後，簽名即可","錯誤處未達三個，可不必更正"],"ans":2,"exp":["📝 解析：保單記載錯誤應立即送回保險公司更正或重新製作；業務員無權自行更正簽名，錯誤多寡也不能作為不更正的理由。"],"pos":0.62412,"w":1},{"id":"E-258","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於保險業務招攬時，不慎對商品作出不正確之解釋，應如何正確處理？","opts":["不影響，因口說無憑","口述僅供參考，一切以要保書或文宣為準","立即對客戶提出更正及正確解釋說明","認知不同，難以斷定錯誤與否"],"ans":3,"exp":["📝 解析：對商品解釋錯誤應立即向客戶更正並正確說明，避免客戶基於錯誤認知投保而生糾紛；推說口說無憑或以文件為準都是卸責。"],"pos":0.6249,"w":1},{"id":"E-259","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬應以何種態度經營及建立客戶群？","opts":["專業誠信之態度","得過且過之態度","業績至上","自身利益優先"],"ans":1,"exp":["📝 解析：保險業務建立在信賴之上，應以專業誠信態度經營客戶；業績至上或自身利益優先容易導致不當招攬。"],"pos":0.62568,"w":1},{"id":"E-260","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員發現客戶需求與其公司所提供保險商品有落差時，應採取下列何種作為？","opts":["不擇手段，爭取業務","避重就輕，轉移焦點","誠實面對，據實說明","藉巧妙說詞掩蓋事實"],"ans":3,"exp":["📝 解析：客戶需求與公司商品有落差時應誠實據實說明，必要時建議其他規劃；不擇手段、避重就輕或以說詞掩蓋事實都屬誤導招攬。"],"pos":0.62646,"w":1},{"id":"E-261","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於保險業務招攬時，得要求要保人履行據實說明義務，係屬下列何種原則？","opts":["損害補償原則","保險利益原則","主力近因原則","最大誠信原則"],"ans":4,"exp":["📝 解析：要保人據實說明義務（保險法§64）源自最大誠信原則；損害補償、保險利益、主力近因原則分別處理賠償範圍、投保資格與因果關係。"],"pos":0.62724,"w":1},{"id":"E-262","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融從業人員從事保險招攬之業務人員不得有下列何種情事？","opts":["以未具保險業招攬人員資格者為招攬","勸誘客戶解除或終止契約，或以貸款、保險單借款繳交保險費","未確認要保人或被保險人對保單之適合度，包括對六十五歲以上之客戶提供不適合之保險商品","以上皆是"],"ans":4,"exp":["📝 解析：依保險業招攬及核保理賠辦法 §6 第1項第8款，保險業或其招攬人員不得以未具招攬資格者為招攬、不得勸誘客戶解除或終止契約或以貸款與保單借款繳交保費，也不得未確認要保人或被保險人對保單之適合度（包括對65歲以上客戶提供不適合商品），三者皆屬禁止情事，故選(4)。"],"pos":0.62802,"w":1},{"id":"E-263","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"下列何者是金融從業人員於保險業務招攬時的不當行為？","opts":["客戶外觀明顯可見或業務員明知應告知事項而惡意隱匿或唆使客戶隱匿","協助、任憑客戶偽造、變造或做不實之登載於要保書、理賠申請文件或其他文件","唆使(誘導)客戶對應告知事項做不實之告知","以上皆是"],"ans":4,"exp":["📝 解析：惡意隱匿或唆使隱匿應告知事項、協助或任憑偽變造文件、誘導客戶不實告知，都是保險業務員管理規則所列不當招攬行為。"],"pos":0.62879,"w":1},{"id":"E-308","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者係金融從業人員秉持誠實信用原則之行為？","opts":["假借銀行存款名義招攬保險","以高預定利率作不實比較，誘使消費者抱持錯誤認知而購買保險","不以單獨強調或與其他金融商品比較之方式誤導消費者","以上皆是"],"ans":3,"exp":["📝 解析：不以單獨強調或與其他金融商品比較的方式誤導消費者才符合誠信；假借存款名義招攬保險、以高預定利率作不實比較都是違規招攬。"],"pos":0.62957,"w":1},{"id":"E-339","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員發現保險商品條款涉及被保險人利益之解釋，如有爭議時，應如何處理？","opts":["作有利保險公司之解釋","作有利被保險人之解釋","以訴訟方式處理","不需理會"],"ans":2,"exp":["📝 解析：依保險法§54，保險契約解釋有疑義時，以作有利於被保險人之解釋為原則。"],"pos":0.63035,"w":1},{"id":"E-340","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，明知道保險標的之危險已消滅，仍要求客戶投保，則保險契約 ：","opts":["無效","有效","不得解除","以上皆非"],"ans":1,"exp":["📝 解析：保險法 §51Ⅰ：保險契約訂立時，保險標的之危險已發生或已消滅者，契約無效；只有雙方都不知情時才例外有效。本題業務員（代表保險人）明知危險已消滅，不符合例外，依原則選無效(1)。補充：同條Ⅲ另規定僅保險人一方知危險已消滅時，要保人不受契約拘束，所以「有效」「不得解除」都不對。"],"pos":0.63113,"w":1},{"id":"E-341","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，其利益與客戶之利益無法兼顧面臨取捨時，從業人員應如何處理？","opts":["以自身利益為重","給予客戶專業分析，爭取合理之利益","以達成公司要求為準則","以客戶意見為準，忽略自身之專業"],"ans":2,"exp":["📝 解析：利益無法兼顧時應以客戶利益為先，運用專業分析替客戶爭取合理利益；以自身或公司業績為重不對，一味順從客戶而放棄專業判斷也不對。"],"pos":0.63191,"w":1},{"id":"E-344","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，除考慮到自身利益外，以下哪一項更加必須顧到？","opts":["公司利益","社會責任","業績成長","以上皆非"],"ans":2,"exp":["📝 解析：保險具有安定社會的功能，從業人員招攬時除自身利益外，更必須兼顧社會責任，不能只看公司利益或業績成長。"],"pos":0.63268,"w":1},{"id":"E-345","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員同時具有核保及理賠人員資格者，是否可同時擔任二者職務？","opts":["可以","只要所屬保險公司允許則可","僅得擇一擔任，以避免利益衝突","依其個人意願"],"ans":3,"exp":["📝 解析：核保決定是否承保、理賠決定是否給付，兩者須互相制衡。依保險業招攬及核保理賠辦法 §15，同時具有核保及理賠人員資格者，僅得擇一擔任核保或理賠人員；同條並禁止理賠人員審核自己三年內核保簽署的案件，以避免利益衝突。"],"pos":0.63346,"w":1},{"id":"E-346","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員同時兼有保險代理人、經紀人資格者，是否可同時申請二者執業證書？","opts":["可以","為避免利益衝突，僅得擇一","視情況而定","依其個人意願"],"ans":2,"exp":["📝 解析：代理人代表保險公司、經紀人代表要保人利益，立場相反。保險法 §165 第 2 項明定：兼有保險代理人、經紀人、公證人資格者，僅得擇一申領執業證照，以避免利益衝突。"],"pos":0.63424,"w":1},{"id":"E-414","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是金融從業人員從事保險業務招攬的不當行為？","opts":["代客戶簽章","未經客戶同意或授權填寫有關保險契約文件","未經授權而代收保險費或代收保險費未依規定交付保險業開發之正式收據","以上皆是"],"ans":4,"exp":["📝 解析：依保險業務員管理規則，代客簽章、未經同意或授權填寫保險文件、未經授權代收保費或未交付公司正式收據，都是業務員不得為的行為。"],"pos":0.63502,"w":1},{"id":"E-475","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員依財產保險損害補償原則，下列何者處理方式才屬正確？","opts":["一分損失可獲二分補償","二分損失只獲一分補償","一分損失只獲一分補償","以上皆是"],"ans":3,"exp":["📝 解析：損害補償原則是損失多少補償多少，被保險人不能因保險獲利，也應獲得足額補償，故一分損失獲一分補償。"],"pos":0.6358,"w":1},{"id":"E-476","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員銷售保險商品之招攬廣告，應遵守下列那些法令？","opts":["個人資料保護法","消費者保護法","保險法等相關法令","以上皆是"],"ans":4,"exp":["📝 解析：保險招攬廣告須遵守保險法等相關法令及消費者保護法的廣告規範，涉及客戶資料時並須遵守個人資料保護法，三者皆是。"],"pos":0.63658,"w":1},{"id":"E-477","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員從事保險業務招攬時，主張保險利益原則，主要是防止什麼危險發生？","opts":["政治危險","倫理危險","職業危險","道德危險"],"ans":4,"exp":["📝 解析：保險利益原則要求要保人對保險標的具有利害關係，避免無關係者投保後故意製造保險事故圖利，即防止道德危險。"],"pos":0.63735,"w":1},{"id":"E-478","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員於保險業務招攬時，可否於保險契約中免除或減輕保險公司依保險法應負義務者？","opts":["可以","不可以","可以，但需要保人同意","以上皆非"],"ans":2,"exp":["📝 解析：依保險法 §54-1，保險契約中免除或減輕保險人依保險法應負義務的約定，依訂約時情形顯失公平者，該部分無效，故不可以。"],"pos":0.63813,"w":1},{"id":"E-479","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員登錄為保險業務員後，依法令規定應如何加強教育訓練？","opts":["每年參加所屬公司辦理的教育訓練","自我進修即可","閱讀其他業務員撰寫的行銷書籍","以上皆是"],"ans":1,"exp":["📝 解析：依保險業務員管理規則，業務員登錄後每年應參加所屬公司辦理的教育訓練，自我進修或閱讀書籍不能取代。"],"pos":0.63891,"w":1},{"id":"E-481","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"保險契約簽訂後，契約雙方應遵守規範下列何者正確？","opts":["遵守簽訂條件和條款","切實履行各自的義務和責任","明確被保險人利益受到法律保護","以上皆是"],"ans":4,"exp":["📝 解析：保險契約成立後雙方應遵守約定條件與條款、切實履行各自義務與責任，被保險人利益也受法律保護，三者皆正確。"],"pos":0.63969,"w":1},{"id":"E-482","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"無行為能力或限制行為能力之人申請登錄保險業務員下列處理何者正確？","opts":["可予登錄","不予登錄","經特准可予登錄","可自由決定登錄"],"ans":2,"exp":["📝 解析：依保險業務員管理規則，無行為能力或限制行為能力者不予登錄為業務員，沒有特准例外。"],"pos":0.64047,"w":1},{"id":"E-483","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"有重大喪失債信情事尚未了結或了結後尚未逾三年之已登錄保險業務員，應作何處置？","opts":["維持登錄","若申請登錄，應不予登錄；已登錄者，所屬公司應通知各有關公會註銷登錄","撤銷或維持登錄均可","經允許可維持登錄"],"ans":2,"exp":["📝 解析：依保險業務員管理規則 §7 第 1 項第 7 款，有重大喪失債信情事尚未了結或了結後尚未逾三年者，申請登錄應不予登錄；已登錄者，所屬公司應通知各有關公會「註銷」登錄，不能維持或任選。"],"pos":0.64125,"w":1},{"id":"E-484","s":"all","ch":"道德｜保險招攬規範","star":1,"n":1,"refs":"","tag":"","stem":"金融從業人員銷售保險商品之招攬廣告，除應遵守相關法令外，並應遵守什麼規定？","o
