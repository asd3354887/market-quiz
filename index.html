、利率、指數或其他利益之下列何種契約之交易？","opts":["期貨契約","選擇權契約","期貨選擇權契約","以上皆是"],"ans":4,"exp":["📝 解析：依期貨交易法第3條，期貨交易包括期貨契約、選擇權契約、期貨選擇權契約及槓桿保證金契約，故以上皆是。"],"pos":0.20078,"w":1},{"id":"M-068","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"自101 年4 月 2 日起銀行及證券商從事店頭衍生性金融商品交易須向下列何者建置之店頭衍生性金融商品交易資訊儲存庫申報相關資訊？","opts":["臺灣證券交易所","證券櫃檯買賣中心","臺灣期貨交易所","臺灣集中保管結算所"],"ans":2,"exp":["📝 解析：金管會自101年起要求銀行與證券商將店頭衍生性商品交易資訊申報至證券櫃檯買賣中心建置的交易資訊儲存庫（TR）。"],"pos":0.20156,"w":1},{"id":"M-069","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"期貨交易人不可透過下列何者從事期貨交易？","opts":["專營期貨經紀商","兼營期貨經紀商","期貨交易輔助人","金融資訊服務公司"],"ans":4,"exp":["📝 解析：期貨交易須透過專營或兼營期貨經紀商，或經期貨交易輔助人轉委託；金融資訊服務公司不得受託從事期貨交易。"],"pos":0.20233,"w":1},{"id":"M-070","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一項行為違反「期貨商管理規則」對保障交易人權益之規定？","opts":["要求業務員在開戶時向客戶詳細說明可能的財務風險","僅以電話告知成交狀況，並以此為由免除交付書面買賣報告書之義務","拒絕未具備期貨業務員資格之員工受託下單","要求交易人在簽署風險預告書前，必須有充分的審閱期間"],"ans":2,"exp":["📝 解析：依期貨商管理規則，期貨商於成交後應作成買賣報告書交付交易人，不得只以電話通知取代；其餘選項都是保障交易人的正確做法。"],"pos":0.20311,"w":1},{"id":"M-071","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一項行為符合我國法律針對「期貨商管理規則」中有關「客戶保證金專戶」之規定？","opts":["為了資金靈活調度，期貨商可將 A 客戶的保證金暫時挪用於支付 B 客戶的交割款","期貨商得將客戶保證金專戶內的有價證券向銀行申請透支，以增加營運資金","期貨商必須在營業場所顯著位置公告所有客戶保證金專戶的機構名稱及帳號","兼營期貨的銀行，可直接將客戶保證金存放在該銀行之營業部門帳戶中"],"ans":3,"exp":["📝 解析：期貨商應於營業場所公告客戶保證金專戶的存放機構與帳號，方便查核；客戶保證金須專戶分離，不得挪用、質借或混入自有帳戶。"],"pos":0.20389,"w":1},{"id":"M-104","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列哪一項敘述「不屬於」結構型商品核心面臨的風險範疇？","opts":["連結標的價格波動導致本金損失的市場風險","發行機構因為信用評等調降而產生的信用風險","投資人隨時可以按原始買入價格賣回給銀行的無風險變現性","若商品涉及外幣計價，因匯率變動產生的匯兌風險"],"ans":3,"exp":["📝 解析：結構型商品有市場、發行機構信用、匯兌與流動性風險；提前贖回常需折價，不可能隨時以原價賣回，故(3)不屬其特性。"],"pos":0.20467,"w":1},{"id":"M-181","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在金融衍生性商品市場中，「期貨合約」具有多項標準化特徵以確保交易安全與效率。請問下列敘述中，何者「不屬於」期貨合約的特性？","opts":["交易係在有組織的期貨交易所內，透過公開競爭價格之方式進行","採行「每日結算」（Mark-to-Market）制度，將盈虧即時反映於保證金帳戶","買賣雙方係以結算所為共同對手方，故無需直接承擔對方的信用風險","交易標的物之品質、數量與交割時間，均可由買賣雙方自行協議變更"],"ans":4,"exp":["📝 解析：期貨是交易所訂定的標準化契約，標的品質、數量、交割時間都已規格化，買賣雙方不能自行協議變更；可議定的是遠期契約。"],"pos":0.20545,"w":1},{"id":"M-182","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是期交所在調整期貨合約保證金時之考量因素？","opts":["期貨合約價格波動性大小","期貨合約總值大小","期貨合約交易量大小","現貨價格波動性大小"],"ans":3,"exp":["📝 解析：保證金水準取決於風險，期交所考量價格（含現貨）波動性及契約總值；交易量大小與單口風險無直接關係。"],"pos":0.20623,"w":1},{"id":"M-183","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於「標準化期貨契約」的敘述，下列哪一個項目是屬於市場變動變數，而非由期貨交易所預先規定一致的因素？","opts":["交易標的物的規格、等級與品質標準","每一口合約所代表的成交價格與跳動點價值","每一筆委託單的基本交易單位","合約到期時的最後交易日與交割結算方式"],"ans":2,"exp":["📝 解析：標的規格、交易單位、最後交易日與結算方式都由交易所預先規定；成交價格則由市場買賣決定，屬變動變數。"],"pos":0.207,"w":1},{"id":"M-184","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"期貨市場中所謂「正向市場」乃指所有期貨價格與現貨價格比較時，期貨價值會：","opts":["高於現貨價格","等於現貨價格","低於現貨價格","與現貨價格無關"],"ans":1,"exp":["📝 解析：正向市場（正常市場）中期貨價格高於現貨價格，差額反映持有成本，基差為負；反之為逆價市場。"],"pos":0.20778,"w":1},{"id":"M-185","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"期貨經紀商不得從事何種行為？","opts":["代收保證金","代客戶下單至交易所","代替買賣雙方直接撮合","代客戶進行實物交割"],"ans":3,"exp":["📝 解析：撮合買賣是期貨交易所的職能；期貨經紀商只能代收保證金、代客下單及辦理交割，不得自行撮合雙方。"],"pos":0.20856,"w":1},{"id":"M-186","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"有些業務員因想獲得不當之較多佣金，於是鼓勵客戶多作交易而未顧及客戶利益，此種情形稱之為：","opts":["對作","擠壓","炒單","搶帽子"],"ans":3,"exp":["📝 解析：業務員為賺取佣金而誘使客戶過度頻繁交易、不顧客戶利益，稱為炒單（churning），屬違反職業道德的行為。"],"pos":0.20934,"w":1},{"id":"M-187","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"最近油價飆漲，某甲若完全根據預期而直接放空利率期貨且賺了不少，請問他屬於：","opts":["避險者","投機者","價差交易者","價值投資交易者"],"ans":2,"exp":["📝 解析：沒有相對應的現貨部位要保護，純粹依預期方向建立部位以賺取價差，就是投機者。"],"pos":0.21012,"w":1},{"id":"M-188","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"主管機關開放的摩根臺指期貨（MSCI Taiwan index）在哪一個交易所交易？","opts":["CME","CBOT","HKEX","SGX"],"ans":3,"exp":["📝 解析：摩根台指期原在新加坡交易所（SGX）交易。MSCI 於 2020 年 5 月改授權香港交易所，HKEX 於 2020 年 7 月 6 日推出 MSCI 台灣指數期貨；SGX 則在 2020 年 10 月 30 日把未平倉部位移到富時台灣期貨並停止交易，所以現行在 HKEX 掛牌。"],"pos":0.21089,"w":1},{"id":"M-189","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"下列對「基差」描述何者為非？","opts":["基差＝現貨價格－期貨價格","正常市場基差為負值","期貨契約到期時，基差為正值","逆價市場基差為正值"],"ans":3,"exp":["📝 解析：期貨到期時價格會收斂到現貨價格，基差應為零而非正值；其餘敘述（基差定義、正常市場為負、逆價市場為正）都正確。"],"pos":0.21167,"w":1},{"id":"M-190","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"期貨合約的價格於到期日收盤後，期貨價格必須等於現貨價格，其原因或理由是：","opts":["未平倉部位必須於到期日收盤後進行交割","期貨交易必須逐日結算","期貨交易量大於現貨交易量","人們對期貨價格沒有偏好"],"ans":1,"exp":["📝 解析：到期時未平倉部位須依最後結算價交割，若期現價不同就有無風險套利，套利力量使期貨價格在到期日等於現貨價格。"],"pos":0.21245,"w":1},{"id":"M-191","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"期貨交易人開戶時，下列何者非屬必要？","opts":["風險預告書簽名","營業員確信交易人適合期貨交易","徵信客戶的信用狀況","$10,000 的保證金存入"],"ans":4,"exp":["📝 解析：開戶須簽風險預告書、評估交易人適合度並徵信；開戶本身沒有規定須先存入新台幣1萬元，保證金是交易時才繳。"],"pos":0.21323,"w":1},{"id":"M-192","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"下列敘述何者符合期貨交易風險告知書之內容精神？","opts":["期貨交易可能產生極大的利潤或損失","客戶若有超額損失，必須補繳","差價交易的風險並不一定較單純的買單或賣單小","以上皆正確"],"ans":4,"exp":["📝 解析：風險預告書提醒：期貨具高槓桿可能大賺大賠、超額損失須補繳、價差交易風險未必較小，三者都屬其內容，故皆正確。"],"pos":0.21401,"w":1},{"id":"M-193","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在台灣的期貨交易體系中，關於「金融監督管理委員會」與「臺灣期貨交易所」的角色關係，下列敘述何者最為正確？","opts":["期貨交易所負責訂定「期貨交易法」，金管會則負責執行場內撮合","金管會負責核准新種期貨商品掛牌，期貨交易所則負責市場第一線的監視與管理","經濟部負責監督期貨商的財務狀況，中央銀行負責管理期貨商的業務員","期貨公會是唯一的行政執法單位，有權對違規投資人進行罰鍰"],"ans":2,"exp":["📝 解析：金管會為主管機關，核准期貨商品上市；期交所負責撮合及市場第一線監視。期貨交易法由立法院制定，公會並非行政罰鍰機關。"],"pos":0.21479,"w":1},{"id":"M-194","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"下列各種委託單，除了何者之外，皆需標明價格？","opts":["限價單","市價單","停損單","觸價單"],"ans":2,"exp":["📝 解析：市價單以當時市場最佳價格立即成交，不需指定價格；限價單、停損單、觸價單都要標明價格或觸發價。"],"pos":0.21556,"w":1},{"id":"M-195","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某投資人目前「放空」一口台指期，為了防止行情大漲造成超額損失，他想利用「停損單」 來執行平倉避險。試問：在設定此停損買單時，其價格設定的原則為何？","opts":["必須設定在 「低於」目前市價的價位，旨在鎖定既有獲利","必須設定在「高於」目前市價的價位，當行情不跌反漲觸及該價位時，自動啟動平倉以止損","必須設定在「等於」目前市價的價位，以確保在開盤時能第一時間成交","無論價格設定為何，停損單都會在委託送出後的下一筆成交時立即轉為市價單"],"ans":2,"exp":["📝 解析：空單怕行情上漲，停損買單須設在高於目前市價處，價格漲到該價位即觸發平倉，限制損失擴大。"],"pos":0.21634,"w":1},{"id":"M-196","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"客戶的保證金淨值，因市場行情往不利的方向發展，當淨值跌破某一水位，期貨商就會向客戶發出追繳保證金的通知，此一特定水位稱為：","opts":["原始保證金","維持保證金","差異保證金","零和保證金"],"ans":2,"exp":["📝 解析：保證金淨值跌破維持保證金時，期貨商即發出追繳通知；原始保證金是建立部位時應繳的金額。"],"pos":0.21712,"w":1},{"id":"M-197","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"客戶保證金不足時，需補足至：","opts":["變動保證金","原始保證金","維持保證金","結算保證金"],"ans":2,"exp":["📝 解析：收到追繳後，須將保證金補足到原始保證金水準，而非只補到維持保證金。"],"pos":0.2179,"w":1},{"id":"M-198","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"目前國內各種指數期貨契約交易保證金可以何種形式繳存？","opts":["現金","現金、債券","現金、債券、定存單","現金、債券、股票"],"ans":4,"exp":["📝 解析：期交所規定交易保證金除現金外，可用公債、股票等有價證券依折價抵繳，因此現金、債券、股票皆可。"],"pos":0.21868,"w":1},{"id":"M-199","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"客戶若要將其存入保證金提出，則其出金數額必須是：","opts":["小於或等於（客戶保證金目前淨值減未平倉部位所需保證金）","保證金既為客戶存入的錢，故客戶的出金數額不受限制","期貨商可以自由決定","法規並未規範"],"ans":1,"exp":["📝 解析：可出金金額以權益數（淨值）扣除未平倉部位所需保證金後的餘額為限，以免部位保證金不足。"],"pos":0.21946,"w":1},{"id":"M-200","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"我國期貨交易之保證金制度採用：","opts":["總額保證金法","淨額保證金法","針對交易人採總額保證金法、結算會員與期貨商則採淨額保證金法","由當事人自由選擇"],"ans":1,"exp":["📝 解析：我國採總額保證金制，不同客戶的多空部位不得相互抵銷，須各自全額計收保證金，以確保結算安全。"],"pos":0.22023,"w":1},{"id":"M-201","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"一般而言，當期貨價格與未平倉數量同步上漲時，代表：","opts":["未來期貨價格持續看漲","未來期貨價格可能反轉而下","未來期貨價格可能反轉而上","未來期貨價格持續看跌"],"ans":1,"exp":["📝 解析：價格上漲且未平倉量同步增加，表示有新資金進場做多，多頭趨勢強勁，一般解讀為後市持續看漲。"],"pos":0.22101,"w":1},{"id":"M-202","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"“買進黃豆期貨，同時賣出黃豆粉、黃豆油期貨”之委託稱為：","opts":["市場間價差委託","商品間價差委託","加工產品間價差委託","無效的委託"],"ans":3,"exp":["📝 解析：買原料黃豆、賣加工品黃豆粉與黃豆油，是利用原料與加工產品間的價格關係，屬加工產品間價差（反壓榨價差）。"],"pos":0.22179,"w":1},{"id":"M-203","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"臺灣期貨交易所30 天期利率期貨之交易標的為國內之何種票券工具？","opts":["30 天期融資性商業本票","國庫券","銀行承兌匯票","可轉讓定期存單"],"ans":1,"exp":["📝 解析：期交所 30 天期利率期貨（CPF）的交易標的是面額新台幣 1 億元的 30 天期融資性商業本票，用來規避短期利率風險，故選 (1)；國庫券、銀行承兌匯票、可轉讓定存單都不是它的標的。","⚠ 現行狀況：期交所 30 天期利率期貨已於 2013 年 6 月 20 日終止上市，目前沒有這項商品（考試以官方答案為準）。"],"pos":0.22257,"w":1},{"id":"M-204","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某進口商利用期貨鎖定購料成本。他在避險策略中發現，越接近合約到期日，避險的效果越精確（即現貨損益與期貨損益抵銷程度越高）。試問：這種現象主要是受下列哪一項因素影響？","opts":["期貨價格會隨時間流逝而產生時間價值，進而提升避險盈餘","基差會隨時間接近到期日而逐漸縮小並收斂，降低了不確定性","到期日時，期貨交易所會強制規定價差必須維持在固定百分比","避險者的心理因素會隨到期日接近而趨於保守，減少了操作誤差"],"ans":2,"exp":["📝 解析：避險的剩餘風險是基差風險；越接近到期，期貨價格向現貨收斂、基差趨近零，現貨與期貨損益抵銷就越完全。"],"pos":0.22335,"w":1},{"id":"M-205","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某股票型基金經理人欲執行「避險式資產重置」，將手中風險較高的股票組合，透過期貨工具轉變為等同於「無風險資產（合成債券）」的性質。下列哪一個等式最能代表此一轉換邏輯？","opts":["股票現貨＋買入指數期貨＝合成債券","股票現貨＋賣出指數期貨＝合成債券","股票現貨－債券現貨＝合成期貨","指數期貨－股票現貨＝合成利息"],"ans":2,"exp":["📝 解析：持有股票並賣出等值指數期貨，股價漲跌被期貨部位抵銷，只剩無風險利率報酬，等同合成債券。"],"pos":0.22412,"w":1},{"id":"M-206","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"採行完全避險策略時，避險者仍有可能遭遇追繳保證金之情況，其主要原因為：","opts":["現貨價格與期貨價格之變動相關性改變所致","逐日結算制度所致","基差值改變所致","現貨價格波動性增大所致"],"ans":2,"exp":["📝 解析：即使現貨與期貨損益整體抵銷，期貨部位仍逐日結算，虧損當日即須以現金補足保證金，因而可能遭追繳。"],"pos":0.2249,"w":1},{"id":"M-207","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"輕油裂解廠通常會如何避險？","opts":["買有鉛汽油期貨，賣無鉛汽油期貨","買無鉛汽油期貨，賣有鉛汽油期貨","買原油期貨，賣無鉛汽油期貨","買有鉛汽油期貨，賣原油期貨"],"ans":3,"exp":["📝 解析：煉油業者風險在原料原油上漲、產品汽油下跌，故買原油期貨、賣無鉛汽油期貨鎖定裂解價差。"],"pos":0.22568,"w":1},{"id":"M-208","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在股價指數期貨的定價模型中，預期股利是影響期貨價格的重要因子。若在避險期間，發生 「非預期」的股利政策變動，這將導致避險者面臨何種困境？","opts":["這種風險屬於非系統性風險，可以透過增加期貨部位來規避","此類風險無法透過指數期貨規避，因為它會改變期貨與現貨之間的理論評價關係","這種風險會自動被交易所的保證金制度抵銷","只要持有到期，股利變動的風險就會自動消失"],"ans":2,"exp":["📝 解析：股利是指數期貨理論價格的組成因子，非預期變動會改變期現貨評價關係，屬基差風險，無法用指數期貨本身規避。"],"pos":0.22646,"w":1},{"id":"M-209","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"以下何者不是期貨投資活動的正常功能？","opts":["風險移轉","增加市場的流動性","有助於期貨價格的穩定","操控期貨價格"],"ans":4,"exp":["📝 解析：期貨的正常經濟功能是風險移轉、價格發現與提供流動性；操控價格是期貨交易法禁止的違法行為。"],"pos":0.22724,"w":1},{"id":"M-210","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"認購權證之「發行者」相當於下列選擇權策略中那一種角色？","opts":["買進買權（Buy Call）","買進賣權（Buy Put）","賣出買權（Sell Call）","賣出賣權（Sell Put）"],"ans":3,"exp":["📝 解析：認購權證賦予持有人以約定價格買進標的的權利，發行者收取權利金並負履約義務，相當於賣出買權。"],"pos":0.22802,"w":1},{"id":"M-211","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"以下那一種交易者不必繳交保證金？","opts":["期貨的買方","選擇權的買方","期貨的賣方","選擇權的賣方"],"ans":2,"exp":["📝 解析：選擇權買方付完權利金後只有權利沒有義務，最大損失就是權利金，不需繳保證金；期貨買賣雙方與選擇權賣方都要繳。"],"pos":0.22879,"w":1},{"id":"M-212","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"S&P 500 現貨指數 675 點，則：","opts":["680 買權為價內／680 賣權為價外","670 買權為價內／ 670 賣權為價外","670 買權及賣權皆為價內","665 買權及賣權皆為價外"],"ans":2,"exp":["📝 解析：指數675時，履約價670買權可用670買進、有內含價值為價內；同一履約價賣權以670賣出不划算，為價外。"],"pos":0.22957,"w":1},{"id":"M-213","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"當賣出期貨賣權(put)且被執行時，其結果如何？","opts":["取得多頭期貨契約","取得空頭期貨契約","取得相等數量之現貨","取得現金"],"ans":1,"exp":["📝 解析：期貨賣權買方履約即取得空頭期貨部位，賣方被執行就必須承接對應的多頭期貨部位。"],"pos":0.23035,"w":1},{"id":"M-214","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"價內（in-the-money）期貨賣權（put）越深價內，其時間價值（time value）會：","opts":["上升","下降","不一定","不受影響"],"ans":2,"exp":["📝 解析：時間價值在價平時最大；越深入價內，選擇權越像標的本身，額外的時間價值越小。"],"pos":0.23113,"w":1},{"id":"M-215","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"結算所在期貨交易中所扮演的角色不包括下列哪一項？","opts":["進行每日結算","介入每筆交易成為買方的賣方，以及賣方的買方","承擔買賣雙方的信用風險","負責監視不法交易行為"],"ans":4,"exp":["📝 解析：結算所負責每日結算、成為買賣雙方的交易對手並承擔履約風險；監視不法交易是交易所與主管機關的職責。"],"pos":0.23191,"w":1},{"id":"M-216","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"目前股價指數期貨之交割方式為","opts":["現金交割","實物交割","由賣方決定","由買方決定"],"ans":1,"exp":["📝 解析：股價指數無法實物交付，國內外股價指數期貨皆以最後結算價計算差額，採現金交割。"],"pos":0.23268,"w":1},{"id":"M-217","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"依期交法規定，期貨交易人於何時繳交交易保證金？","opts":["下單買賣之前","下單買賣之後","成交之後","成交當日之收盤後"],"ans":1,"exp":["📝 解析：期貨商應於受託交易前向交易人收足交易保證金，交易人須先存入保證金才能下單。"],"pos":0.23346,"w":1},{"id":"M-218","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"","stem":"履約價格7,200 之加權股價指數賣權在最後結算價 7,150 點時，每口會有多少價值？","opts":["10,000 元","2,500 元","0 元","50 元"],"ans":2,"exp":["📝 解析：賣權價值＝履約價－結算價＝7,200－7,150＝50點，台指選擇權每點50元，故每口價值2,500元。"],"pos":0.23424,"w":1},{"id":"M-524","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某航空公司為了避免國際油價大漲導致營運成本激增，與銀行簽訂了一份合約，約定未來一年內可以特定價格購入燃油。試問：此種合約屬於下列哪一類金融商品？","opts":["衍生性金融商品","權益型有價證券","貨幣市場工具","抵押型證券"],"ans":1,"exp":["📝 解析：約定未來以特定價格購入燃油的合約，價值衍生自油價，屬遠期或選擇權類衍生性金融商品，用於規避油價風險。"],"pos":0.23502,"w":1},{"id":"M-532","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在期貨市場的運作架構中，下列哪一個機構的主要職能是「提供數據傳輸與交易平台軟體」，而非「受託買賣與結算」？","opts":["兼營期貨經紀商","期貨交易輔助人","專營期貨經紀商","金融資訊服務公司"],"ans":4,"exp":["📝 解析：金融資訊服務公司只提供行情資料傳輸與交易軟體平台；專營、兼營期貨經紀商與期貨交易輔助人才涉及受託買賣業務。"],"pos":0.2358,"w":1},{"id":"M-544","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當市場出現劇烈震盪時，期貨交易所通常會調整保證金以防範違約風險。關於保證金調整的參考依據，下列敘述何者為錯誤？","opts":["當市場價格波動顯著增加時，為防範違約，交易所通常會調高保證金","保證金之數額，通常以能涵蓋標的資產在一段時間內，絕大部分可能的價格波動損失為準","合約的交易量（成交量）愈大，代表該商品愈熱門，因此其保證金一定會設定得比冷門商品高","交易所會參考標的現貨市場的變動及相關法律規範，作為評估期貨合約風險的依據"],"ans":3,"exp":["📝 解析：保證金依標的價格波動度與風險評估訂定，與成交量冷熱無必然關係，熱門商品不一定保證金較高，故選項(3)錯。"],"pos":0.23658,"w":1},{"id":"M-545","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據「無套利機會原則」，期貨價格與現貨價格在合約到期時必然會趨於一致（收斂）。若在到期交割時，期貨價格仍顯著「高於」現貨價格，投資人將可採取下列何種行動進行無風險獲利，進而促使兩者價格接軌？","opts":["在現貨市場買進標的物，同時在期貨市場放空並進行交割","在現貨市場賣出標的物，同時在期貨市場買進並進行交割","僅在期貨市場進行當日沖銷，不需理會現貨價格","由於結算所會自動修正價差，投資人無需採取任何行動"],"ans":1,"exp":["📝 解析：期貨高於現貨時，可買進現貨、放空期貨並交割，賺取無風險價差；套利會推升現貨、壓低期貨，使兩者收斂。"],"pos":0.23735,"w":1},{"id":"M-546","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某出口商為了規避匯率風險進行期貨避險。雖然其現貨與期貨部位價值變動完全抵銷，但該出口商仍因「現金流不足」而被迫平倉。試問：導致此現象的最主要原因為何？","opts":["現貨部位的獲利多屬「帳面價值」，無法立即變現來支應期貨部位的「逐日結算」虧損","基差風險過大，導致期貨部位的保證金被交易所全數沒收","投資人未在合約到期前進行實物交割，被視為違約","期貨合約的流動性不足，導致買賣價差過大而損失資金"],"ans":1,"exp":["📝 解析：期貨每日結算，虧損須立即補繳保證金，但現貨部位的獲利多為未實現的帳面價值，無法即時變現，造成資金缺口。"],"pos":0.23813,"w":1},{"id":"M-558","s":"all","ch":"常識｜期貨與衍生性商品","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"根據期貨市場的「持有成本理論」，考量標的物之倉儲、保險及利息等「持有成本」，若期貨市場表現為「正向市場」，則該商品的期貨價格相對於現貨價格會呈現何種狀態？","opts":["呈現折價","呈現溢價","兩者價格一致，基差等於零","兩者價格隨機波動，不存在穩定的價差結構"],"ans":2,"exp":["📝 解析：正向市場下期貨價格＝現貨價格＋持有成本，期貨高於現貨呈溢價，基差（現貨－期貨）為負值。"],"pos":0.23891,"w":1},{"id":"M-017","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"以下哪一種是台灣公司債主要的市場交易方式？","opts":["僅能在台灣證券交易所（集中市場）進行競價交易","透過證券商營業櫃檯（店頭市場）進行議價交易","投資人直接與發行公司進行私下轉讓","僅能透過自動櫃員機（ATM）進行申購交易"],"ans":2,"exp":["📝 解析：我國公司債主要在櫃買中心店頭市場交易，由證券商營業處所議價或透過債券等殖成交系統進行，並非只在集中市場。"],"pos":0.23969,"w":1},{"id":"M-032","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於資本市場?","opts":["股票市場","公債市場","公司債市場","商業本票市場"],"ans":4,"exp":["📝 解析：股票、公債、公司債屬一年以上的資本市場工具；商業本票期限多在一年以內，屬貨幣市場（票券市場）工具。"],"pos":0.24047,"w":1},{"id":"M-037","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何項金融工具，通常「不屬於」貨幣市場所流通的短期信用工具？","opts":["銀行承兌匯票","股份有限公司發行之普通股股票","可轉讓定期存單","融資性商業本票"],"ans":2,"exp":["📝 解析：銀行承兌匯票、可轉讓定期存單、融資性商業本票都是短期票券；普通股沒有到期日，屬資本市場工具。"],"pos":0.24125,"w":1},{"id":"M-047","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於短期資金市場？","opts":["票券市場","債券市場","基金市場","期貨市場"],"ans":1,"exp":["📝 解析：票券市場交易商業本票、國庫券、可轉讓定存單等一年內工具，屬短期資金（貨幣）市場；債券屬資本市場。"],"pos":0.24202,"w":1},{"id":"M-048","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬臺灣貨幣市場投資工具？","opts":["國庫券","歐洲美元借款","銀行承兌匯票","商業本票"],"ans":2,"exp":["📝 解析：國庫券、銀行承兌匯票、商業本票都是臺灣貨幣市場工具；歐洲美元借款屬境外的國際金融市場交易。"],"pos":0.2428,"w":1},{"id":"M-096","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"債券市場產品多元，關於各類債券的定義與分類，下列何者「不正確」？","opts":["金融債券是由銀行等金融機構為募集長期資金而發行的債務憑證","無實體債券是指不印製紙本實體票券，透過登錄方式記載的債券","次順位債券的持有人，其受償順序優於普通債券持有者，但利率較低","附認股權債券是指投資人除了領取利息外，還擁有依約定價格購買股票的權利"],"ans":3,"exp":["📝 解析：次順位債券的受償順序在普通（主順位）債之後，風險較高，因此利率通常較高，(3)把順序與利率都說反了。"],"pos":0.24358,"w":1},{"id":"M-141","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"通常而言，零息債券（Zero-Coupon Bond）的票面價格較市價為：","opts":["高","相等","低","沒有一定關係"],"ans":1,"exp":["📝 解析：零息債券不付利息，以低於面額折價發行與交易，到期按面額償還，因此票面金額通常高於市價。"],"pos":0.24436,"w":1},{"id":"M-142","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"公債自營商在公債發行消息公布後，於正式標售之前，以約定利率和投資人進行買賣，而交割日訂在發行日之後，此種市場為?","opts":["公債發行前期交易市場","發行市場","次級市場","店頭市場"],"ans":1,"exp":["📝 解析：公債標售前即以約定利率買賣、發行日後交割的交易，稱為公債發行前交易（When-Issued），屬發行前期交易市場。"],"pos":0.24514,"w":1},{"id":"M-143","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"登錄公債係指：","opts":["無風險債券","無實體公債","垃圾債券","固定利率公債"],"ans":2,"exp":["📝 解析：登錄公債是不印製實體債票，以帳簿登錄方式記載持有人權利的無實體公債。"],"pos":0.24591,"w":1},{"id":"M-144","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"公債於何處流通買賣：","opts":["集中交易市場","同時在集中與店頭市場","店頭市場","櫃檯市場"],"ans":2,"exp":["📝 解析：我國中央政府公債可在證交所集中市場及櫃買中心店頭市場買賣，實務上以櫃買的等殖成交系統為主。"],"pos":0.24669,"w":1},{"id":"M-145","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"公司之債券評等下降時，則？A.表示其違約風險下降；B.表示其違約風險上升；C.債券價格會下降；D.債券價格會上升","opts":["A.、C.","A.、D.","B.、C.","B.、D."],"ans":3,"exp":["📝 解析：評等下降代表違約風險上升，投資人要求較高殖利率，債券價格因而下跌，故B與C正確。"],"pos":0.24747,"w":1},{"id":"M-146","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"債券價格隨著到期日的接近，會愈來愈趨近於：","opts":["承銷價","贖回價值","市價","面值"],"ans":4,"exp":["📝 解析：債券到期時按面額償還，因此不論溢價或折價，價格會隨到期日接近逐漸收斂至面值。"],"pos":0.24825,"w":1},{"id":"M-147","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"A 國的發行者在B 國發行以 B 國貨幣計價的債券稱為：","opts":["歐洲債券","貨幣債券","普通債券","外國債券"],"ans":4,"exp":["📝 解析：A國發行者在B國發行並以B國貨幣計價的債券稱外國債券（如揚基債券）；若不以當地貨幣計價則為歐洲債券。"],"pos":0.24903,"w":1},{"id":"M-148","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者對「垃圾債券」的敘述為真？","opts":["預期報酬低的債券","屬於投資等級的債券","高風險、高殖利率之債券","高品質的債券"],"ans":3,"exp":["📝 解析：垃圾債券是信用評等低於投資等級（S&P BB+以下）的債券，違約風險高，因此殖利率較高。"],"pos":0.24981,"w":1},{"id":"M-149","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"乙債券4 年後到期，其面額為 10 萬元，每年付息一次 5,000 元，若該債券以 105,000 元賣出，則其到期殖利率：","opts":["小於 5%","等於 5%","大於5%","大於或等於 5%"],"ans":1,"exp":["📝 解析：票面利率5%，價格105,000元高於面額（溢價），表示市場要求報酬較低，到期殖利率小於5%。"],"pos":0.25058,"w":1},{"id":"M-150","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為債券投資所面臨的風險？","opts":["違約風險","購買力風險","利率風險","以上皆是"],"ans":4,"exp":["📝 解析：債券面臨發行人違約風險、通膨侵蝕實質報酬的購買力風險，以及利率變動造成價格波動的利率風險，故以上皆是。"],"pos":0.25136,"w":1},{"id":"M-151","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"其他因素不變下，債券市價與市場利率常作何種變動關係？","opts":["同方向變動","反方向變動","沒有關連性","同方向或反方向變動均有可能"],"ans":2,"exp":["📝 解析：債券價格是未來現金流以市場利率折現，市場利率上升則價格下跌，兩者呈反向變動。"],"pos":0.25214,"w":1},{"id":"M-152","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"其他因素不變下，下列何種金融工具的利率風險最高？","opts":["短期公債","國庫券","長期公債","商業本票"],"ans":3,"exp":["📝 解析：到期期間愈長，價格對利率變動愈敏感；長期公債存續期間最長，利率風險最高，國庫券與商業本票最低。"],"pos":0.25292,"w":1},{"id":"M-153","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"證券商在國外證券市場買賣「小龍債券」之結算交割之進行是?","opts":["現款現券交割","在臺灣集保公司","透過 Euroclear 或 Cedel 國際性結算交割辦理","在臺灣證券交易所"],"ans":3,"exp":["📝 解析：小龍債券是亞洲開發銀行等在亞洲發行的國際債券，在國外市場買賣時透過Euroclear或Cedel（Clearstream）國際結算機構交割。"],"pos":0.2537,"w":1},{"id":"M-154","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"在標準普爾(Standard & Poor 's)的評等中，那一評等等級以上的債券為投資等級？","opts":["BB","BBB","A","AA"],"ans":2,"exp":["📝 解析：標準普爾評等BBB（含）以上為投資等級，BB+以下為投機等級（垃圾債）。"],"pos":0.25447,"w":1},{"id":"M-155","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"公司債的持有人為公司的：","opts":["債權人","股東","董事","經理人"],"ans":1,"exp":["📝 解析：公司債是公司向投資人借款的債務憑證，持有人為公司債權人，享有固定還本付息權利，無股東權。"],"pos":0.25525,"w":1},{"id":"M-156","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"歐洲債券(Euro Bonds)與外國債券(Foreign Bonds)之比較何者為真？","opts":["歐洲債券是指 A 國發行者在B 國發行以 B 國幣計價之債券","外國債券是指 A 國發行者在 B 國發行不以 B 國幣計價之債券","歐洲債券發行的相關條件與規定均較外國債券來得有彈性","亞銀所發行的亞洲小龍債券系列屬於歐洲債券的一種"],"ans":3,"exp":["📝 解析：歐洲債券在計價貨幣國以外發行，較不受單一國家法規限制，發行條件較外國債券有彈性；(1)(2)把兩者定義說反，小龍債券也不屬歐洲債券。"],"pos":0.25603,"w":1},{"id":"M-157","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"目前在我國賣出公司債時須課徵多少證券交易稅？","opts":["千分之一","千分之二","千分之三","免稅"],"ans":4,"exp":["📝 解析：依證券交易稅條例第2條之1，公司債及金融債券證券交易稅自99年起停徵，現行延至115年（2026年）12月31日止，故賣出免稅。","⚠ 公司債、金融債券停徵證交稅現行只到 2026 年 12 月 31 日；行政院 2026-10-01 已送立法院延長到 2036 年底，若未及時三讀，2027 年起賣出公司債要課千分之一。考試照官方答案 (4)。"],"pos":0.25681,"w":1},{"id":"M-158","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於債券？","opts":["政府公債","公司債","金融債券","認購權證"],"ans":4,"exp":["📝 解析：政府公債、公司債、金融債券都是還本付息的債務工具；認購權證是證券商發行、以股票為標的的衍生性商品。"],"pos":0.25759,"w":1},{"id":"M-159","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"可贖回公司債之贖回權利是操之於：","opts":["債權人","發行公司","承銷之證券商","選項 (1)、(2)、(3)均有可能"],"ans":2,"exp":["📝 解析：可贖回公司債是發行公司有權在到期前依約定價格提前贖回，通常在利率下跌時行使，權利屬發行公司。"],"pos":0.25837,"w":1},{"id":"M-160","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"零息債券(Zero-coupon Bonds)之敘述何者正確？","opts":["以高於面額發行","每間隔一固定期間，定期給付利息","每間隔一固定期間，定期償還本金","到期時，按面額贖回"],"ans":4,"exp":["📝 解析：零息債券以低於面額折價發行，期間不付息，到期時按面額一次償還，價差即為利息。"],"pos":0.25914,"w":1},{"id":"M-161","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"在其他條件相同下，到期期間愈長的債券，其價格對利率的敏感性：","opts":["愈大","愈小","不變","無從得知"],"ans":1,"exp":["📝 解析：其他條件相同時，到期期間愈長，存續期間愈長，價格對利率變動愈敏感，利率風險愈大。"],"pos":0.25992,"w":1},{"id":"M-162","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"在其他條件不變下，可轉換公司債的凍結期間愈長，則其價值會：","opts":["愈低","愈高","不變","無從得知"],"ans":1,"exp":["📝 解析：凍結期間（閉鎖期）內不得轉換成股票，期間愈長，持有人可行使轉換權的時間愈短，轉換選擇權價值下降，可轉債價值就愈低。"],"pos":0.2607,"w":1},{"id":"M-163","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"在其他條件相同下，當殖利率變動 1%時，高票面利率債券價格的變動會比低票面利率債券價格的變動：","opts":["大","一樣","小","不一定"],"ans":3,"exp":["📝 解析：票面利率愈高，前期收到的現金流比重愈大、存續期間愈短，對殖利率變動的敏感度較低，因此價格變動幅度較小。"],"pos":0.26148,"w":1},{"id":"M-179","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"其他因素不變下，下列何者不直接影響公司債券價格的波動？","opts":["公司信用評等狀況","公司股利","市場利率","時間"],"ans":2,"exp":["📝 解析：公司債價格受信用評等、市場利率與到期時間影響；股利是分配給股東的，不直接影響債券的現金流與價格。"],"pos":0.26226,"w":1},{"id":"M-272","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"銀行兌付可轉讓定期存單、商業本票、國庫券之利息時，應按給付額多少百分比扣繳利息所得稅？","opts":["10%","15%","20%","30%"],"ans":1,"exp":["📝 解析：依所得稅法，短期票券（含可轉讓定存單、商業本票、國庫券）利息採10%分離課稅，兌付時按給付額扣繳10%。"],"pos":0.26304,"w":1},{"id":"M-275","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"可轉讓定期存單以新台幣多少元為一單位，並按其倍數發行？","opts":["一萬元","五萬元","十萬元","五十萬元"],"ans":3,"exp":["📝 解析：可轉讓定期存單以新台幣10萬元為單位，並按其倍數發行。"],"pos":0.26381,"w":1},{"id":"M-340","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬短期票券市場之信用工具？","opts":["國庫券","可轉讓定存單","匯票","公司債"],"ans":4,"exp":["📝 解析：短期票券包括國庫券、可轉讓定存單、商業本票、匯票；公司債期限通常一年以上，屬資本市場工具。"],"pos":0.26459,"w":1},{"id":"M-343","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"中央政府為調節國庫收支，得發行未滿一年之信用工具，下列何者係屬之？","opts":["政府公債","建設公債","國庫券","金融債券"],"ans":3,"exp":["📝 解析：國庫券是中央政府為調節國庫收支而發行的一年期以內短期票券；公債為長期籌資工具，金融債券由銀行發行。"],"pos":0.26537,"w":1},{"id":"M-344","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"銀行為了提高流動性，發行一種具有可轉讓但不可中途解約特性，並承諾一定時間後之到期日按票載利率支付本息予存款人之短期信用工具，係屬下列何者？","opts":["定期存單","可轉讓定期存單","金融債券","商業承兌匯票"],"ans":2,"exp":["📝 解析：可轉讓定期存單（NCD）可在次級市場轉讓但不得中途解約，到期按票載利率還本付息，銀行藉此籌措短期資金。"],"pos":0.26615,"w":1},{"id":"M-345","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"發票人簽發一定之金額，委託付款人於指定之到期日，無條件支付與受款人或執票人之票據，稱之為下列何者？","opts":["匯票","本票","支票","保付支票"],"ans":1,"exp":["📝 解析：依票據法，匯票是發票人委託付款人於到期日無條件支付的票據，涉及發票人、付款人、受款人三方。"],"pos":0.26693,"w":1},{"id":"M-346","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"凡出售商品或提供勞務之相對人簽發之匯票，委託銀行為付款人而經其承兌者，稱之為下列何者？","opts":["銀行承兌匯票","商業承兌匯票","交易性商業本票","融資性商業本票"],"ans":1,"exp":["📝 解析：因交易簽發、以銀行為付款人並經銀行承兌的匯票稱銀行承兌匯票（BA），由銀行信用擔保。"],"pos":0.2677,"w":1},{"id":"M-347","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"凡出售商品或提供勞務之相對人簽發之匯票，以相對人(非銀行)為付款人而經其承兌者，稱之為下列何者？","opts":["銀行承兌匯票","商業承兌匯票","交易性商業本票","融資性商業本票"],"ans":2,"exp":["📝 解析：因交易簽發、以買方（非銀行）為付款人並經其承兌的匯票稱商業承兌匯票（TA），信用來自企業本身。"],"pos":0.26848,"w":1},{"id":"M-348","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"發票人簽發一定之金額，於指定之到期日，由自己無條件支付與受款人或執票人之票據，稱之為下列何者？","opts":["匯票","本票","支票","承兌匯票"],"ans":2,"exp":["📝 解析：本票是發票人自己承諾於到期日無條件付款的票據，只有發票人與受款人兩方。"],"pos":0.26926,"w":1},{"id":"M-349","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬因出售商品或勞務之交易行為所簽發之票據？","opts":["銀行承兌匯票","商業承兌匯票","交易性商業本票","融資性商業本票"],"ans":4,"exp":["📝 解析：融資性商業本票（CP2）是企業為籌措短期資金而發行，沒有實際交易背景；BA、TA 與交易性商業本票（CP1）都源自商品或勞務交易。"],"pos":0.27004,"w":1},{"id":"M-350","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列貨幣市場的短期信用工具中，何者簡稱為 RP？","opts":["附買回協議","附賣回協議","可轉讓定存單","國庫券"],"ans":1,"exp":["📝 解析：RP（Repurchase Agreement）指附買回協議：投資人向票券商買入票券並約定日後由票券商以約定價格買回，相反方向為附賣回（RS）。"],"pos":0.27082,"w":1},{"id":"M-352","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"短期票券集中保管結算機構應以幾家為限？","opts":["一家","二家","三家","四家"],"ans":1,"exp":["📝 解析：短期票券集中保管結算機構以一家為限，目前由臺灣集中保管結算所辦理票券的集中保管與結算交割。"],"pos":0.2716,"w":1},{"id":"M-353","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"票券交割作業中，有關買賣雙方款項部分的清算作業，係由下列何者負責？","opts":["臺灣銀行","財金資訊網路","央行同資系統","聯徵中心"],"ans":3,"exp":["📝 解析：票券交割的款項清算透過中央銀行同業資金調撥清算系統（央行同資系統）辦理，與集保結算所的券項撥轉同步完成。"],"pos":0.27237,"w":1},{"id":"M-354","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為票券次級市場之交割方式？","opts":["無實體化","實體化","無實體化與實體化","人工作業"],"ans":1,"exp":["📝 解析：我國短期票券已全面無實體化，以集保帳簿劃撥方式辦理次級市場交割，不再交付實體票券。"],"pos":0.27315,"w":1},{"id":"M-355","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為票券集中保管之結算交割方式？","opts":["款券同步交割","款先券後交割","券先款後交割","與券商協議而定"],"ans":1,"exp":["📝 解析：票券集中保管採款券同步交割（DVP），券與款同時撥轉，可消除一方交付後對方違約的交割風險。"],"pos":0.27393,"w":1},{"id":"M-356","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者之利息所得非採分離課稅方式扣繳，須依規定將利息所得併入綜合所得總額申報所得稅？","opts":["國庫券","可轉讓定存單","銀行承兌匯票","活期存款"],"ans":4,"exp":["📝 解析：國庫券、NCD、BA 等短期票券利息採10%分離課稅；活期存款利息須併入綜合所得申報，可適用儲蓄投資特別扣除額。"],"pos":0.27471,"w":1},{"id":"M-357","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"目前短期票券之利息所得採分離課稅，按給付額扣繳多少？","opts":["百分之十","百分之二十","百分之二十五","百分之三十"],"ans":1,"exp":["📝 解析：所得稅法規定個人持有短期票券的利息所得採分離課稅，按給付額扣繳10%後即完稅，不再併入綜合所得。"],"pos":0.27549,"w":1},{"id":"M-358","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"投資人購買一張可轉讓定存單，假設其利息所得為十萬元，請問採分離課稅後，其實際淨利息所得為多少？","opts":["七萬元","七萬五仟元","八萬元","九萬元"],"ans":4,"exp":["📝 解析：NCD 屬短期票券，利息按10%分離課稅：10萬元扣繳1萬元，實際淨利息為9萬元。"],"pos":0.27626,"w":1},{"id":"M-359","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何種信用工具之承銷價格非採貼現方式計算？","opts":["國庫券","商業本票","銀行承兌匯票","可轉讓定存單"],"ans":4,"exp":["📝 解析：國庫券、商業本票、承兌匯票以貼現方式發行（折價買入、到期領面額）；NCD 按面額發行、到期按票載利率還本付息，不採貼現。"],"pos":0.27704,"w":1},{"id":"M-360","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"票券商接受發行人之委託，依約定包銷或代銷票券之行為，稱為下列何者？","opts":["保證","簽證","承銷","標售"],"ans":3,"exp":["📝 解析：依票券金融管理法，票券商接受發行人委託，以包銷或代銷方式銷售票券的行為稱為承銷。"],"pos":0.27782,"w":1},{"id":"M-361","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者亦稱為初級市場？","opts":["發行市場","流通市場","期貨市場","拆款市場"],"ans":1,"exp":["📝 解析：初級市場即發行市場，是發行人首次發行證券、取得資金的市場；次級市場則是已發行證券的流通交易市場。"],"pos":0.2786,"w":1},{"id":"M-362","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬我國貨幣市場流通之主要信用工具？","opts":["可轉讓定存單","國庫券","商業本票","股票"],"ans":4,"exp":["📝 解析：我國貨幣市場主要工具有國庫券、商業本票、NCD、承兌匯票及附條件交易；股票屬資本市場。"],"pos":0.27938,"w":1},{"id":"M-363","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列哪一種固定收益的信用工具，其信用風險最大？","opts":["政府公債","商業本票","垃圾債券","國庫券"],"ans":3,"exp":["📝 解析：垃圾債券（高收益債）信用評等低於投資等級，違約機率最高；政府公債與國庫券由政府擔保，信用風險最低。"],"pos":0.28016,"w":1},{"id":"M-365","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"國庫券之發行、買回及還本付息等業務，係委由下列何者經理？","opts":["財政部","中央銀行","臺灣銀行","商業銀行"],"ans":2,"exp":["📝 解析：依國庫券及短期借款條例，國庫券由財政部發行，其發行、買回及還本付息等業務委由中央銀行經理。"],"pos":0.28093,"w":1},{"id":"M-366","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"國庫券的競標者，其投標利率低於底標利率時，下列敘述何者正確？","opts":["由低至高依次得標","由高至低依次得標","由投標時間先後依次得標","由投標金額大小依次得標"],"ans":1,"exp":["📝 解析：國庫券競標以利率投標，利率愈低代表出價愈高；投標利率低於底標（最高可接受利率）者，依利率由低至高依次得標至額滿。"],"pos":0.28171,"w":1},{"id":"M-367","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"國庫券的非競標者，其申購價格係按下列何者計算？","opts":["競標發行價格","競標最低價格","競標最高價格","競標最高價與最低價之平均價"],"ans":1,"exp":["📝 解析：國庫券非競標部分不參與出價，按競標部分得標結果所決定的發行價格（加權平均得標價格）申購。"],"pos":0.28249,"w":1},{"id":"M-368","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"銀行發行可轉讓定期存單可按月發行或指定到期日，其最低天期為何？","opts":["七天","十四天","二十一天","一個月"],"ans":4,"exp":["📝 解析：銀行發行 NCD 以按月為單位或指定到期日，最短天期為一個月、最長一年。"],"pos":0.28327,"w":1},{"id":"M-369","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"銀行為資金調度需要，發行可轉讓定期存單，其發行天期最長為多久？","opts":["六個月","一年","二年","三年"],"ans":2,"exp":["📝 解析：NCD 屬貨幣市場工具，銀行發行天期最長為一年；超過一年的籌資應改發金融債券。"],"pos":0.28405,"w":1},{"id":"M-374","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者於購買短期票券時，其利息收入免予扣繳所得稅？","opts":["教育機構","個人","上市公司","合夥事業"],"ans":1,"exp":["📝 解析：依所得稅法規定，教育、文化、公益、慈善機關或團體取得的短期票券利息免予扣繳；個人、公司及合夥事業仍須扣繳10%。"],"pos":0.28482,"w":1},{"id":"M-379","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"依票券金融管理法規定，融資性商業本票之發行，需委由經信用評等機構評等之金融機構保證，下列何者非屬前述所稱之金融機構？","opts":["銀行","投顧公司","信託投資公司","票券金融公司"],"ans":2,"exp":["📝 解析：依票券金融管理法，融資性商業本票須由銀行、信託投資公司或票券金融公司等金融機構保證；投顧公司不是金融機構，不能保證。"],"pos":0.2856,"w":1},{"id":"M-380","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬票券商辦理簽證作業之內容？","opts":["核驗發行人簽章","核驗保證人簽章","核驗票面額、發行日及到期日","洽定交易條件"],"ans":4,"exp":["📝 解析：票券簽證是核驗發行人、保證人簽章及票面金額、發行日、到期日等記載是否真實無誤；洽定交易條件屬承銷或買賣作業。"],"pos":0.28638,"w":1},{"id":"M-381","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"發行人所發行之商業本票，票券商承諾全數買入，並於承銷當日給付價款的方式，稱之為下列何者？","opts":["包銷","代銷","寄售","委辦"],"ans":1,"exp":["📝 解析：包銷是票券商承諾全數買下發行人的票券並於承銷日付款，未賣出部分自行承擔；代銷則賣不完退回發行人。"],"pos":0.28716,"w":1},{"id":"M-382","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"中央銀行可轉讓定期存單之發行面額分為三種，下列何者非屬之？","opts":["新台幣一百萬元","新台幣五百萬元","新台幣一千萬元","新台幣一億元"],"ans":1,"exp":["📝 解析：央行發行的可轉讓定期存單面額分為新台幣五百萬元、一千萬元及一億元三種，沒有一百萬元面額。"],"pos":0.28794,"w":1},{"id":"M-383","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"","stem":"發行人運用融資性商業本票籌集資金，其需經過之程序，下列何者錯誤？","opts":["保證","簽證","承銷","兌償"],"ans":4,"exp":["📝 解析：企業發行融資性商業本票籌資須經保證、簽證、承銷三道程序；兌償是到期還款階段，不屬籌資程序。"],"pos":0.28872,"w":1},{"id":"M-516","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於交易性商業本票與融資性商業本票之區別，下列何者為最重要的判別基準？","opts":["票券面額的大小","是否基於實際交易行為而產生之自償性質","發行人的信用評等等級","法律規定的最長到期期限"],"ans":2,"exp":["📝 解析：交易性商業本票（CP1）基於實際交易而發行，具自償性；融資性商業本票（CP2）純為籌措資金而發行，通常需金融機構保證。"],"pos":0.28949,"w":1},{"id":"M-520","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"統一企業計畫轉投資成立「聖娜多堡」麵包店，若財務經理預計在「短期票券市場」籌措所需的營運週轉資金，下列哪一種金融工具最為合適？","opts":["商業本票","可轉換公司債","存託憑證","普通股"],"ans":1,"exp":["📝 解析：商業本票是一年以內的短期票券，適合籌措營運週轉金；可轉債、存託憑證、普通股屬資本市場的長期籌資工具。"],"pos":0.29027,"w":1},{"id":"M-521","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"若某企業預計投入大量資金進行為期五年的「廠房興建與設備更新」，在健全的財務管理原則下，該企業應優先考慮下列哪一種籌資方式？","opts":["發行融資性商業本票不斷進行借新還舊","向銀行申請短期信用貸款","發行十年期公司債以鎖定長期資金成本","在票券市場發行國庫券"],"ans":3,"exp":["📝 解析：長期資本支出應以長期資金支應（期限配合原則），發行長期公司債可鎖定資金成本，避免短債長用的再融資風險。"],"pos":0.29105,"w":1},{"id":"M-522","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"證券商與客戶約定，由證券商出資$100,000 元向客戶買入甲債券，並約定在 20 天後，由客戶按約定利率（如：8%）買回該債券。就「證券商」的角度而言，此項交易稱為：","opts":["附買回交易","附賣回交易","買斷交易","賣斷交易"],"ans":3,"exp":["⚠ 依定義，證券商先買入、約定客戶日後買回，對證券商而言是附賣回（RS），應為 (2)；官方題庫答案印 (3) 買斷，疑似題庫錯誤。考試先照官方答案 (3)，若證基會公告修正會再更新。"],"pos":0.29183,"w":1},{"id":"M-527","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在台灣的債券實務交易中，若買賣雙方是透過證券商在營業處所進行報價、協商，最終達成議價交易，而非透過證券交易所的電腦系統自動撮合，這種交易模式屬於下列哪一種市場？","opts":["集中市場","店頭市場","貨幣市場","拍賣市場"],"ans":2,"exp":["📝 解析：在證券商營業處所議價成交、不經交易所電腦集中撮合者屬店頭市場（櫃買），我國債券多在此交易。"],"pos":0.29261,"w":1},{"id":"M-539","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在進行防禦性資產配置時，除了「銀行定存」外，下列哪一種金融商品也常被視為具備較佳的「固定收益」及「相對穩健」特徵，適合作為長期退休規劃的一部分？","opts":["未上市櫃公司的私募股票","具備高信用評等之政府債券或投資等級公司債","當沖交易之熱門標的","全球槓桿型 ETF（兩倍看多）"],"ans":2,"exp":["📝 解析：高信評政府債與投資等級公司債提供固定利息、違約風險低，適合穩健的退休配置；其餘選項風險或槓桿都很高。"],"pos":0.29339,"w":1},{"id":"M-542","s":"all","ch":"常識｜票券與債券","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當發行公司不幸面臨破產或進行清算時，關於「公司債持有人（債權人）」與「普通股股東」的受償順序，下列敘述何者正確？","opts":["股東有權優先於債權人分配剩餘財產","債權人與股東享有同等的受償順序，應按比例分配","債權人之受償順序優先於股東，剩餘財產須先清償債務後始得分配予股東","員工紅利領取後，應先分配股利給股東，最後才償還債權人之本金"],"ans":3,"exp":["📝 解析：公司清算時，債權人（含公司債持有人）優先受償，清償債務後若有剩餘財產才分配給股東，股東受償順序最後。"],"pos":0.29416,"w":1},{"id":"M-091","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"保險業務員小張正在為客戶辦理投保手續，下列哪一個作業環節最容易導致未來的理賠糾紛，應予以「避免」？","opts":["小張主動出示合格的人身保險業務員登錄證","為了作業方便，小張建議客戶由其代為勾選要保書上的健康告知事項","客戶在簽名確認前，小張提醒客戶應再次核對保單內容是否與需求相符","小張詳細向客戶解釋保單中關於「給付限制」的相關規定"],"ans":2,"exp":["📝 解析：健康告知須由要保人或被保險人親自據實填寫，業務員代填可能構成告知不實，日後保險公司得依保險法第64條解約或拒賠，引發糾紛。"],"pos":0.29494,"w":1},{"id":"M-092","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"對寄達之壽險保單看後，多久之內可以撤回，請求退還保費？","opts":["收到第 2 天起算 5 天內","收到第2 天起算 10 天內","收到第2 天起算 14 天內","收到第 2 天起算 30 天內"],"ans":2,"exp":["📝 解析：依人壽保險單示範條款，要保人收到保單翌日起10日內可書面撤銷契約，保險公司應無息退還已繳保費（契約撤銷權）。"],"pos":0.29572,"w":1},{"id":"M-093","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是投資型保單之特性？","opts":["具有結合保險與投資二方面功能","具保證將來一定之收益","依約定方式扣除各項費用後，依保戶同意或指定之投資分配方式","以部分之保費投資金融商品"],"ans":2,"exp":["📝 解析：投資型保單結合保障與投資，保費扣除費用後依保戶指定配置投資標的，投資風險由保戶承擔，不保證收益。"],"pos":0.2965,"w":1},{"id":"M-094","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於保險業務的分類，下列何者「非屬」財產保險公司得經營之業務項目？","opts":["貨物運輸保險","團體定期壽險","營造工程綜合保險","產品責任保險"],"ans":2,"exp":["📝 解析：依保險法第138條，產險業不得兼營人身保險（經核准可經營傷害及健康保險）；團體定期壽險屬人壽保險，只能由壽險公司經營。"],"pos":0.29728,"w":1},{"id":"M-384","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"「損失的不確定性」指的是下列何者?","opts":["風險","風險因素","風險事故","風險標的"],"ans":1,"exp":["📝 解析：風險的定義就是損失發生與否、何時發生、損失多大的不確定性。"],"pos":0.29805,"w":1},{"id":"M-385","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"人的健康狀況屬於下列那一個名詞？","opts":["風險標的","風險程度","風險因素","風險事故"],"ans":3,"exp":["📝 解析：風險因素是促使事故發生或加重損失的條件，健康狀況不佳會提高疾病或死亡事故的機率，屬實質風險因素。"],"pos":0.29883,"w":1},{"id":"M-386","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者敍述不正確？","opts":["風險事故會影響風險因素","風險因素會影響損失幅度","風險事故為造成損失的意外事故","損失指非自願性的經濟價值減少"],"ans":1,"exp":["📝 解析：因果順序是風險因素→風險事故→損失，是風險因素影響風險事故，而非事故影響因素，故(1)錯。"],"pos":0.29961,"w":1},{"id":"M-387","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於純粹風險？","opts":["外匯風險","生產風險","信用風險","政治風險"],"ans":3,"exp":["📝 解析：純粹風險只有損失、沒有獲利機會；信用風險是對方違約造成損失，屬純粹風險。外匯、生產、政治風險可能獲利或虧損，屬投機風險。"],"pos":0.30039,"w":1},{"id":"M-388","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"會影響整個群體或大部份人的風險屬何種風險？","opts":["純粹風險","客觀風險","特定風險","基本風險"],"ans":4,"exp":["📝 解析：基本風險是影響整個社會或大多數人的風險，如通膨、戰爭、天災；特定風險只影響個人或少數人。"],"pos":0.30117,"w":1},{"id":"M-389","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於風險控制措施？","opts":["損失抑制","風險自留","投保保險","提撥準備金"],"ans":1,"exp":["📝 解析：風險控制是降低損失頻率或幅度的措施（風險避免、損失預防、損失抑制）；風險自留、保險、提撥準備金屬風險理財。"],"pos":0.30195,"w":1},{"id":"M-390","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"針對損失頻率小但損失幅度大的風險，採何種風險管理方法較適宜？","opts":["損失抑減","風險避免","自己保險","保險"],"ans":4,"exp":["📝 解析：低頻率、高幅度的風險（如火災、早逝）自己承擔不起又難以預測，最適合透過保險轉嫁。"],"pos":0.30272,"w":1},{"id":"M-391","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"對於損失幅度不大，且損失成本較能精確估計的風險，最宜採用下列何種風險管理方法？","opts":["損失預防","風險自留","風險避免","保險"],"ans":2,"exp":["📝 解析：損失幅度小且可精確估計的風險，自行承擔成本比投保便宜，最適合風險自留。"],"pos":0.3035,"w":1},{"id":"M-392","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何種風險管理方法可以完全將損失發生之頻率降為零？","opts":["損失預防","損失抑減","風險避免","風險隔離"],"ans":3,"exp":["📝 解析：風險避免是根本不從事該活動（如不開車），可讓損失頻率降為零；其他方法只能降低頻率或幅度。"],"pos":0.30428,"w":1},{"id":"M-393","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"下列何種風險管理方法具有降低損失頻率的功能？","opts":["損失預防","風險隔離","計劃性風險自留","自己保險"],"ans":1,"exp":["📝 解析：損失預防是在事故發生前降低發生機率的措施（如定期檢修）；風險隔離與自留不會降低事故發生頻率。"],"pos":0.30506,"w":1},{"id":"M-394","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於損失抑減措施？","opts":["投保汽車保險","檢修汽車","搶救車禍傷患","賣掉汽車"],"ans":3,"exp":["📝 解析：損失抑減是事故發生後降低損失幅度，搶救車禍傷患屬之；檢修汽車是損失預防、賣車是風險避免、投保是風險轉嫁。"],"pos":0.30584,"w":1},{"id":"M-395","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"保險所承保的風險，一般僅限於：","opts":["動態風險","純粹風險","投機風險","基本風險"],"ans":2,"exp":["📝 解析：保險只承保純粹風險，因為只有損失可能才能精算與分攤；可能獲利的投機風險不予承保。"],"pos":0.30661,"w":1},{"id":"M-396","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為可保風險？","opts":["創新風險","行銷風險","財產風險","生產風險"],"ans":3,"exp":["📝 解析：財產風險屬純粹風險，損失可衡量且有大量同質標的，為可保風險；創新、行銷、生產風險屬經營上的投機風險。"],"pos":0.30739,"w":1},{"id":"M-397","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是可保風險之要件?","opts":["損失機率須可以預測","損失須為明確且可衡量","須有大量異質性風險單位","須有釀成個別經濟單位重大損失之可能"],"ans":3,"exp":["📝 解析：可保風險須有大量「同質」風險單位，大數法則才能有效預測損失；異質單位無法精算，故(3)錯。"],"pos":0.30817,"w":1},{"id":"M-398","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"保險契約的當事人為：","opts":["被保險人與要保人","被保險人與保險人","要保人與保險人","要保人與受益人"],"ans":3,"exp":["📝 解析：保險契約當事人是訂約雙方：要保人（負有交付保費義務）與保險人（負擔賠付責任）。"],"pos":0.30895,"w":1},{"id":"M-399","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"在保險事故發生時，保險人支付給被保險人或受益人的補償金額稱為：","opts":["保險金額","保險價額","保險費","保險金"],"ans":4,"exp":["📝 解析：保險金是事故發生時保險人實際給付的金額；保險金額是約定的最高責任額，保險價額是標的實際價值。"],"pos":0.30973,"w":1},{"id":"M-400","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"保險契約的關係人指：","opts":["保險人與被保險人","被保險人與受益人","要保人與受益人","要保人與被保險人"],"ans":2,"exp":["📝 解析：保險契約關係人是非訂約方但享有權益者，即被保險人與受益人；要保人與保險人為當事人。"],"pos":0.31051,"w":1},{"id":"M-401","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國保險法將保險分為：","opts":["財產保險與人壽保險","產物保險與人壽保險","財產保險與人身保險","產物保險與人身保險"],"ans":3,"exp":["📝 解析：保險法 §13 將保險分為財產保險與人身保險兩大類；人身保險含人壽、健康、傷害、年金保險。"],"pos":0.31128,"w":1},{"id":"M-402","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"一般人壽保險屬於：","opts":["費用保險","損害保險","定值保險","定額保險"],"ans":4,"exp":["📝 解析：人的生命無法以金錢衡量，人壽保險按契約約定金額給付，屬定額保險，不適用損失填補原則。"],"pos":0.31206,"w":1},{"id":"M-403","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於人壽保險之性質？","opts":["保險期間長","多屬個人保險","保險價額高","屬定額保險"],"ans":3,"exp":["📝 解析：人壽保險屬定額保險，人的生命無保險價額可言；保險期間長、多屬個人保險、定額給付都是其特性。"],"pos":0.31284,"w":1},{"id":"M-404","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"產險公司不得經營下列何種保險？","opts":["年金保險","健康保險","傷害保險","旅行平安保險"],"ans":1,"exp":["📝 解析：保險法規定產險業不得經營人身保險，但經核准可經營傷害與健康保險（旅平險屬傷害險）；年金保險只能由壽險業經營。"],"pos":0.31362,"w":1},{"id":"M-405","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是我國保險法上財產保險的分類之一？","opts":["火災保險","陸空保險","責任保險","汽車保險"],"ans":4,"exp":["📝 解析：保險法 §13 的財產保險包括火災、海上、陸空、責任、保證保險及經核准之其他保險；汽車保險是實務名稱，不是法定分類。"],"pos":0.3144,"w":1},{"id":"M-406","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於財產保險之性質？","opts":["保險事故之發生相當規則","保險金額差距甚大","保險期間通常為一年或少於一年","依賴再保險程度較深"],"ans":1,"exp":["📝 解析：財產保險事故（火災、颱風、地震）發生並不規則，損失波動大，因此較依賴再保險；事故發生規則（如死亡率）是人壽保險的特性。"],"pos":0.31518,"w":1},{"id":"M-407","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"財產保險不承保下列何種標的？","opts":["建築物","動產","土地","收益"],"ans":3,"exp":["📝 解析：土地不會因火災等事故毀損滅失，一般不在財產保險承保範圍；建築物、動產與收益（營業中斷）則可承保。"],"pos":0.31595,"w":1},{"id":"M-408","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"人壽保險是依約給付一定金額的一種：","opts":["定值保險","生存保險","定額保險","死亡保險"],"ans":3,"exp":["📝 解析：人壽保險依契約約定的金額給付，不論實際損失多少，屬定額保險。"],"pos":0.31673,"w":1},{"id":"M-409","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"人身保險不包括下列那一險種？","opts":["健康保險","傷害保險","旅行平安保險","信用保險"],"ans":4,"exp":["📝 解析：人身保險包括人壽、健康、傷害（旅平險屬之）及年金保險；信用保險屬財產保險中的保證保險。"],"pos":0.31751,"w":1},{"id":"M-410","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是人壽保險的主要特徵？","opts":["保險給付不確定","保險事故較不確定","僅是利己的單純投保動機","保險期間長"],"ans":4,"exp":["📝 解析：人壽保險期間通常長達數十年甚至終身；其給付金額確定，且常有為家人保障的利他動機。"],"pos":0.31829,"w":1},{"id":"M-411","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"貸款購買房屋最好配合下列何種保險?","opts":["遞增型定期保險","生存保險","可變更型定期保險","遞減型定期保險"],"ans":4,"exp":["📝 解析：房貸餘額隨還款逐年減少，遞減型定期保險的保額同步遞減，保費最省又能確保身故時貸款可清償。"],"pos":0.31907,"w":1},{"id":"M-412","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列有關定期保險之敘述何者為非？","opts":["期滿仍生存，保障全失","中途退保保費不能退還","適合債權人購買","被保人於保險期間內死亡，保險人應退還大部份保險費"],"ans":4,"exp":["📝 解析：被保險人於定期保險期間內死亡，保險人應給付保險金，而非退還保費，故(4)錯；期滿生存則無給付、無現金價值。"],"pos":0.31984,"w":1},{"id":"M-413","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"就保障目的而論，年輕夫妻養育子女期間應購買何種人壽保險？","opts":["遞增型定期保險","生存保險","生死合險","年金保險"],"ans":1,"exp":["📝 解析：養育子女期間家庭責任與生活成本逐年增加，遞增型定期保險保額隨之提高，以較低保費提供足夠身故保障。"],"pos":0.32062,"w":1},{"id":"M-414","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"依我國保險法規定，人壽保險契約如涉及死亡給付之情況，發生保險事故之被保險人應年滿幾歲？","opts":["1 歲","15 歲","67 歲","80 歲"],"ans":2,"exp":["📝 解析：保險法 §107 規定以未滿15歲者為被保險人的人壽保險，死亡給付自被保險人滿15歲之日起才發生效力，之前僅退還保費加利息。"],"pos":0.3214,"w":1},{"id":"M-415","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"依我國保險法規定，人壽保險之保險費到期未交付者，除契約另有訂定外，經催告到達後屆多少日仍不交付時，保險契約之效力停止？","opts":["2 日","一年","30 日","五年"],"ans":3,"exp":["📝 解析：保險法 §116 規定人壽保險費到期未交付，經催告到達後屆30日仍不交付，保險契約效力停止。"],"pos":0.32218,"w":1},{"id":"M-416","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"依我國保險法規定，保險契約載有被保險人故意自殺，保險人仍應給付保險金額之條款者， 其條款於訂約多久後始生效力？","opts":["2 年","5 年","10 年","20 年"],"ans":1,"exp":["📝 解析：保險法 §109 規定故意自殺仍給付保險金的條款，須於訂約或復效之日起2年後始生效力，以防投保後蓄意自殺。"],"pos":0.32296,"w":1},{"id":"M-417","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"生存保險主要之目的為：","opts":["保障","保障加儲蓄","儲蓄","生存"],"ans":3,"exp":["📝 解析：生存保險在被保險人活到約定期間時才給付，目的在儲蓄（如教育金、退休金），不具身故保障。"],"pos":0.32374,"w":1},{"id":"M-418","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"人壽保險公司給付之生存保險金，來自：","opts":["被保人在保險期間屆滿前死亡者所繳付之保費","要保人所繳付保費之累積儲存生息","被保人在保險期間屆滿前死亡者所繳付之保費與要保人所繳付保費之累積儲存生息","保險公司的投資收入"],"ans":3,"exp":["📝 解析：生存保險金來自全體保費的累積生息，加上期滿前死亡者已繳但不再給付的保費（生存者共享），兩者合計。"],"pos":0.32451,"w":1},{"id":"M-419","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"所謂養老保險在性質上是一種?","opts":["生存保險","定期保險","生存保險與定期保險","終身保險"],"ans":3,"exp":["📝 解析：養老保險（生死合險）期間內身故給付死亡保險金、期滿生存給付滿期金，是定期保險與生存保險的組合。"],"pos":0.32529,"w":1},{"id":"M-420","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"保險期間較長的生死合險，其主要用途為?","opts":["組合工作年齡保障與晚年生活準備","為子女預備學費","為未來債務預為償還準備","年輕人初入社會所需之基本保障"],"ans":1,"exp":["📝 解析：長期生死合險在工作年齡期間提供身故保障，期滿領回滿期金作為退休生活準備，兼顧兩者。"],"pos":0.32607,"w":1},{"id":"M-421","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於健康保險之範疇？","opts":["失業保險","專門職業責任保險","失能保險","傷害保險"],"ans":3,"exp":["📝 解析：健康保險承保疾病或傷害導致的醫療費用與收入損失，失能保險（失能所得補償）屬之；傷害保險是另一獨立險種。"],"pos":0.32685,"w":1},{"id":"M-422","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"影響傷害保險之保險費率最大的因素是?","opts":["年齡大小","婚姻狀況","性別","職業類別"],"ans":4,"exp":["📝 解析：傷害保險承保意外事故，危險程度主要取決於工作環境，因此費率依職業類別分級，年齡、性別影響較小。"],"pos":0.32763,"w":1},{"id":"M-423","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非傷害保險事故之「意外事故」，之構成要件？","opts":["內在原因觸發","意外事故所致","外在原因觸發","以上皆非"],"ans":1,"exp":["📝 解析：傷害保險的意外事故須是外來、突發、非由疾病引起；由身體內在原因（疾病）觸發者不屬意外，不予理賠。"],"pos":0.3284,"w":1},{"id":"M-424","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"傷害保險失能保險金主要決定因素為：","opts":["住院長短","保險事故","失能級數","職業種類"],"ans":3,"exp":["📝 解析：傷害保險失能保險金依失能程度與保險金給付表所列級數，按保額一定比例給付。"],"pos":0.32918,"w":1},{"id":"M-425","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何種年金旨在照顧基本經濟生活？","opts":["公共年金保險","企業年金保險","商業年金保險","個人年金保險"],"ans":1,"exp":["📝 解析：公共（社會）年金保險由政府強制辦理，目的在保障國民老年、失能、遺屬的基本經濟生活；企業與商業年金屬補充性質。"],"pos":0.32996,"w":1},{"id":"M-426","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於社會年金保險之範疇？","opts":["老年年金","失能年金","遺屬年金","延期年金"],"ans":4,"exp":["📝 解析：社會年金保險包括老年、失能、遺屬年金；延期年金是商業年金依給付開始時間的分類，不屬社會年金。"],"pos":0.33074,"w":1},{"id":"M-427","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"保險人於被保險人生存期間或特定期間內，依照契約負一次或分期給付一定金額之責，此種保險稱為：","opts":["年金保險","退休金保險","死亡保險","養老保險"],"ans":1,"exp":["📝 解析：保險法 §135-1 規定年金保險人於被保險人生存期間或特定期間內，依約負一次或分期給付一定金額之責。"],"pos":0.33152,"w":1},{"id":"M-428","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"年金保險契約中，如規定有保證給付金額，年金受領人死亡之時，如有一部份尚未支領，此時保險人應將該差額","opts":["繳交國庫","保留一定年限成為公司盈餘","給付給年金受領人之身故受益人","成為其他受領人之分紅"],"ans":3,"exp":["📝 解析：年金保險若有保證給付期間或金額，年金受領人提前死亡時，尚未領完的差額應給付其身故受益人。"],"pos":0.3323,"w":1},{"id":"M-429","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為投資型保險的特點？","opts":["主要功能為提供保障","仍具有保障與投資雙重功能","風險全由被保險人承擔","要保人領取保單紅利"],"ans":2,"exp":["📝 解析：投資型保險同時提供壽險保障與投資帳戶，具保障與投資雙重功能；投資風險由要保人承擔，不分配保單紅利。"],"pos":0.33307,"w":1},{"id":"M-430","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列變額壽險之敘述何者為正確之敘述？","opts":["保費固定","保險金不固定","投資方式採用分離帳戶","以上皆是"],"ans":4,"exp":["📝 解析：變額壽險保費固定，保費投入分離帳戶投資，保險金與現金價值隨投資績效變動，三項敘述都正確。"],"pos":0.33385,"w":1},{"id":"M-431","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列萬能變額壽險之敘述何者為是？","opts":["現金價值不固定","較低的保證利率","保險保障彈性較大","以上皆是"],"ans":4,"exp":["📝 解析：萬能變額壽險結合萬能壽險繳費與保額彈性及變額壽險分離帳戶投資，現金價值不固定、保證利率低或無，三項皆正確。"],"pos":0.33463,"w":1},{"id":"M-432","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列有關團體人壽保險的敘述何者錯誤？","opts":["承保時僅簽發一張總保險單","要保人為企業負責人","被保險人須接受體檢","核保簡單"],"ans":3,"exp":["📝 解析：團體壽險以團體核保，簽發一張總保單，被保險人通常免體檢、核保簡單；要求個別體檢不符其特性，故(3)錯。"],"pos":0.33541,"w":1},{"id":"M-433","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"依我國團體一年定期人壽保單示範條款規定，所謂「團體」，其最低人數通常為多少？","opts":["5 人","100 人","500 人","1,000 人"],"ans":1,"exp":["📝 解析：團體一年定期人壽保險示範條款所稱團體，須非以投保為目的而組成，成員人數至少5人。"],"pos":0.33619,"w":1},{"id":"M-434","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非團體傷害保險之保險費考慮因素？","opts":["年齡","職業","工作環境","意外事故發生率"],"ans":1,"exp":["📝 解析：團體傷害保險費率主要依職業類別、工作環境與意外事故發生率決定；意外風險與年齡關係不大，年齡不列入考量。"],"pos":0.33696,"w":1},{"id":"M-435","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬團體保險之險種？","opts":["定期保險","信用人壽保險","傷害保險","職業責任保險"],"ans":4,"exp":["📝 解析：團體保險常見險種有團體定期壽險、信用人壽保險、傷害保險、健康保險；職業責任保險屬財產保險中的責任保險。"],"pos":0.33774,"w":1},{"id":"M-436","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國公教人員保險的主管機關為：","opts":["內政部","考試院銓敘部","行政院","金融監督管理委員會"],"ans":2,"exp":["📝 解析：依公教人員保險法，公保主管機關為考試院銓敘部，承保機關為臺灣銀行。"],"pos":0.33852,"w":1},{"id":"M-437","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非我國公教人員保險給付項目之一？","opts":["醫療給付","養老給付","死亡給付","育嬰留職停薪"],"ans":1,"exp":["📝 解析：公保給付包括失能、養老、死亡、眷屬喪葬、生育及育嬰留職停薪津貼；醫療給付已於全民健保開辦後移由健保辦理。"],"pos":0.3393,"w":1},{"id":"M-438","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非我國勞工保險承保的給付項目之一？","opts":["生育給付","傷病給付","失業給付","眷屬喪葬津貼"],"ans":3,"exp":["📝 解析：勞保普通事故給付包括生育、傷病、失能、老年、死亡（含眷屬喪葬津貼）；失業給付屬就業保險，不在勞保範圍。"],"pos":0.34008,"w":1},{"id":"M-439","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為我國勞工保險中職業災害保險的承保項目？","opts":["傷病給付","生育給付","失業給付","以上皆是"],"ans":1,"exp":["📝 解析：職業災害保險給付為傷病、醫療、失能、死亡；生育給付屬普通事故，失業給付屬就業保險。現行職災保險已改依勞工職業災害保險及保護法辦理，傷病給付仍在內。"],"pos":0.34086,"w":1},{"id":"M-440","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為我國勞工保險中普通事故保險與職業災害保險二者均會給付之項目？","opts":["生育給付","傷病給付","失業給付","以上皆是"],"ans":2,"exp":["📝 解析：勞保普通事故與職業災害保險都有傷病、失能、死亡給付；生育只在普通事故，失業給付屬就業保險。"],"pos":0.34163,"w":1},{"id":"M-441","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國勞工保險主管機關在中央為：","opts":["財政部","勞動部","金融監督管理委員會","保險局"],"ans":2,"exp":["📝 解析：勞工保險條例規定中央主管機關為勞動部，勞動部勞工保險局為保險人（承保機關）。"],"pos":0.34241,"w":1},{"id":"M-442","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國勞工保險規定，被保險人的年齡限制為：","opts":["15 歲以上 65 歲以下","20 歲以上 65 歲以下","18 歲以上60 歲以下","16 歲以上 65 歲以下"],"ans":1,"exp":["📝 解析：勞工保險條例 §6 規定被保險人年齡為年滿15歲以上、65歲以下之勞工。"],"pos":0.34319,"w":1},{"id":"M-443","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國就業保險之中央主管機關為：","opts":["勞動部","財政部","金融監督管理委員會","勞工保險局"],"ans":1,"exp":["📝 解析：就業保險法規定中央主管機關為勞動部，業務委由勞工保險局辦理。"],"pos":0.34397,"w":1},{"id":"M-444","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非我國就業保險之給付項目？","opts":["失業給付","提早就業獎助津貼","職業訓練生活津貼","身心障礙給付"],"ans":4,"exp":["📝 解析：就業保險給付有失業給付、提早就業獎助津貼、職業訓練生活津貼、育嬰留職停薪津貼及健保費補助；身心障礙給付不在其中。"],"pos":0.34475,"w":1},{"id":"M-445","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國就業保險規定，被保險人包括：","opts":["公教人員","受雇之外國籍勞工","受雇之本國籍勞工","以上皆是"],"ans":3,"exp":["📝 解析：就業保險法以15～65歲受僱的本國籍勞工為被保險人（另含獲准在臺工作的外籍配偶等）；公教人員與一般外籍移工不納入。"],"pos":0.34553,"w":1},{"id":"M-446","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非我國農民健康保險承保的給付項目之一？","opts":["生育給付","失業給付","身心障礙給付","喪葬津貼"],"ans":2,"exp":["📝 解析：農民健康保險給付為生育給付、身心障礙給付及喪葬津貼；農民屬自營作業，無失業給付。"],"pos":0.3463,"w":1},{"id":"M-447","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非我國農民健康保險承保的危險事故之一種？","opts":["生育","身心障礙","老年","死亡"],"ans":3,"exp":["📝 解析：農保承保生育、身心障礙、死亡事故；老年不在農保範圍，老年經濟保障另由老年農民福利津貼提供。"],"pos":0.34708,"w":1},{"id":"M-448","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國農民健康保險的被保險人不包括：","opts":["自耕農","佃農","農業學校畢業從事農業推廣工作者","農業學校職員"],"ans":4,"exp":["📝 解析：農保被保險人為實際從事農業工作者，如自耕農、佃農及從事農業推廣的農校畢業生；農業學校職員屬受僱教職員，應參加其他保險。"],"pos":0.34786,"w":1},{"id":"M-449","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國軍人保險中所稱「軍人」，係指：","opts":["現役軍人","退役軍人","後備軍人","以上皆是"],"ans":1,"exp":["📝 解析：軍人保險條例所稱軍人指現役軍人；退役、後備軍人不屬軍保被保險人。"],"pos":0.34864,"w":1},{"id":"M-450","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"我國軍人保險之給付項目之種類不包括：","opts":["死亡","身心障礙","退伍","醫療給付"],"ans":4,"exp":["📝 解析：軍保給付包括死亡、失能（身心障礙）、退伍、育嬰留職停薪及眷屬喪葬；醫療由全民健保負責，非軍保給付。"],"pos":0.34942,"w":1},{"id":"M-451","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國軍人保險之主管機關為：","opts":["國防部","臺灣銀行","行政院","勞保局"],"ans":1,"exp":["📝 解析：軍人保險條例規定主管機關為國防部，承保機構為臺灣銀行。"],"pos":0.35019,"w":1},{"id":"M-452","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國軍人保險退伍及身心障礙給付，受益人為：","opts":["被保險人本人","被保險人之配偶","被保險人之子女","被保險人之父母"],"ans":1,"exp":["📝 解析：軍保的退伍給付與失能（身心障礙）給付是補償被保險人本人，受益人為本人；死亡給付才由遺族受領。"],"pos":0.35097,"w":1},{"id":"M-453","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國全民健康保險承保的危險事故不包括：","opts":["疾病","傷害","生育","失能"],"ans":4,"exp":["📝 解析：全民健保承保疾病、傷害、生育的醫療服務；失能屬所得損失，由勞保、公保等現金給付處理，不在健保範圍。"],"pos":0.35175,"w":1},{"id":"M-454","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國全民健康保險第一類的保險對象不包括：","opts":["公教人員","榮民","專門職業人員","私校教職員"],"ans":2,"exp":["📝 解析：全民健保第一類為公教人員、受僱者、雇主、自營業主及專門職業技術人員等；榮民屬第六類被保險人。"],"pos":0.35253,"w":1},{"id":"M-455","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國全民健康保險規定第一類被保險人負擔其眷屬之保險費，最高以幾口為限？","opts":["三口","六口","九口","十二口"],"ans":1,"exp":["📝 解析：全民健保規定眷屬保費由被保險人繳納，超過三口者以三口計，最多負擔三口。"],"pos":0.35331,"w":1},{"id":"M-456","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"設(甲)全民健康保險，(乙)商業性健康保險，則下列敘述何者為非：","opts":["甲之投保方式為強制性","乙之給付按法律規定","甲之經營主體為政府機關","甲乙之保險成本均賴精算原理"],"ans":2,"exp":["📝 解析：商業健康保險的給付內容依保險契約約定，不是依法律規定；依法律規定給付的是全民健保，故(2)錯。"],"pos":0.35409,"w":1},{"id":"M-457","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"廠房因火災而遭燒毀，則此損失屬：","opts":["直接損失","間接損失","從屬損失","連帶營業中斷損失"],"ans":1,"exp":["📝 解析：廠房被火燒毀是保險事故直接造成的實體財產損失，屬直接損失；因停工造成的利潤減少才是間接損失。"],"pos":0.35486,"w":1},{"id":"M-458","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者為間接損失保險？","opts":["火災保險","營業中斷保險","營造綜合保險","汽車保險"],"ans":2,"exp":["📝 解析：營業中斷保險填補事故導致停業期間的利潤損失與固定費用，屬間接損失保險；火災、營造、汽車保險承保實體損失。"],"pos":0.35564,"w":1},{"id":"M-459","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"一般財產保險通常不承保下列何種危險事故？","opts":["地震","颱風洪水","航空器墜落及機動車輛碰撞","核子輻射"],"ans":4,"exp":["📝 解析：核子輻射損害巨大且難以分散，一般財產保險列為除外不保事項；地震、颱風洪水可透過附加條款加保。"],"pos":0.35642,"w":1},{"id":"M-460","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何種保險之保險標的，無保險價額之概念？","opts":["火災保險","海上貨物保險","責任保險","工程保險"],"ans":3,"exp":["📝 解析：責任保險承保被保險人對第三人的賠償責任，責任金額事前無法以標的價值衡量，因此沒有保險價額概念，只約定責任限額。"],"pos":0.3572,"w":1},{"id":"M-461","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何種標的物投保時採定值保險單方式？","opts":["古董或藝術品","廠房","傢俱衣李","機器設備"],"ans":1,"exp":["📝 解析：古董、藝術品市價難以事後鑑定，投保時常由雙方約定價值作為賠償基礎，採定值保險單。"],"pos":0.35798,"w":1},{"id":"M-462","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"以一個保險金額，承保多數標的物之保險單稱為：","opts":["個別保險單","集合保險單","總括保險單","複數保險單"],"ans":3,"exp":["📝 解析：總括保險單以單一保險金額承保多數標的物（如不同地點的貨物），不逐項分配保額。"],"pos":0.35875,"w":1},{"id":"M-463","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"財產保險之保險利益一般須在何時存在？","opts":["要保時","保險契約訂立時","保險事故發生時","保險期間屆滿時"],"ans":3,"exp":["📝 解析：財產保險屬損失填補，被保險人須在事故發生時對標的具保險利益才有實際損失可求償。"],"pos":0.35953,"w":1},{"id":"M-464","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國財產保險遇有複保險情形時，大都採何種賠款分攤方式？","opts":["獨立責任比例分攤法","保險金額比例分攤法","超額賠償法","優先賠償法"],"ans":2,"exp":["📝 解析：保險法 §38 規定善意複保險時，各保險人依其保險金額占總保險金額的比例分攤賠款，我國實務多採此法。"],"pos":0.36031,"w":1},{"id":"M-465","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是企業財產保險的重要功能？","opts":["維持企業利潤","保障企業經營安全","提高企業信用","保障員工生命安全"],"ans":4,"exp":["📝 解析：企業財產保險可填補財產損失、維持利潤、保障經營安全並提高信用；員工生命安全須靠人身保險（如團體保險）保障。"],"pos":0.36109,"w":1},{"id":"M-466","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是財產保險對個人之功能？","opts":["填補財產之損失","保障家庭生活安定","提升生活品質","減少對財產損失危險之憂慮"],"ans":3,"exp":["📝 解析：財產保險對個人的功能是填補損失、安定家庭生活、減少憂慮；它只能恢復原狀，不會提升生活品質。"],"pos":0.36187,"w":1},{"id":"M-467","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是財產保險對國家社會的功能？","opts":["累積政治資源","促進經濟發展","提供國家建設資金","保障社會安定"],"ans":1,"exp":["📝 解析：財產保險對社會可促進經濟發展、累積資金供國家建設、維持社會安定；累積政治資源與保險無關。"],"pos":0.36265,"w":1},{"id":"M-468","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國商業火災保險之基本承保事故不包括：","opts":["閃電雷擊","爆炸","爆炸引起之火災","竊盜後之縱火"],"ans":2,"exp":["📝 解析：商業火災保險基本承保火災、閃電雷擊及爆炸引起之火災等；單純爆炸造成的損失須另加保爆炸附加險，竊盜後之縱火仍屬火災。"],"pos":0.36342,"w":1},{"id":"M-469","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國商業火災保險之保險金額，除另有約定外，以下列何者為基礎？","opts":["實際價值","重置成本","原始價格","會計價值"],"ans":1,"exp":["📝 解析：商業火災保險除另約定採重置成本外，保險金額以標的物的實際價值（重置成本扣除折舊）為基礎。"],"pos":0.3642,"w":1},{"id":"M-470","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非商業火災保險之承保標的？","opts":["廠房","機器設備","汽車","貨物"],"ans":3,"exp":["📝 解析：商業火災保險承保建築物、機器設備、貨物等營業處所財產；汽車屬移動財產，須投保汽車保險。"],"pos":0.36498,"w":1},{"id":"M-471","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國商業火災保險附加之共保附加條款，其共保百分比為：","opts":["60%","70%","80%","100%"],"ans":3,"exp":["📝 解析：商業火災保險共保附加條款要求投保金額達實際價值80%，未達時按比例分攤賠款，以防不足額投保。"],"pos":0.36576,"w":1},{"id":"M-472","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"海上保險之查勘費及公證費為：","opts":["損害防止費用","救助費用","額外費用","共同海損費用"],"ans":3,"exp":["📝 解析：海上保險中為證明損失或確定賠款所生的查勘費、公證費屬額外費用，與防止損失擴大的損害防止費用不同。"],"pos":0.36654,"w":1},{"id":"M-473","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"共同海損屬於下列何種損失？","opts":["部分損失","單獨海損","實際全損","推定全損"],"ans":1,"exp":["📝 解析：共同海損是為船貨共同安全而故意犧牲部分財產或支出費用，由各利害關係方分攤，屬部分損失。"],"pos":0.36732,"w":1},{"id":"M-474","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國自用汽車保險單不包括：","opts":["車體損失險","竊盜損失險","第三人責任保險","旅客責任險"],"ans":4,"exp":["📝 解析：自用汽車保險單包括車體損失險、竊盜損失險及第三人責任保險；旅客責任險適用於營業用車輛。"],"pos":0.36809,"w":1},{"id":"M-475","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"免自負額車對車碰撞損失保險即車體損失險：","opts":["甲式","乙式","丙式","丁式"],"ans":3,"exp":["📝 解析：車體損失險分甲、乙、丙式；丙式為「免自負額車對車碰撞損失保險」，只賠與車輛碰撞且確認對方車輛的損失。"],"pos":0.36887,"w":1},{"id":"M-476","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是自用汽車保險第三人責任保險之附加被保險人？","opts":["保險契約所載明之被保險人","列名被保險人之配偶","列名被保險人所僱用之駕駛人","列名被保險人之同居家屬"],"ans":1,"exp":["📝 解析：附加被保險人是列名被保險人以外、經其同意使用車輛的人，如配偶、同居家屬、所僱駕駛；保單載明的被保險人本身是列名被保險人。"],"pos":0.36965,"w":1},{"id":"M-477","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"對必須更換之零件，汽車車體損失險如何理賠？","opts":["以舊品為準","以舊品加工資為準","以新品為準","以新品減折舊為準"],"ans":3,"exp":["📝 解析：自用汽車車體損失險條款規定須更換的零件以新品更換，不扣除折舊。"],"pos":0.37043,"w":1},{"id":"M-478","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非車體損失險乙式之承保危險事故？","opts":["抛擲物或墜落物","第三者非善意行為","碰撞及傾覆","閃電及雷擊"],"ans":2,"exp":["📝 解析：乙式承保碰撞、傾覆、火災、閃電雷擊、爆炸、拋擲物或墜落物；第三者非善意行為（惡意破壞）只在甲式承保。"],"pos":0.37121,"w":1},{"id":"M-479","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"責任保險又稱為：","opts":["第一人責任保險","第二人責任保險","第三人責任保險","第四人責任保險"],"ans":3,"exp":["📝 解析：責任保險承保被保險人依法對第三人負賠償責任的損失，因此又稱第三人責任保險。"],"pos":0.37198,"w":1},{"id":"M-480","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"責任保險所承保的責任為：","opts":["民事責任","刑事責任","行政責任","道義責任"],"ans":1,"exp":["📝 解析：責任保險只承保被保險人依法應負的民事損害賠償責任；刑事與行政責任屬懲罰性質，不得以保險轉嫁。"],"pos":0.37276,"w":1},{"id":"M-481","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於員工誠實保證保險之被保證員工範圍？","opts":["會計人員","業務人員","董監事","經理人員"],"ans":3,"exp":["📝 解析：員工誠實保證保險承保受僱員工的不誠實行為；董監事是公司機關成員而非受僱員工，不在被保證員工範圍。"],"pos":0.37354,"w":1},{"id":"M-482","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"員工誠實保證保險不承保員工何種行為？","opts":["過失","詐欺","侵占","竊盜"],"ans":1,"exp":["📝 解析：員工誠實保證保險只承保員工故意的不誠實行為，如詐欺、侵占、竊盜；單純過失不屬不誠實行為。"],"pos":0.37432,"w":1},{"id":"M-483","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"現行現金保險所承保之現金不包括：","opts":["紙幣","硬幣","支票","金銀條塊"],"ans":4,"exp":["📝 解析：現金保險承保的現金指紙幣、硬幣及支票、匯票等票據；金銀條塊屬貴重物品，不在現金範圍。"],"pos":0.3751,"w":1},{"id":"M-484","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"保障範圍包括被保險人之所有債務人在內的信用保險單，稱為：","opts":["通用保單","特定保單","回溯保單","前伸保單"],"ans":1,"exp":["📝 解析：通用保單承保被保險人對所有債務人的應收帳款信用風險；特定保單則只針對特定債務人或特定交易。"],"pos":0.37588,"w":1},{"id":"M-485","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是我國強制汽車責任保險之性質？","opts":["政府部份補貼","公辦民營","無盈無虧原則","包括軍用汽車"],"ans":1,"exp":["📝 解析：強制汽車責任保險採公辦民營、無盈無虧原則，保費由車主負擔，政府不補貼；軍用汽車依強制汽車責任保險法亦須投保。"],"pos":0.37665,"w":1},{"id":"M-486","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"強制汽車責任保險之死亡給付金額為新台幣：","opts":["100 萬元","120 萬元","150 萬元","200 萬元"],"ans":4,"exp":["⚠ 依題庫選 (4) 200 萬元，這是 2026 年 6 月底以前的強制汽車責任保險給付標準。金管會已修正給付標準，自 115 年（2026）7 月 1 日起發生的事故，死亡給付及第一等級失能給付提高為每人 300 萬元，死亡、失能、傷害醫療合計上限由 220 萬元提高為 320 萬元（傷害醫療仍為 20 萬元）。考試請照官方答案 (4)。"],"pos":0.37743,"w":1},{"id":"M-487","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"強制汽車責任保險之給付項目不包括：","opts":["傷害醫療給付","身心障礙給付","死亡給付","財損給付"],"ans":4,"exp":["📝 解析：強制險是人身傷亡的基本保障，只給付傷害醫療、失能（身心障礙）與死亡，不賠車輛或財物損失，財損須另保任意險。"],"pos":0.37821,"w":1},{"id":"M-488","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何種情形不可向特別補償基金請求補償？","opts":["事故汽車全部或部分無須訂立強制汽車保險契約者","事故汽車可以查究者","事故事汽車為未保險汽車","事故汽車係未經保險人同意使用之被保險汽車。"],"ans":2,"exp":["📝 解析：依強制汽車責任保險法，特別補償基金補償肇事車無法查究、未保險、無須投保或未經同意使用等情形；車輛可查究時應向其保險人請求。"],"pos":0.37899,"w":1},{"id":"M-489","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"強制汽車責任保險之保險人應於保險期間屆滿前何時以書面通知被保險人續保？","opts":["2 日前","3 日前","30 日前","55 日前"],"ans":3,"exp":["📝 解析：依強制汽車責任保險法，保險人應於保險期間屆滿30日前以書面通知續保，避免保障中斷。"],"pos":0.37977,"w":1},{"id":"M-490","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國現行住宅火災及地震基本保險之承保危險事故不包括：","opts":["颱風及洪水","航空器落","爆炸","閃電及雷擊"],"ans":1,"exp":["⚠ 依題庫：住宅火災及地震基本保險原本不保颱風洪水，故選 (1)。但金管會自 2020 年起已把「住宅颱風及洪水災害補償保險」納入（每戶最高 7,000～9,000 元），依現行規定四項都在承保範圍。考試請照官方答案 (1)。"],"pos":0.38054,"w":1},{"id":"M-491","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"火災及地震基本保險承保之住宅建築物係以何種基礎約定保險金額？","opts":["會計成本","原始取得成本","實際價值","重置成本"],"ans":4,"exp":["📝 解析：住宅火災及地震基本保險的建築物保額以重置成本為基礎，即依造價參考表重建同等房屋所需金額，不扣折舊。"],"pos":0.38132,"w":1},{"id":"M-492","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國現行住宅火災保險對承保之建築物適用何種比例之共保條款？","opts":["5%","13%","18%","60%"],"ans":4,"exp":["📝 解析：住宅火險建築物採60%共保條款：保額達重置成本60%以上按實際損失賠付（以保額為限），不足60%則按比例賠付。"],"pos":0.3821,"w":1},{"id":"M-493","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"我國現行住宅火災及地震基本保險不承保下列何種標的？","opts":["住宅玻璃","屋內傢俱","停放屋內之車輛","房屋之裝潢"],"ans":3,"exp":["📝 解析：住宅火險承保建築物（含玻璃、裝潢）及屋內動產（如傢俱），但汽機車不屬承保動產，應另投保車險。"],"pos":0.38288,"w":1},{"id":"M-494","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"住宅地震基本保險對建築物之賠償限額為?","opts":["2 萬元","5 萬元","10 萬元","150 萬元"],"ans":4,"exp":["📝 解析：住宅地震基本保險於建築物全損時依重置成本賠付，最高新台幣150萬元，另給付臨時住宿費用最高20萬元。"],"pos":0.38366,"w":1},{"id":"M-499","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"業務員應如何規劃適合身心障礙者的保險商品?","opts":["規劃高保費的商品，佣金也可領得多","公司核保手續較複雜，只要規劃年金保險就好","依其身心障礙種類、發生原因、目前障礙狀況等因素，規劃適當的保險商品","公司核保手續較複雜，規劃投保微型保險就好"],"ans":3,"exp":["📝 解析：應依障礙種類、發生原因與目前狀況評估實際需求再規劃保障，而非以佣金高低或核保便利為考量。"],"pos":0.38444,"w":1},{"id":"M-500","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"業務員應如何規劃適合高齡者的保險商品?","opts":["規劃高保費的商品，佣金也可領得多","容易因體況影響公司核保，只要規劃年金保險就好","多半有退休金，儘量為其規劃投資型保險以獲取較高收益","考量其生活、醫療、照護等各方面費用需求，規劃適當的保險商品"],"ans":4,"exp":["📝 解析：高齡者應依生活、醫療與長期照護等需求規劃保險並注意適合度；以佣金或高收益為導向推銷投資型保單皆屬不當。"],"pos":0.38521,"w":1},{"id":"M-504","s":"all","ch":"常識｜保險","star":1,"n":1,"refs":"","tag":"","stem":"下列何種商品是現行法令規定提供特定身分及經濟弱勢者投保的保險商品?","opts":["微型保險","投資型保險","強制汽車責任保險","利率變動型保險"],"ans":1,"exp":["📝 解析：微型保險專為經濟弱勢及特定身分者（如低收入戶、身障者、原住民）設計，保費低廉、提供基本保障。"],"pos":0.38599,"w":1},{"id":"M-297","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬資訊安全的基本三要素？","opts":["一致性(Consistency)","完整性(Integrity)","可用性(Availability)","機密性(Confidentiality)"],"ans":1,"exp":["📝 解析：資訊安全三要素為機密性、完整性、可用性（CIA）；一致性不在其中。"],"pos":0.38677,"w":1},{"id":"M-298","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬組織採用雲端運算服務的常見考量原因？","opts":["商譽","成本","速度","效能"],"ans":1,"exp":["📝 解析：組織採用雲端服務主要看成本、部署速度、運算效能與彈性等實際效益，商譽不是常見考量。"],"pos":0.38755,"w":1},{"id":"M-299","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列何種數據資料單位代表 1024GB？","opts":["1ZB","1EB","1PB","1TB"],"ans":4,"exp":["📝 解析：儲存單位每級相差1024倍：1TB＝1024GB，1PB＝1024TB，依此類推到EB、ZB。"],"pos":0.38833,"w":1},{"id":"M-300","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列哪一個名詞和其他三個名詞不同義？","opts":["數據資料","大數據","巨量資料","海量資料"],"ans":1,"exp":["📝 解析：大數據、巨量資料、海量資料皆指Big Data；一般數據資料不一定具備巨量、多樣、快速等特性。"],"pos":0.38911,"w":1},{"id":"M-301","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬網際網路興起後的數位商品或服務模式？","opts":["純網路銀行","電子資金轉帳","電子商務支付系統","加密貨幣"],"ans":2,"exp":["📝 解析：電子資金轉帳（EFT）在網際網路普及前就已透過銀行專用網路運作；純網銀、電商支付、加密貨幣都是網路興起後的模式。"],"pos":0.38988,"w":1},{"id":"M-302","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"機器人是人工智慧的容器，若機器人是身體，而人工智慧可以比喻成機器人的哪一部分？","opts":["心臟","腳","手","大腦"],"ans":4,"exp":["📝 解析：人工智慧負責感知、判斷與決策，對應機器人的大腦；機器人本體則是執行動作的身體。"],"pos":0.39066,"w":1},{"id":"M-303","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"當保險業欲透過網路與電話語音等通路提供服務時，可運用何項技術驗證身分？","opts":["生物辨識","通訊技術","物聯網技術","網路技術"],"ans":1,"exp":["📝 解析：透過網路或電話語音辨認客戶身分，可用聲紋、臉部、指紋等生物辨識技術驗證；其他選項只是傳輸與連網技術。"],"pos":0.39144,"w":1},{"id":"M-304","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列何項敘述非屬純網路銀行的明顯獨特特色？","opts":["沒有實體分行","沒有實體 ATM 機器","營業時間無限制全年無休","透過APP 提供金融服務"],"ans":4,"exp":["📝 解析：傳統銀行也透過APP提供服務，不算純網銀獨有；沒有實體分行、沒有自有ATM、全年無休才是其明顯特色。"],"pos":0.39222,"w":1},{"id":"M-305","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"下列何者非屬我國核准設立之純網路銀行？","opts":["連線銀行","將來銀行","新網銀行","樂天銀行"],"ans":3,"exp":["📝 解析：我國核准的三家純網銀為連線銀行（LINE Bank）、將來銀行、樂天國際商業銀行；新網銀行是中國大陸的網路銀行。"],"pos":0.393,"w":1},{"id":"M-306","s":"all","ch":"常識｜金融科技與數位金融","star":1,"n":1,"refs":"","tag":"","stem":"目前各國金融監理機關對比特幣抱持戒慎恐懼的態度，考量的原因包含下列哪幾項？ A.洗錢 B.資恐 C.逃稅 D.詐騙","opts":["僅 A","僅 A、B","僅A、B、C","A、B、C、D"],"ans":4,"exp":["📝 解析：比特幣具匿名性與跨境流通便利，易被用於洗錢、資恐、逃稅及詐騙，因此監理機關態度謹慎，四項皆是。"],"pos":0.39377,"w":1},{"id":"M-121","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"有關於以下由行政院國家永續發展委員會核定之『永續發展政策綱領』中所分類的政策層面與面向敘述，請問何者錯誤？","opts":["「永續的環境」層面包含：大氣、水、土地、海洋、生物多樣性及環境管理等六個面向","「永續的社會」層面包含：人口與健康、居住環境、社會福利、文化多樣性及災害防救等五個面向","「永續的經濟」層面包含：企業獲利、企業績效、企業營運、永續能源及資源再利用等五個面向","「執行的機制」層面包含：教育、科技發展、資訊化社會、公眾參與、政府再造及國際合作等六個面向"],"ans":3,"exp":["📝 解析：永續發展政策綱領分四個層面、22 個面向。「永續的經濟」包含經濟發展、產業發展、交通發展、永續能源及資源再利用五個面向；(3) 改寫成企業獲利、企業績效、企業營運等個別企業指標，故錯誤。環境、社會、執行機制三個層面的面向敘述都正確。"],"pos":0.39455,"w":1},{"id":"M-122","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"因應氣候變遷衝擊及國際間對永續議題關注，協助我國企業及早因應訂定其減碳目標，金融監督管理委員會（以下稱金管會）於 2022 年推動「上市櫃公司永續發展路徑圖」規劃案， 以下有關規劃案敘述何者正確？","opts":["配合政府 2070 淨零碳排目標，金管會特訂定上市櫃公司溫室氣體盤查資訊揭露時程，俾利企業遵循及訂定減碳目標","揭露對象除鋼鐵、化工業自 2022 年強制揭露外，其餘上市櫃公司係按實收資本額自 2022 年起分階段推動","揭露目標為 2025 年全體上市櫃公司完成溫室氣體盤查且與財務報表範圍一致","揭露內容包含範疇一 （溫室氣體直接排放）與範疇二（能源間接排放量）"],"ans":4,"exp":["📝 解析：金管會 2022 年 3 月發布的上市櫃公司永續發展路徑圖，揭露內容為範疇一（直接排放）與範疇二（能源間接排放），故 (4) 正確。其餘錯在：我國淨零目標是 2050 年不是 2070 年；首波揭露對象是實收資本額 100 億元以上公司及鋼鐵、水泥業，自 2023 年起盤查個體公司，不是鋼鐵、化工業自 2022 年；全體上市櫃公司是 2027 年完成（含合併報表子公司）盤查、2029 年完成查證，不是 2025 年。"],"pos":0.39533,"w":1},{"id":"M-123","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於上市公司編製永續報告書之作業程序與內容，下列哪一項作法「違反」現行作業辦法之規定？","opts":["食品工業公司應於永續報告書內揭露食品安全管理相關指標","公司應將永續報告書之編製及驗證作業程序，正式納入內部控制制度","關於非主管職務之全時員工薪資資訊，僅需揭露平均數，無須揭露中位數","永續報告書申報期限原則上為每年 6 月底前，若經會計師確信者得延長至 9 月底"],"ans":3,"exp":["⚠ (3) 違規：作業辦法要求揭露非主管職全時員工薪資的平均數及中位數，只揭露平均數不行。另提醒：現行申報期限已改為每年 8 月 31 日前、沒有延到 9 月底的規定，(4) 依新法也不正確；考試照官方答案 (3)。"],"pos":0.39611,"w":1},{"id":"M-124","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"請問以下何者非屬金融監督管理委員會於 2020 年宣布之『公司治理 3.0-永續發展藍圖』中所推動之主軸？","opts":["強化股東會職能，提升企業永續價值","提高資訊透明度，促進永續經營","強化利害關係人溝通，營造良好互動管道","接軌國際規範，引導盡職治理"],"ans":1,"exp":["📝 解析：公司治理3.0五大主軸為強化董事會職能、提高資訊透明度、強化利害關係人溝通、接軌國際規範引導盡職治理、深化永續治理文化；是「董事會」而非「股東會」。"],"pos":0.39689,"w":1},{"id":"M-125","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"「深化公司永續治理文化，提供多元化商品」為金融監督管理委員推動『公司治理 3.0-永續發展藍圖』的五大主軸之一，請問以下何者非屬該項目之具體推動措施？","opts":["規劃建置永續板，推動永續發展相關保險產品","持續視市場使用者需求，研議推動永續相關指數商品","持續檢討公司治理評鑑指標，強化評鑑效度","持續宣導公司治理及企業社會責任"],"ans":1,"exp":["📝 解析：該主軸措施包括規劃建置永續板（永續債券）、推動永續指數商品、檢討公司治理評鑑、宣導公司治理；永續板是債券板，不是推動保險產品。"],"pos":0.39767,"w":1},{"id":"M-126","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"以下有關聯合國永續發展目標（Sustainable Development Goals, SDGs）之敘述，請問何者有誤?","opts":["SDGs 4 是「確保有教無類、公平以及高品質的教育，及提倡終身學習」 （Quality Education），包含消除教育上的性別差距不能雙重標準公然性羞辱","SDGs 5 是 「實現性別平等，並賦予婦女權力」（Gender Equality），包含終結所有對婦女和女童的各種形式歧視","SDGs 8 是「促進包容且永續的經濟成長，讓每個人都有一份好工作」 （Decent Work and Economic Growth），包含保護勞工的權益，為所有勞工創造安全有保障的工作環境","SDGs 16 是「促進和平多元的社會，確保司法平等，建立具公信力且廣納民意的體系」（Peace, Justice and Strong Institutions），包含促進及落實沒有歧視的法律與政策，以實現永續發展"],"ans":1,"exp":["📝 解析：SDG 4優質教育的細項是確保教育公平、消除教育性別差距與終身學習，(1)摻入「雙重標準公然性羞辱」等不相干內容，敘述錯誤。"],"pos":0.39844,"w":1},{"id":"M-127","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"✏️ 116 改過","stem":"魷魚公司找來經理人奇勳、尚佑、美女跟俊昊一起替公司鑑別氣候變遷轉型風險，鑑別錯誤的經理人今年將無法得到績效獎金，但鑑別出最關鍵的氣候變遷轉型風險者可以得到 456 億獎金，請問以下哪項提案可以幫助他們成為獎金贏家?","opts":["氣溫上升可能導致政府對於徵收碳費，公司營運成本上升","洪水可能導致廠房及設備損傷，進而可能使營運中斷","極端降雨可能導致用水吃緊或產量下降","乾旱可能造成缺水影響產能穩定性"],"ans":1,"exp":["📝 解析：轉型風險來自邁向低碳過程的政策法規、技術與市場變化，徵收碳費屬政策法規風險；洪水、極端降雨、乾旱則屬實體風險。"],"pos":0.39922,"w":1},{"id":"M-128","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"企業依照「上市公司編製與申報永續報告書作業辦法」編製永續報告書時應參考全球永續性報告協會（Global Reporting Initiatives，GRI）發布之 GRI 準則，請問以下對 GRI 準則的敘述何者錯誤?","opts":["GRI 準則的主題準則涵蓋經濟、社會及環境","GRI 準則在 2021 年 10 月改版後，企業應隨即適用新版準則編製報告書","企業應透過重大性分析流程，決定報告書應報告的內容","GRI 準則中除了主題準則外也包含基礎通用準則，例如報告書的報導原則"],"ans":2,"exp":["📝 解析：GRI 2021版準則自2023年1月1日起生效，給企業過渡期，並非改版後立即適用；其餘敘述正確。"],"pos":0.4,"w":1},{"id":"M-129","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"","stem":"小黃因疫情慘澹失業後，個人經濟遭遇困難、信用紀錄也開始惡化，還好受惠於近年來金融業積極推動普惠金融服務，請問以下小黃獲得之幫助何者非屬普惠金融相關?","opts":["小黃得以較低保費取得基本保險保障","小黃報名參加某證券商舉辦的期貨商品投資講座，學習投資期貨或選擇權獲利","某銀行提供小黃低碳運輸微型貸款，幫助小黃購置電動機車代步、開啟外送員新人生","小黃透過完整的網銀服務，在失業期間為了節省房租而搬回鄉下老家時， 也可以享受e 指理財、從線上進行基金申購"],"ans":2,"exp":["📝 解析：普惠金融是讓弱勢族群以合理成本取得基本金融服務，如微型保險、微型貸款、數位金融；鼓勵失業者學期貨選擇權交易是高風險投資推廣，不屬普惠金融。"],"pos":0.40078,"w":1},{"id":"M-130","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在推動「綠色金融行動方案 2.0」的過程中，政府企圖透過多方力量落實責任投資。下列何者「非屬」該方案中關於投資面向的推動重點？","opts":["修正並落實機構投資人盡職治理守則","建立綠色債券與永續發展債券之評估制度","鼓勵金融業以外的國營事業與政府基金共同投入永續轉型","研議在相關公會自律規範中，納入 ESG 投資審核標準"],"ans":2,"exp":["📝 解析：綠色金融行動方案 2.0 的「投資」面向措施包括：修正機構投資人盡職治理守則、研議將 ESG 責任投資納入公會自律規範、鼓勵金融機構投資永續發展領域，以及洽請國營事業和政府基金（國發基金、郵政儲金、勞保與勞退基金、公務人員退撫基金）參與永續投資，所以 (1)(3)(4) 都屬投資面向。綠色債券與可持續發展債券的制度屬「資本市場籌資」面向，不是投資面向，故選 (2)。"],"pos":0.40156,"w":1},{"id":"M-540","s":"all","ch":"常識｜永續金融與ESG","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在氣候相關財務揭露（TCFD）框架下，企業需辨識實體風險與轉型風險。請問下列哪一項提案屬於因應低碳經濟所產生的「轉型風險」？","opts":["極端氣候事件造成的財產損失","因應淨零排放政策，政府提高碳排放交易價格或稅收","氣候模式改變導致可用資源匱乏","海平面上升對公司沿海資產造成的慢性損害"],"ans":2,"exp":["📝 解析：TCFD把氣候風險分為實體風險與轉型風險；碳價或碳稅提高源自淨零政策變動，屬轉型風險，其餘選項為實體風險。"],"pos":0.40233,"w":1},{"id":"M-064","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"民國100 年12 月30 日開始施行的金融消費者保護法，其主管機關為：","opts":["財政部","法務部","公平交易委員會","金融監督管理委員會"],"ans":4,"exp":["📝 解析：金融消費者保護法第2條明定主管機關為金融監督管理委員會，並設財團法人金融消費評議中心處理爭議。"],"pos":0.40311,"w":1},{"id":"M-072","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"證券投資人及期貨交易人對紛爭之解決機制：","opts":["只可依金融消費者保護法向評議中心申請評議","只可依證券投資人及期貨交易人保護法向投保中心申請調處、或授權提付仲裁或提起團體訴訟","以上均可選擇尋求解決","以上皆非"],"ans":3,"exp":["📝 解析：證券期貨投資人可依金融消費者保護法向評議中心申請評議，也可依投保法向投保中心申請調處、仲裁或由其提起團體訴訟，管道可擇一使用。"],"pos":0.40389,"w":1},{"id":"M-078","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當上市公司發生重大財報不實或高層掏空資產等違法情事，造成廣大投資人權益受損時，依據我國「證券投資人及期貨交易人保護法」之規範，下列關於受害股東救濟管道的敘述，何者正確？","opts":["投資人應直接要求臺灣證券交易所承擔全部的經濟損失與賠償義務","投保中心有權直接簽發行政處分，強制該公司董事長歸還非法所得給股東","對於同一原因事件造成 20 人以上受害時，投保中心得受讓訴訟實施權後提起團體訴訟","投資人僅能向法務部申請補償金，不得透過民事訴訟向該公司求償"],"ans":3,"exp":["📝 解析：依投保法第28條，同一原因事件致20人以上受損害，投保中心得由其授與訴訟實施權後以自己名義提起團體訴訟或仲裁。"],"pos":0.40467,"w":1},{"id":"M-089","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於銀行理財專員銷售金融商品的過程，下列何者屬於「不正當」的行為？","opts":["主動揭露商品可能發生的最大損失金額","告知客戶過去的投資報酬率，但明確聲明「過去績效不保證未來獲利」","為增加客戶購買意願，口頭承諾該商品具備「保本保息」之效果","依法提供風險預告書，並確認客戶已充分理解其中條款"],"ans":3,"exp":["📝 解析：以口頭承諾「保本保息」誘使購買屬不實陳述，違反金融消費者保護法說明義務與銀行理財業務相關規範；其餘選項都是正當揭露。"],"pos":0.40545,"w":1},{"id":"M-095","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在進行理財投資時，下列哪一種作法最容易導致長期投資目標失敗？","opts":["建立明確的財務目標，並將資金分配在不同優先級的計畫中","為了節省時間，投資後便放任不管，即使市場趨勢改變也不做調整","嚴格遵守投資紀律，不隨市場情緒隨意更改既定的退場機制","交易前先確認理財專員的證照與過往服務評價，確保服務品質"],"ans":2,"exp":["📝 解析：投資後完全不檢視、不隨市場與自身狀況調整，容易偏離目標；設定目標、遵守紀律、確認理專資格都是正確做法。"],"pos":0.40623,"w":1},{"id":"M-103","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"理財專員在執業過程中，下列哪一項行為最符合「金融從業人員倫理守則」？","opts":["為節省客戶時間，代為簽署各項重要投資契約文件","僅推薦手續費收入最高的商品，而不考慮客戶之風險承受度","秉持專業判斷，針對不同客戶之需求與背景，善盡專業注意義務","只要客戶同意，可私下與客戶約定盈虧分擔或保證獲利"],"ans":3,"exp":["📝 解析：理專應依客戶需求與風險承受度提供適合建議並善盡專業注意義務；代簽文件、只推高佣商品、約定分擔盈虧或保證獲利都違反規範。"],"pos":0.407,"w":1},{"id":"M-105","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於銀行辦理結構型商品業務之銷售行為，下列敘述何者為「錯誤」？","opts":["銷售前必須完成客戶風險承擔能力評估，以落實適合度原則","若客戶追求穩定保本，理專應主動建議其將所有定存轉投入結構型商品以獲取高利","必須提供商品說明書及風險預告書，並確保客戶已充分閱讀且理解內容","應向投資人說明該商品之發行機構信用風險及可能之流動性限制"],"ans":2,"exp":["📝 解析：結構型商品不保本且有多重風險，對追求穩定保本的客戶建議全數轉入，違反適合度原則及金融消費者保護法。"],"pos":0.40778,"w":1},{"id":"M-106","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"金融機構在進行跨業合作推廣或共同行銷時，下列哪一項作法「違反」相關管理辦法？","opts":["應建立關於資料儲存、處理及交互運用的內部控制與稽核規範","金融機構應與客戶約定資料交互運用之範疇，並提供客戶隨時停止運用之權利","共同行銷之業務人員因招攬過失導致客戶損失時，該行為僅由人員個人負責，與他業機構無關，故機構無須負賠償或行政責任","辦理共同行銷之場所，應明確標示不同業務之區別，避免消費者對契約主體產生混淆"],"ans":3,"exp":["📝 解析：共同行銷人員招攬他業商品時，其行為對他業機構發生效力，機構須負監督及賠償責任，不能只推給個人，故(3)違規。"],"pos":0.40856,"w":1},{"id":"M-118","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"老年人較適合投資下列那一種資產?","opts":["股票","定存","認購權證","期貨"],"ans":2,"exp":["📝 解析：老年人風險承受度低、重視收入穩定，定存保本且風險最低；股票、認購權證、期貨波動大或有槓桿，較不適合。"],"pos":0.40934,"w":1},{"id":"M-131","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"知名犯罪學家唐諾‧克雷西(DonaldCressey)提出了「舞弊三角理論」用以說明在某些條件存在時，詐騙行為通常會發生！上開條件為何?","opts":["壓力/動機","機會","合理化的心理機制","以上皆是"],"ans":4,"exp":["📝 解析：Cressey舞弊三角理論指出壓力（動機）、機會、合理化三要素同時存在時舞弊最可能發生，故以上皆是。"],"pos":0.41012,"w":1},{"id":"M-132","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於紅旗警訊(亦即發現此種情形時，通常接下來有舞弊的可能)?","opts":["生活突然變得奢侈","陷入嚴重的財務困境","跟供應商或客戶有不正常的親密或往來","以上皆是"],"ans":4,"exp":["📝 解析：生活突然奢侈、陷入財務困境、與供應商或客戶關係異常密切都是常見舞弊紅旗警訊，故以上皆是。"],"pos":0.41089,"w":1},{"id":"M-133","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"詐騙之所以能夠遂行，常常是公司組織內部給予行為人「機會」，下列何者屬於較為常見的 「機會」：","opts":["缺乏內部控制(譬如會計兼任出納等)","內部控制的逾越與失靈","最高管理階層漠不關心","以上皆是"],"ans":4,"exp":["📝 解析：缺乏內控（如會計兼出納）、內控被逾越或失靈、高層漠不關心，都讓舞弊者有機可乘，故以上皆是。"],"pos":0.41167,"w":1},{"id":"M-134","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者能夠有效發現潛在詐騙行為的措施?","opts":["檢舉專線","內部稽核","管理階層定期檢視","以上皆是"],"ans":4,"exp":["📝 解析：檢舉專線、內部稽核、管理階層定期檢視都是發現舞弊的有效機制，其中檢舉通常是最常見的發現來源。"],"pos":0.41245,"w":1},{"id":"M-135","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"金管會為阻斷舞弊行為發生，進而指示、建議了理專二十一誡，下列何者屬實？","opts":["留存或代客戶保管存摺、印章、保單","跟客戶間有私人借貸關係或資金往來","理專的客戶與理專留存的電話、地址、電子郵件同一","以上皆是"],"ans":4,"exp":["📝 解析：金管會列出的理專異常態樣包括代客保管存摺印章保單、與客戶有私人借貸或資金往來、客戶聯絡資料與理專相同，皆屬應注意的舞弊警訊。"],"pos":0.41323,"w":1},{"id":"M-139","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"新聞事件中常看到作假帳、財報不實等案件，這些案件常可看到行為人透過「人頭」來進行假交易或非常規交易，下列何者為檢調偵辦實務上常見到的「人頭」？","opts":["公司前員工","求學過程同學","親友","以上皆是"],"ans":4,"exp":["📝 解析：財報不實或非常規交易常利用與行為人關係密切、容易掌控的人當人頭，前員工、同學、親友都常見，故以上皆是。"],"pos":0.41401,"w":1},{"id":"M-495","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"一般而言,所謂高齡者，係指老年福利法第 2 條規定的對象，其年齡是指在幾歲以上？","opts":["65 歲","70 歲","80 歲","90 歲"],"ans":1,"exp":["📝 解析：老人福利法第2條所稱老人為年滿65歲以上之人，金融業對高齡客戶的保護措施亦以65歲為基準。"],"pos":0.41479,"w":1},{"id":"M-496","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何人常常可能是弱勢金融消費者？","opts":["金融服務業商品銷售人員","大專院校教授財務投資課程的老師","身心障礙者","專業投資人"],"ans":3,"exp":["📝 解析：身心障礙者在資訊取得、溝通或行動上可能受限，屬金融友善服務照顧的弱勢消費者；其餘選項皆具金融專業。"],"pos":0.41556,"w":1},{"id":"M-497","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何人常常不是弱勢金融消費者？","opts":["高齡者","低學歷者","身心障礙者","銀行理財專員"],"ans":4,"exp":["📝 解析：銀行理財專員具備金融專業知識，屬從業人員；高齡、低學歷、身心障礙者才是常見的弱勢金融消費者。"],"pos":0.41634,"w":1},{"id":"M-498","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"業務員對於身心障礙者的投保要求應如何處理?","opts":["一律拒絕受理","與一般非身心障礙者相同不得有所歧視","一律勸其改投保微型保險","告以公司核保不會通過予以勸退"],"ans":2,"exp":["📝 解析：依公平待客原則與身心障礙者權益保障法，不得因身心障礙而拒保或差別待遇，應依核保規定公平評估。"],"pos":0.41712,"w":1},{"id":"M-501","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是業務員招攬時應遵循的公平待客原則?","opts":["訂約公平誠信原則","忠實與注意義務原則","廣告招攬真實原則","以上皆是"],"ans":4,"exp":["📝 解析：金融服務業公平待客原則包括訂約公平誠信、注意與忠實義務、廣告招攬真實等，三者都是招攬時應遵循的原則。"],"pos":0.4179,"w":1},{"id":"M-502","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不是普惠金融主要的照顧對象?","opts":["高齡者","專業投資人","身心障礙者","經濟弱勢者"],"ans":2,"exp":["📝 解析：普惠金融旨在讓高齡、身障、經濟弱勢等族群取得基本金融服務；專業投資人資源充足，並非照顧對象。"],"pos":0.41868,"w":1},{"id":"M-503","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者是現行處理金融消費爭議的專責機構?","opts":["保險商業同業公會","保險事業發展中心","金融消費評議中心","保險職業工會"],"ans":3,"exp":["📝 解析：依金融消費者保護法設立的財團法人金融消費評議中心，是專責處理金融消費爭議申訴與評議的機構。"],"pos":0.41946,"w":1},{"id":"M-512","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"某投資平台宣稱受政府委託開發「太陽能電廠」，並出示蓋有「政府機關官印」的保證收購契約。面對這類資訊，投資人應如何正確查證？","opts":["只要證照上有政府官印或長官合照，即可認定該公司具備政府背書","撥打「165 反詐騙專線」或向相關部會直接核實計畫真實性","觀察其官網是否有許多美輪美奐的綠能建設宣傳影片，以此判斷其公司規模","詢問該平台的線上客服，確認其證件是否為正本掃描件即可"],"ans":2,"exp":["📝 解析：官印、與長官合照及華麗宣傳都可偽造，應撥打165反詐騙專線或直接向主管部會查證計畫真偽。"],"pos":0.42023,"w":1},{"id":"M-513","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當您收到簡訊聲稱「點數即將到期」或「包裹配送地址錯誤」，要求點擊連結並輸入信用卡號及手機收到的驗證碼（OTP）時，下列應對方式何者正確？","opts":["為了維護權益，應立即依照網頁指示填寫所有個資以免錯失機會","只要不輸入身分證字號，僅提供信用卡號與驗證碼並不會造成財務損失","應先將驗證碼提供給線上客服，請其協助確認該筆交易是否合法","驗證碼（OTP）具備授權交易功能，不應在來源不明的網頁輸入，應先撥打 165 查證"],"ans":4,"exp":["📝 解析：OTP驗證碼等同交易授權，輸入卡號加驗證碼即可能遭盜刷；來源不明的連結不可輸入，應先撥165查證。"],"pos":0.42101,"w":1},{"id":"M-514","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在「名師指導」或「內線消息」的投資群組中，當對方要求匯款時，下列哪一種情形最可能是詐騙集團所使用的誘騙手段？","opts":["要求將資金匯入投資人本人名下的銀行交割帳戶","要求將資金匯入與該券商名稱一致的法人信託專戶","要求將資金匯入特定的「個人銀行帳戶」 或提供之「私人人頭帳戶」","建議投資人至實體銀行臨櫃諮詢理財專員後再行決定"],"ans":3,"exp":["📝 解析：合法投資款應存入本人交割帳戶或業者專戶；要求匯入個人帳戶或人頭帳戶是典型投資詐騙手法。"],"pos":0.42179,"w":1},{"id":"M-515","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"隨著綠色金融與ESG 議題升溫，詐騙集團常利用大眾對「碳權」或「再生能源基礎建設」術語的不熟悉進行誘導。當您遇到標榜「零風險、保證獲利」的「碳權」投資計畫時，下列哪一項特徵最能說明這是「吸金陷阱」？","opts":["要求投資人必須透過金管會核准的合法證券商進行開戶與交易","主動告知碳權價格會隨國際市場供需波動，投資人應自行承擔盈虧風險","宣稱擁有「特殊管道」可低價取得國際碳權，且承諾每個月固定配息 10%以上","投資說明書中詳細列出碳權的來源、認證標準（如 VCS 或 GS）與失效年限"],"ans":3,"exp":["📝 解析：宣稱有特殊管道、零風險並承諾每月固定高額配息是吸金詐騙典型特徵；其餘選項皆屬合法業者的正常揭露。"],"pos":0.42257,"w":1},{"id":"M-541","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"關於金融機構推動普惠金融之具體作為，下列哪一項敘述「非屬」其範疇？","opts":["發展微型保險，協助經濟弱勢者建構基本的風險轉移機制","提供數位金融服務，解決偏鄉民眾往返實體分行的不便","鎖定失業者推廣「選擇權賣方」策略，以追求短期的財務翻身","開辦小額貸款專案，協助創業困難者或受災戶解決資金週轉"],"ans":3,"exp":["📝 解析：普惠金融重在讓弱勢取得基本金融服務；向失業者推銷高風險的選擇權賣方策略違反適合度原則，不屬普惠金融。"],"pos":0.42335,"w":1},{"id":"M-553","s":"all","ch":"常識｜金融消費者保護與詐騙防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當發生大規模證券詐欺或內線交易，導致多數投資人受損時，投資人最常透過下列哪一個機構來提起「團體訴訟」？","opts":["金管會","投保中心","評議中心","證交所"],"ans":2,"exp":["📝 解析：依證券投資人及期貨交易人保護法，投保中心可受20人以上投資人授與訴訟實施權，對證券詐欺、內線交易提起團體訴訟。"],"pos":0.42412,"w":1},{"id":"M-080","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"在防制洗錢的實務運作中，金融機構必須建立一套嚴謹的風險控管程序。試問：下列哪一項措施被視為預防非法資金進入金融體系的「首要防線」，其目的在於確實掌握客戶的真實身分、職業、交易目的及預期資金往來規模？","opts":["內部稽核與法令遵循：由第三方單位定期抽查交易紀錄","客戶盡職審查與確認身分：從源頭評估客戶風險等級","強化市場行銷：吸引大量客戶開戶以增加監控數據基準","交易監控與申報：僅針對已完成的每筆交易進行事後核對"],"ans":2,"exp":["📝 解析：客戶盡職審查（CDD）與確認身分是洗錢防制的第一道防線，從開戶源頭了解客戶身分、資金來源與交易目的並評估風險。"],"pos":0.4249,"w":1},{"id":"M-081","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"","stem":"洗錢防制法規定金融機構對於達一定金額以上之通貨交易，應確認客戶身分及留存交易紀錄憑證，並應向指定之機構申報。所稱之一定金額係指新台幣多少之單筆現金或換鈔交易?","opts":["25 萬元","50 萬元","75 萬元","100 萬元"],"ans":2,"exp":["📝 解析：依金融機構防制洗錢辦法，單筆現金收付或換鈔達新臺幣50萬元（含等值外幣）屬大額通貨交易，須確認身分、留存紀錄並向法務部調查局申報。"],"pos":0.42568,"w":1},{"id":"M-082","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者不屬於金融機構防制洗錢措施，訂定內部控制、稽核及法令遵行之事項?","opts":["確認客戶身分之程序及留存交易紀錄憑證之方式與期限","申報流程及程序及保密規定","定期檢討及辦理在職訓練","無需專責人員負責協調監督"],"ans":4,"exp":["📝 解析：洗錢防制法要求內控制度涵蓋確認身分與紀錄留存、申報程序與保密、定期檢討與在職訓練，並須指派專責人員（主管）負責協調監督，故(4)錯誤。"],"pos":0.42646,"w":1},{"id":"M-083","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"","stem":"下列何者屬於金融機構防制洗錢措施所稱之金融機構：","opts":["辦理儲金匯兌之郵政機構","銀行業","證券集中保管事業","以上皆是"],"ans":4,"exp":["📝 解析：洗錢防制法所稱金融機構包括銀行業、辦理儲金匯兌的郵政機構、證券集中保管事業等，三者皆屬之。"],"pos":0.42724,"w":1},{"id":"M-136","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"","stem":"金融機構確認客戶身分時，有下列何種情形，應予以婉拒建立業務關係?","opts":["出示之身分證明文件均為影本","客戶不尋常拖延應補充之身分證明文件","疑似使用匿名、假名、人頭、虛設行號","以上皆是"],"ans":4,"exp":["📝 解析：依金融機構防制洗錢辦法，疑似使用假名人頭、只提供影本證件、不尋常拖延補件等情形，應婉拒建立業務關係，故以上皆是。"],"pos":0.42802,"w":1},{"id":"M-140","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"🆕 116 新題","stem":"當金融機構人員明知客戶款項為犯罪所得，卻仍提供個人帳戶供其使用，或協助其分批存入資金以規避監控，此類行為違反了下列哪一項法律？","opts":["公平交易法","洗錢防制法","消費者保護法","勞動基準法"],"ans":2,"exp":["📝 解析：明知為犯罪所得仍提供帳戶或協助分拆存入以規避申報，屬掩飾隱匿不法所得，違反洗錢防制法。"],"pos":0.42879,"w":1},{"id":"M-273","s":"all","ch":"常識｜洗錢防制","star":1,"n":1,"refs":"","tag":"","stem":"依「洗錢防制法」之規定，金融機構對疑似洗錢之交易，應向下列何者申報？",
